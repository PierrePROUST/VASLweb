    id: v(0, ''), nom: v(1, ''), date: v(2, ''), lieu: v(3, ''), tours: v(4, '6'),
    toursLV: v(5, ''), toursNuit: v(6, ''),
    j: [
      {code: nat(7, 'germans'), nom: v(8, ''), elr: v(9, '1'), san: v(10, '1'), renforts: v(16, '')},
      {code: nat(11, 'americans'), nom: v(12, ''), elr: v(13, '1'), san: v(14, '1'), renforts: v(17, '')},
      {code: nat(50, 'russian'), nom: v(51, ''), elr: v(52, '1'), san: v(53, '1'), renforts: v(54, '')}
    ],
    vc: v(15, ''), police: v(18, 'Verdana'), disposition: v(20, 'horizontal'),
    nvr: v(36, '-'), joueurs: parseInt(v(49, '2'), 10) === 3 ? 3 : 2
  };
}

// Feuille de style de la carte (baseCss + nationCss), à l'échelle k.
function _vtCss(k, codes){
  const px = n => Math.max(1, Math.round(n * k)) + 'px';
  let css = `.vtc{color:#000;line-height:normal}.vtc table.main{border-collapse:separate;border-spacing:2px;border:0}`
    + `.vtc td{height:${px(60)};width:${px(60)};min-width:${px(60)};text-align:center;border:2px solid #666;`
    + `background-color:#fff;border-radius:${px(5)};padding:0;box-sizing:border-box;position:relative}`
    + `.vtc td.scenario{height:${px(180)};width:${px(180)};font-size:${px(22)};color:#fff;background-color:#000;`
    + `font-weight:600;padding:${px(5)};line-height:1.1em;vertical-align:middle}`
    + `.vtc td.phasewheel{width:${px(120)};height:${px(120)};color:#999;font-weight:bold;font-size:${px(12)}}`
    + `.vtc td.vc{width:${px(180)};max-width:${px(180)};font-size:${px(11)};text-align:left;font-family:arial;font-weight:normal;`
    + `background-color:#FCF3CF;vertical-align:top;padding:${px(5)};overflow:hidden}`
    // Le texte ne fixe pas la hauteur des lignes : il est coupé à la case,
    // comme fitVcText le fait (texte entier au survol).
    + `.vtc td.vc div{position:absolute;left:${px(5)};right:${px(5)};top:${px(5)};bottom:${px(5)};overflow:hidden}`
    + `.vtc td.vtrack,.vtc td.track{height:${px(20)};width:${px(20)};min-width:${px(20)};color:#fff;background-color:#333;font-size:${px(12)}}`
    + `.vtc td.token{font-weight:bold;font-size:${px(8)};color:#999}`
    + `.vtc td.turn,.vtc td.turnlv,.vtc td.turnnight,.vtc td.reinforce,.vtc td.endcell,.vtc td.half{font-weight:bold;font-size:${px(24)}}`
    + `.vtc td.turnlv{background-color:#c0c0c0}.vtc td.turnnight{color:#fff;background-color:#000}`
    + `.vtc td.players{height:${px(20)};background-color:#333;font-size:${px(12)};color:#fff;letter-spacing:.05em}`
    + `.vtc .vclabel{color:#f00;font-weight:bold}`
    + `.vtc td.filler{border:0;background:transparent}`
    + `.vtc .nvr{position:absolute;left:6%;bottom:6%;font:bold ${px(9)} Arial;color:#fff}`
    + `.vtc .coin{position:absolute;width:75%;height:75%;pointer-events:none}`
    + `.vtc .coin img{position:absolute;width:33%;height:33%}`;
  for(const code of codes){
    const [, coul, txt] = _vtNation(code);
    css += `.vtc td.n-${code}{background-color:${coul};height:${px(35)};width:${px(60)};font-weight:bold;`
      + `font-size:${px(12)};${txt || ''}}`;
  }
  return css;
}

// Corps de la carte, d'après horizontalBody, verticalBody et leurs formes
// compactes. Le tableau à trois joueurs reprend la forme horizontale.
function _vtCorps(s, logos){
  // Le moteur HTML de Swing compte 1 px CSS pour 1,3 px à l'écran
  // (CSS.LengthUnit) : sans ce facteur, les compteurs que l'extension a
  // posés dans les cases tombaient à côté.
  const k = (s.joueurs === 3 ? 1 : 0.8833333333333333) * 1.3;
  const px = n => Math.max(1, Math.round(n * k)) + 'px';
  const j = s.j.slice(0, s.joueurs);
  const tours = parseFloat(String(s.tours).trim());
  const entiers = Math.floor(isNaN(tours) ? 6 : tours);
  const demi = (isNaN(tours) ? 6 : tours) - entiers >= 0.4999;
  const lv = _vtTours(s.toursLV), nuit = _vtTours(s.toursNuit);
  const nvr = /^[0-6]$/.test(String(s.nvr).trim()) ? +s.nvr : -1;
  const renf = j.map(x => new Set(String(x.renforts).split(',').map(t => t.trim()).filter(Boolean)));

  // Case d'un tour : couleur LV / nuit, coins de renfort par camp, NVR.
  const cases = [];
  const coin = (code, rang) => {
    const coul = _vtNation(code)[1];
    const pos = rang === 0 ? 'left:0;top:0' : rang === 2 ? 'right:0;top:0' : 'right:0;bottom:0';
    const dir = rang === 0 ? 'to bottom right' : rang === 2 ? 'to bottom left' : 'to top left';
    const clip = rang === 0 ? 'polygon(0 0,100% 0,0 100%)' : rang === 2 ? 'polygon(0 0,100% 0,100% 100%)' : 'polygon(100% 0,100% 100%,0 100%)';
    const u = logos.get(_vtLogo(code));
    const ipos = rang === 0 ? 'left:5%;top:5%' : rang === 2 ? 'right:5%;top:5%' : 'right:5%;bottom:5%';
    return `<span class="coin" style="${pos};clip-path:${clip};`
      + `background:linear-gradient(${dir},${coul} 0%,${coul}b3 33%,${coul}00 50%)">`
      + (u ? `<img src="${u}" style="${ipos}">` : '') + '</span>';
  };
  for(let n = 1; n <= entiers; n++){
    const estLV = lv.has(n), estNuit = nuit.has(n);
    const fond = estNuit ? 'background-color:#000;color:#fff;' : estLV ? 'background-color:#c0c0c0;' : '';
    const coins = j.map((x, i) => renf[i].has(String(n)) ? coin(x.code, i) : '').join('');
    cases.push(`<td class="${coins ? 'reinforce' : estLV ? 'turnlv' : estNuit ? 'turnnight' : 'turn'}" style="${fond}">`
      + coins + n + (estNuit && nvr >= 0 ? `<span class="nvr">NVR: ${nvr}</span>` : '') + '</td>');
  }
  if(demi){
    const n = entiers + 1, estLV = lv.has(entiers), estNuit = nuit.has(entiers);
    const fond = estLV ? '#c0c0c0' : estNuit ? '#000' : '#fff';
    // Demi-tour : moitié inférieure droite en rouge (paintRedHalf).
    cases.push(`<td class="half" style="background:linear-gradient(to bottom right,${fond} 50%,#ff4444 50%);`
      + `${estNuit ? 'color:#fff;' : ''}">${n}`
      + (estNuit && nvr >= 0 ? `<span class="nvr">NVR: ${nvr}</span>` : '') + '</td>');
  }
  cases.push('<td class="endcell">END</td>');
  const compact = /^comp/.test(s.disposition) && s.joueurs !== 3;
  if(compact) cases.splice(9);

  const rs = (c, n) => n > 1 ? c.replace('<td ', `<td rowspan="${n}" `) : c;
  const rang = (a, n, r) => cases.slice(a, a + n).map(c => rs(c, r || 1)).join('');
  const titre = `<span style="color:#ffad2d;font-size:${px(24)}">${_vtEsc(s.id)}</span><br>`
    + `<span style="font-size:${px(20)}">${_vtEsc(s.nom)}</span><br>`
    + `<span style="color:#fff;font-size:${px(11)}">${_vtEsc(s.date)}<br>${_vtEsc(s.lieu)}</span>`;
  const vc = `<div><span class="vclabel">Victory Conditions:</span> ${_vtEsc(s.vc)}</div>`;
  const barre = x => `<td class="players" colspan="3">${_vtEsc(x.nom)}${x.nom ? ': ' : ''}${_vtEsc(_vtNation(x.code)[0])}</td>`;
  const infos = x => {
    const u = logos.get(_vtLogo(x.code));
    return `<td class="n-${x.code}" style="width:${px(60)}">`
      + (u ? `<img src="${u}" style="height:${px(32)};vertical-align:middle">` : '') + '</td>'
      + `<td class="n-${x.code}">ELR: ${_vtEsc(x.elr)}</td>`
      + `<td class="n-${x.code}" style="padding-left:2px;padding-right:4px">SAN: ${_vtEsc(x.san)}</td>`;
  };
  const scen = (span) => `<td valign="top" class="scenario" colspan="3"${span ? ` rowspan="${span}"` : ''}>${titre}</td>`;
  const vcc = (span) => `<td valign="top" class="vc" colspan="3"${span ? ` rowspan="${span}"` : ''} title="${_vtEsc(s.vc)}">${vc}</td>`;
  const roue = (span) => `<td class="phasewheel" data-case="PhaseWheel" colspan="2" rowspan="${span}">Phase<br>Wheel</td>`;
  const jetons = (noms) => noms.map(n => `<td class="token" data-case="${VT_ROLES[n] || ''}">${n}</td>`).join('');
  const piste = '<td class="track" rowspan="5">T<br>U<br>R<br>N<br><br>T<br>R<br>A<br>C<br>K</td>';
  const misc = `<td class="token">Wind Dir · Wind · Gusts · ECs · Weather · LV · NQ</td>`;

  let h = '<table class="main">';
  if(s.joueurs === 3 || !/^(vertical|comphorizontal|compvertical)$/.test(s.disposition)){
    const n = Math.ceil(cases.length / 3);
    h += '<tr>' + scen(5) + barre(j[0]) + vcc(4) + roue(4) + piste + rang(0, n, 2) + '</tr>'
      + '<tr>' + infos(j[0]) + '</tr>'
      + '<tr>' + barre(j[1]) + rang(n, n, 2) + '</tr>'
      + '<tr>' + infos(j[1]) + '</tr>'
      + '<tr>' + jetons(['Compass', 'Wind Dir', 'Wind', 'Gusts', 'ECs', 'Weather', 'LV', 'NQ'])
      + rang(n * 2, n) + '</tr>';
    if(j[2]) h += '<tr>' + barre(j[2]) + '</tr><tr>' + infos(j[2]) + '</tr>';
  } else if(s.disposition === 'comphorizontal'){
    h += '<tr>' + scen(5) + barre(j[0]) + vcc(4) + roue(4) + rs('<td class="token">Compass</td>', 2) + '</tr>'
      + '<tr>' + infos(j[0]) + '</tr>'
      + '<tr>' + barre(j[1]) + rs(misc, 2) + '</tr>'
      + '<tr>' + infos(j[1]) + '</tr>'
      + '<tr>' + cases.join('') + '<td class="filler"></td>'.repeat(Math.max(0, 9 - cases.length)) + '</tr>';
  } else {
    const comp = s.disposition === 'compvertical';
    h += '<tr>' + scen(0) + '</tr>'
      + '<tr>' + barre(j[0]) + '</tr><tr>' + infos(j[0]) + '</tr>'
      + '<tr>' + barre(j[1]) + '</tr><tr>' + infos(j[1]) + '</tr>'
      + '<tr>' + vcc(0) + '</tr>';
    if(comp){
      h += '<tr>' + roue(2) + '<td class="token">Compass</td></tr><tr>' + misc + '</tr>';
    } else {
      h += '<tr><td class="vtrack" colspan="3">STATUS</td></tr>'
        + '<tr>' + roue(2) + '<td class="token">Compass</td></tr>'
        + '<tr><td class="token">LV</td></tr>'
        + '<tr>' + jetons(['NQ', 'Weather', 'Gusts']) + '</tr>'
        + '<tr>' + jetons(['ECs', 'Wind Dir', 'Wind']) + '</tr>'
        + '<tr><td class="vtrack" colspan="3">TURN TRACK</td></tr>';
    }
    for(let i = 0; i < cases.length; i += 3) h += '<tr>' + rang(i, 3) + '</tr>';
  }
  h += '</table>';
  return {html: h, css: _vtCss(k, [...new Set(j.map(x => x.code))])};
}

// Case de la carte → rôle des compteurs que l'extension y pose
// (« VASLTablesRole » de leur BasicPiece).
const VT_ROLES = {'Compass': 'Compass', 'Wind Dir': 'WindDir', 'Wind': 'WindForce', 'Gusts': 'Gusts',
                  'ECs': 'EC', 'Weather': 'Weather', 'LV': 'LV', 'NQ': 'NoQuarter'};

// Calage de la carte sur ses compteurs. L'extension dessine sa carte par
// le moteur HTML de Swing, dont les marges et arrondis ne se reproduisent
// pas au pixel près ; elle y a posé les compteurs au centre des cases.
// On décale donc la carte de l'écart médian entre chaque case et le
// compteur de même rôle — ce qui la recale aussi pour d'autres versions.
function _vtCaler(p, e){
  p.decX = p.decY = 0;
  const er = e.getBoundingClientRect();
  if(!er.width) return;
  const k = e.offsetWidth / er.width;
  const role = q => ((q.seg || '').match(/VASLTablesRole;([^;\\]+)/) || [])[1];
  const dx = [], dy = [];
  for(const td of e.querySelectorAll('[data-case]')){
    const q = vivants().find(x => x !== p && role(x) === td.dataset.case);
    if(!q) continue;
    const r = td.getBoundingClientRect();
    const cx = p.x - e.offsetWidth / 2 + (r.x + r.width / 2 - er.x) * k;
    const cy = p.y - e.offsetHeight / 2 + (r.y + r.height / 2 - er.y) * k;
    dx.push(q.x - cx); dy.push(q.y - cy);
  }
  if(dx.length < 2) return;
  const med = a => a.sort((u, v) => u - v)[a.length >> 1];
  const mx = med(dx), my = med(dy);
  // Au-delà d'une case d'écart, les compteurs ont été déplacés à la main :
  // on garde la carte centrée sur sa position, comme VASSAL.
  if(Math.abs(mx) > 150 || Math.abs(my) > 150) return;
  p.decX = mx; p.decY = my;
}

// Élément de la carte de scénario, prêt à poser sur le pion.
async function _vtElementCarte(champs){
  const s = _vtCarte(champs);
  const logos = new Map();
  for(const x of s.j.slice(0, s.joueurs)){
    const im = _vtLogo(x.code);
    if(im && !logos.has(im)) logos.set(im, await chargerImage(im));
  }
  const {html, css} = _vtCorps(s, logos);
  const e = document.createElement('div');
  e.className = 'vtc';
  e.style.fontFamily = `${s.police}, Verdana, sans-serif`;
  e.innerHTML = `<style>${css}</style>${html}`;
  return e;
}

// Panneau de notes (NotePanel.draw) : bandeau de la couleur du camp,
// corps teinté à mi-chemin du blanc, texte enroulé au fil de la largeur.
function _vtElementNotes(c){
  const titre = c[0] || '', corps = c[1] || '';
  const coul = /^#[0-9a-f]{6}$/i.test(c[2] || '') ? c[2] : '#333333';
  const larg = Math.max(126, parseInt(c[5], 10) || 200);
  const haut = Math.max(70, parseInt(c[6], 10) || 200);
  const fond = /^#[0-9a-f]{6}$/i.test(c[8] || '') ? c[8]
    : '#' + [1, 3, 5].map(i => Math.round(parseInt(coul.substr(i, 2), 16) / 2 + 127.5).toString(16).padStart(2, '0')).join('');
  const taille = parseInt(c[9], 10) || 14;
  const e = document.createElement('div');
  e.className = 'vtn';
  e.style.cssText = `width:${larg}px;min-height:${haut}px;background:${fond};border:2px solid #666;`
    + 'border-radius:12px;overflow:hidden;box-sizing:border-box;font-family:Dialog,Arial,sans-serif';
  const h = document.createElement('div');
  h.style.cssText = `height:24px;line-height:24px;background:${coul};border-bottom:1px solid #666;`
    + `padding:0 6px;font-weight:bold;font-size:15px;white-space:nowrap;overflow:hidden;`
    + `color:${c[3] === 'ss' ? '#fff' : '#000'}`;
  h.textContent = titre;
  const b = document.createElement('div');
  b.style.cssText = `padding:6px;font-size:${taille}px;line-height:1.2;color:#000;white-space:pre-wrap;word-wrap:break-word`;
  b.textContent = corps;
  e.append(h, b);
  return e;
}

// ── Images des pions, tirées du dépôt VASL.
// Les SVG VASL déclarent width/height sans viewBox : sans lui ils ne se
// mettent pas à l'échelle. Leur silhouette, en lien relatif, est
// incorporée ; leurs polices Nimbus remplacées par une pile système.
const VASL_IMAGES_URL =
  'https://raw.githubusercontent.com/vasl-developers/vasl/develop/dist/images/';
const _imgCache = new Map();      // chemin → Promise<URL de Blob | null>

function _ensureViewBox(svg){
  const m = svg.match(/<svg\b[^>]*>/i);
  if(!m || /\bviewBox\s*=/i.test(m[0])) return svg;
  const w = (m[0].match(/\bwidth\s*=\s*"([\d.]+)/i) || [])[1];
  const hh = (m[0].match(/\bheight\s*=\s*"([\d.]+)/i) || [])[1];
  if(!w || !hh) return svg;
  return svg.replace(m[0], m[0].replace(/<svg\b/i, `<svg viewBox="0 0 ${w} ${hh}"`));
}

function chargerImage(path){
  if(!path) return Promise.resolve(null);
  if(!_imgCache.has(path)) _imgCache.set(path, _chargerImage(path));
  return _imgCache.get(path);
}

async function _chargerImage(path){
  try {
    // Le module désigne bien des images sans extension (« MS/Gutted »,
    // « ML/NoMove ») et certaines n'existent qu'en SVG, d'autres qu'en GIF :
    // on essaie le chemin donné, puis les autres formats.
    const base = path.replace(/\.(svg|gif|png)$/i, '');
    const essais = [...new Set([path, base + '.svg', base + '.gif', base + '.png'])];
    let r = null;
    for(const e of essais){
      r = await fetch(VASL_IMAGES_URL + e);
      if(r.ok){ path = e; break; }
    }
    if(!r.ok) throw new Error('HTTP ' + r.status);
    if(!/\.svg$/i.test(path)){
      const mime = /\.gif$/i.test(path) ? 'image/gif' : /\.png$/i.test(path) ? 'image/png' : 'image/jpeg';
      return URL.createObjectURL(new Blob([await r.arrayBuffer()], {type: mime}));
    }
    let svg = await r.text();
    svg = svg.replace(/@font-face\s*\{[^}]*\}/g, '')
             .replace(/font-family\s*:\s*Nimbus Sans L/g, 'font-family:Helvetica,Arial,sans-serif');
    const dir = path.substring(0, path.lastIndexOf('/') + 1);
    const sil = svg.match(/href="(\.\/)?(svg\/[^"]+\.(?:png|svg|gif))"/i);
    if(sil){
      const ref = sil[0].slice(6, -1), rel = sil[2];
      const ext = rel.split('.').pop().toLowerCase();
      const mime = ext === 'svg' ? 'image/svg+xml' : ext === 'gif' ? 'image/gif' : 'image/png';
      try {
        const pr = await fetch(VASL_IMAGES_URL + dir + rel);
        if(!pr.ok) throw 0;
        const buf = new Uint8Array(await pr.arrayBuffer());
        let bin = '';
        for(let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
        svg = svg.split(ref).join('data:' + mime + ';base64,' + btoa(bin));
      } catch(e){
        svg = svg.replace(/<image[^>]*href="\.?\/?svg\/[^"]*"[^>]*\/?>/g, '');
      }
    }
    return URL.createObjectURL(new Blob([_ensureViewBox(svg)], {type: 'image/svg+xml'}));
  } catch(e){
    return null;
  }
}

// ═══════════════════════════════════════════════════════════════
// PIONS SUR LA CARTE
// Chaque pion garde son segment VASSAL complet : ses traits ne sont pas
// reconstructibles depuis l'affichage, et c'est ce segment, position
// mise à jour, que l'export réécrit.
//   seg     « +/uid/TYPE/ÉTAT » courant
//   x, y    position en pixels VASL natifs
//   ordre   rang dans la pile, du fond vers le sommet
// ═══════════════════════════════════════════════════════════════
const STACK_DX = 4, STACK_DY = -4;    // décalage d'empilement, à l'écran
let pions = [];
let _pileSel = null;                  // clé de la pile sélectionnée
let _source = null;                   // segments de l'état chargé
let _carteJeu = 'Main Map';           // nom VASSAL de la carte de jeu
let _annexes = new Map();
let _nomFichier = 'partie';
let _coucheParUid = new Map();        // uid → couche (@@n) de sa pile d'origine
let _pilesVassal = new Map();         // id de pile VASSAL → uids, du fond au sommet
let _pilesRetirees = new Map();       // piles retirées d'un seul -/, pour Undo
let _uidSeq = 0;

const cle = p => p.x + ',' + p.y;
const vivants = () => pions.filter(p => !p.deleted);
function pile(k){
  return vivants().filter(p => cle(p) === k).sort((a, b) => a.ordre - b.ordre);
}
function nouvelUid(){ return String(Date.now()) + String(++_uidSeq); }

function _majPosEtat(etat, carte, x, y){
  const t = etat.lastIndexOf('\t');
  const f = etat.substring(t + 1).split(';');
  if(f.length < 3) return etat;
  f[0] = carte; f[1] = String(x); f[2] = String(y);
  return etat.substring(0, t + 1) + f.join(';');
}

// Réécrit la position dans le segment du pion.
function _majSeg(p){
  const te = _typeEtEtat(p.seg);
  if(!te) return;
  p.seg = '+/' + p.uid + '/' + te.type + '/' + _majPosEtat(te.etat, _carteJeu, p.x, p.y);
}

function creerPion(seg, ordre){
  const d = lirePiece(seg);
  const el = document.createElement('div');
  el.className = 'pion';
  const face = document.createElement('img');
  el.appendChild(face);
  const p = {id: pions.length, uid: d.uid, seg, x: d.x, y: d.y, ordre, nom: d.nom,
             el, face, sz: Math.round(48 * SC), deleted: false};
  pions.push(p);
  el.addEventListener('pointerdown', e => _pionPointerDown(e, p));
  el.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); cacherSurvol(); ouvrirMenu(p, e.clientX, e.clientY); });
  el.addEventListener('pointerenter', e => { if(e.pointerType === 'mouse' && !e.buttons) survolEntre(p, e); });
  el.addEventListener('pointermove', e => { if(e.pointerType === 'mouse' && !e.buttons) survolEntre(p, e); });
  el.addEventListener('pointerleave', e => { if(e.pointerType === 'mouse') survolSort(); });
  document.getElementById('mapInner').appendChild(el);
  majApparence(p, d);
  return p;
}

// Pièce de l'extension VASL Tools : la carte et les panneaux sont dessinés
// en HTML à l'échelle de la carte, les outils restent invisibles.
async function _majPieceVaslTools(p, d, gen){
  if(d.vt.genre === 'outil'){
    p.el.style.display = 'none';
    p.cache = p.outil = true;
    return;
  }
  const e = d.vt.genre === 'carte' ? await _vtElementCarte(d.vt.champs) : _vtElementNotes(d.vt.champs);
  if(gen !== p.gen) return;
  p.face.removeAttribute('src');
  p.face.style.display = 'none';
  p.el.style.background = '';
  p.el.title = d.nom;
  p.el.querySelectorAll('.couche, .vtc, .vtn').forEach(x => x.remove());
  e.style.position = 'absolute';
  e.style.left = e.style.top = '0';
  // Sans cela, le tableau se tasserait à la largeur du pion qui le porte.
  e.style.width = 'max-content';
  e.style.transformOrigin = '0 0';
  e.style.transform = `scale(${SC})`;
  p.el.appendChild(e);
  // Les logos fixent la largeur de leurs cases : on mesure une fois
  // qu'ils sont décodés.
  await Promise.all([...e.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
  if(gen !== p.gen) return;
  p.fond = true;
  p.larg = Math.round(e.offsetWidth * SC);
  p.haut = Math.round(e.offsetHeight * SC);
  if(d.vt.genre === 'carte') _vtCaler(p, e);
  _etendreCarte();
  p.sz = Math.max(p.larg, p.haut);
  rendrePile(cle(p));
}

// Face, surimpressions et orientation, d'après le segment courant.
async function majApparence(p, d){
  // Deux mises à jour peuvent se croiser (création, puis arrivée de la
  // base) : seule la plus récente pose ses surimpressions.
  const gen = p.gen = (p.gen || 0) + 1;
  d = d || lirePiece(p.seg);
  p.nom = d.nom;
  // Comme Concealable de VASL : l'adversaire ne voit que le « ? », le
  // joueur qui a dissimulé l'unité la voit, marquée d'un petit « ? ».
  // L'administrateur voit tout.
  const voile = d.masque && !_admin && d.masqueProprio !== idJoueur() ? d.masque : null;
  p.el.title = voile ? 'Pion dissimulé' : d.nom + (d.masque ? ' (?)' : '');
  p.proprietaire = d.proprietaire;
  p.masqueProprio = d.masqueProprio;
  p.hipProprio = d.hipProprio;
  p.compteurProprio = d.compteurProprio;
  // HIP : invisible de l'adversaire ; son joueur et l'administrateur le
  // voient en transparence, comme Hideable de VASSAL.
  const voitHip = d.hip && (_admin || d.hipProprio === idJoueur());
  p.el.style.display = d.hip && !voitHip ? 'none' : '';
  p.el.style.opacity = voitHip ? '.55' : '';
  p.cache = d.hip && !voitHip;
  p.couche = coucheDe(d);
  if(d.vt){ await _majPieceVaslTools(p, d, gen); return; }
  const imgFace = voile || d.img;
  const url = voile === '?' ? _pionInconnu() : await chargerImage(imgFace);
  if(gen !== p.gen) return;
  if(url){
    p.face.src = url;
    await p.face.decode().catch(() => {});
    // Taille propre au pion : 48 px pour un 1/2", 60 px pour un 5/8".
    if(p.face.naturalWidth) p.sz = Math.round(p.face.naturalWidth * SC);
    p.face.style.cssText = '';
    if(d.faceCouche && !voile){
      // Pion fait de couches : sa taille est celle de la plus grande, et
      // chacune garde la sienne, centrée — comme Embellishment.draw().
      let cote = p.face.naturalWidth || 0;
      for(const c of d.couches){
        if(!c.actif) continue;
        const u = await chargerImage(_imgCouche(c));
        if(!u) continue;
        const o = new Image(); o.src = u;
        await o.decode().catch(() => {});
        cote = Math.max(cote, o.naturalWidth || 0, o.naturalHeight || 0);
      }
      if(gen !== p.gen) return;
      if(cote > p.face.naturalWidth){
        p.sz = Math.round(cote * SC);
        const w = p.face.naturalWidth * SC, h = p.face.naturalHeight * SC;
        p.face.style.cssText = `width:${w}px;height:${h}px;`
          + `left:${(p.sz - w) / 2}px;top:${(p.sz - h) / 2}px`;
      }
    }
  } else {
    p.face.removeAttribute('src');
    p.el.style.background = '#b81414';
    p.el.title = `${d.nom} — image introuvable : ${imgFace || '?'}`;
  }
  p.face.style.transform = d.rot ? `rotate(${d.rot}deg)` : '';
  // Tout ce qui est intérieur à un trait rotate tourne avec la face,
  // autour du centre du pion (FreeRotator.draw).
  const orienter = (o, i, gauche, haut) => {
    const a = _angleInterieur(d.rotations, i);
    if(!a) return;
    o.style.transformOrigin = gauche === undefined ? '50% 50%' : `${p.sz/2 - gauche}px ${p.sz/2 - haut}px`;
    o.style.transform = `rotate(${a}deg)`;
  };
  // Les couches de marqueur (ML/, MS/…) se superposent au visage ; une
  // image de nationalité est une autre face du pion, pas une surimpression.
  const couches = voile ? [] : await imagesCouches(d, SC, p.sz);
  if(d.masque && !voile && d.masqueNation){
    const u = await chargerImage(`${d.masqueNation}/${d.masqueNation}qmarkme.svg`);
    if(u){
      const o = new Image();
      o.className = 'couche'; o.src = u;
      o.style.cssText = 'left:0;top:0;width:100%;height:100%';
      orienter(o, d.iMasque);
      couches.push(o);
    }
  }
  if(!voile && d.tourelle){
    const u = await chargerImage(d.tourelle.img);
    if(u){
      const o = new Image();
      o.className = 'couche'; o.src = u;
      await o.decode().catch(() => {});
      // Taille propre de l'image, pas celle du pion : elle déborde.
      const w = (o.naturalWidth || 68) * SC, h = (o.naturalHeight || 68) * SC;
      const gauche = p.sz / 2 + d.tourelle.dx * SC - w / 2, haut = p.sz / 2 + d.tourelle.dy * SC - h / 2;
      o.style.cssText = `width:${w}px;height:${h}px;left:${gauche}px;top:${haut}px`;
      orienter(o, d.tourelle.i, gauche, haut);
      couches.push(o);
    }
  }
  if(!voile && d.deplace){
    const u = await chargerImage(d.deplace.img);
    if(u){
      const o = new Image();
      o.className = 'couche'; o.src = u;
      await o.decode().catch(() => {});
      const gauche = d.deplace.droite ? p.sz : d.deplace.dx * SC;
      const haut = d.deplace.droite ? 0 : d.deplace.dy * SC;
      o.style.cssText = `width:${o.naturalWidth * SC}px;height:${o.naturalHeight * SC}px;`
        + `top:${haut}px;left:${gauche}px`;
      orienter(o, d.deplace.i, gauche, haut);
      couches.push(o);
    }
  }
  if(!voile) for(const t of d.etiquettes){
    const e = document.createElement('div');
    e.className = 'couche etiq';
    e.textContent = t.texte;
    const famille = /serif/i.test(t.police) && !/sans/i.test(t.police) ? 'Georgia,serif'
                  : /mono/i.test(t.police) ? 'monospace' : 'Arial,Helvetica,sans-serif';
    e.style.font = `${t.style & 2 ? 'italic ' : ''}${t.style & 1 ? 'bold ' : ''}`
                 + `${Math.round(t.taille * SC)}px/1.15 ${famille}`;
    e.style.color = t.couleur;
    if(t.fond) e.style.background = t.fond;
    e._label = t;
    e._rotPion = _angleInterieur(d.rotations, t.i);
    couches.push(e);
  }
  if(gen !== p.gen) return;
  p.el.querySelectorAll('.couche').forEach(e => e.remove());
  p.face.before(...couches.filter(o => o.dessous).reverse());
  p.el.append(...couches.filter(o => !o.dessous));
  for(const e of p.el.querySelectorAll('.etiq')) placerLabel(e, p.sz);
  rendrePile(cle(p));
  // La liste de pile copie le pion affiché : elle suit son image.
  if(_pileSel === cle(p)) afficherPile();
}

// ── Surimpressions d'un pion, prêtes à poser dans un cadre de côté
// `cote` dessiné à l'échelle `k`. Les couches de marqueur (ML/, MS/…)
// se superposent au visage ; une image de nationalité est une autre
// face du pion, pas une surimpression.
// Comme Embellishment.draw() : chaque image garde sa taille propre, à la
// même échelle que le pion, centrée sur lui puis décalée de (dx, dy).
// L'étirer à la taille du pion grossissait d'autant le chiffre de SAN du
// sniper (18 px dans un pion de 60).
async function imagesCouches(d, k, cote){
  const out = [];
  // Les couches vont de la plus externe à la plus interne. Quand le visage
  // est lui-même une couche, celles qui la suivent sont DESSOUS : le fond
  // coloré d'un Wire, d'un Trench ou d'un Tetrahedron (_brownd58.svg…)
  // est opaque et recouvrait le GIF transparent du dessin.
  const iFace = d.couches.findIndex(c => c.actif && c.images.length && _imgCouche(c) === d.img);
  for(let i = 0; i < d.couches.length; i++){
    const c = d.couches[i];
    if(!c.actif) continue;
    const im = _imgCouche(c);
    // Une image de nationalité posée en (0, 0) est une autre face du pion
    // (brisé, HS…). Décalée, c'est un marqueur : le CE (xxCEnt) ou le BU
    // (xxBUnt) d'un véhicule sans tourelle, les tourelles d'un xxCT2tur.
    if(!im || !im.trim() || im === d.img || (/^[a-z]{2}\//.test(im) && !c.dx && !c.dy) || /^ovr/i.test(im)) continue;
    const u = await chargerImage(im);
    if(!u) continue;
    const o = new Image();
    o.className = 'couche';
    o.src = u;
    await o.decode().catch(() => {});
    const w = o.naturalWidth * k, h = o.naturalHeight * k;
    if(w && h){
      o.style.width = w + 'px'; o.style.height = h + 'px';
      o.style.left = (cote/2 + c.dx*k - w/2) + 'px';
      o.style.top  = (cote/2 + c.dy*k - h/2) + 'px';
    }
    // Couche intérieure à un trait rotate : elle tourne autour du centre
    // du pion, décalage compris.
    const a = _angleInterieur(d.rotations, c.i);
    if(a){
      o.style.transformOrigin = (w && h) ? `${w/2 - c.dx*k}px ${h/2 - c.dy*k}px` : '50% 50%';
      o.style.transform = `rotate(${a}deg)`;
    }
    o.dessous = iFace >= 0 && i > iFace;
    out.push(o);
  }
  return out;
}

// Vignette composée — fond et couches — d'un pion de la palette. Bien
// des pions n'ont pour image de base qu'un fond vierge (« _white12 ») :
// la Fire Lane, plusieurs First Fire… Leur dessin est tout entier dans
// les couches, et une vignette réduite à l'image de base restait blanche.
async function composerVignette(boite, d, cote){
  const u = await chargerImage(d.img);
  if(!u) return;
  const face = new Image();
  face.src = u;
  await face.decode().catch(() => {});
  const k = cote / (face.naturalWidth || 48);
  face.style.cssText = 'left:0;top:0;width:100%;height:100%';
  const couches = await imagesCouches(d, k, cote);
  // La plus interne d'abord : c'est l'ordre de dessin de VASSAL.
  boite.replaceChildren(...couches.filter(o => o.dessous).reverse(), face,
                        ...couches.filter(o => !o.dessous));
}

// « ? » neutre, pour une pièce dissimulée dont le trait ne nomme pas
// d'image de masque : on ne montre jamais la face cachée.
function _pionInconnu(){
  return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" '
    + 'width="48" height="48"><rect width="48" height="48" rx="3" fill="#555" stroke="#111"/>'
    + '<text x="24" y="33" font-family="Arial" font-size="26" font-weight="bold" '
    + 'fill="#fff" text-anchor="middle">?</text></svg>');
}

// Position d'un label, comme Labeler.getLabelPosition() : point de départ
// au bord du pion désigné (posV, posH), décalage (le vertical compte vers
// le bas), puis justification selon la taille du texte. La rotation se
// fait autour du centre du pion.
function placerLabel(e, sz){
  const t = e._label;
  const w = e.offsetWidth, h = e.offsetHeight;
  let x = t.decH * SC, y = t.decV * SC;
  if(t.posV === 't') y -= sz/2; else if(t.posV === 'b') y += sz/2;
  if(t.posH === 'l') x -= sz/2; else if(t.posH === 'r') x += sz/2;
  if(t.justV === 'b') y -= h; else if(t.justV === 'c') y -= h/2;
  if(t.justH === 'c') x -= w/2; else if(t.justH === 'r') x -= w;
  e.style.left = (sz/2 + x) + 'px';
  e.style.top = (sz/2 + y) + 'px';
  // Rotation propre du label, plus celle d'un trait rotate extérieur :
  // toutes deux autour du centre du pion.
  const a = (t.rotation || 0) + (e._rotPion || 0);
  if(a){
    e.style.transformOrigin = `${-x}px ${-y}px`;
    e.style.transform = `rotate(${a}deg)`;
  }
}

function rendrePile(k){
  const s = pile(k).filter(p => !p.cache);
  s.forEach((p, i) => {
    // Une carte ou un panneau n'est pas carré, et passe sous les pions
    // posés dans ses cases.
    const w = p.larg || p.sz, h = p.haut || p.sz;
    p.el.style.width = w + 'px';
    p.el.style.height = h + 'px';
    p.el.style.left = (p.x * SC - w/2 + (p.decX || 0) * SC + i*STACK_DX) + 'px';
    p.el.style.top  = (p.y * SC - h/2 + (p.decY || 0) * SC + i*STACK_DY) + 'px';
    p.el.style.zIndex = (p.fond ? 2 : 10) + i;
    p.el.classList.toggle('sel', k === _pileSel);
    p.el.classList.toggle('verrou', !COUCHES_SEL[p.couche || 'unite']);
  });
}

// ── Couches de sélection.
// La carte de scénario et les panneaux de VASL Tools couvrent de grandes
// zones du terrain : un clic destiné à la carte les prenait, ou un pion
// voisin. Chaque famille peut donc être retirée de la sélection ; ses
// pièces restent affichées mais ne répondent plus au clic.
const COUCHES_SEL = {unite: true, marqueur: true, carte: false};
try {
  const m = JSON.parse(localStorage.getItem('couchesSel') || 'null');
  if(m) for(const k in COUCHES_SEL) if(typeof m[k] === 'boolean') COUCHES_SEL[k] = m[k];
} catch(e){}

function coucheDe(d){
  if(d.vt) return 'carte';
  // Le « ? » de dissimulation voyage avec les unités qu'il couvre.
  if(d.masque || /qmark/i.test(d.img)) return 'unite';
  const dir = d.img.includes('/') ? d.img.split('/')[0] : '';
  return !dir || /^(MS|ML|MC|sh|DO|tables|CIDs)$/.test(dir) ? 'marqueur' : 'unite';
}

function _brancherCouches(){
  document.querySelectorAll('#couches input').forEach(c => {
    c.checked = COUCHES_SEL[c.dataset.couche];
    c.addEventListener('change', () => {
      COUCHES_SEL[c.dataset.couche] = c.checked;
      try { localStorage.setItem('couchesSel', JSON.stringify(COUCHES_SEL)); } catch(e){}
      for(const k of new Set(vivants().map(cle))) rendrePile(k);
    });
  });
}

function _etendreCarte(){
  let w = _mapW, h = _mapH;
  for(const p of vivants()){
    // Une carte de scénario ou un panneau de notes déborde de son centre.
    w = Math.max(w, Math.ceil(p.x * SC + (p.larg || 0) / 2 + (p.decX || 0) * SC + 80));
    h = Math.max(h, Math.ceil(p.y * SC + (p.haut || 0) / 2 + (p.decY || 0) * SC + 80));
  }
  if(w > _mapW || h > _mapH) _setMapSize(w, h);
}

// ═══ IMPORT ═══
// Les piles VASSAL sont des pièces « stack » dont l'état liste les
// identifiants du fond vers le sommet : +/<uid>/stack/Main Map;x;y;id0;…;@@couche
function _parseStacks(segs){
  const rangs = new Map();
  _coucheParUid = new Map();
  _pilesVassal = new Map();
  _pilesRetirees = new Map();
  for(const seg of segs){
    if(!/^\+\/[^/]+\/stack\//.test(seg)) continue;
    const ch = seg.substring(seg.indexOf('/stack/') + 7).replace(/\\/g, '').split(';');
    const ids = ch.slice(3).filter(c => c && !c.startsWith('@@'));
    _pilesVassal.set(seg.split('/')[1], ids);
    const at = ch.slice(3).find(c => c.startsWith('@@'));
    const couche = at ? parseInt(at.substring(2), 10) : -1;
    ids.forEach((u, i) => { rangs.set(u, i); _coucheParUid.set(u, Number.isFinite(couche) ? couche : -1); });
  }
  return rangs;
}

// La carte de jeu porte le nom par défaut de VASSAL ; à défaut, la plus
// peuplée hors fenêtres auxiliaires (Casualties, Scenario Aid…).
function _carteDeJeu(infos){
  const tally = {};
  for(const d of infos) if(d.carte && d.carte !== 'null') tally[d.carte] = (tally[d.carte] || 0) + 1;
  const noms = Object.keys(tally);
  const std = ['Main Map', 'Carte principale'].find(n => tally[n]);
  if(std) return std;
  const AUX = /Casualties|Field Maintenance|Campaign Roster|Scenario Aid|Charts?|Reference|Dice|Roster|Aid Card/i;
  const jeu = noms.filter(n => !AUX.test(n));
  return (jeu.length ? jeu : noms).sort((a, b) => tally[b] - tally[a])[0] || 'Main Map';
}

function importerPions(texte, label, annexes){
  for(const p of pions) p.el.remove();
  pions = []; _pileSel = null; afficherPile();
  _histo = []; majUndo();
  const segs = texte.split('\x1b');
  // L'état de la partie précède le premier « LOG » ; la suite, dans un
  // .vlog, ce sont les coups.
  let iLog = segs.findIndex(s => s.startsWith('LOG\t'));
  if(iLog < 0) iLog = segs.length;
  _source = segs.slice(0, iLog).filter(s => !s.startsWith('UNDO'));
  _annexes = annexes || new Map();
  _nomFichier = label.replace(/\.(vsav|vlog)$/i, '');

  const rangs = _parseStacks(_source);
  const candidats = [];
  _source.forEach((seg, i) => {
    if(!seg.startsWith('+/') || /^\+\/[^/]+\/stack\//.test(seg)) return;
    const d = lirePiece(seg);
    if(d.carte !== null) candidats.push({seg, d, i});
  });
  _carteJeu = _carteDeJeu(candidats.map(c => c.d));
  let n = 0;
  for(const c of candidats){
    if(c.d.carte !== _carteJeu) continue;     // autres fenêtres : réécrites telles quelles
    // Hors de toute pile : une pièce qui ne s'empile pas est dessinée
    // sous les piles (DefaultPieceCollection, couche 0), les autres dessus.
    const q = creerPion(c.seg, rangs.has(c.d.uid) ? rangs.get(c.d.uid) : 1000 + c.i);
    if(!rangs.has(c.d.uid) && neSEmpilePas(q)) q.ordre = -1000 + c.i;
    n++;
  }
  const caches = vivants().filter(p => p.cache && !p.outil).length;
  const outils = vivants().filter(p => p.outil).length;
  chatLog(`♟️ ${n} pion(s) sur « ${_carteJeu} »` + (caches ? ` dont ${caches} HIP, non affiché(s)` : '')
    + (outils ? ` ; ${outils} outil(s) VASL Tools masqué(s)` : ''));

  lireInfo(_source);
  // Un .vlog s'ouvre, comme dans VASSAL, sur l'état de départ : on le
  // parcourt ensuite coup par coup.
  preparerRelecture(segs.slice(iLog));
  _etendreCarte();
  new Set(vivants().map(cle)).forEach(rendrePile);

  if(_etapes.length) chatLog(`🎬 .vlog : ${_etapes.length} coup(s) à relire — ▶ ou Page suivante pour avancer`);
}

// ═══ ANNULER — le bouton Undo de BasicLogger ═══
// Chaque coup joué, reçu ou relu entre dans l'historique (logOutput).
// Undo prend le dernier coup qui n'est pas encore annulé, en exécute
// l'inverse — getUndoCommand : les sous-commandes en ordre inverse,
// AddPiece ↔ RemovePiece, ChangePiece avec ses états échangés, MovePiece
// vers l'ancienne place — puis le consigne et l'envoie aux autres joueurs
// entre « UNDO\ttrue » et « UNDO\tfalse ». Ce coup-là ne s'annule pas.
// Un message ou un jet de dés n'a pas d'inverse : Undo passe par-dessus.
let _histo = [];          // {no, cmds, inv, annulable, annule, etape}
let _annulation = false;  // vrai pendant qu'Undo consigne son coup
let _etapeLog = false;    // vrai pendant qu'un coup relu est consigné

// Champs d'une commande « / » tels qu'écrits (guillemets et
// contre-obliques gardés), pour la réécrire dans l'autre sens. Comme
// SequenceEncoder.Decoder, seul un « / » précédé d'une contre-oblique
// est échappé ; les apostrophes ne protègent rien.
function _decoupeBrut(s){
  const out = []; let debut = 0;
  for(let i = 0; i < s.length; i++){
    if(s[i] === '/' && (i === 0 || s[i-1] !== '\\')){ out.push(s.substring(debut, i)); debut = i + 1; }
  }
  out.push(s.substring(debut));
  return out;
}

// RemovePiece.myUndoCommand : AddPiece de la pièce telle qu'elle était,
// plus le ChangePiece qui la remet dans sa pile. Nos piles n'ont pas
// d'identifiant VASSAL : un M/ sur la pièce qui était dessous (null :
// au fond) la remet à son rang, chez nous comme chez un client VASSAL.
function _remise(p, sous){
  const d = lirePiece(p.seg);
  if(d.carte !== _carteJeu) return [p.seg];
  return [p.seg, `M/${p.uid}/${_carteJeu}/${d.x}/${d.y}/${sous || 'null'}/${_carteJeu}/${d.x}/${d.y}/null/${joueur()}`];
}

// Pièce encore en jeu juste sous p, d'après les rangs d'avant le retrait.
function _dessousRetire(p){
  if(neSEmpilePas(p)) return null;
  let best = null;
  for(const q of vivants())
    if(q !== p && q.x === p.x && q.y === p.y && q.ordre < p.ordre && !neSEmpilePas(q) && (!best || q.ordre > best.ordre)) best = q;
  return best ? best.uid : null;
}

// Commande(s) inverse(s), ou null si elle n'en a pas.
function _inverse(c){
  if(/^\+\/[^/]+\/stack\//.test(c)) return null;
  if(c.startsWith('+/')) return ['-/' + c.split('/')[1]];
  if(c.startsWith('-/')){
    const uid = c.substring(2);
    const p = pions.filter(q => q.uid === uid).pop();
    if(p) return _remise(p, _dessousRetire(p));
    // Une pile entière : ses pièces reviennent du fond vers le sommet.
    const ids = _pilesRetirees.get(uid);
    if(!ids) return null;
    const out = [];
    let sous = null;
    for(const u of ids){
      const q = pions.filter(x => x.uid === u).pop();
      if(!q) continue;
      out.push(..._remise(q, sous));
      sous = u;
    }
    return out.length ? out : null;
  }
  if(c.startsWith('D/')){
    const t = _decoupeBrut(c.substring(2));
    return t.length >= 3 ? [`D/${t[0]}/${t[2]}/${t[1]}`] : null;
  }
  if(c.startsWith('M/')){
    const t = _decoupeBrut(c.substring(2));
    if(t.length < 9) return null;
    return ['M/' + [t[0], t[5], t[6], t[7], t[8] || 'null', t[1], t[2], t[3], t[4], ...t.slice(9)].join('/')];
  }
  return null;
}

function _histoCmd(c){
  let e = _histo[_histo.length - 1];
  if(!e || e.no !== _actionNo){
    e = {no: _actionNo, cmds: [], inv: [], annulable: !_annulation, annule: false, etape: _etapeLog};
    _histo.push(e);
  }
  e.cmds.push(c);
  if(c.startsWith('UNDO')){ e.annulable = false; e.inv = []; }
  const i = e.annulable ? _inverse(c) : null;
  if(i) e.inv.unshift(...i);
  majUndo();
}

const _aAnnuler = () => {
  for(let i = _histo.length - 1; i >= 0; i--){
    const e = _histo[i];
    if(e.annulable && !e.annule && e.inv.length) return e;
  }
  return null;
};

function majUndo(){
  const b = document.getElementById('btUndo');
  if(b) b.disabled = !_aAnnuler();
}

function annuler(){
  const e = _aAnnuler();
  if(!e) return false;
  fermerMenu();
  // Le dernier coup relu d'un .vlog : comme BasicLogger, Undo recule
  // alors la relecture d'un coup.
  if(e.etape && e === _histo[_histo.length - 1] && _logPos > 0) return reculerLog();
  _avantAction();
  const photo = _photo();
  e.annule = true;
  rejouerLog(e.inv);
  _actionOuverte = false;
  _annulation = true;
  try {
    ['UNDO\ttrue', ...e.inv, 'UNDO\tfalse'].forEach(_logCmd);
  } finally { _annulation = false; }
  _actionOuverte = false;
  new Set(pions.map(cle)).forEach(rendrePile);
  if(_pileSel) afficherPile();
  signalerCoup(photo);
  chatLog(`↶ Coup annulé (${e.inv.length} commande(s))`);
  majUndo();
  return true;
}

// ═══ RELECTURE D'UN .vlog ═══
// Commandes de BasicCommandEncoder, séparateur « / » :
//   +/id/type/état · -/id · D/id/nouvelÉtat/ancienÉtat
//   M/id/carte/x/y/dessous/carteAnc/xAnc/yAnc/dessousAnc/joueur
// Les sous-commandes d'un coup composé suivent leur « LOG » dans des
// segments à part : tout segment de la zone de log est donc examiné.
// Un champ entouré d'apostrophes les perd (SequenceEncoder.unquote).
function _decoupeCmd(s){
  return _decoupeBrut(s).map(t => t.length > 1 && t[0] === "'" && t[t.length - 1] === "'" ? t.slice(1, -1) : t);
}
const _nul = v => (v === 'null' || v === '' ? null : v);
const parUid = uid => pions.find(p => p.uid === uid && !p.deleted);
// Contenu d'une pile VASSAL d'après son état « carte;x;y;id0;…;@@couche ».
const _idsPile = etat => etat.replace(/\\/g, '').split(';').slice(3).filter(c => c && !c.startsWith('@@'));

// Retrait d'une pièce, ou de toute une pile : VASSAL retire une pile
// entière (« Delete » sur la pile, commande globale « remove all ») par
// un seul -/ portant l'identifiant de la pile.
function _retirer(id){
  const p = pions.find(q => q.uid === id && (!q.deleted || q.ailleurs));
  if(p){
    p.deleted = true; p.ailleurs = null; p.el.remove();
    return 1;
  }
  const ids = _pilesVassal.get(id);
  if(!ids) return 0;
  _pilesVassal.delete(id);
  _pilesRetirees.set(id, ids);
  let n = 0;
  for(const u of ids) n += _retirer(u);
  return n;
}

function rejouerLog(segs){
  let n = 0;
  for(let s of segs){
    if(s.startsWith('LOG\t')) s = s.substring(4);
    s = s.replace(/\\+$/, '');
    if(s.startsWith('CHAT')){
      afficherChat(_desechappe(s.substring(4)));
      n++;
    } else if(s.startsWith('INFO\t')){
      _infoEtat = s.substring(5); majChampsInfo();
      n++;
    } else if(s.startsWith('+/')){
      if(/^\+\/[^/]+\/stack\//.test(s)){
        _pilesVassal.set(s.split('/')[1], _idsPile(s.substring(s.indexOf('/stack/') + 7)));
        continue;
      }
      const d = lirePiece(s);
      if(!parUid(d.uid)){
        const q = creerPion(s, 1e9);
        // Née hors de la carte de jeu (« null;0;0 ») : elle attend le M/
        // qui la place, à l'écart comme une pièce envoyée ailleurs.
        if(d.carte !== _carteJeu){ q.deleted = true; q.ailleurs = d.carte || 'null'; q.el.remove(); }
        n++;
      }
    } else if(s.startsWith('-/')){
      n += _retirer(s.substring(2));
    } else if(s.startsWith('D/')){
      const t = _decoupeCmd(s.substring(2));
      if(_pilesVassal.has(t[0])){
        if(t[1]) _pilesVassal.set(t[0], _idsPile(t[1]));
        continue;
      }
      // Une pièce tenue sur une autre fenêtre (Casualties…) change d'état
      // elle aussi : elle le garde en revenant, et dans la sauvegarde.
      const id = _nul(t[0]);
      const p = pions.find(q => q.uid === id && (!q.deleted || q.ailleurs));
      const te = p && _typeEtEtat(p.seg);
      if(te && t[1]){
        p.seg = '+/' + p.uid + '/' + te.type + '/' + t[1];
        const d = lirePiece(p.seg);
        if(d.carte === _carteJeu){ p.x = d.x; p.y = d.y; }
        majApparence(p, d);
        n++;
      }
    } else if(s.startsWith('M/')){
      const t = _decoupeCmd(s.substring(2));
      if(t.length < 5) continue;
      const id = _nul(t[0]), dessous = _nul(t[4]);
      const pos = [t[1], parseInt(t[2], 10) || 0, parseInt(t[3], 10) || 0];
      if(_pilesVassal.has(id)){
        // VASSAL déplace une pile entière d'un seul M/ portant son
        // identifiant : ses pions la suivent, du fond vers le sommet.
        const ids = _pilesVassal.get(id);
        let sous = dessous;
        for(const u of ids){
          if(_deplacerPiece(u, pos, sous)){ n++; sous = u; }
        }
        // Posée sur une autre pile, elle s'y fond.
        if(dessous){
          _pilesVassal.delete(id);
          for(const u of ids) _changerDePile(u, null);
          let prec = dessous;
          for(const u of ids){ _changerDePile(u, prec); prec = u; }
        }
        continue;
      }
      _changerDePile(id, dessous);
      if(_deplacerPiece(id, pos, dessous)) n++;
    }
  }
  return n;
}

// Place la pièce uid en pos [carte, x, y], au-dessus de « dessous ».
function _deplacerPiece(uid, [carte, x, y], dessous){
  const p = pions.find(q => q.uid === uid && (!q.deleted || q.ailleurs));
  if(!p) return false;
  // Retour sur la carte de jeu d'une pièce tenue à l'écart.
  if(p.ailleurs && carte === _carteJeu){
    p.deleted = false; p.ailleurs = null;
    document.getElementById('mapInner').appendChild(p.el);
  }
  if(carte !== _carteJeu){
    const te = _typeEtEtat(p.seg);
    if(te) p.seg = '+/' + p.uid + '/' + te.type + '/' + _majPosEtat(te.etat, carte, x, y);
    p.deleted = true; p.ailleurs = carte; p.el.remove();
    return true;
  }
  p.x = x; p.y = y;
  _empiler(p, parUid(dessous));
  _majSeg(p);
  return true;
}

// Une pièce déplacée quitte sa pile VASSAL et rejoint celle de la pièce
// sur laquelle elle est posée.
function _changerDePile(uid, dessous){
  for(const [id, ids] of _pilesVassal){
    if(ids.includes(uid)) _pilesVassal.set(id, ids.filter(u => u !== uid));
  }
  if(!dessous) return;
  for(const [id, ids] of _pilesVassal){
    const i = ids.indexOf(dessous);
    if(i >= 0){ _pilesVassal.set(id, [...ids.slice(0, i + 1), uid, ...ids.slice(i + 1)]); return; }
  }
}

// Range p juste au-dessus de « dessous » dans sa pile, ou au fond.
function _empiler(p, dessous){
  const s = pile(cle(p)).filter(q => q !== p);
  const i = dessous && s.includes(dessous) ? s.indexOf(dessous) + 1 : (dessous ? s.length : 0);
  s.splice(i, 0, p);
  s.forEach((q, k) => { q.ordre = k; });
}

// ═══ JEU : DÉPLACER, POSER, RETIRER ═══
// Chaque action est appliquée puis consignée au log, comme VASSAL :
// un M/ par pion déplacé, du fond vers le sommet, chacun désignant la
// pièce qui doit se trouver dessous.
function _avantAction(){
  // Jouer au milieu d'une relecture : la partie repart de cette position,
  // les coups suivants du fichier sont abandonnés.
  if(!_relecture && _logPos < _etapes.length){
    chatLog(`✂️ Relecture interrompue au coup ${_logPos} : ${_etapes.length - _logPos} coup(s) suivant(s) abandonné(s)`);
    _etapes.length = _logPos;
    _instantanes.length = _logPos;
    majBarreLog();
  }
}

// ═══════════════════════════════════════════════════════════════
// LECTURE D'UN .vlog — coup par coup
// Un coup est une entrée « LOG » de BasicLogger ; les sous-commandes d'un
// coup composé (une pile qui bouge, un pion posé puis placé) la suivent
// dans des segments à part. Avancer rejoue le coup ; reculer restaure
// l'instantané pris juste avant lui.
// ═══════════════════════════════════════════════════════════════
let _etapes = [];          // coups : listes de segments
let _logPos = 0;           // coups déjà joués
let _instantanes = [];     // état avant chaque coup joué
let _relecture = false;    // vrai pendant qu'un coup est rejoué

function preparerRelecture(segs){
  _etapes = []; _logPos = 0; _instantanes = [];
  for(const sg of segs){
    if(sg.startsWith('LOG\t') || !_etapes.length) _etapes.push([sg]);
    else _etapes[_etapes.length - 1].push(sg);
  }
  // Les entrées vides (« LOG\t » seul) ne sont pas des coups.
  _etapes = _etapes.filter(e => e.some(x => x.replace(/^LOG\t/, '').replace(/\\+$/, '').trim()));
  majBarreLog();
}

function _instantane(){
  return {info: _infoEtat, piles: new Map(_pilesVassal),
          pions: pions.map(p => ({p, seg: p.seg, x: p.x, y: p.y, ordre: p.ordre, deleted: p.deleted, ailleurs: p.ailleurs}))};
}

function _restaurer(snap){
  const connus = new Set(snap.pions.map(e => e.p));
  // Pions nés après l'instantané : ils disparaissent.
  for(const p of pions) if(!connus.has(p)) p.el.remove();
  pions = snap.pions.map(e => e.p);
  for(const e of snap.pions){
    const p = e.p;
    const segChange = p.seg !== e.seg;
    Object.assign(p, {seg: e.seg, x: e.x, y: e.y, ordre: e.ordre, deleted: e.deleted, ailleurs: e.ailleurs});
    if(p.deleted) p.el.remove();
    else if(!p.el.isConnected) document.getElementById('mapInner').appendChild(p.el);
    if(segChange && !p.deleted) majApparence(p);
  }
  _pilesVassal = new Map(snap.piles);
  if(_infoEtat !== snap.info){ _infoEtat = snap.info; majChampsInfo(); }
}

function avancerLog(muet){
  if(_logPos >= _etapes.length) return false;
  const etape = _etapes[_logPos];
  _instantanes[_logPos] = _instantane();
  _instantanes[_logPos].log = _logEnr ? {enr: _logEnr, n: _logEnr.length} : null;
  _instantanes[_logPos].histo = _histo.length;
  const photo = _photo();
  _relecture = true;
  try { rejouerLog(etape); } finally { _relecture = false; }
  // BasicLogger.step : le coup relu passe par sendAndLog, il entre donc
  // dans le log en cours et part chez les autres joueurs.
  _actionOuverte = false;
  _etapeLog = true;
  try {
    for(const sg of etape){
      const c = sg.replace(/^LOG\t/, '').replace(/\\+$/, '');
      if(c && !c.startsWith('UNDO')) _logCmd(c);
    }
  } finally { _etapeLog = false; }
  _actionOuverte = false;
  _logPos++;
  new Set(pions.map(cle)).forEach(rendrePile);
  if(_pileSel) afficherPile();
  // Les pions touchés par le coup sont signalés, et la vue les rejoint.
  if(!muet) signalerCoup(photo);
  majBarreLog();
  if(_logPos === _etapes.length){
    chatLog('🏁 Fin du log');
    // « Replay completed. Begin new log file? »
    proposerLog(false);
  }
  return true;
}

function reculerLog(muet){
  if(_logPos <= 0) return false;
  _logPos--;
  const photo = _photo();
  const snap = _instantanes[_logPos];
  _restaurer(snap);
  if(snap.histo !== undefined){ _histo.length = Math.min(snap.histo, _histo.length); majUndo(); }
  // VASSAL ne recule pas dans une relecture : ici, le coup relu sort du
  // log en cours. Revenir avant le début du log le fait repartir de là.
  if(_logEnr){
    if(snap.log && snap.log.enr === _logEnr){
      _logEnr.length = _logGroupes.length = Math.min(snap.log.n, _logEnr.length);
    } else {
      _logEnr.length = _logGroupes.length = 0;
      _logDepart = etatPartie();
      chatLog(`⏺️ Log : il repart désormais du coup ${_logPos}`);
    }
    majBoutons();
  }
  new Set(pions.map(cle)).forEach(rendrePile);
  if(_pileSel) afficherPile();
  if(!muet) signalerCoup(photo);
  majBarreLog();
  return true;
}

function allerLog(cible){
  while(_logPos < cible && avancerLog(true));
  while(_logPos > cible && reculerLog(true));
}

// État visible des pions avant un coup, pour savoir ce qu'il a changé.
// Les pions HIP ne comptent pas : la vue ne doit pas les trahir.
function _photo(){
  return new Map(vivants().filter(p => !p.cache).map(p => [p, {x: p.x, y: p.y, seg: p.seg}]));
}

// Rayon, en hexagones, de la zone montrée autour d'une action.
const RAYON_COUP = 6;

function signalerCoup(photo){
  document.querySelectorAll('.pion.coup').forEach(e => e.classList.remove('coup'));
  const ici = vivants().filter(p => !p.cache);
  // Arrivées : pions déplacés ou posés. Retraits : pions disparus, montrés
  // un instant à leur ancienne place. Sinon, simples changements d'état.
  const arrives = ici.filter(p => { const a = photo.get(p); return !a || a.x !== p.x || a.y !== p.y; });
  const modifies = ici.filter(p => { const a = photo.get(p); return a && a.x === p.x && a.y === p.y && a.seg !== p.seg; });
  const encore = new Set(ici);
  const retires = [...photo.keys()].filter(p => !encore.has(p));
  for(const p of [...arrives, ...modifies]){
    p.el.classList.add('coup');
    setTimeout(() => p.el.classList.remove('coup'), 1600);
  }
  for(const p of retires){
    const f = p.el.cloneNode(true);
    f.classList.remove('sel', 'coup');
    f.classList.add('retire');
    document.getElementById('mapInner').appendChild(f);
    setTimeout(() => f.remove(), 1600);
  }
  // La vue se centre sur l'action : là où les pions arrivent, sinon là où
  // ils ont été retirés ou modifiés.
  const cibles = arrives.length ? arrives : retires.length ? retires : modifies;
  if(cibles.length) cadrerSur(cibles.map(p => ({x: p.x, y: p.y})));
}

// Centre la vue sur des points (pixels natifs) avec un zoom qui montre
// RAYON_COUP hexagones autour ; des points plus étalés (retrait en masse)
// sont tous cadrés, sans descendre sous le zoom « Ajuster ».
function cadrerSur(pts){
  const wrap = document.getElementById('mapWrap');
  if(!_mapW || !wrap.clientWidth) return;
  const xs = pts.map(q => q.x), ys = pts.map(q => q.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const demiL = Math.max((RAYON_COUP + .5) * 2 * HEX_HX, (x1 - x0) / 2 + 2 * HEX_HX);
  const demiH = Math.max((RAYON_COUP + .5) * 2 * HEX_HY, (y1 - y0) / 2 + 2 * HEX_HY);
  const ajuste = Math.min(wrap.clientWidth / _mapW, wrap.clientHeight / _mapH);
  const z = Math.max(ajuste, Math.min(wrap.clientWidth / (2 * demiL * SC), wrap.clientHeight / (2 * demiH * SC)));
  setZoom(z);
  wrap.scrollLeft = (x0 + x1) / 2 * SC * zoom - wrap.clientWidth / 2;
  wrap.scrollTop  = (y0 + y1) / 2 * SC * zoom - wrap.clientHeight / 2;
}

function majBarreLog(){
  const b = document.getElementById('barreLog');
  b.style.display = _etapes.length ? '' : 'none';
  document.getElementById('logPos').textContent = `${_logPos} / ${_etapes.length}`;
  document.getElementById('lgDebut').disabled = document.getElementById('lgArr').disabled = _logPos <= 0;
  document.getElementById('lgFin').disabled = document.getElementById('lgAv').disabled = _logPos >= _etapes.length;
}

// Trait Immobilized sans « L » en tête des options d'empilement : la
// pièce ne s'empile pas (Properties.NO_STACK) — clocher, tunnel, marqueur
// de la piste des tours. VASSAL ne la met dans aucune pile.
const _nonEmpilable = new Map();      // type → booléen
function neSEmpilePas(p){
  const te = _typeEtEtat(p.seg);
  if(!te) return false;
  if(!_nonEmpilable.has(te.type) || !_bdd){
    const ts = _developperPrototypes(_splitTypeState(p.seg), 0);
    const im = ts && ts.typ.map(t => _seq(t.replace(/\\+$/, ''), ';')).find(f => f[0] === 'immob');
    const v = !!im && (im[3] === undefined ? 'R' : im[3].replace(/\\/g, '')).charAt(0) !== 'L';
    if(!_bdd) return v;
    _nonEmpilable.set(te.type, v);
  }
  return _nonEmpilable.get(te.type);
}

// La pièce sur laquelle p est posée, pour un M/ : la plus proche en
// dessous qui s'empile, ou rien si p elle-même ne s'empile pas.
function _dessous(p){
  if(neSEmpilePas(p)) return 'null';
  const s = pile(cle(p));
  for(let i = s.indexOf(p) - 1; i >= 0; i--) if(!neSEmpilePas(s[i])) return s[i].uid;
  return 'null';
}

// Position finale d'un lâcher : l'ancrage d'hexagone, ou une pile déjà
// là — les piles d'un fichier VASL ne tombent pas toujours au pixel
// près sur nos centres calculés.
function positionDepot(x, y){
  const a = ancragePlusProche(x, y) || {x: Math.round(x), y: Math.round(y)};
  let best = null, bd = 12*12;
  for(const p of vivants()){
    const d = (p.x-a.x)*(p.x-a.x) + (p.y-a.y)*(p.y-a.y);
    if(d < bd){ bd = d; best = p; }
  }
  return best ? {x: best.x, y: best.y, label: a.label} : a;
}

function deplacer(liste, x, y){
  if(!liste.length) return;
  _avantAction();
  const pos = positionDepot(x, y);
  const avant = liste.map(p => ({p, x: p.x, y: p.y, sous: _dessous(p), k: cle(p)}));
  const kArr = pos.x + ',' + pos.y;
  let haut = Math.max(-1, ...pile(kArr).filter(q => !liste.includes(q)).map(q => q.ordre));
  for(const p of liste){ p.x = pos.x; p.y = pos.y; p.ordre = ++haut; }
  for(const a of avant){
    _majSeg(a.p);
    _logCmd(`M/${a.p.uid}/${_carteJeu}/${a.p.x}/${a.p.y}/${_dessous(a.p)}`
          + `/${_carteJeu}/${a.x}/${a.y}/${a.sous}/${joueur()}`);
  }
  // Comme la carte de VASL : un pion qui change de place est marqué
  // « moved », puis reçoit la touche de mouvement (Ctrl+Alt+M), qui
  // inscrit notamment le joueur dans sa propriété Owner.
  for(const a of avant) a.p.ancienLieu = lieu(a.x, a.y);
  rapportDeplacement(liste, avant[0].x, avant[0].y);
  for(const a of avant){
    if(a.x === a.p.x && a.y === a.p.y) continue;
    marquerDeplace(a.p, true);
    executerTouche(a.p, TOUCHE_MOUVEMENT);
  }
  new Set([...avant.map(a => a.k), kArr]).forEach(k => { ajusterDissimulation(k); rendrePile(k); });
  selectionnerPile(kArr);
  chatLog(`➡️ ${liste.length > 1 ? liste.length + ' pions' : liste[0].nom} → ${pos.label || kArr}`);
}

// ── Saisie d'un label, sur la carte, à la place de la boîte de VASSAL.
// Une touche envoyée à une pile entière n'ouvre qu'une saisie, qui
// s'applique à chaque pion concerné. Entrée valide, Échap annule ; un
// texte vide efface le label.
function editerLabel(p, i, titre, lot){
  if(lot && lot.label){ lot.label.cibles.push({p, i}); return; }
  const cibles = [{p, i}];
  if(lot) lot.label = {cibles};
  fermerEditeurLabel();
  const te = _typeEtEtat(p.seg);
  const actuel = te ? _texteLabel(decoderTraits(te.etat)[i]) : '';
  const box = document.createElement('div');
  box.id = 'editLabel'; box.className = 'editLabel';
  const t = document.createElement('span'); t.textContent = titre;
  const inp = document.createElement('input'); inp.value = actuel;
  const ok = document.createElement('button'); ok.textContent = 'OK';
  box.append(t, inp, ok);
  document.body.appendChild(box);
  const r = p.el.getBoundingClientRect();
  box.style.left = Math.max(4, Math.min(r.left, window.innerWidth - box.offsetWidth - 4)) + 'px';
  box.style.top = Math.max(4, Math.min(r.bottom + 6, window.innerHeight - box.offsetHeight - 4)) + 'px';
  const valider = () => {
    const v = inp.value.replace(/[\t\x1b\\]/g, ' ').trim().replace(/\//g, '\\/');
    fermerEditeurLabel();
    for(const c of cibles) fixerTrait(c.p, c.i, v);
    chatLog(`🏷️ ${titre} : ${inp.value.trim() || '(effacé)'}`);
  };
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if(e.key === 'Enter') valider();
    else if(e.key === 'Escape') fermerEditeurLabel();
  });
  ok.addEventListener('click', valider);
  box.addEventListener('pointerdown', e => e.stopPropagation());
  setTimeout(() => { inp.focus(); inp.select(); }, 0);
}

function fermerEditeurLabel(){
  const b = document.getElementById('editLabel');
  if(b) b.remove();
}

// Change l'état d'un trait d'un pion, avec son « D/ ».
function fixerTrait(p, i, valeur){
  if(!p || p.deleted) return false;
  const te = _typeEtEtat(p.seg);
  if(!te) return false;
  const S = decoderTraits(te.etat);
  if(S[i] === valeur) return false;
  S[i] = valeur;
  _avantAction();
  const neuf = encoderTraits(S);
  p.seg = '+/' + p.uid + '/' + te.type + '/' + neuf;
  _logCmd(`D/${p.uid}/${neuf}/${te.etat}`);
  majApparence(p);
  return true;
}

// ── Statut « moved » (traits moved de VASL et markmoved de VASSAL).
const TOUCHE_MOUVEMENT = _touche(77, 650);     // moveKey de la carte VASL

function marquerDeplace(p, oui){
  const te = _typeEtEtat(p.seg);
  if(!te) return false;
  const T = decoderTraits(te.type), S = decoderTraits(te.etat);
  let change = false;
  T.forEach((t, i) => {
    if(!/^(moved|markmoved);/.test(t)) return;
    const v = oui ? 'true' : 'false';
    if((S[i] || '').replace(/\\+$/, '') !== v){ S[i] = v; change = true; }
  });
  if(!change) return false;
  _avantAction();
  const neuf = encoderTraits(S);
  p.seg = '+/' + p.uid + '/' + te.type + '/' + neuf;
  _logCmd(`D/${p.uid}/${neuf}/${te.etat}`);
  majApparence(p);
  return true;
}

// Bouton « mark unmoved » de la carte : lève le statut sur tous les pions.
function leverDeplaces(){
  let n = 0;
  for(const p of vivants()) if(marquerDeplace(p, false)) n++;
  chatLog(n ? `↩️ Statut Moved levé sur ${n} pion(s)` : 'Aucun pion marqué Moved');
  return n;
}

// ── « Remove all counters of a given type » : le bouton ALL de VASL
// (MassRemover). Son menu et ses listes de noms viennent du buildFile ;
// une action retire de la carte de jeu tous les pions dont le nom simple
// (BasicPiece) ou le nom affiché (« 1 FP », « Final Fire ») figure dans sa
// liste. Tous les retraits forment un seul coup du log.
async function ouvrirMassRemover(bt){
  fermerMenu();
  let bdd;
  try { bdd = await chargerBDD(); } catch(e){ return; }
  if(!bdd.massRemover.length){ chatLog('⚠️ Le module VASL ne déclare aucun MassRemover'); return; }
  const m = document.createElement('div');
  m.id = 'ctx';
  for(const a of bdd.massRemover){
    const it = document.createElement('div');
    it.className = 'it';
    it.textContent = a.nom;
    it.title = a.pions.join(', ');
    it.addEventListener('click', e => { e.stopPropagation(); fermerMenu(); retirerTous(a); });
    m.appendChild(it);
  }
  document.body.appendChild(m);
  const r = bt.getBoundingClientRect();
  m.style.left = Math.max(4, Math.min(r.left, window.innerWidth - m.offsetWidth - 4)) + 'px';
  m.style.top = Math.max(4, Math.min(r.bottom + 2, window.innerHeight - m.offsetHeight - 4)) + 'px';
}

function retirerTous(action){
  if(!_source){ chatLog('⚠️ Aucune partie ouverte'); return 0; }
  const noms = new Set(action.pions);
  const cibles = vivants().filter(p => {
    const d = lirePiece(p.seg);
    return noms.has(d.nomBase) || noms.has(d.nom);
  });
  // Un pion masqué par un autre joueur n'a aucune commande : il reste.
  const garde = cibles.filter(accesRefuse);
  const partis = cibles.filter(p => !accesRefuse(p));
  for(const p of partis) retirer(p, true);
  chatLog(partis.length ? `✖️ Remove all « ${action.nom} » : ${partis.length} pion(s) retiré(s)`
                        : `Remove all « ${action.nom} » : aucun pion à retirer`);
  if(garde.length) chatLog(`🔒 ${garde.length} pion(s) masqué(s) par un autre joueur laissé(s) en place`);
  return partis.length;
}

function retirer(p, silencieux){
  if(p.deleted || refuser(p)) return;
  _avantAction();
  const k = cle(p);
  p.deleted = true; p.el.remove();
  _logCmd('-/' + p.uid);
  ajusterDissimulation(k);
  rendrePile(k); afficherPile();
  if(!silencieux) chatLog(`✖️ ${p.nom} retiré`);
}

// Monte (+1) ou descend (-1) un pion dans sa pile.
function changerRang(p, sens){
  const s = pile(cle(p));
  const i = s.indexOf(p), j = i + sens;
  if(j < 0 || j >= s.length) return;
  _avantAction();
  const avant = _dessous(p);
  [s[i], s[j]] = [s[j], s[i]];
  s.forEach((q, k) => { q.ordre = k; });
  _logCmd(`M/${p.uid}/${_carteJeu}/${p.x}/${p.y}/${_dessous(p)}/${_carteJeu}/${p.x}/${p.y}/${avant}/${joueur()}`);
  ajusterDissimulation(cle(p));
  rendrePile(cle(p)); afficherPile();
}

// Pose un pion de la palette : le type VASSAL vient du PieceSlot, l'état
// initial aussi (il porte déjà le gpid). VASL procède en deux temps — la
// pièce naît sans position, puis un M/ la place au sommet de la pile.
function poserDepuisPalette(x, cx, cy){
  if(!_source){ chatLog('⚠️ Ouvrir d\'abord une partie : le pion doit rejoindre une carte VASL.'); return; }
  const def = developperDefinition(x.cmd);
  if(!def){ chatLog(`⚠️ ${x.n} : définition VASSAL illisible`); return; }
  const pos = positionDepot(cx, cy);
  const p = poserTraits(def.T, def.S, pos.x, pos.y, null, 0);
  selectionnerPile(cle(p));
  if(!p.cache) rapport(_remplir(FORMAT_CREATION, {pieceName: nomRapport(p), location: lieu(p.x, p.y), mapName: _carteJeu}));
}

// Pose une pièce décrite par ses traits. VASL procède en deux temps — la
// pièce naît sans position, puis un M/ la place, ce qui fixe aussi son
// rang : 0 sommet de la pile, 1 fond, 2 juste au-dessus de `ref`,
// 3 juste en dessous (placements de PlaceMarker).
function poserTraits(T, S, x, y, ref, placement){
  _avantAction();

  const uid = nouvelUid();
  const n = S.length - 1;
  const S1 = S.slice(), S0 = S.slice();
  S1[n] = _majPosEtat(S[n], _carteJeu, x, y);
  S0[n] = _majPosEtat(S[n], 'null', 0, 0);
  const type = encoderTraits(T);
  const p = creerPion('+/' + uid + '/' + type + '/' + encoderTraits(S1), 0);
  const s = pile(cle(p)).filter(q => q !== p);
  let i = s.length;
  if(placement === 1) i = 0;
  else if(ref && placement === 2 && s.includes(ref)) i = s.indexOf(ref) + 1;
  else if(ref && placement === 3 && s.includes(ref)) i = s.indexOf(ref);
  s.splice(i, 0, p);
  s.forEach((q, k) => { q.ordre = k; });
  _logCmd('+/' + uid + '/' + type + '/' + encoderTraits(S0));
  _logCmd(`M/${uid}/${_carteJeu}/${p.x}/${p.y}/${_dessous(p)}/null/0/0/null/${joueur()}`);
  ajusterDissimulation(cle(p));
  rendrePile(cle(p));
  return p;
}

// ═══════════════════════════════════════════════════════════════
// TRAITS VASSAL : DÉCODAGE, ENCODAGE, PROTOTYPES
// Le contenu d'un trait n° i porte i contre-obliques de trop devant
// chacune de ses tabulations (une par niveau d'emboîtement) : on les
// retire au décodage et on les remet à l'encodage, ce qui permet de
// déplacer un trait d'un rang à l'autre — c'est ce que fait le
// développement des prototypes.
// ═══════════════════════════════════════════════════════════════
function decoderTraits(s){
  return _traits(s).map((c, i) => i ? c.replace(new RegExp('\\\\{' + i + '}\\t', 'g'), '\t') : c);
}
function encoderTraits(l){
  return l.map((c, j) => {
    const b = '\\'.repeat(j);
    return c.replace(/\t/g, b + '\t') + (j < l.length - 1 ? b + '\t' : '');
  }).join('');
}

// Comme PieceCloner de VASSAL : chaque « prototype;Nom » est remplacé par
// les traits du prototype (sans son BasicPiece), avec leur état par
// défaut. Une pièce posée ainsi porte tous ses traits, et l'état de
// chacun peut changer et s'enregistrer.
function developperDefinition(cmd, prof){
  prof = prof || 0;
  const te = _typeEtEtat(cmd);
  if(!te) return null;
  const T = decoderTraits(te.type), S = decoderTraits(te.etat);
  if(T.length !== S.length) return null;
  const T2 = [], S2 = [];
  for(let i = 0; i < T.length; i++){
    const m = T[i].match(/^prototype;((?:\\.|[^;])*)/);
    if(m && prof < 8 && _bdd){
      const def = _bdd.protos.get(m[1].replace(/\\(.)/g, '$1'));
      const d = def && developperDefinition(def, prof + 1);
      if(d){ T2.push(...d.T.slice(0, -1)); S2.push(...d.S.slice(0, -1)); continue; }
    }
    T2.push(T[i]); S2.push(S[i]);
  }
  return {T: T2, S: S2};
}

// ═══════════════════════════════════════════════════════════════
// COMMANDES DES PIONS — le clic droit de VASL
// Comme dans VASSAL, le menu d'un pion est la liste des commandes que
// déclarent ses traits ; une commande envoie une touche, qui traverse
// tous les traits du plus externe au plus interne, et chacun réagit s'il
// la reconnaît. Les macros (Trigger Action) en déclenchent d'autres.
// Rien n'est écrit à la main par type de pion : tout vient de la base.
// ═══════════════════════════════════════════════════════════════

// ── Touches. VASSAL les note « code,modificateurs » (KeyStroke Java),
// ou par leur nom pour les touches nommées (« 57355,0,hc »), ou encore,
// dans les traits anciens, par un caractère et des modificateurs.
function _touche(code, mods){
  const c = (mods & (2 | 128)) ? 1 : 0, sh = (mods & (1 | 64)) ? 1 : 0;
  const a = (mods & (8 | 512)) ? 1 : 0, m = (mods & (4 | 256)) ? 1 : 0;
  return code + ':' + c + sh + a + m;
}
function lireTouche(v){
  if(!v) return null;
  const f = v.replace(/\\/g, '').split(',');
  if(f[2]) return 'n:' + f.slice(2).join(',');
  const code = parseInt(f[0], 10);
  return code ? _touche(code, parseInt(f[1], 10) || 0) : null;
}
function toucheAncienne(car, mods){
  const c = (car || '').replace(/\\/g, '');
  return c && c.trim() ? _touche(c.toUpperCase().charCodeAt(0), parseInt(mods, 10) || 0) : null;
}
// Listes de touches d'une macro : virgules échappées dans chaque touche.
function lireTouches(v){
  return (v || '').split(/(?<!\\),/).map(x => lireTouche(x.replace(/\\,/g, ','))).filter(Boolean);
}
function libelleTouche(k){
  if(!k || k.startsWith('n:')) return '';
  const [code, f] = k.split(':');
  const n = +code;
  const NOMS = {91:'[', 93:']', 44:',', 46:'.', 47:'/', 59:';', 61:'=', 45:'-', 92:'\\', 127:'Suppr', 10:'Entrée',
                37:'←', 38:'↑', 39:'→', 40:'↓', 32:'Espace'};
  const t = NOMS[n] || (n >= 96 && n <= 105 ? 'Num' + (n - 96) : '') || (n >= 112 && n <= 123 ? 'F' + (n - 111) : (n >= 32 && n < 127 ? String.fromCharCode(n) : '#' + n));
  return (f[0] === '1' ? 'Ctrl+' : '') + (f[2] === '1' ? 'Alt+' : '') + (f[1] === '1' ? 'Maj+' : '') + (f[3] === '1' ? 'Méta+' : '') + t;
}
// Touche du navigateur → KeyStroke Java (les codes diffèrent hors lettres).
const _JAVA = {219: 91, 221: 93, 186: 59, 187: 61, 188: 44, 189: 45, 190: 46, 191: 47, 220: 92, 46: 127, 13: 10};
function toucheClavier(e){
  // Pavé numérique : la touche physique fait foi, verrouillage numérique
  // ou non (sinon Num8 arrive comme une flèche).
  const num = /^Numpad(\d)$/.exec(e.code || '');
  const code = num ? 96 + +num[1] : (_JAVA[e.keyCode] || e.keyCode);
  return _touche(code, (e.ctrlKey ? 2 : 0) | (e.shiftKey ? 1 : 0) | (e.altKey ? 8 : 0) | (e.metaKey ? 4 : 0));
}

// ── Conditions des macros. Deux syntaxes, comme dans VASSAL :
//   « {HS_Active==false && GetProperty("SL On_Active")} » (BeanShell)
//   « CurrentPhase_Facing = 1 && Player_Level = 1 » (ancien filtre)
// Une propriété inconnue vaut "" ; une expression illisible est fausse.
function proprietesPion(p, T, S){
  const pr = Object.assign({}, _globales, _proprietes({typ: T, eta: S}));
  pr.BasicName = pr.PieceName = p.nom;
  pr.CurrentMap = pr.OldMap = p.ailleurs || _carteJeu;
  pr.PlayerName = pr.PlayerSide = joueur();
  return pr;
}
const _nombre = v => typeof v === 'number' || (typeof v === 'string' && v.trim() !== '' && !isNaN(Number(v)));
function _comparer(a, op, b){
  const na = Number(a), nb = Number(b);
  const num = _nombre(a) && _nombre(b);
  switch(op){
    case '==': case '=': return num ? na === nb : String(a) === String(b);
    case '!=': return num ? na !== nb : String(a) !== String(b);
    case '<': return num && na < nb;
    case '<=': return num && na <= nb;
    case '>': return num && na > nb;
    case '>=': return num && na >= nb;
    case '=~': try { return new RegExp('^(?:' + b + ')$').test(a); } catch(e){ return false; }
    case '!~': try { return !new RegExp('^(?:' + b + ')$').test(a); } catch(e){ return false; }
  }
  return false;
}
const _vrai = v => v === true || v === 'true';
function evaluerCondition(expr, pr){
  const e = expr.trim();
  if(!/^\{[^]*\}$/.test(e)){
    const val = n => (pr[n] !== undefined ? pr[n] : '');
    return e.split('||').some(ou => ou.split('&&').every(c => {
      const f = /^\s*(.+?)\s*(!=|<=|>=|=~|!~|=|<|>)\s*(.*?)\s*$/.exec(c);
      return f ? _comparer(val(f[1]), f[2], f[3]) : false;
    }));
  }
  return _vrai(evaluerExpression(e, pr));
}
// Expression BeanShell « {…} » de VASSAL, réduite à ce qu'emploie la base
// VASL : propriétés, GetProperty, If(c, a, b), c ? a : b, comparaisons,
// && || !, + - * /, et .contains("…"). Renvoie undefined si illisible ;
// un texte sans accolades est rendu tel quel.
function evaluerExpression(expr, pr){
  const m = /^\s*\{([^]*)\}\s*$/.exec(expr);
  if(!m) return expr;
  const val = n => (pr[n] !== undefined ? pr[n] : '');
  const toks = m[1].match(/"(?:\\.|[^"\\])*"|\d+(?:\.\d+)?|&&|\|\||==|!=|<=|>=|[<>!()?:,+\-*/.]|[A-Za-z_]\w*|\S/g) || [];
  let k = 0;
  const lit = () => toks[k], suivant = () => toks[k++];
  const attendre = t => { if(suivant() !== t) throw 0; };
  const num = v => _nombre(v) ? Number(v) : (() => { throw 0; })();
  const prim = () => {
    const t = suivant();
    if(t === undefined) throw 0;
    let v;
    if(t === '(') { v = expr3(); attendre(')'); }
    else if(t === '!') return !_vrai(prim());
    else if(t === '-') return -num(prim());
    else if(t[0] === '"') v = t.slice(1, -1).replace(/\\(.)/g, '$1');
    else if(/^\d/.test(t)) v = Number(t);
    else if(t === 'true' || t === 'false') v = t === 'true';
    else if(t === 'GetProperty'){ attendre('('); v = val(String(expr3())); attendre(')'); }
    else if(t === 'If'){
      attendre('('); const c = expr3(); attendre(','); const a = expr3(); attendre(','); const b = expr3(); attendre(')');
      v = _vrai(c) ? a : b;
    }
    else if(/^[A-Za-z_]/.test(t)) v = val(t);
    else throw 0;
    while(lit() === '.'){
      suivant();
      if(suivant() !== 'contains') throw 0;
      attendre('('); const x = expr3(); attendre(')');
      v = String(v).includes(String(x));
    }
    return v;
  };
  const mul = () => {
    let a = prim();
    while(lit() === '*' || lit() === '/'){ const op = suivant(), b = num(prim()); a = op === '*' ? num(a) * b : num(a) / b; }
    return a;
  };
  const add = () => {
    let a = mul();
    while(lit() === '+' || lit() === '-'){
      const op = suivant(), b = mul();
      a = op === '-' ? num(a) - num(b) : (_nombre(a) && _nombre(b) ? Number(a) + Number(b) : String(a) + String(b));
    }
    return a;
  };
  const cmp = () => {
    let a = add();
    while(['==', '!=', '<', '<=', '>', '>='].includes(lit())){ const op = suivant(); a = _comparer(a, op, add()); }
    return a;
  };
  const et = () => { let a = cmp(); while(lit() === '&&'){ suivant(); const b = cmp(); a = _vrai(a) && _vrai(b); } return a; };
  const ou = () => { let a = et(); while(lit() === '||'){ suivant(); const b = et(); a = _vrai(a) || _vrai(b); } return a; };
  const expr3 = () => {
    const c = ou();
    if(lit() !== '?') return c;
    suivant(); const a = expr3(); attendre(':'); const b = expr3();
    return _vrai(c) ? a : b;
  };
  try {
    const v = expr3();
    return k === toks.length ? v : undefined;
  } catch(e){ return undefined; }
}

// Propriétés globales du module (traits setprop), le temps de la séance :
// VASSAL les garde dans la partie, la page seulement en mémoire. Les
// couches qui les suivent gardent leur niveau dans leur propre état.
const _globales = {};

// Découpage d'une séquence VASSAL (SequenceEncoder) : un séparateur
// précédé d'une contre-oblique fait partie du texte, et perd celle-ci.
function _seq(s, sep){
  return (s || '').split(new RegExp('(?<!\\\\)' + sep.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')))
    .map(x => x.split('\\' + sep).join(sep));
}

// ── Commandes d'un type de pion, mises en cache par type : toutes les
// pièces d'un même pion de la palette partagent la même liste.
//   {nom, touche, i (rang du trait), faire(ctx)}   ctx = {S, p, effets, declencher}
const _cacheCommandes = new Map();

function commandesDe(type){
  if(_cacheCommandes.has(type)) return _cacheCommandes.get(type);
  const T = decoderTraits(type);
  const cmds = [], sousMenus = [], suivis = [];
  const ajouter = (i, nom, touche, faire) => cmds.push({i, nom: (nom || '').replace(/\\(.)/g, '$1').trim(), touche, faire});
  // Niveau signé d'une couche : « 3 », « -2\… ».
  const niveau = (S, i) => { const m = (S[i] || '').match(/^(-?\d+)([^]*)$/); return m ? [+m[1], m[2]] : [1, '']; };
  const premier = v => (v || '').split(';')[0].replace(/\\/g, '').trim();
  const basculerJoueur = (S, i) => {
    const f = (S[i] || '').split(';');
    const v = (f[0] || '').replace(/\\/g, '').trim();
    f[0] = (!v || v === 'null') ? idJoueur() : 'null';
    S[i] = f.join(';');
  };
  T.forEach((t, i) => {
    const ch = t.split(';');
    const id = ch[0];
    if(id === 'emb2' || id === 'emb'){
      // Au format emb2, le 17e champ est la liste d'images, même faite de
      // blancs : la couche du Covered Arc (« , , , , , » nommée ca1 à ca6)
      // n'a pas d'image mais bien six niveaux. Les compter d'après une
      // image réelle la faisait retomber à 1 à chaque cran.
      const liste = ch.length > 17 ? ch[16] : (ch.find(c => /\.(svg|gif|png)/i.test(c)) || '');
      const N = Math.max(1, liste.split(',').length);
      const boucle = ch[18] !== 'false';
      const regle = (S, f) => { const [v, r] = niveau(S, i); const n = f(Math.abs(v)); S[i] = String(v < 0 ? -n : n) + r; };
      const car = v => (v || '').replace(/\\/g, '');
      if(car(ch[3]).length > 1 || car(ch[6]).length > 1 || car(ch[9]).length > 1){
        // Embellishment0 (ancien format, plusieurs touches) : la couche n'est
        // active que lorsque TOUTES ses touches d'activation sont enclenchées
        // — « FV » : brisée (Ctrl+F) ET demi-escouade (Ctrl+V). L'état garde
        // les touches enclenchées : « -1;F », « 1;FV ».
        const act = car(ch[3]).toUpperCase(), up = car(ch[6]), down = car(ch[9]);
        const etat = S => {
          const f = (S[i] || '').replace(/\\+$/, '').split(';');
          const v = parseInt(f[0], 10) || 1;
          return {v, statut: f.length > 1 ? f[1] : (v < 0 ? '' : act)};
        };
        [...act].forEach((c, j) => ajouter(i, j ? '' : ch[1], toucheAncienne(c, ch[2]), ({S}) => {
          let {v, statut} = etat(S);
          statut = statut.includes(c) ? statut.replace(c, '') : statut + c;
          v = statut.length === act.length ? Math.abs(v) : -Math.abs(v);
          S[i] = v + ';' + statut;
        }));
        const pas = d => ({S}) => {
          const {v, statut} = etat(S);
          let n = Math.abs(v) + d;
          if(n > N) n = boucle ? 1 : N;
          if(n < 1) n = boucle ? N : 1;
          S[i] = (v > 0 ? n : -n) + ';' + statut;
        };
        [...up].forEach((c, j) => ajouter(i, j ? '' : ch[4], toucheAncienne(c, ch[5]), pas(+1)));
        [...down].forEach((c, j) => ajouter(i, j ? '' : ch[7], toucheAncienne(c, ch[8]), pas(-1)));
        return;
      }
      // Couche « toujours active » (alwaysActive, champ 26) : pas de
      // commande d'activation, comme Embellishment de VASSAL.
      if(ch[26] !== 'true') ajouter(i, ch[1], lireTouche(ch[27]) || toucheAncienne(ch[3], ch[2]), ({S}) => {
        const [v, r] = niveau(S, i); S[i] = String(v === 0 ? 1 : -v) + r;
      });
      // Couche qui suit une propriété (champs 22-24) : son niveau en
      // découle, elle n'a ni commande de niveau ni remise à zéro.
      if(id === 'emb2' && ch[22] === 'true' && ch[23]){
        suivis.push({i, prop: ch[23].replace(/\\(.)/g, '$1'), premier: parseInt(ch[24], 10) || 0, N});
        return;
      }
      ajouter(i, ch[4], lireTouche(ch[28]) || toucheAncienne(ch[6], ch[5]),
              ({S}) => regle(S, n => n + 1 > N ? (boucle ? 1 : N) : n + 1));
      ajouter(i, ch[7], lireTouche(ch[29]) || toucheAncienne(ch[9], ch[8]),
              ({S}) => regle(S, n => n - 1 < 1 ? (boucle ? N : 1) : n - 1));
      // Remise à un niveau (resetLevel) : sa valeur absolue donne le
      // niveau, son signe l'activation — « 0 » ou « -1 » : niveau 1 éteint.
      const raz = parseInt(ch[12], 10) || 0;
      if(ch[10] || ch[11]) ajouter(i, ch[10], lireTouche(ch[11]), ({S}) => {
        const [, r] = niveau(S, i);
        const n = Math.min(N, Math.max(1, Math.abs(raz)));
        S[i] = String(raz > 0 ? n : -n) + r;
      });
      // Niveau au hasard (rndKey, champ 20), activation inchangée.
      if(ch[20]) ajouter(i, ch[21], lireTouche(ch[20]), ({S}) => {
        const [v, r] = niveau(S, i);
        const n = 1 + Math.floor(Math.random() * N);
        S[i] = String(v < 0 ? -n : n) + r;
      });
    } else if(id === 'rotate'){
      // FreeRotator : rotate;facettes;touche cw;touche ccw;texte cw;texte ccw
      const N = parseInt(ch[1], 10) || 1;
      if(N > 1){
