  // Restrictions (hideCmd) en vigueur : elles visent les commandes des
  // traits qui leur sont intérieurs.
  const S = decoderTraits(te.etat);
  let pr = null;
  const restriction = c => {
    for(const r of cmds){
      if(!r.bloque || r.i >= c.i || !c.touche || !r.bloque.touches.includes(c.touche)) continue;
      pr = pr || proprietesPion(p, T, S);
      if(evaluerCondition(r.bloque.cond, pr)) return r.bloque.cacher ? 'cacher' : 'griser';
    }
    return null;
  };
  // Deux traits peuvent offrir la même commande (les deux « Set Sides » de
  // la roue) : la touche les atteint tous, une seule entrée suffit.
  const vues = new Set();
  // Comme Obscurable de VASSAL : un pion masqué par un autre joueur
  // n'offre aucune commande.
  const visibles = accesRefuse(p) ? [] : cmds.filter(c => {
    if(!c.nom || restriction(c) === 'cacher') return false;
    const k = c.touche ? c.nom + '\u0001' + c.touche : null;
    if(k && vues.has(k)) return false;
    if(k) vues.add(k);
    return true;
  });

  // Arbre du menu, comme MenuDisplayer de VASSAL : une commande citée par
  // un trait SubMenu va dans ce sous-menu, qui peut lui-même figurer dans
  // un autre ; chaque sous-menu prend la place de sa première commande.
  const parent = new Map();
  for(const sm of sousMenus) for(const n of sm.cmds) if(n && n !== sm.nom && !parent.has(n)) parent.set(n, sm.nom);
  const racine = {items: []}, noeuds = new Map();
  const sousMenu = (nom, prof) => {
    if(noeuds.has(nom)) return noeuds.get(nom);
    const nd = {nom, items: []};
    noeuds.set(nom, nd);
    const pp = parent.get(nom);
    (pp && prof < 8 ? sousMenu(pp, prof + 1) : racine).items.push(nd);
    return nd;
  };
  for(const c of visibles){
    const pp = parent.get(c.nom);
    (pp ? sousMenu(pp, 0) : racine).items.push({nom: c.nom, touche: c.touche, cmd: c, grise: restriction(c) === 'griser'});
  }
  return {titre: p.el.title || p.nom, items: racine.items,
          vide: visibles.length ? null : accesRefuse(p) ? 'Aucune commande — pion masqué par un autre joueur' : 'Aucune commande'};
}

// Une commande choisie dans un menu, une feuille ou une barre : un pion
// sélectionné la transmet à toute la sélection, comme son raccourci.
let _freqCmd = (() => { try { return JSON.parse(localStorage.getItem('aslweb.freqCmd') || '{}') || {}; } catch(e){ return {}; } })();
function lancerCommande(p, c){
  _freqCmd[c.nom] = (_freqCmd[c.nom] || 0) + 1;
  try { localStorage.setItem('aslweb.freqCmd', JSON.stringify(_freqCmd)); } catch(e){}
  if(c.touche && _sel.has(p) && _sel.size > 1) commanderSelection(c.touche);
  else if(c.touche) commander([p], c.touche); else commander([p], null, c.cmd);
}

// pointerType : celui du geste qui ouvre le menu ; à défaut, le profil.
function ouvrirMenu(p, cx, cy, pointerType){
  fermerMenu();
  const arbre = arbreCommandes(p);
  if(!arbre) return;
  const tactile = pointerType ? pointerType !== 'mouse' : _profil !== 'pc';
  if(tactile) rendreFeuilleCommandes(arbre, p);
  else rendreMenuFlottant(arbre, p, cx, cy);
}

function rendreMenuFlottant(arbre, p, cx, cy){
  const m = document.createElement('div');
  m.id = 'ctx';
  m.setAttribute('role', 'menu');
  const tt = document.createElement('div');
  tt.className = 'tt'; tt.textContent = arbre.titre;
  m.appendChild(tt);
  const remplir = (conteneur, items) => {
    for(const c of items){
      const it = document.createElement('div');
      it.className = 'it';
      it.setAttribute('role', 'menuitem');
      const a = document.createElement('span'); a.textContent = c.nom;
      const b = document.createElement('span'); b.className = 'rc';
      it.append(a, b);
      if(c.items){
        // Sous-menu : s'ouvre au survol, ou au toucher.
        it.classList.add('smi');
        b.textContent = '▸';
        const sm = document.createElement('div');
        sm.className = 'ssmenu';
        remplir(sm, c.items);
        it.appendChild(sm);
        const ouvrir = () => {
          for(const f of it.parentElement.children) if(f !== it) f.classList.remove('ouvert');
          it.classList.add('ouvert');
          placerSousMenu(it, sm);
        };
        it.addEventListener('mouseenter', ouvrir);
        it.addEventListener('mouseleave', () => it.classList.remove('ouvert'));
        it.addEventListener('click', e => { e.stopPropagation(); if(e.target === it || e.target.parentElement === it) ouvrir(); });
      } else {
        b.textContent = libelleTouche(c.touche);
        it.addEventListener('mouseenter', () => {
          for(const f of it.parentElement.children) if(f !== it) f.classList.remove('ouvert');
        });
        if(c.grise){
          it.classList.add('off');
          it.addEventListener('click', e => e.stopPropagation());
        } else it.addEventListener('click', e => {
          e.stopPropagation();
          fermerMenu();
          lancerCommande(p, c);
        });
      }
      conteneur.appendChild(it);
    }
  };
  remplir(m, arbre.items);
  if(arbre.vide){
    const v = document.createElement('div');
    v.className = 'vide';
    v.textContent = arbre.vide;
    m.appendChild(v);
  }
  document.body.appendChild(m);
  const x = Math.min(cx, window.innerWidth - m.offsetWidth - 4);
  const y = Math.min(cy, window.innerHeight - m.offsetHeight - 4);
  m.style.left = Math.max(4, x) + 'px'; m.style.top = Math.max(4, y) + 'px';
}

// Feuille du bas : un sous-menu remplace le contenu, avec un en-tête
// « ‹ nom » pour revenir.
function rendreFeuilleCommandes(arbre, p){
  const f = ouvrirFeuille({id: 'feuilleCmd', titre: arbre.titre, hauteur: 'moitie'});
  const pileNiv = [];
  const remplir = (items, nom) => {
    f.corps.replaceChildren();
    if(nom){
      const r = document.createElement('button');
      r.type = 'button'; r.className = 'act ligne retour';
      r.innerHTML = '<span class="ic">‹</span><span class="lb"></span>';
      r.querySelector('.lb').textContent = nom;
      r.addEventListener('click', () => { pileNiv.pop(); const h = pileNiv[pileNiv.length - 1]; remplir(h ? h.items : arbre.items, h && h.nom); });
      f.corps.appendChild(r);
    }
    for(const c of items){
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'act ligne';
      b.innerHTML = '<span class="lb"></span><span class="rc"></span>';
      b.querySelector('.lb').textContent = c.nom;
      b.querySelector('.rc').textContent = c.items ? '›' : libelleTouche(c.touche);
      if(c.grise) b.disabled = true;
      b.addEventListener('click', () => {
        if(c.items){ pileNiv.push(c); remplir(c.items, c.nom); return; }
        f.fermer();
        lancerCommande(p, c);
      });
      f.corps.appendChild(b);
    }
    if(!items.length && arbre.vide){
      const v = document.createElement('div');
      v.className = 'videFeuille'; v.textContent = arbre.vide;
      f.corps.appendChild(v);
    }
  };
  remplir(arbre.items, null);
}

// À droite de l'entrée, ou à gauche faute de place ; jamais hors de l'écran.
function placerSousMenu(it, sm){
  const r = it.getBoundingClientRect();
  let x = r.right - 2, y = r.top - 4;
  if(x + sm.offsetWidth > window.innerWidth - 4) x = Math.max(4, r.left - sm.offsetWidth + 2);
  if(y + sm.offsetHeight > window.innerHeight - 4) y = Math.max(4, window.innerHeight - sm.offsetHeight - 4);
  sm.style.left = x + 'px'; sm.style.top = y + 'px';
}

// Raccourcis des pions : comme dans VASSAL, la touche s'adresse à toute la
// sélection — ici la pile sélectionnée. Elle passe avant ceux des dés.
function _brancherCommandes(){
  document.addEventListener('pointerdown', e => {
    if(!e.target.closest('#ctx, .feuille, .voile')) fermerMenu();
    if(!e.target.closest('#editLabel')) fermerEditeurLabel();
  }, true);
  document.getElementById('mapWrap').addEventListener('scroll', fermerMenu);
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      // Le menu d'abord, puis les piles dépliées, puis la sélection.
      if(document.getElementById('ctx')){ fermerMenu(); return; }
      if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
      if(!replierTout() && (_sel.size || _pileSel)) selectionnerPile(null);
      return;
    }
    // Begin Logfile [Alt+W], End Logfile [Alt+Maj+W], comme VASSAL.
    if(e.altKey && !e.ctrlKey && e.code === 'KeyW'){
      e.preventDefault();
      if(e.shiftKey) terminerLog(); else commencerLog();
      return;
    }
    if((e.key === 'PageDown' || e.key === 'PageUp') && _etapes.length
       && !/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){
      e.preventDefault();
      if(e.key === 'PageDown') avancerLog(); else reculerLog();
      return;
    }
    if((!_pileSel && !_sel.size) || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if(['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;
    const k = toucheClavier(e);
    if(ciblesTouche(k).length){
      e.preventDefault(); e.stopImmediatePropagation();
      fermerMenu();
      commanderSelection(k);
      return;
    }
    // Touches de rang du module (StackMetrics), si aucun trait ne les prend.
    const m = metriques();
    const rang = ['top', 'bottom', 'up', 'down'].find(n => m[n] === k);
    if(rang && _sel.size){
      e.preventDefault(); e.stopImmediatePropagation();
      fermerMenu();
      rangerSelection(rang);
    }
  }, true);
}

// Les pions visés par une touche : la sélection si elle existe, sinon la
// pile courante. Ceux qui n'ont pas la touche sont écartés.
function ciblesTouche(touche){
  const base = _sel.size ? [..._sel] : (_pileSel ? pile(_pileSel).filter(p => !p.cache) : []);
  return trierParPile(base.filter(p => !p.cache && commandesDe((_typeEtEtat(p.seg) || {}).type || '')
                                              .cmds.some(c => c.touche === touche)));
}
// Comme un raccourci clavier de VASSAL : la touche part à toute la
// sélection. Les pions masqués par un autre joueur ne la reçoivent pas ;
// un seul avertissement pour tous.
function commanderSelection(touche, cmd){
  const tous = ciblesTouche(touche);
  if(!tous.length) return false;
  const cibles = tous.filter(p => !accesRefuse(p));
  if(!cibles.length){ refuser(tous[0]); return true; }
  commander(cibles, touche, cmd);
  return true;
}

// Envoie une commande à des pions. Si elle demande un choix (propriété
// de type E, comme « Set Sides » de la roue des phases), la boîte de
// choix s'ouvre d'abord, et les réponses accompagnent la touche.
function commander(pions, touche, cmdDirecte){
  const lot = {};
  const k = touche || (cmdDirecte && cmdDirecte.touche);
  let invites = [], S = null;
  for(const p of pions){
    const te = _typeEtEtat(p.seg);
    if(!te || !k) continue;
    invites = commandesDe(te.type).cmds.filter(c => c.invite && c.touche === k).map(c => c.invite);
    if(invites.length){ S = decoderTraits(te.etat); break; }
  }
  const lancer = () => { for(const p of pions) executerTouche(p, touche, cmdDirecte, lot); };
  if(!invites.length) return lancer();
  demanderChoix(pions[0], invites, S, reponses => { lot.reponses = reponses; lancer(); });
}

// Boîte de choix, à la place de celle de VASSAL : une liste par invite.
function demanderChoix(p, invites, S, valider){
  fermerEditeurLabel();
  const box = document.createElement('div');
  box.id = 'editLabel'; box.className = 'editLabel choix';
  const listes = invites.map(inv => {
    const l = document.createElement('label');
    const t = document.createElement('span'); t.textContent = inv.titre;
    const sel = document.createElement('select');
    for(const o of inv.options){
      const op = document.createElement('option'); op.value = op.textContent = o;
      sel.appendChild(op);
    }
    const actuel = inv.actuel(S);
    if(inv.options.includes(actuel)) sel.value = actuel;
    l.append(t, sel);
    box.appendChild(l);
    return sel;
  });
  const ok = document.createElement('button'); ok.textContent = 'OK';
  box.appendChild(ok);
  document.body.appendChild(box);
  const r = p.el.getBoundingClientRect();
  box.style.left = Math.max(4, Math.min(r.left, window.innerWidth - box.offsetWidth - 4)) + 'px';
  box.style.top = Math.max(4, Math.min(r.bottom + 6, window.innerHeight - box.offsetHeight - 4)) + 'px';
  _ancrerAuClavier(box);
  const fini = () => {
    const rep = {};
    invites.forEach((inv, j) => { rep[inv.cle] = listes[j].value; });
    fermerEditeurLabel();
    valider(rep);
  };
  box.addEventListener('keydown', e => {
    e.stopPropagation();
    if(e.key === 'Enter') fini();
    else if(e.key === 'Escape') fermerEditeurLabel();
  });
  ok.addEventListener('click', fini);
  box.addEventListener('pointerdown', e => e.stopPropagation());
  setTimeout(() => listes[0] && listes[0].focus(), 0);
}

// Ctrl+Z : Undo, si aucun pion de la pile sélectionnée n'a pris la touche.
document.addEventListener('keydown', e => {
  if(!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey || (e.key || '').toLowerCase() !== 'z') return;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  e.preventDefault();
  annuler();
});

function fermerMenu(){
  const m = document.getElementById('ctx');
  if(m) m.remove();
  fermerFeuille('feuilleCmd');
}

// ── Geste sur un pion : glisser déplace toute la pile, un simple clic
// la sélectionne. Un pion seul se tire depuis la liste de la pile.
// L'événement continue jusqu'à la carte, qui compte le pointeur : un
// deuxième doigt en fait un pincement.
let _dernierPointeur = 'mouse';
document.addEventListener('pointerdown', e => { _dernierPointeur = e.pointerType || 'mouse'; }, true);
const vibrer = () => { try { if(navigator.vibrate) navigator.vibrate(10); } catch(e){} };

// À la souris, comme KeyBufferer.mousePressed : l'appui sélectionne.
//   · pion hors de la sélection : elle est remplacée (Maj : complétée) par
//     sa pile entière si elle est repliée, par lui seul si elle est
//     dépliée ou avec Ctrl (Cmd sur Mac), qui ajoute ou retire ;
//   · pion déjà sélectionné : Ctrl le retire (sa pile, si elle est
//     repliée) ; un simple clic sans glisser ne garde que lui (sa pile).
// Le glissé emporte ensuite toute la sélection.
// Au doigt, la sélection se fait au relâché, et le glissé emporte la
// sélection si le pion en fait partie, sinon sa pile (ou lui seul, dans
// une pile dépliée).
const _basculeSel = e => e.ctrlKey || e.metaKey;
function _pionPointerDown(e, p){
  if(e.button > 0) return;
  cacherSurvol();
  const k = cle(p), souris = e.pointerType === 'mouse' || !e.pointerType;
  const deplie = () => _depliees.has(k);
  const pileOuLui = () => deplie() ? [p] : pile(k).filter(selectionnable);
  // Pose ou déplacement en deux appuis : la pile touchée est la destination.
  if(_modeCarte){
    glisser(e, null, 0, () => {}, () => toucherModeCarte({x: p.x, y: p.y}), {tapSeul: true});
    return;
  }
  if(!souris) _appuiLong(e, p);
  // Pions verrouillés : le doigt qui glisse déplace la carte.
  if(!souris && _verrouPions){
    glisser(e, null, 0, () => {}, () => { if(deplie() && selectionnable(p)) selectionner([p]); else appuiSurPile(k); }, {tapSeul: true});
    return;
  }
  let reduire = false;
  if(souris && selectionnable(p)){
    if(!_sel.has(p)){
      if(_basculeSel(e)) selectionner([p], 'basculer');
      else selectionner(pileOuLui(), e.shiftKey ? 'ajouter' : 'remplacer');
    } else if(_basculeSel(e)) selectionner(pileOuLui(), 'retirer');
    else reduire = !e.shiftKey;
  }
  const aDeplacer = () => {
    if(_sel.has(p)) return piecesADeplacer();
    if(!souris && deplie() && selectionnable(p)) return [p];
    return pile(k);
  };
  glisser(e, p.face.src, p.sz * zoom, (cx, cy) => {
    const c = clientVersCarte(cx, cy);
    const l = aDeplacer();
    if(c && l.length) deplacer(l, c.x, c.y);
  }, () => {
    if(souris){
      if(!selectionnable(p)) selectionnerPile(k);
      else if(reduire) selectionner(pileOuLui());
    }
    else if(deplie() && selectionnable(p)) selectionner([p]);
    else appuiSurPile(k);
  });
}

// Glisser générique avec fantôme : la capture est prise sur le document,
// faute de quoi le geste se perd en quittant l'élément de départ. Seul le
// pointeur qui a commencé le geste le fait avancer ; un pincement
// l'abandonne (rien n'est déplacé).
//   opts.appuiLong : au doigt, dans une liste qui défile, le glissé ne
//                    part qu'après cet appui maintenu (ms) ; avant, le
//                    doigt fait défiler la liste.
//   opts.zone      : élément où le glissé reste local (changer de rang dans
//                    une liste) : tant que le pointeur y est, pas de
//                    fantôme, mais opts.dansZone(ev) ; lâché dedans,
//                    opts.lacherZone(ev). Hors de la zone, vers la carte.
//   opts.tapSeul   : pas de glissé (le geste revient à la carte) ; seul le
//                    toucher compte.
//   opts.debut     : appelé quand le geste devient un glissé.
let _glisse = null;
function glisser(e, src, taille, auLacher, auClic, opts = {}){
  if(_glisse) _glisse.abandonner();
  const id = e.pointerId, x0 = e.clientX, y0 = e.clientY;
  const doigt = !!e.pointerType && e.pointerType !== 'mouse';
  const seuil = doigt ? 12 : 8;
  let arme = !(doigt && opts.appuiLong), timer = null;
  let fantome = null, cible = null, rects = null, raf = 0, dernier = null, demarre = false;
  if(!arme) timer = setTimeout(() => { arme = true; vibrer(); }, opts.appuiLong);
  const wrap = document.getElementById('mapWrap');
  const oublierRects = () => { rects = null; };
  const zr = opts.zone ? opts.zone.getBoundingClientRect() : null;
  const dansZone = ev => !!zr && ev.clientX >= zr.left && ev.clientX <= zr.right && ev.clientY >= zr.top && ev.clientY <= zr.bottom;
  const montrer = oui => { if(fantome){ fantome.style.display = oui ? '' : 'none'; if(!oui){ cible.style.display = 'none'; cacherLoupe(); } } };
  const peindre = () => {
    raf = 0;
    const ev = dernier;
    if(!ev) return;
    if(dansZone(ev)){ montrer(false); if(opts.dansZone) opts.dansZone(ev); return; }
    if(zr && opts.horsZone) opts.horsZone(ev);
    if(!fantome) creerFantome();
    montrer(true);
    // Lectures d'abord (une seule fois par image), écritures ensuite.
    if(!rects) rects = _rectsCarte();
    const c = clientVersCarte(ev.clientX, ev.clientY, rects);
    const a = c && positionDepot(c.x, c.y);
    const t = Math.max(24, taille);
    fantome.style.left = (ev.clientX - t/2) + 'px';
    fantome.style.top  = (ev.clientY - t/2) + 'px';
    cible.style.display = a ? '' : 'none';
    if(a){ cible.style.left = a.x*SC + 'px'; cible.style.top = a.y*SC + 'px'; }
    // Au doigt, le fantôme et la cible passent sous le doigt : une loupe
    // montre, au-dessus, l'hexagone visé.
    if(doigt) dessinerLoupe(ev.clientX, ev.clientY, a, rects);
    if(opts.pendant) opts.pendant(ev, a);
  };
  const creerFantome = () => {
    fantome = document.createElement('img');
    fantome.className = 'fantome';
    if(src) fantome.src = src;
    fantome.style.width = fantome.style.height = Math.max(24, taille) + 'px';
    document.body.appendChild(fantome);
    cible = document.createElement('div');
    cible.className = 'cible';
    document.getElementById('mapInner').appendChild(cible);
  };
  const bouge = ev => {
    if(ev.pointerId !== id) return;
    if(!demarre && Math.hypot(ev.clientX-x0, ev.clientY-y0) < seuil) return;
    if(!arme || opts.tapSeul){ abandonner(); return; }
    ev.preventDefault();
    if(!demarre){
      demarre = true;
      clearTimeout(timer);
      if(!zr) creerFantome();
      if(opts.debut) opts.debut();
    }
    dernier = ev;
    if(!raf) raf = requestAnimationFrame(peindre);
  };
  const nettoyer = () => {
    document.removeEventListener('pointermove', bouge);
    document.removeEventListener('pointerup', fin);
    document.removeEventListener('pointercancel', fin);
    wrap.removeEventListener('scroll', oublierRects);
    clearTimeout(timer);
    if(raf) cancelAnimationFrame(raf);
    if(fantome){ fantome.remove(); cible.remove(); }
    cacherLoupe();
    if(opts.fin) opts.fin();
    if(_glisse === g) _glisse = null;
  };
  const fin = ev => {
    if(ev.pointerId !== id) return;
    const avait = demarre;
    nettoyer();
    if(avait){
      if(ev.type !== 'pointerup') return;
      if(dansZone(ev)){ if(opts.lacherZone) opts.lacherZone(ev); }
      else auLacher(ev.clientX, ev.clientY, ev);
    }
    else if(ev.type === 'pointerup' && auClic) auClic(ev);
  };
  const abandonner = () => { fantome = fantome && (fantome.remove(), cible.remove(), null); nettoyer(); };
  const g = _glisse = {abandonner, id, actif: () => arme && !opts.tapSeul && (demarre || !!opts.appuiLong)};
  document.addEventListener('pointermove', bouge);
  document.addEventListener('pointerup', fin);
  document.addEventListener('pointercancel', fin);
  wrap.addEventListener('scroll', oublierRects);
  return g;
}
// Un glissé armé dans une liste : le doigt ne la fait plus défiler.
document.addEventListener('touchmove', e => { if(_glisse && _glisse.actif()) e.preventDefault(); }, {passive: false});

// ── Loupe de dépôt : 90 px, décalée au-dessus du doigt ; la zone des
// boards et les faces des pions autour du point visé, grossies, et le nom
// de l'ancrage.
const LOUPE = 90, LOUPE_GROS = 1.8;
function dessinerLoupe(cx, cy, a, rects){
  let l = document.getElementById('loupe');
  if(!a){ cacherLoupe(); return; }
  if(!l){
    l = document.createElement('div');
    l.id = 'loupe'; l.className = 'loupe';
    l.innerHTML = `<canvas width="${LOUPE * 2}" height="${LOUPE * 2}"></canvas><span></span>`;
    document.body.appendChild(l);
  }
  const cv = l.querySelector('canvas'), g = cv.getContext('2d');
  // Point visé, en pixels de #mapInner, et demi-côté de la zone montrée.
  const px = a.x * SC, py = a.y * SC;
  // La vue grossie LOUPE_GROS fois, sans montrer plus de deux hexagones.
  const cote = Math.min(LOUPE / LOUPE_GROS / zoom, 4 * HEX_HX * SC);
  const x0 = px - cote / 2, y0 = py - cote / 2, k = cv.width / cote;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#222'; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(k, 0, 0, k, -x0 * k, -y0 * k);
  for(const b of document.querySelectorAll('#mapInner canvas.boardLayer')){
    const L = parseFloat(b.style.left), T = parseFloat(b.style.top), W = parseFloat(b.style.width), H = parseFloat(b.style.height);
    if(L > x0 + cote || T > y0 + cote || L + W < x0 || T + H < y0) continue;
    try { g.drawImage(b, L, T, W, H); } catch(e){}
  }
  for(const p of pions){
    if(p.deleted || p.cache || !p.face.src || p.face.style.display === 'none') continue;
    const L = parseFloat(p.el.style.left), T = parseFloat(p.el.style.top), W = parseFloat(p.el.style.width) || p.sz;
    if(L > x0 + cote || T > y0 + cote || L + W < x0 || T + W < y0) continue;
    try { g.drawImage(p.face, L, T, W, W); } catch(e){}
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.strokeStyle = '#d9a441'; g.lineWidth = 4;
  g.beginPath(); g.arc(cv.width / 2, cv.height / 2, 16, 0, 2 * Math.PI); g.stroke();
  l.querySelector('span').textContent = a.label || '';
  l.style.left = (cx - LOUPE / 2) + 'px';
  l.style.top = Math.max(4, cy - LOUPE - 70) + 'px';
}
function cacherLoupe(){ const l = document.getElementById('loupe'); if(l) l.remove(); }

const _rectsCarte = () => ({wrap: document.getElementById('mapWrap').getBoundingClientRect(),
                            inner: document.getElementById('mapInner').getBoundingClientRect()});

// Point de l'écran → pixels VASL natifs, ou null hors de la carte — et
// null aussi sur un panneau ou une fenêtre qui la recouvre, sauf `libre`.
function clientVersCarte(cx, cy, rects, libre){
  const {wrap: wr, inner: mr} = rects || _rectsCarte();
  if(cx < wr.left || cx > wr.right || cy < wr.top || cy > wr.bottom) return null;
  if(!libre){
    const el = document.elementFromPoint(cx, cy);
    if(el && !document.getElementById('mapWrap').contains(el)) return null;
  }
  return {x: (cx - mr.left) / zoom / SC, y: (cy - mr.top) / zoom / SC};
}

// ── Panneau de la pile sélectionnée, du sommet vers le fond.
// La pile entière : c'est le clic sur une pile repliée, la dépose, la
// pose, et la relecture.
function selectionnerPile(k){
  selectionner(k ? pile(k) : []);
  if(k && _pileSel !== k){
    // Pile sans pion sélectionnable (une carte de VASL Tools) : elle reste
    // la pile courante, comme avant.
    const ancien = _pileSel;
    _pileSel = k;
    if(ancien) rendrePile(ancien);
    afficherPile();
  }
}

// Panneau de la pile courante, du sommet (en haut) vers le fond. Chaque
// ligne montre si son pion est sélectionné. Clic : ce pion seul ; Ctrl
// (Cmd) : l'ajouter ou le retirer ; Maj : la plage depuis le dernier clic.
// Glisser une ligne dans la liste change son rang (un seul M/) ; vers la
// carte, elle emporte la sélection si elle en fait partie, sinon ce pion.
let _ancrePile = null;
function afficherPile(){
  purgerSelection();
  majEventail();
  majBarrePile();
  const box = document.getElementById('pile');
  box.innerHTML = '';
  if(!_pileSel) return;
  const s = pile(_pileSel).filter(p => !p.cache).reverse();
  if(!s.length) return;
  const tete = document.createElement('div');
  tete.className = 'bordPile';
  tete.textContent = '▲ Sommet';
  box.appendChild(tete);
  const marque = document.createElement('div');
  marque.className = 'inserPile';
  marque.hidden = true;
  const lignes = [];
  // Vignettes de 56 px au doigt, de 36 px à la souris.
  const coteMini = _profil && _profil !== 'pc' ? 56 : 36;
  for(const p of s){
    const l = document.createElement('div');
    l.className = 'lig' + (_sel.has(p) ? ' sel' : '');
    const nom = p.el.title || p.nom;
    l.title = nom + ' — glisser dans la liste pour changer son rang, vers la carte pour le déplacer';
    l.setAttribute('role', 'option');
    l.setAttribute('aria-label', nom);
    l.setAttribute('aria-selected', String(_sel.has(p)));
    // Copie réduite du pion affiché : fond, couches et orientation.
    const im = document.createElement('div');
    im.className = 'mini';
    const copie = p.el.cloneNode(true);
    copie.classList.remove('sel', 'deplie');
    copie.removeAttribute('title');
    copie.style.cssText = `position:absolute;left:0;top:0;width:${p.sz}px;height:${p.sz}px;`
                        + `transform:scale(${coteMini / p.sz});transform-origin:0 0;opacity:1`;
    im.appendChild(copie);
    // Le pion seul, sans son nom.
    l.append(im);
    l.addEventListener('contextmenu', e => { e.preventDefault(); if(_dernierPointeur === 'mouse') ouvrirMenu(p, e.clientX, e.clientY, 'mouse'); });
    const plusieurs = () => _sel.has(p) && _sel.size > 1;
    for(const [txt, titre, f] of [['⋮', 'Commandes du pion (clic droit)', e => ouvrirMenu(p, e.clientX, e.clientY, e.pointerType || _dernierPointeur)],
                                  ['▲', 'Monter', () => changerRang(p, +1)],
                                  ['▼', 'Descendre', () => changerRang(p, -1)],
                                  ['✕', 'Retirer de la carte (la sélection, si ce pion en fait partie)',
                                   () => plusieurs() ? retirerSelection() : retirer(p)]]){
      const b = document.createElement('button');
      b.textContent = txt; b.title = titre; b.setAttribute('aria-label', titre);
      b.addEventListener('pointerdown', e => e.stopPropagation());
      b.addEventListener('click', f);
      l.appendChild(b);
    }
    // Rang visé : avant ou après la ligne la plus proche du pointeur.
    const vise = ev => {
      let best = null, bd = Infinity;
      for(const x of lignes){
        const r = x.l.getBoundingClientRect();
        const d = Math.abs((r.top + r.bottom) / 2 - ev.clientY);
        if(d < bd){ bd = d; best = {x, r}; }
      }
      return best && {q: best.x.p, r: best.r, dessus: ev.clientY < (best.r.top + best.r.bottom) / 2};
    };
    l.addEventListener('pointerdown', e => {
      if(e.button > 0) return;
      glisser(e, p.face.src, p.sz * zoom, (cx, cy) => {
        const c = clientVersCarte(cx, cy);
        if(c) deplacer(aEmporter(p), c.x, c.y);
      }, ev => {
        if(!selectionnable(p)) return;
        if(ev && (ev.ctrlKey || ev.metaKey)) selectionner([p], 'basculer');
        else if(ev && ev.shiftKey && _ancrePile && s.includes(_ancrePile)){
          const a = s.indexOf(_ancrePile), b = s.indexOf(p);
          selectionner(s.slice(Math.min(a, b), Math.max(a, b) + 1));
          return;
        } else selectionner([p]);
        _ancrePile = p;
      }, {
        appuiLong: 300,
        zone: box,
        dansZone: ev => {
          const v = vise(ev);
          if(!v) return;
          const br = box.getBoundingClientRect();
          marque.hidden = false;
          marque.style.top = ((v.dessus ? v.r.top : v.r.bottom) - br.top + box.scrollTop - 1) + 'px';
        },
        horsZone: () => { marque.hidden = true; },
        fin: () => { marque.hidden = true; },
        lacherZone: ev => {
          const v = vise(ev);
          if(!v || v.q === p) return;
          // La liste va du sommet au fond : « dessus » veut dire juste au-dessus.
          const sans = pile(cle(p)).filter(x => x !== p);
          deplacerDansPile(p, sans.indexOf(v.q) + (v.dessus ? 1 : 0));
        }
      });
    });
    lignes.push({l, p});
    box.appendChild(l);
  }
  const pied = document.createElement('div');
  pied.className = 'bordPile';
  pied.textContent = '▼ Fond';
  box.append(pied, marque);
}

// ═══ APERÇU DES PILES AU SURVOL ═══
// Comme le CounterDetailViewer de VASSAL : quand la souris s'arrête sur
// une pile, une bande montre tous ses pions côte à côte, du fond (à
// gauche) vers le sommet, en grand et sans le décalage d'empilement,
// avec la position et l'effectif. L'aperçu ne prend aucun geste.
const SURVOL_DELAI = 180, SURVOL_ECHELLE = 0.75;
let _survolTimer = null, _survolCache = null, _survolCle = null;

function survolEntre(p, e){
  clearTimeout(_survolCache); _survolCache = null;
  const k = cle(p);
  const t = document.getElementById('survol');
  if(t && _survolCle === k){ _placerSurvol(t, e.clientX, e.clientY); return; }
  clearTimeout(_survolTimer);
  const x = e.clientX, y = e.clientY;
  _survolTimer = setTimeout(() => afficherSurvol(k, x, y), SURVOL_DELAI);
}

// Passer d'un pion à l'autre d'une même pile ne doit pas faire clignoter.
function survolSort(){
  clearTimeout(_survolTimer); _survolTimer = null;
  clearTimeout(_survolCache);
  _survolCache = setTimeout(cacherSurvol, 120);
}

function cacherSurvol(){
  clearTimeout(_survolTimer); _survolTimer = null;
  clearTimeout(_survolCache); _survolCache = null;
  const t = document.getElementById('survol');
  if(t) t.remove();
  _survolCle = null;
}

function afficherSurvol(k, cx, cy){
  const s = pile(k).filter(p => !p.cache);
  if(!s.length) return;
  cacherSurvol();
  const t = document.createElement('div');
  t.id = 'survol'; t.className = 'survol';
  const a = ancragePlusProche(s[0].x, s[0].y);
  // VASL arrondit ses centres autrement que nous : quelques pixels d'écart
  // désignent encore le même ancrage.
  const ici = a && Math.hypot(a.x - s[0].x, a.y - s[0].y) < 4 ? a.label : `${s[0].x}, ${s[0].y}`;
  const tt = document.createElement('div');
  tt.className = 'tt';
  tt.textContent = `${ici} — ${s.length} pion${s.length > 1 ? 's' : ''}`;
  const rang = document.createElement('div');
  rang.className = 'rang';
  for(const p of s){
    // Copie du pion affiché : face, couches et orientation comprises.
    const c = p.el.cloneNode(true);
    c.classList.remove('sel');
    c.removeAttribute('title');
    c.style.cssText = `position:absolute;left:0;top:0;width:${p.sz}px;height:${p.sz}px;`
                    + `transform:scale(${SURVOL_ECHELLE});transform-origin:0 0;`;
    const boite = document.createElement('div');
    const cote = Math.round(p.sz * SURVOL_ECHELLE);
    boite.style.cssText = `position:relative;width:${cote}px;height:${cote}px`;
    boite.appendChild(c);
    // Le pion seul, sans son nom.
    const cel = document.createElement('div');
    cel.className = 'cel';
    cel.append(boite);
    rang.appendChild(cel);
  }
  t.append(tt, rang);
  document.body.appendChild(t);
  _placerSurvol(t, cx, cy);
  _survolCle = k;
}

// Au-dessus du curseur, sans sortir de la fenêtre.
function _placerSurvol(t, cx, cy){
  let x = cx - t.offsetWidth/2, y = cy - t.offsetHeight - 16;
  x = Math.max(4, Math.min(x, window.innerWidth - t.offsetWidth - 4));
  if(y < 4) y = cy + 24;
  t.style.left = x + 'px'; t.style.top = y + 'px';
}

// Au doigt, pas de clic droit : un appui maintenu sans bouger (500 ms)
// ouvre le menu du pion, comme le clic droit, et vibre. C'est le seul
// accès au menu sur iOS, qui n'envoie pas de contextmenu.
const APPUI_LONG = 500;
function _appuiLong(e, p){
  const x0 = e.clientX, y0 = e.clientY, id = e.pointerId;
  const timer = setTimeout(() => {
    if(_glisse) _glisse.abandonner();
    if(_pointeursCarte.size > 1) return;
    vibrer();
    if(!_sel.has(p)) selectionnerPile(cle(p));
    ouvrirMenu(p, x0, y0, 'touch');
  }, APPUI_LONG);
  const bouge = ev => {
    if(ev.pointerId !== id || Math.hypot(ev.clientX - x0, ev.clientY - y0) < 12) return;
    clearTimeout(timer);
    fin();
  };
  const leve = ev => {
    if(ev.pointerId !== id) return;
    clearTimeout(timer);
    fin();
  };
  const fin = () => {
    document.removeEventListener('pointermove', bouge);
    document.removeEventListener('pointerup', leve);
    document.removeEventListener('pointercancel', leve);
  };
  document.addEventListener('pointermove', bouge);
  document.addEventListener('pointerup', leve);
  document.addEventListener('pointercancel', leve);
}


// ═══════════════════════════════════════════════════════════════
// COMPOSANTS TACTILES — feuille du bas, barre de pile, éventail,
// poses et déplacements en deux appuis, verrou des pions
// ═══════════════════════════════════════════════════════════════

// ── Feuille du bas générique : fond sombre, poignée, fermeture par glissé
// vers le bas, Échap ou appui sur le voile.
//   hauteur : 'auto' | 'moitie' | 'plein'
const _feuilles = new Map();      // id → {el, voile, fermer}
function ouvrirFeuille({id = 'feuille', titre = '', hauteur = 'auto', fermer, voile = true} = {}){
  fermerFeuille(id);
  const v = document.createElement('div');
  v.className = 'voile' + (voile ? '' : ' transparent');
  const f = document.createElement('div');
  f.className = 'feuille ' + hauteur;
  f.dataset.feuille = id;
  f.setAttribute('role', 'dialog');
  f.setAttribute('aria-modal', 'true');
  f.innerHTML = '<div class="poigneeFeuille" aria-hidden="true"></div>'
    + '<div class="teteFeuille"><span class="tt"></span><button type="button" class="ferme" aria-label="Fermer">✕</button></div>'
    + '<div class="corpsFeuille"></div>';
  f.querySelector('.tt').textContent = titre;
  if(!titre) f.querySelector('.teteFeuille').classList.add('sansTitre');
  document.body.append(v, f);
  const h = {el: f, voile: v, corps: f.querySelector('.corpsFeuille'), fermer: () => fermerFeuille(id),
             titre: t => { f.querySelector('.tt').textContent = t; }};
  h._surFermer = fermer;
  _feuilles.set(id, h);
  v.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); h.fermer(); });
  f.addEventListener('pointerdown', e => e.stopPropagation());
  f.querySelector('.ferme').addEventListener('click', () => h.fermer());
  // Glisser la poignée (ou l'en-tête) vers le bas referme la feuille.
  for(const prise of [f.querySelector('.poigneeFeuille'), f.querySelector('.teteFeuille')]){
    prise.addEventListener('pointerdown', e => {
      if(e.target.closest('button')) return;
      const id0 = e.pointerId, y0 = e.clientY;
      let dy = 0;
      f.style.transition = 'none';
      const bouge = ev => { if(ev.pointerId !== id0) return; dy = Math.max(0, ev.clientY - y0); f.style.transform = `translateY(${dy}px)`; };
      const finir = ev => {
        if(ev.pointerId !== id0) return;
        document.removeEventListener('pointermove', bouge);
        document.removeEventListener('pointerup', finir);
        document.removeEventListener('pointercancel', finir);
        f.style.transition = ''; f.style.transform = '';
        if(dy > 80) h.fermer();
      };
      document.addEventListener('pointermove', bouge);
      document.addEventListener('pointerup', finir);
      document.addEventListener('pointercancel', finir);
    });
  }
  setTimeout(() => { const b = f.querySelector('.corpsFeuille button, .corpsFeuille input, .corpsFeuille select'); if(b && _profil === 'pc') b.focus(); }, 0);
  return h;
}
function fermerFeuille(id){
  const h = _feuilles.get(id);
  if(!h) return false;
  _feuilles.delete(id);
  h.el.remove(); h.voile.remove();
  if(h._surFermer) h._surFermer();
  return true;
}
const feuilleOuverte = () => _feuilles.size > 0;
// Dans une feuille, ↑ et ↓ passent d'une entrée à l'autre.
window.addEventListener('keydown', e => {
  if(!_feuilles.size || (e.key !== 'ArrowDown' && e.key !== 'ArrowUp')) return;
  const f = [..._feuilles.values()].pop().el;
  const l = [...f.querySelectorAll('.corpsFeuille button:not(:disabled)')];
  if(!l.length || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  e.preventDefault(); e.stopImmediatePropagation();
  const i = l.indexOf(document.activeElement);
  l[(i + (e.key === 'ArrowDown' ? 1 : -1) + l.length) % l.length].focus();
}, true);
// Échap referme la dernière feuille ouverte, avant tout le reste.
window.addEventListener('keydown', e => {
  if(e.key !== 'Escape' || !_feuilles.size) return;
  e.preventDefault(); e.stopImmediatePropagation();
  fermerFeuille([..._feuilles.keys()].pop());
}, true);

// ── Commandes rapides : celles, nommées et dotées d'une touche, des pions
// donnés, avec les filtres du menu ; classées par fréquence d'usage, puis
// dans l'ordre des traits.
function commandesRapides(pions, n = 5){
  const vues = new Map();
  let rang = 0;
  for(const p of pions){
    const a = arbreCommandes(p);
    if(!a) continue;
    const aplatir = items => { for(const c of items){
      if(c.items){ aplatir(c.items); continue; }
      if(!c.touche || c.grise) continue;
      const k = c.nom + '\u0001' + c.touche;
      if(!vues.has(k)) vues.set(k, {nom: c.nom, touche: c.touche, cmd: c.cmd, p, rang: rang++});
    } };
    aplatir(a.items);
  }
  return [...vues.values()].sort((a, b) => (_freqCmd[b.nom] || 0) - (_freqCmd[a.nom] || 0) || a.rang - b.rang).slice(0, n);
}
// Pions visés par les barres : la sélection, sinon la pile courante.
const _visesBarre = () => _sel.size ? trierParPile([..._sel])
                    : _pileSel ? pile(_pileSel).filter(selectionnable) : [];

function _rangeeCommandes(boite, avecDeplacer){
  const vises = _visesBarre();
  const haut = vises[vises.length - 1];
  for(const c of commandesRapides(vises)){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'act bouton cmdRapide';
    b.textContent = c.nom;
    b.title = c.nom + (libelleTouche(c.touche) ? ` [${libelleTouche(c.touche)}]` : '');
    b.addEventListener('click', () => {
      _freqCmd[c.nom] = (_freqCmd[c.nom] || 0) + 1;
      try { localStorage.setItem('aslweb.freqCmd', JSON.stringify(_freqCmd)); } catch(e){}
      if(_sel.size) commanderSelection(c.touche);
      else commander(vises.filter(p => !accesRefuse(p) && commandesDe(_typeEtEtat(p.seg).type).cmds.some(x => x.touche === c.touche)), c.touche);
    });
    boite.appendChild(b);
  }
  const outil = (txt, titre, f, cls) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'act bouton ' + (cls || '');
    b.textContent = txt; b.title = titre; b.setAttribute('aria-label', titre);
    b.addEventListener('click', f);
    boite.appendChild(b);
    return b;
  };
  if(haut) outil('⋮ Toutes', 'Toutes les commandes', () => ouvrirMenu(haut, 0, 0, 'touch'));
  if(avecDeplacer && vises.length) outil('Déplacer…', 'Déplacer : toucher ensuite la destination', () => armerDeplacement());
  if(vises.length) outil('✕', 'Retirer de la carte', () => retirerSelection(), 'danger');
}

// Retire la sélection (ou la pile courante) ; confirmation dès 3 pions.
function retirerSelection(){
  const l = _visesBarre().filter(p => !accesRefuse(p));
  if(!l.length){ const v = _visesBarre(); if(v.length) refuser(v[0]); return; }
  if(l.length >= 3 && !confirm(`Retirer ${l.length} pions de la carte ?`)) return;
  for(const p of l) retirer(p, l.length > 1);
  if(l.length > 1) chatLog(`✖️ ${l.length} pions retirés`);
}

// ── Barre de pile (profils tactiles) : en bas de la carte, tant qu'une
// pile est sélectionnée et que l'éventail est fermé.
function majBarrePile(){
  let b = document.getElementById('barrePile');
  const montrer = _profil && _profil !== 'pc' && (_sel.size || _pileSel) && !_eventail && !_modeCarte;
  document.body.classList.toggle('avecBarrePile', !!montrer);
  if(!montrer){ if(b) b.remove(); if(typeof _placerVolants === 'function') _placerVolants(); return; }
  if(!b){
    b = document.createElement('div');
    b.id = 'barrePile'; b.className = 'barrePile';
    b.setAttribute('role', 'toolbar');
    b.addEventListener('pointerdown', e => e.stopPropagation());
    document.getElementById('corps').appendChild(b);
  }
  b.replaceChildren();
  const vises = _visesBarre();
  const s = _pileSel ? pile(_pileSel).filter(p => !p.cache) : [];
  const haut = vises[vises.length - 1] || s[s.length - 1];
  // La pile en miniature : un appui ouvre l'éventail.
  const mini = document.createElement('button');
  mini.type = 'button'; mini.className = 'miniPile';
  mini.setAttribute('aria-label', 'Pions de la pile');
  if(haut) mini.appendChild(_copiePion(haut, 34));
  const nb = document.createElement('span');
  nb.className = 'nb';
  nb.textContent = _sel.size && _sel.size < s.filter(selectionnable).length ? `${_sel.size}/${s.length}` : String(s.length);
  mini.appendChild(nb);
  mini.addEventListener('click', () => { if(_pileSel) ouvrirEventail(_pileSel); });
  b.appendChild(mini);
  _rangeeCommandes(b, true);
  _placerBarrePile();
  _placerVolants();
}
function _placerBarrePile(){
  const b = document.getElementById('barrePile');
  if(!b) return;
  const w = document.getElementById('mapWrap');
  b.style.left = w.offsetLeft + 'px';
  b.style.width = w.clientWidth + 'px';
}

// Copie réduite d'un pion affiché (face, couches, orientation).
function _copiePion(p, cote){
  const boite = document.createElement('div');
  boite.className = 'copiePion';
  boite.style.width = boite.style.height = cote + 'px';
  const c = p.el.cloneNode(true);
  c.classList.remove('sel', 'deplie', 'coup', 'verrou');
  c.removeAttribute('title');
  c.style.cssText = `position:absolute;left:0;top:0;width:${p.sz}px;height:${p.sz}px;`
                  + `transform:scale(${cote / p.sz});transform-origin:0 0;opacity:1`;
  boite.appendChild(c);
  return boite;
}

// ── Éventail de pile : au doigt, viser un pion décalé de 4 px est
// impossible ; une bande flottante montre la pile en grand, du fond
// (à gauche) vers le sommet, au-dessus de la pile.
let _eventail = null;            // {k, el}
const EVENTAIL_COTE = 60, EVENTAIL_PAR_RANG = 6;
function ouvrirEventail(k){
  if(_filArme) return;
  _eventail = {k, el: null};
  majEventail();
  majBarrePile();
}
function fermerEventail(){
  if(!_eventail) return;
  if(_eventail.el) _eventail.el.remove();
  _eventail = null;
  majBarrePile();
}
function majEventail(){
  const ev = _eventail;
  if(!ev) return;
  const s = pile(ev.k).filter(selectionnable);
  if(!s.length){ fermerEventail(); return; }
  const defil = ev.el ? ev.el.querySelector('.bandeEv').scrollTop : 0;
  if(ev.el) ev.el.remove();
  const el = ev.el = document.createElement('div');
  el.id = 'eventail'; el.className = 'eventail';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-label', 'Pions de la pile');
  el.addEventListener('pointerdown', e => e.stopPropagation());
  el.addEventListener('contextmenu', e => e.preventDefault());
  const bande = document.createElement('div');
  bande.className = 'bandeEv';
  bande.style.maxWidth = (EVENTAIL_PAR_RANG * (EVENTAIL_COTE + 8) + 56) + 'px';
  const tout = document.createElement('button');
  tout.type = 'button'; tout.className = 'act bouton tout';
  tout.textContent = 'Tout';
  tout.title = 'Sélectionner toute la pile';
  tout.addEventListener('click', () => { selectionnerPile(ev.k); vibrer(); });
  bande.appendChild(tout);
  const marque = document.createElement('div');
  marque.className = 'inserEv';
  marque.hidden = true;
  for(const p of s) bande.appendChild(_vignetteEventail(p, ev.k, bande, marque));
  const som = document.createElement('span');
  som.className = 'sommetEv';
  som.textContent = 'sommet ▸';
  bande.append(som, marque);
  const actions = document.createElement('div');
  actions.className = 'actionsEv';
  _rangeeCommandes(actions, false);
  el.append(bande, actions);
  document.body.appendChild(el);
  bande.scrollTop = defil;
  placerEventail();
}
function placerEventail(){
  const ev = _eventail;
  if(!ev || !ev.el) return;
  const s = pile(ev.k).filter(p => !p.cache);
  const haut = s[s.length - 1];
  if(!haut){ fermerEventail(); return; }
  const r = haut.el.getBoundingClientRect(), bas = s[0].el.getBoundingClientRect();
  const w = document.getElementById('mapWrap').getBoundingClientRect();
  const el = ev.el, L = el.offsetWidth, H = el.offsetHeight;
  let x = (r.left + r.right) / 2 - L / 2;
  let y = Math.min(r.top, bas.top) - H - 10;
  if(y < w.top + 4) y = Math.max(r.bottom, bas.bottom) + 10;
  x = Math.max(8, Math.min(x, window.innerWidth - L - 8));
  y = Math.max(w.top + 4, Math.min(y, w.bottom - H - 4));
  el.style.left = x + 'px'; el.style.top = y + 'px';
}

function _vignetteEventail(p, k, bande, marque){
  const v = document.createElement('div');
  v.className = 'vigEv';
  const masque = accesRefuse(p), horsCouche = !COUCHES_SEL[p.couche || 'unite'];
  v.classList.toggle('sel', _sel.has(p));
  v.classList.toggle('masque', masque);
  v.classList.toggle('horsCouche', horsCouche);
  v.title = p.el.title || p.nom;
  v.setAttribute('aria-label', (p.el.title || p.nom) + (_sel.has(p) ? ', sélectionné' : ''));
  v.appendChild(_copiePion(p, EVENTAIL_COTE));
  if(masque){ const c = document.createElement('span'); c.className = 'cadenas'; c.textContent = '🔒'; v.appendChild(c); }
  if(horsCouche) return v;        // couche non sélectionnable : vue, pas prise
  const ck = document.createElement('button');
  ck.type = 'button'; ck.className = 'ckEv';
  ck.textContent = _sel.has(p) ? '☑' : '☐';
  ck.setAttribute('aria-label', _sel.has(p) ? 'Retirer de la sélection' : 'Ajouter à la sélection');
  ck.addEventListener('pointerdown', e => e.stopPropagation());
  ck.addEventListener('click', e => { e.stopPropagation(); selectionner([p], 'basculer'); vibrer(); });
  v.appendChild(ck);
  v.addEventListener('pointerdown', e => {
    if(e.button > 0) return;
    const x0 = e.clientX, y0 = e.clientY;
    // Appui long : le menu de ce pion, en feuille du bas.
    const timer = setTimeout(() => {
      if(_glisse) _glisse.abandonner();
      vibrer();
      if(!_sel.has(p)) selectionner([p]);
      ouvrirMenu(p, x0, y0, 'touch');
    }, APPUI_LONG);
    // Rang visé dans la bande : avant ou après la vignette sous le doigt.
    const rangVise = ev => {
      const cases = [...bande.querySelectorAll('.vigEv')];
      let best = null, bd = Infinity;
      for(const c of cases){
        const r = c.getBoundingClientRect();
        const d = Math.hypot((r.left + r.right) / 2 - ev.clientX, (r.top + r.bottom) / 2 - ev.clientY);
        if(d < bd){ bd = d; best = {c, r}; }
      }
      if(!best) return null;
      return {c: best.c, r: best.r, apres: ev.clientX > (best.r.left + best.r.right) / 2, i: cases.indexOf(best.c)};
    };
    glisser(e, p.face.src, EVENTAIL_COTE, (cx, cy) => {
      // Lâché sur la carte : la sélection, ou ce pion s'il n'en est pas.
      const c = clientVersCarte(cx, cy);
      if(!c || masque) return;
      deplacer(aEmporter(p), c.x, c.y);
    }, () => {
      clearTimeout(timer);
      selectionner([p]); vibrer();
    }, {
      zone: bande,
      debut: () => clearTimeout(timer),
      fin: () => { clearTimeout(timer); marque.hidden = true; },
      dansZone: ev => {
        const r = rangVise(ev);
        if(!r) return;
        const br = bande.getBoundingClientRect();
        marque.hidden = false;
        marque.style.left = ((r.apres ? r.r.right + 3 : r.r.left - 5) - br.left + bande.scrollLeft) + 'px';
        marque.style.top = (r.r.top - br.top + bande.scrollTop) + 'px';
        marque.style.height = r.r.height + 'px';
      },
      horsZone: () => { marque.hidden = true; },
      lacherZone: ev => {
        // Glissé le long de la bande : un seul M/, au rang visé.
        const r = rangVise(ev);
        if(!r || masque) return;
        const vus = pile(k).filter(selectionnable);
        const q = vus[r.i];
        if(!q || q === p) return;
        const sans = pile(k).filter(x => x !== p);
        deplacerDansPile(p, sans.indexOf(q) + (r.apres ? 1 : 0));
        vibrer();
      }
    });
  });
  return v;
}

// L'éventail et la barre suivent la sélection, la pile et la vue.
_apresRedimension.push(() => { placerEventail(); _placerBarrePile(); if(_fil) dessinerFil(); });
_apresProfil.push(() => { fermerEventail(); majBarrePile(); });

let _modeCarte = null;           // {texte, toucher(c), multiple}

function toucherModeCarte(c){

function armerDeplacement(){
  const l = _sel.size ? piecesADeplacer() : (_pileSel ? pile(_pileSel) : []);
  if(!l.length) return;
  armerModeCarte({texte: `➡️ ${l.length > 1 ? l.length + ' pions' : l[0].nom} — touchez la destination`,
    toucher: c => deplacer(l.filter(p => !p.deleted), c.x, c.y)});
}
function armerPose(x){

    multiple: _lirePref('aslweb.posesMultiples') === '1',

// ── Verrou des pions : un glissé déplace toujours la carte, jamais une
// pile ; on déplace alors par « Déplacer… ».
let _verrouPions = _lirePref('aslweb.verrouPions') === '1';
function basculerVerrou(){
  _verrouPions = !_verrouPions;
  try { localStorage.setItem('aslweb.verrouPions', _verrouPions ? '1' : '0'); } catch(e){}
  chatLog(_verrouPions ? '🔒 Pions verrouillés : un glissé déplace la carte' : '🔓 Pions déverrouillés');
}

// Au doigt, un appui hors de tout pion prend la pile la plus proche si son
// centre est à moins de 30 px à l'écran : après « Ajuster », un pion de
// téléphone ne fait que quelques pixels.
function pileProche(cx, cy){
  const c = clientVersCarte(cx, cy, null, true);
  if(!c) return null;
  let best = null, bd = 30;
  for(const [k, l] of indexerPiles()){
    const vus = l.filter(p => selectionnable(p) && COUCHES_SEL[p.couche || 'unite']);
    if(!vus.length) continue;
    const d = Math.hypot(l[0].x - c.x, l[0].y - c.y) * SC * zoom;
    if(d < bd){ bd = d; best = k; }
  }
  return best;
}

// Appui (doigt) sur une pile : elle est sélectionnée ; de deux pions ou
// plus, l'éventail s'ouvre ; un double appui l'ouvre même pour un seul.
let _dernierAppui = {k: null, t: 0};
function appuiSurPile(k){
  const double = _dernierAppui.k === k && Date.now() - _dernierAppui.t < 350;
  _dernierAppui = {k, t: Date.now()};
  if(!(_sel.size && pileEntiereSel(k)) || !_eventail || _eventail.k !== k) selectionnerPile(k);
  const n = pile(k).filter(selectionnable).length;
  if(n >= 2 || (double && n >= 1)) ouvrirEventail(k);
  else majBarrePile();
}

// BASE DE DONNÉES DES PIONS — le buildFile du module VASL
// Chaque PieceSlot y donne le nom, le gpid et la définition VASSAL
// complète du pion (« +/null/TYPE/ÉTAT »), celle-là même que VASL écrit
// quand on tire un pion de sa palette. On la lit une fois, à la première
// ouverture de la palette.
// ═══════════════════════════════════════════════════════════════
const VASL_BUILDFILE_URL =
  'https://raw.githubusercontent.com/vasl-developers/vasl/develop/dist/buildFile';
const FENETRES_PALETTE = ['VASL Counters', '?'];
let _bdd = null, _bddPromesse = null;

function chargerBDD(){
  if(!_bddPromesse) _bddPromesse = _chargerBDD().catch(e => {
    _bddPromesse = null;
    chatLog('❌ Base de données VASL indisponible : ' + e.message);
    throw e;
  });
  return _bddPromesse;
}

async function _chargerBDD(){
  chatLog('⏳ Lecture de la base de données des pions VASL…');
  const r = await fetch(VASL_BUILDFILE_URL);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), 'application/xml');
  const mod = doc.documentElement;
  const cats = [], slots = [], idxCat = new Map();
  // Arbre des widgets de la palette, tel que VASL le construit :
  // TabWidget (onglets), ListWidget (liste), BoxWidget (liste déroulante),
  // PanelWidget (grille), et les PieceSlot dans l'ordre du module.
  let nid = 0;
  const construire = (el, chemin) => {
    const t = el.tagName.split('.').pop();
    const nom = el.getAttribute('entryName') || el.getAttribute('name') || '';
    const noeud = {id: nid++, t, nom, enfants: []};
    for(const c of el.children){
      const tag = c.tagName.split('.').pop();
      if(tag === 'PieceSlot'){
        const ch = chemin.join(' / ');
        if(!idxCat.has(ch)){ idxCat.set(ch, cats.length); cats.push(ch); }
        const x = {n: c.getAttribute('entryName') || '?', g: c.getAttribute('gpid'),
                   c: idxCat.get(ch), cmd: (c.textContent || '').trim()};
        slots.push(x);
        noeud.enfants.push(x);
      } else if(/Widget$/.test(tag)){
        const n = c.getAttribute('entryName') || c.getAttribute('name') || '';
        noeud.enfants.push(construire(c, n ? [...chemin, n] : chemin));
      }
    }
    return noeud;
  };
  const arbre = {id: nid++, t: 'Racine', nom: '', enfants: []};
  const protos = new Map();
  for(const e of doc.getElementsByTagName('*'))
    if(e.tagName.endsWith('.PrototypeDefinition'))
      protos.set(e.getAttribute('name'), (e.textContent || '').trim());
  for(const w of mod.children){
    if(w.tagName.split('.').pop() !== 'PieceWindow') continue;
    const nom = w.getAttribute('name');
    if(FENETRES_PALETTE.includes(nom)) arbre.enfants.push(construire(w, nom === '?' ? ['?'] : []));
  }
  // Tous les PieceSlot du module, par gpid : un pion peut en poser un
  // autre (Place Marker, Replace, DM, ACQ), même hors de la palette.
  const parGpid = new Map();
  for(const e of doc.getElementsByTagName('*'))
    if(e.tagName.endsWith('.PieceSlot') && e.getAttribute('gpid'))
      parGpid.set(e.getAttribute('gpid'), {n: e.getAttribute('entryName') || '?', g: e.getAttribute('gpid'),
                                           cmd: (e.textContent || '').trim()});
  // … et par chemin de composants (ComponentPathBuilder) : c'est ainsi que
  // le trait de dissimulation désigne son contre-pion « ? ».
  const parChemin = new Map();
  for(const e of doc.getElementsByTagName('*')){
    if(!e.tagName.endsWith('.PieceSlot')) continue;
    const noms = [];
    for(let a = e; a && a !== mod; a = a.parentElement)
      noms.unshift(a.getAttribute('entryName') || a.getAttribute('name') || '');
    parChemin.set(noms.join('\u0001'), parGpid.get(e.getAttribute('gpid')));
  }
  // Bouton « ALL » de la carte (MassRemover) : chaque entrée donne une
  // action et un nom de pion ; les actions gardent l'ordre du module.
  const massRemover = [];
  for(const e of doc.getElementsByTagName('*')){
    if(!e.tagName.endsWith('.MassRemover')) continue;
    for(const en of e.getElementsByTagName('*')){
      const nom = en.getAttribute('name') || '';
      let a = massRemover.find(x => x.nom === nom);
      if(!a) massRemover.push(a = {nom, pions: []});
      a.pions.push(en.textContent || '');
    }
  }
  // Empilement de la carte de jeu (StackMetrics) : écarts replié et
  // déplié, en pixels natifs, et touches qui changent le rang d'un pion.
  let sm = null;
  for(const e of doc.getElementsByTagName('*')){
    if(!e.tagName.endsWith('.StackMetrics')) continue;
    const carte = e.parentElement && e.parentElement.getAttribute('mapName');
    if(!sm || carte === 'Main Map') sm = e;
  }
  const entier = (n, d) => { const v = parseInt(sm.getAttribute(n), 10); return Number.isFinite(v) ? v : d; };
  const stackMetrics = sm ? {
    unexSepX: entier('unexSepX', 2), unexSepY: entier('unexSepY', 4),
    exSepX: entier('exSepX', 6), exSepY: entier('exSepY', 18),
    disabled: sm.getAttribute('disabled') === 'true',
    top: lireTouche(sm.getAttribute('top')) || METRIQUES_DEFAUT.top,
    bottom: lireTouche(sm.getAttribute('bottom')) || METRIQUES_DEFAUT.bottom,
    up: lireTouche(sm.getAttribute('up')) || METRIQUES_DEFAUT.up,
    down: lireTouche(sm.getAttribute('down')) || METRIQUES_DEFAUT.down} : null;
  _bdd = {cats, pions: slots, protos, parGpid, parChemin, arbre, massRemover, stackMetrics, version: mod.getAttribute('version')};
  rendreToutes();
  // Les pions déjà sur la carte gagnent les couches de leurs prototypes.
  for(const p of vivants()) majApparence(p);
  chatLog(`📚 Base VASL ${_bdd.version} : ${slots.length} pions, ${cats.length} catégories`);
  return _bdd;
}

// Lecture d'un PieceSlot comme d'une pièce, faite à la demande.
function lireSlot(x){
  if(!x.lu) x.lu = lirePiece(x.cmd.replace(/^\+\/null\//, '+/0/'));
  return x.lu;
}

let _palFiltre = '';

async function dessinerPalette(){
  const box = document.getElementById('palCorps');
  if(!_bdd){
    box.innerHTML = '<div style="padding:8px;color:var(--doux)">Chargement de la base VASL…</div>';
    try { await chargerBDD(); } catch(e){ box.innerHTML = '<div style="padding:8px">Base indisponible.</div>'; return; }
  }
  const B = _bdd;
  const defil = box.scrollTop;
  box.innerHTML = '';
  if(_palFiltre){
    const t = B.pions.filter(x => x.n.toLowerCase().includes(_palFiltre)).slice(0, 200);
    const info = document.createElement('div');
    info.style.cssText = 'opacity:.6;margin:4px 0';
    info.textContent = t.length + ' pion(s)' + (t.length === 200 ? ' (200 premiers)' : '');
    box.appendChild(info);
    box.appendChild(remplirGrille(t));
    return;
  }
  rendreWidget(B.arbre, box);
  box.scrollTop = defil;
}

// ── Widgets de la palette VASL. Seule la branche sélectionnée est dessinée :
// les vignettes ne se chargent qu'à l'ouverture de leur panneau.
// La sélection de chaque widget est retenue d'une visite à l'autre.
const _palSel = (() => {
  try { return new Map(JSON.parse(localStorage.getItem('palSel') || '[]')); } catch(e){ return new Map(); }
})();
function _choisir(noeud, i){
  _palSel.set(noeud.id, i);
  try { localStorage.setItem('palSel', JSON.stringify([..._palSel])); } catch(e){}
  dessinerPalette();
}

function rendreWidget(n, boite){
  const widgets = n.enfants.filter(e => e.enfants);
  const pions = n.enfants.filter(e => !e.enfants);
  const sel = Math.min(_palSel.get(n.id) || 0, Math.max(0, widgets.length - 1));
  const contenu = () => {
    const z = document.createElement('div');
    z.className = 'wcontenu';
    if(widgets[sel]) rendreWidget(widgets[sel], z);
    return z;
  };
  // Une fenêtre de palette qui contient plusieurs widgets les présente en
  // onglets, comme PieceWindow (la fenêtre « ? » : un onglet par nation).
  if(n.t === 'TabWidget' || n.t === 'Racine' || (n.t === 'PieceWindow' && widgets.length > 1)){
    // Onglets : un par widget enfant.
    if(pions.length) boite.appendChild(remplirGrille(pions));
    if(!widgets.length) return;
    const o = document.createElement('div');
    o.className = 'onglets';
    widgets.forEach((w, i) => {
      const b = document.createElement('div');
      b.className = 'onglet' + (i === sel ? ' actif' : '');
      b.textContent = w.nom || '—';
      b.addEventListener('click', () => _choisir(n, i));
      o.appendChild(b);
    });
    boite.append(o, contenu());
  } else if(n.t === 'BoxWidget'){
    // Liste déroulante.
    const t = document.createElement('div');
    t.className = 'wtitre'; t.textContent = n.nom;
    const s = document.createElement('select');
    s.className = 'wboite';
    widgets.forEach((w, i) => s.add(new Option(w.nom || '—', i, false, i === sel)));
    s.addEventListener('change', () => _choisir(n, +s.value));
    boite.append(t, s);
    if(pions.length) boite.appendChild(remplirGrille(pions));
    if(widgets.length) boite.appendChild(contenu());
  } else if(n.t === 'ListWidget'){
    // Liste : le choix d'une entrée affiche son contenu en dessous.
    if(widgets.length){
      const l = document.createElement('div');
      l.className = 'wliste';
      widgets.forEach((w, i) => {
        const e = document.createElement('div');
        e.className = 'wli' + (i === sel ? ' actif' : '');
        e.textContent = w.nom || '—';
        e.addEventListener('click', () => _choisir(n, i));
        l.appendChild(e);
      });
      boite.appendChild(l);
    }
    if(pions.length) boite.appendChild(remplirGrille(pions));
    if(widgets.length) boite.appendChild(contenu());
  } else {
    // PanelWidget, PieceWindow : tout le contenu, dans l'ordre du module ;
    // un panneau imbriqué porte son titre.
    let lot = [];
    const vider = () => { if(lot.length) boite.appendChild(remplirGrille(lot)); lot = []; };
    for(const e of n.enfants){
      if(!e.enfants){ lot.push(e); continue; }
      vider();
      if(e.t === 'PanelWidget' && e.nom){
        const t = document.createElement('div');
        t.className = 'wtitre'; t.textContent = e.nom;
        boite.appendChild(t);
      }
      rendreWidget(e, boite);
    }
    vider();
  }
}

function remplirGrille(liste){
  const g = document.createElement('div');
  g.className = 'grille';
  for(const x of liste){
    const d = document.createElement('div');
    d.className = 'vig';
    d.title = `${x.n}  (gpid ${x.g}) — glisser vers la carte, ou cliquer pour poser au centre ; au doigt, toucher puis toucher la carte`;
    d.setAttribute('aria-label', x.n);
    const mini = document.createElement('div');
    mini.className = 'mini';
    d.appendChild(mini);
    g.appendChild(d);
    composerVignette(mini, lireSlot(x), 42);
    // Glisser vers la carte, ou clic : pose au centre de la vue.
    d.addEventListener('pointerdown', e => glisser(e, (mini.querySelector('img') || {}).src, 48 * SC * zoom, (cx, cy) => {
      const c = clientVersCarte(cx, cy);
      if(c) poserDepuisPalette(x, c.x, c.y);
      else chatLog('Lâché hors de la carte : rien posé');
    }, ev => {
      // Au doigt : le pion est armé, l'appui suivant sur la carte le pose.
      if(ev && ev.pointerType && ev.pointerType !== 'mouse') armerPose(x);
      else _poserAuCentre(x);
    }, {appuiLong: 300}));
  }
  return g;
}

// ═══════════════════════════════════════════════════════════════
// DÉS — d'après ASLDiceBot et ASLChatter (VASL)
// Le jet est un message de chat au format d'ASLDiceBot, que VASL relit
// et décore lui-même :
//   *** (IFT DR) 3,1 ***   <Pierre>      Axis SAN    [1 / 8   avg   6,62 (6,62)]    (01.51)
// Le premier dé est le COLORÉ, le second le blanc. Le SAN se contrôle
// sur le total du DR original (A14.2), comme IsSpecialDiceRoll().
// ═══════════════════════════════════════════════════════════════
const DE_COLORE = 'R', DE_BLANC = 'W';     // DC<n>_<couleur>.png du module

// ═══ UTILISATEURS ET PROPRIÉTÉ DES PIONS ═══
// Comme dans VASSAL, un joueur a un NOM, qui s'inscrit dans la propriété
// Owner des pions qu'il pose ou déplace ($PlayerName$), et un MOT DE
// PASSE, qui est l'identifiant de ses masques : l'état des traits conceal
// et hide d'un fichier VASL porte ce mot de passe. Le saisir prouve donc
// qu'on est ce joueur, sans qu'aucune liste de mots de passe ne soit lue.
//
// Comme dans VASL, la propriété ne joue que pour les masques : tout le
// monde déplace tous les pions, mais un pion dissimulé (« ? ») ou en HIP
// n'est visible et commandable que par le joueur qui l'a masqué.
// L'administrateur voit et commande tout : arbitrage, relecture, partie
// solitaire.
//
// Rien de tout cela ne résiste à quelqu'un qui ouvre la console : tout
// s'exécute dans son navigateur. Le contrôle évite les regards
// distraits, pas la triche — il faudrait un serveur pour cela.
const NOM_ADMIN = 'Administrateur';
const ADMIN_MDP = 'Glorantha';
let _utilisateur = null;              // {nom, mdp} ; null = observateur
let _admin = false;

// Nom du joueur : Owner, chat, dés, rapports et commandes du log.
const joueur = () => _admin ? NOM_ADMIN : (_utilisateur ? _utilisateur.nom : 'web');
// Identifiant des masques (conceal, hide) : le mot de passe.
const idJoueur = () => _admin ? 'admin' : (_utilisateur ? _utilisateur.mdp : 'web');

const CLE_COMPTES = 'aslweb.comptes';
const CLE_DERNIER = 'aslweb.dernierUtilisateur';
const _lireLocal = (k, def) => { try { const v = localStorage.getItem(k); return v === null ? def : v; } catch(e){ return def; } };
const _ecrireLocal = (k, v) => { try { localStorage.setItem(k, v); return true; } catch(e){ return false; } };

// Comptes créés sur ce poste. Le mot de passe n'y est pas en clair :
// une empreinte FNV-1a suffit à refuser une faute de frappe, et
// crypto.subtle manque quand la page est ouverte en file://.
function _empreinte(t){
  let h = 0x811c9dc5;
  for(const c of String(t)){ h ^= c.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}
function comptesLocaux(){
  try {
    const l = JSON.parse(_lireLocal(CLE_COMPTES, '[]'));
    return Array.isArray(l) ? l.filter(c => c && c.nom && c.h) : [];
  } catch(e){ return []; }
}
const _memeNom = (a, b) => !!a && !!b && a.toLowerCase() === b.toLowerCase();
function enregistrerCompte(nom, mdp){
  const l = comptesLocaux();
  const c = l.find(x => _memeNom(x.nom, nom));
  if(c) c.h = _empreinte(mdp); else l.push({nom, h: _empreinte(mdp)});
  return _ecrireLocal(CLE_COMPTES, JSON.stringify(l));
}
function oublierCompte(nom){
  return _ecrireLocal(CLE_COMPTES, JSON.stringify(comptesLocaux().filter(x => !_memeNom(x.nom, nom))));
}
// Le nom est écrit tel quel dans l'état Owner : « ; », « / », « \ »,
// « , » et la tabulation sont des séparateurs de VASSAL.
const nomValide = nom => /^[^;/\\\t,<>&"]{1,24}$/.test(nom) && !_memeNom(nom, NOM_ADMIN) && !_memeNom(nom, 'web');

// Joueurs du fichier : un par identifiant de masque, nommé d'après
// l'Owner majoritaire des pions qu'il masque.
function joueursDuFichier(){
  const par = new Map();
  for(const p of vivants()){
    for(const id of [p.masqueProprio, p.hipProprio, p.compteurProprio]){
      if(!id || id === 'web' || id === 'admin') continue;
      if(!par.has(id)) par.set(id, {id, n: 0, noms: new Map()});
      const f = par.get(id);
      f.n++;
      if(p.proprietaire) f.noms.set(p.proprietaire, (f.noms.get(p.proprietaire) || 0) + 1);
    }
  }
  return [...par.values()].map((f, i) => {
    const nom = [...f.noms.entries()].sort((a, b) => b[1] - a[1])[0];
    return {id: f.id, n: f.n, nom: nom ? nom[0] : null, etiquette: 'Joueur ' + (i + 1)};
  }).sort((a, b) => b.n - a.n);
}

function seConnecter(u, admin){
  _utilisateur = admin ? null : u;
  _admin = !!admin;
  majUtilisateur();
  _netMajInfo();
  // Ce qu'on voit d'une unité dissimulée ou en HIP dépend de qui l'on est.
  vivants().forEach(p => majApparence(p));
  if(_pileSel) afficherPile();
  chatLog(_admin ? '👁️ Administrateur : tous les pions dissimulés et HIP sont visibles'
    : (_utilisateur ? `👤 ${_utilisateur.nom} — ${nbMasques(_utilisateur.mdp)} pion(s) masqué(s) à vous`
                    : '👤 Observateur : les pions dissimulés et HIP restent cachés'));
}

function majUtilisateur(){ rafraichirActions(['utilisateur']); }

// ── Accès aux pions masqués.
// « web » est l'identifiant d'avant les comptes : il ne réserve rien.
const _masqueDe = (p, id) => !!id && (p.masqueProprio === id || p.hipProprio === id || p.compteurProprio === id);
const nbMasques = id => vivants().filter(p => _masqueDe(p, id)).length;
function accesRefuse(p){
  if(!p || _admin) return false;
  const autrui = id => !!id && id !== 'web' && id !== idJoueur();
  return autrui(p.masqueProprio) || autrui(p.hipProprio) || autrui(p.compteurProprio);
}
// Vrai si la commande est refusée ; le refus est dit au journal.
function refuser(p){
  if(!accesRefuse(p)) return false;
  chatLog(`🔒 ${p.el.title || p.nom} : masqué par un autre joueur, aucune commande`
    + ` — vous êtes ${_utilisateur ? _utilisateur.nom : 'observateur'}`);
  return true;
}

// ── Boîte d'identification, ouverte à chaque carte chargée.
// Choisir une ligne ne donne aucun accès : c'est le mot de passe qui
// prouve l'identité.
//   · joueur du fichier : son mot de passe est l'identifiant de ses masques
//   · compte du poste   : comparé à l'empreinte enregistrée
//   · administrateur    : ADMIN_MDP
const _esc = t => String(t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);

function demanderUtilisateur(){
  fermerFenetres();
  const fiches = joueursDuFichier();
  const comptes = comptesLocaux();
  const compteDe = nom => comptes.find(c => _memeNom(c.nom, nom)) || null;
  const entrees = [{type: 'admin', nom: NOM_ADMIN, info: 'voit tous les pions masqués'}];
  const deja = nom => entrees.some(e => _memeNom(e.nom, nom));
  for(const f of fiches){
    if(f.nom && deja(f.nom)) continue;
    entrees.push({type: 'joueur', nom: f.nom || f.etiquette, fiche: f, compte: compteDe(f.nom),
                  info: `${f.n} pion(s) masqué(s)`});
  }
  for(const c of comptes) if(!deja(c.nom)) entrees.push({type: 'joueur', nom: c.nom, compte: c, info: 'compte de ce poste'});
  entrees.push({type: 'nouveau', nom: 'Nouvel utilisateur…', info: ''});

  // Présélection : l'utilisateur de la dernière fois, sinon le premier joueur.
  const dernier = _lireLocal(CLE_DERNIER, '');
  let defaut = entrees.findIndex(e => e.type !== 'nouveau' && _memeNom(e.nom, dernier));
  if(defaut < 0) defaut = entrees.length > 2 ? 1 : entrees.length - 1;

  const w = document.createElement('div');
  w.id = 'fenUtil'; w.className = 'fenetre';
  w.innerHTML = `
    <div class="ft">Identification</div>
    <div class="fc">
      <p>Choisir l'utilisateur, puis saisir son mot de passe. Les pions dissimulés
        et HIP ne sont visibles que de leur joueur${fiches.length ? ` ; cette carte en
        contient de ${fiches.length} joueur(s)` : ''}.</p>
      <label>Utilisateur<select id="utSel">${entrees.map((e, i) =>
        `<option value="${i}"${i === defaut ? ' selected' : ''}>${_esc(e.nom)}${e.info ? ' — ' + _esc(e.info) : ''}</option>`).join('')}</select></label>
      <label id="utNomL">Nom du nouvel utilisateur<input id="utNom" maxlength="24" autocomplete="off" placeholder="nom affiché"></label>
      <label>Mot de passe<input id="utMdp" type="password" autocomplete="off" placeholder="mot de passe"></label>
      <div class="ferr" id="utErr"></div>
      <div class="fb">
        <button id="utOk" class="prim">Se connecter</button>
        <button id="utObs">Observateur</button>
        <button id="utGerer">Utilisateurs…</button>
      </div>
      <p class="fnote">Pour un joueur VASL, le mot de passe est celui de VASL : il ouvre ses
        pions dissimulés et en HIP.</p>
    </div>`;
  document.body.appendChild(w);
  const $ = id => document.getElementById(id);
  const sel = $('utSel'), err = $('utErr');
  const majNom = () => {
    const nouveau = entrees[+sel.value].type === 'nouveau';
    $('utNomL').style.display = nouveau ? '' : 'none';
    err.textContent = '';
    (nouveau ? $('utNom') : $('utMdp')).focus();
  };
  sel.addEventListener('change', majNom);
  const connecter = (nom, mdp) => {
    _ecrireLocal(CLE_DERNIER, nom);
    w.remove();
    seConnecter({nom, mdp}, false);
  };
  $('utOk').onclick = () => {
    const e = entrees[+sel.value], mdp = $('utMdp').value;
    if(e.type === 'admin'){
      if(mdp !== ADMIN_MDP){ err.textContent = 'Mot de passe administrateur incorrect.'; return; }
      _ecrireLocal(CLE_DERNIER, NOM_ADMIN);
      w.remove();
      seConnecter(null, true);
      return;
    }
    if(!mdp){ err.textContent = 'Saisir le mot de passe.'; return; }
    if(mdp === ADMIN_MDP || mdp === 'web' || mdp === 'admin'){ err.textContent = 'Ce mot de passe est réservé.'; return; }
    if(e.type === 'nouveau'){
      const nom = $('utNom').value.trim();
      if(!nomValide(nom)){ err.textContent = 'Nom requis : 24 caractères au plus, sans ; / \\ , < > & ".'; return; }
      if(entrees.some(x => x.type !== 'nouveau' && _memeNom(x.nom, nom))){
        err.textContent = 'Cet utilisateur existe déjà : le choisir dans la liste.'; return;
      }
      enregistrerCompte(nom, mdp);
      chatLog(`➕ Utilisateur créé : ${nom}`);
      connecter(nom, mdp);
      return;
    }
    // Le mot de passe doit être celui de l'utilisateur DÉSIGNÉ.
    const parMasque = e.fiche && mdp === e.fiche.id;
    const parCompte = e.compte && _empreinte(mdp) === e.compte.h;
    if(!parMasque && !parCompte){ err.textContent = 'Mot de passe incorrect pour cet utilisateur.'; return; }
    // Un nom réel encore inconnu du poste y devient un compte : il sera
    // reconnu la prochaine fois, même sans pion masqué.
    const nom = e.fiche ? (e.fiche.nom || e.nom) : e.nom;
    if(!e.compte && nomValide(nom)) enregistrerCompte(nom, mdp);
    connecter(nom, mdp);
  };
  $('utObs').onclick = () => { _ecrireLocal(CLE_DERNIER, ''); w.remove(); seConnecter(null, false); };
  $('utGerer').onclick = () => { w.remove(); gererUtilisateurs(); };
  for(const c of [$('utMdp'), $('utNom')])
    c.addEventListener('keydown', ev => {
      if(ev.key === 'Enter') $('utOk').click();
      if(ev.key === 'Escape') w.remove();
    });
  majNom();
}

// ── Gestion des utilisateurs : comptes du poste et joueurs du fichier,
// avec le nombre de pions que chacun tient masqués.
function gererUtilisateurs(){
  fermerFenetres();
  const fiches = joueursDuFichier();
  const lignes = [];
  for(const f of fiches)
    lignes.push({nom: f.nom || f.etiquette, n: f.n, local: false, moi: !!_utilisateur && f.id === _utilisateur.mdp});
  for(const c of comptesLocaux()){
    const l = lignes.find(x => _memeNom(x.nom, c.nom));
    if(l) l.local = true;
    else lignes.push({nom: c.nom, n: 0, local: true, moi: !!_utilisateur && _memeNom(c.nom, _utilisateur.nom)});
  }
  const w = document.createElement('div');
  w.id = 'fenUtil'; w.className = 'fenetre';
  w.innerHTML = `
    <div class="ft">Utilisateurs</div>
    <div class="fc">
      <p>Connecté : <b>${_esc(_admin ? NOM_ADMIN : (_utilisateur ? _utilisateur.nom : 'observateur'))}</b>.</p>
      <table><tr><th>Utilisateur</th><th>Pions masqués</th><th></th></tr>
        ${lignes.map(l => `<tr><td>${_esc(l.nom)}${l.moi ? ' <b>(vous)</b>' : ''}</td><td class="nb">${l.n}</td>
          <td>${l.local ? `<button class="oubli" data-nom="${_esc(l.nom)}">Oublier</button>` : '<i>fichier</i>'}</td></tr>`).join('')
          || '<tr><td colspan="3"><i>Aucun utilisateur</i></td></tr>'}</table>
      <div class="fb">
        <button id="utChanger" class="prim">Changer d'utilisateur…</button>
        <button id="utFermer">Fermer</button>
      </div>
      <p class="fnote">Comme dans VASL, tous les pions se déplacent librement ; un pion
        dissimulé ou en HIP n'est visible et commandable que par son joueur et par
        l'administrateur.</p>
    </div>`;
  document.body.appendChild(w);
