function afficherSurvol(k, cx, cy){
  const s = pile(k).filter(p => !p.cache);
  if(!s.length) return;
  cacherSurvol();
  const t = document.createElement('div');
  t.id = 'survol'; t.className = 'survol';
  const a = ancragePlusProche(s[0].x, s[0].y);
  // VASL arrondit ses centres autrement que nous : quelques pixels d'écart
  // désignent encore le même ancrage.
  const ici = a && Math.hypot(a.x - s[0].x, a.y - s[0].y) < 4 ? a.label : `${s[0].x}, ${s[0].y}`;
  const tt = document.createElement('div');
  tt.className = 'tt';
  tt.textContent = `${ici} — ${s.length} pion${s.length > 1 ? 's' : ''}`;
  const rang = document.createElement('div');
  rang.className = 'rang';
  for(const p of s){
    // Copie du pion affiché : face, couches et orientation comprises.
    const c = p.el.cloneNode(true);
    c.classList.remove('sel');
    c.style.cssText = `position:absolute;left:0;top:0;width:${p.sz}px;height:${p.sz}px;`
                    + `transform:scale(${SURVOL_ECHELLE});transform-origin:0 0;`;
    const boite = document.createElement('div');
    const cote = Math.round(p.sz * SURVOL_ECHELLE);
    boite.style.cssText = `position:relative;width:${cote}px;height:${cote}px`;
    boite.appendChild(c);
    const n = document.createElement('span');
    n.textContent = p.el.title || p.nom;
    const cel = document.createElement('div');
    cel.className = 'cel';
    cel.append(boite, n);
    rang.appendChild(cel);
  }
  t.append(tt, rang);
  document.body.appendChild(t);
  _placerSurvol(t, cx, cy);
  _survolCle = k;
}

// Au-dessus du curseur, sans sortir de la fenêtre.
function _placerSurvol(t, cx, cy){
  let x = cx - t.offsetWidth/2, y = cy - t.offsetHeight - 16;
  x = Math.max(4, Math.min(x, window.innerWidth - t.offsetWidth - 4));
  if(y < 4) y = cy + 24;
  t.style.left = x + 'px'; t.style.top = y + 'px';
}

// Au doigt, pas de survol : un appui maintenu sans bouger affiche
// l'aperçu, décalé pour ne pas passer sous le doigt, puis il se referme
// seul peu après le relâché.
function _appuiLong(e, p){
  const x0 = e.clientX, y0 = e.clientY;
  let montre = false;
  const timer = setTimeout(() => {
    montre = true;
    afficherSurvol(cle(p), x0, y0 - 50);
    if(navigator.vibrate) navigator.vibrate(10);
  }, 450);
  const bouge = ev => {
    if(Math.hypot(ev.clientX - x0, ev.clientY - y0) < 8) return;
    clearTimeout(timer);
    if(montre) cacherSurvol();
    fin();
  };
  const leve = () => {
    clearTimeout(timer);
    if(montre) _survolCache = setTimeout(cacherSurvol, 2500);
    fin();
  };
  const fin = () => {
    document.removeEventListener('pointermove', bouge);
    document.removeEventListener('pointerup', leve);
    document.removeEventListener('pointercancel', leve);
  };
  document.addEventListener('pointermove', bouge);
  document.addEventListener('pointerup', leve);
  document.addEventListener('pointercancel', leve);
}

function basculerCote(){ document.getElementById('cote').classList.toggle('ferme'); }

// ═══════════════════════════════════════════════════════════════
// BASE DE DONNÉES DES PIONS — le buildFile du module VASL
// Chaque PieceSlot y donne le nom, le gpid et la définition VASSAL
// complète du pion (« +/null/TYPE/ÉTAT »), celle-là même que VASL écrit
// quand on tire un pion de sa palette. On la lit une fois, à la première
// ouverture de la palette.
// ═══════════════════════════════════════════════════════════════
const VASL_BUILDFILE_URL =
  'https://raw.githubusercontent.com/vasl-developers/vasl/develop/dist/buildFile';
const FENETRES_PALETTE = ['VASL Counters', '?'];
let _bdd = null, _bddPromesse = null;

function chargerBDD(){
  if(!_bddPromesse) _bddPromesse = _chargerBDD().catch(e => {
    _bddPromesse = null;
    chatLog('❌ Base de données VASL indisponible : ' + e.message);
    throw e;
  });
  return _bddPromesse;
}

async function _chargerBDD(){
  chatLog('⏳ Lecture de la base de données des pions VASL…');
  const r = await fetch(VASL_BUILDFILE_URL);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), 'application/xml');
  const mod = doc.documentElement;
  const cats = [], slots = [], idxCat = new Map();
  // Arbre des widgets de la palette, tel que VASL le construit :
  // TabWidget (onglets), ListWidget (liste), BoxWidget (liste déroulante),
  // PanelWidget (grille), et les PieceSlot dans l'ordre du module.
  let nid = 0;
  const construire = (el, chemin) => {
    const t = el.tagName.split('.').pop();
    const nom = el.getAttribute('entryName') || el.getAttribute('name') || '';
    const noeud = {id: nid++, t, nom, enfants: []};
    for(const c of el.children){
      const tag = c.tagName.split('.').pop();
      if(tag === 'PieceSlot'){
        const ch = chemin.join(' / ');
        if(!idxCat.has(ch)){ idxCat.set(ch, cats.length); cats.push(ch); }
        const x = {n: c.getAttribute('entryName') || '?', g: c.getAttribute('gpid'),
                   c: idxCat.get(ch), cmd: (c.textContent || '').trim()};
        slots.push(x);
        noeud.enfants.push(x);
      } else if(/Widget$/.test(tag)){
        const n = c.getAttribute('entryName') || c.getAttribute('name') || '';
        noeud.enfants.push(construire(c, n ? [...chemin, n] : chemin));
      }
    }
    return noeud;
  };
  const arbre = {id: nid++, t: 'Racine', nom: '', enfants: []};
  const protos = new Map();
  for(const e of doc.getElementsByTagName('*'))
    if(e.tagName.endsWith('.PrototypeDefinition'))
      protos.set(e.getAttribute('name'), (e.textContent || '').trim());
  for(const w of mod.children){
    if(w.tagName.split('.').pop() !== 'PieceWindow') continue;
    const nom = w.getAttribute('name');
    if(FENETRES_PALETTE.includes(nom)) arbre.enfants.push(construire(w, nom === '?' ? ['?'] : []));
  }
  // Tous les PieceSlot du module, par gpid : un pion peut en poser un
  // autre (Place Marker, Replace, DM, ACQ), même hors de la palette.
  const parGpid = new Map();
  for(const e of doc.getElementsByTagName('*'))
    if(e.tagName.endsWith('.PieceSlot') && e.getAttribute('gpid'))
      parGpid.set(e.getAttribute('gpid'), {n: e.getAttribute('entryName') || '?', g: e.getAttribute('gpid'),
                                           cmd: (e.textContent || '').trim()});
  // … et par chemin de composants (ComponentPathBuilder) : c'est ainsi que
  // le trait de dissimulation désigne son contre-pion « ? ».
  const parChemin = new Map();
  for(const e of doc.getElementsByTagName('*')){
    if(!e.tagName.endsWith('.PieceSlot')) continue;
    const noms = [];
    for(let a = e; a && a !== mod; a = a.parentElement)
      noms.unshift(a.getAttribute('entryName') || a.getAttribute('name') || '');
    parChemin.set(noms.join('\u0001'), parGpid.get(e.getAttribute('gpid')));
  }
  _bdd = {cats, pions: slots, protos, parGpid, parChemin, arbre, version: mod.getAttribute('version')};
  // Les pions déjà sur la carte gagnent les couches de leurs prototypes.
  for(const p of vivants()) majApparence(p);
  chatLog(`📚 Base VASL ${_bdd.version} : ${slots.length} pions, ${cats.length} catégories`);
  return _bdd;
}

// Lecture d'un PieceSlot comme d'une pièce, faite à la demande.
function lireSlot(x){
  if(!x.lu) x.lu = lirePiece(x.cmd.replace(/^\+\/null\//, '+/0/'));
  return x.lu;
}

let _palFiltre = '';

async function dessinerPalette(){
  const box = document.getElementById('palCorps');
  if(!_bdd){
    box.innerHTML = '<div style="padding:8px;color:var(--doux)">Chargement de la base VASL…</div>';
    try { await chargerBDD(); } catch(e){ box.innerHTML = '<div style="padding:8px">Base indisponible.</div>'; return; }
  }
  const B = _bdd;
  const defil = box.scrollTop;
  box.innerHTML = '';
  if(_palFiltre){
    const t = B.pions.filter(x => x.n.toLowerCase().includes(_palFiltre)).slice(0, 200);
    const info = document.createElement('div');
    info.style.cssText = 'opacity:.6;margin:4px 0';
    info.textContent = t.length + ' pion(s)' + (t.length === 200 ? ' (200 premiers)' : '');
    box.appendChild(info);
    box.appendChild(remplirGrille(t));
    return;
  }
  rendreWidget(B.arbre, box);
  box.scrollTop = defil;
}

// ── Widgets de la palette VASL. Seule la branche sélectionnée est dessinée :
// les vignettes ne se chargent qu'à l'ouverture de leur panneau.
// La sélection de chaque widget est retenue d'une visite à l'autre.
const _palSel = (() => {
  try { return new Map(JSON.parse(localStorage.getItem('palSel') || '[]')); } catch(e){ return new Map(); }
})();
function _choisir(noeud, i){
  _palSel.set(noeud.id, i);
  try { localStorage.setItem('palSel', JSON.stringify([..._palSel])); } catch(e){}
  dessinerPalette();
}

function rendreWidget(n, boite){
  const widgets = n.enfants.filter(e => e.enfants);
  const pions = n.enfants.filter(e => !e.enfants);
  const sel = Math.min(_palSel.get(n.id) || 0, Math.max(0, widgets.length - 1));
  const contenu = () => {
    const z = document.createElement('div');
    z.className = 'wcontenu';
    if(widgets[sel]) rendreWidget(widgets[sel], z);
    return z;
  };
  // Une fenêtre de palette qui contient plusieurs widgets les présente en
  // onglets, comme PieceWindow (la fenêtre « ? » : un onglet par nation).
  if(n.t === 'TabWidget' || n.t === 'Racine' || (n.t === 'PieceWindow' && widgets.length > 1)){
    // Onglets : un par widget enfant.
    if(pions.length) boite.appendChild(remplirGrille(pions));
    if(!widgets.length) return;
    const o = document.createElement('div');
    o.className = 'onglets';
    widgets.forEach((w, i) => {
      const b = document.createElement('div');
      b.className = 'onglet' + (i === sel ? ' actif' : '');
      b.textContent = w.nom || '—';
      b.addEventListener('click', () => _choisir(n, i));
      o.appendChild(b);
    });
    boite.append(o, contenu());
  } else if(n.t === 'BoxWidget'){
    // Liste déroulante.
    const t = document.createElement('div');
    t.className = 'wtitre'; t.textContent = n.nom;
    const s = document.createElement('select');
    s.className = 'wboite';
    widgets.forEach((w, i) => s.add(new Option(w.nom || '—', i, false, i === sel)));
    s.addEventListener('change', () => _choisir(n, +s.value));
    boite.append(t, s);
    if(pions.length) boite.appendChild(remplirGrille(pions));
    if(widgets.length) boite.appendChild(contenu());
  } else if(n.t === 'ListWidget'){
    // Liste : le choix d'une entrée affiche son contenu en dessous.
    if(widgets.length){
      const l = document.createElement('div');
      l.className = 'wliste';
      widgets.forEach((w, i) => {
        const e = document.createElement('div');
        e.className = 'wli' + (i === sel ? ' actif' : '');
        e.textContent = w.nom || '—';
        e.addEventListener('click', () => _choisir(n, i));
        l.appendChild(e);
      });
      boite.appendChild(l);
    }
    if(pions.length) boite.appendChild(remplirGrille(pions));
    if(widgets.length) boite.appendChild(contenu());
  } else {
    // PanelWidget, PieceWindow : tout le contenu, dans l'ordre du module ;
    // un panneau imbriqué porte son titre.
    let lot = [];
    const vider = () => { if(lot.length) boite.appendChild(remplirGrille(lot)); lot = []; };
    for(const e of n.enfants){
      if(!e.enfants){ lot.push(e); continue; }
      vider();
      if(e.t === 'PanelWidget' && e.nom){
        const t = document.createElement('div');
        t.className = 'wtitre'; t.textContent = e.nom;
        boite.appendChild(t);
      }
      rendreWidget(e, boite);
    }
    vider();
  }
}

function remplirGrille(liste){
  const g = document.createElement('div');
  g.className = 'grille';
  for(const x of liste){
    const d = document.createElement('div');
    d.className = 'vig';
    d.title = `${x.n}  (gpid ${x.g})`;
    const mini = document.createElement('div');
    mini.className = 'mini';
    d.appendChild(mini);
    g.appendChild(d);
    composerVignette(mini, lireSlot(x), 42);
    // Glisser vers la carte, ou clic : pose au centre de la vue.
    d.addEventListener('pointerdown', e => glisser(e, (mini.querySelector('img') || {}).src, 48 * SC * zoom, (cx, cy) => {
      const c = clientVersCarte(cx, cy);
      if(c) poserDepuisPalette(x, c.x, c.y);
      else chatLog('Lâché hors de la carte : rien posé');
    }, () => {
      const wr = document.getElementById('mapWrap').getBoundingClientRect();
      const c = clientVersCarte(wr.left + wr.width/2, wr.top + wr.height/2);
      if(c) poserDepuisPalette(x, c.x, c.y);
    }));
  }
  return g;
}

// ═══════════════════════════════════════════════════════════════
// DÉS — d'après ASLDiceBot et ASLChatter (VASL)
// Le jet est un message de chat au format d'ASLDiceBot, que VASL relit
// et décore lui-même :
//   *** (IFT DR) 3,1 ***   <Pierre>      Axis SAN    [1 / 8   avg   6,62 (6,62)]    (01.51)
// Le premier dé est le COLORÉ, le second le blanc. Le SAN se contrôle
// sur le total du DR original (A14.2), comme IsSpecialDiceRoll().
// ═══════════════════════════════════════════════════════════════
const DE_COLORE = 'R', DE_BLANC = 'W';     // DC<n>_<couleur>.png du module

const joueur = () => (document.getElementById('joueur').value.trim() || 'web');
const _d6 = () => {
  // Tirage uniforme sans biais de modulo.
  const t = new Uint8Array(1);
  do { crypto.getRandomValues(t); } while(t[0] >= 252);
  return 1 + (t[0] % 6);
};

// ── Informations de scénario (ScenInfo, segment « INFO\t ») :
//   qui joue en premier, joueur, tour, ELR Axis, SAN Axis, ELR Allied,
//   SAN Allied, piège Axis, piège Allied, météo…
let _infoEtat = 'Axis\tAxis\t1\t?\t?\t?\t?\t?\t?';
let _infoModifiee = false;
const INFO_SAN_AXIS = 4, INFO_SAN_ALLIED = 6, INFO_BB_AXIS = 7, INFO_BB_ALLIED = 8;

function _infoChamp(i){
  return (_infoEtat.split('\t')[i] || '?').replace(/\\/g, '').trim();
}
function _infoFixer(i, v){
  const f = _infoEtat.split('\t');
  while(f.length <= i) f.push('?');
  f[i] = v;
  _infoEtat = f.join('\t');
}

function lireInfo(segs){
  const seg = segs.find(x => x.startsWith('INFO\t'));
  _infoEtat = seg ? seg.substring(5) : 'Axis\tAxis\t1\t?\t?\t?\t?\t?\t?';
  _infoModifiee = false;
  majChampsInfo();
  const sa = _infoChamp(INFO_SAN_AXIS), sl = _infoChamp(INFO_SAN_ALLIED);
  if(seg) chatLog(`🎯 SAN Axis ${sa} · Allied ${sl}`);
}

function majChampsInfo(){
  const n = v => /^\d+$/.test(v) ? v : '';
  document.getElementById('sanAxis').value = n(_infoChamp(INFO_SAN_AXIS));
  document.getElementById('sanAllied').value = n(_infoChamp(INFO_SAN_ALLIED));
  const b = v => ['A','B','C'].includes(v) ? v : '?';
  document.getElementById('bbAxis').value = b(_infoChamp(INFO_BB_AXIS));
  document.getElementById('bbAllied').value = b(_infoChamp(INFO_BB_ALLIED));
}

// Saisie : VASL diffuse et consigne la fiche entière (SetInfo).
function changerInfo(){
  const v = id => document.getElementById(id).value.trim();
  _avantAction();
  _infoFixer(INFO_SAN_AXIS, v('sanAxis') || '?');
  _infoFixer(INFO_SAN_ALLIED, v('sanAllied') || '?');
  _infoFixer(INFO_BB_AXIS, v('bbAxis'));
  _infoFixer(INFO_BB_ALLIED, v('bbAllied'));
  _infoModifiee = true;
  _logCmd('INFO\t' + _infoEtat);
  chatLog(`🎯 SAN Axis ${_infoChamp(INFO_SAN_AXIS)} · Allied ${_infoChamp(INFO_SAN_ALLIED)}`
        + ` — pièges Axis ${_infoChamp(INFO_BB_AXIS)} · Allied ${_infoChamp(INFO_BB_ALLIED)}`);
}

// IsSpecialDiceRoll() : SAN des deux camps sur le total, pièges sur 11-12.
function _special(total){
  const san = c => { const v = parseInt(_infoChamp(c), 10); return !isNaN(v) && v === total; };
  const ax = san(INFO_SAN_AXIS), al = san(INFO_SAN_ALLIED);
  if(ax && al) return 'Axis/Allied SAN    ';
  if(ax) return 'Axis SAN    ';
  if(al) return 'Allied SAN    ';
  if(total >= 11){
    const bt = c => { const v = _infoChamp(c); return v === 'A' || (v === 'B' && total === 11) || (v === 'C' && total === 12); };
    const bx = bt(INFO_BB_AXIS), bl = bt(INFO_BB_ALLIED);
    if(bx && bl) return 'Axis/Allied Booby Trap    ';
    if(bx) return 'Axis Booby Trap   ';
    if(bl) return 'Allied Booby Trap   ';
  }
  return '';
}

// ── Statistiques de la session, par catégorie et au total (DiceStats).
const _stats = new Map();
function _stat(cle){
  if(!_stats.has(cle)) _stats.set(cle, {n: 0, somme: 0, detail: new Map()});
  return _stats.get(cle);
}
function _ajouterStat(cle, valeur){
  const s = _stat(cle);
  s.n++; s.somme += valeur;
  s.detail.set(valeur, (s.detail.get(valeur) || 0) + 1);
}
const _fmt2 = v => v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const _moy = cle => { const s = _stats.get(cle); return s && s.n ? _fmt2(s.somme / s.n) : '-'; };
const _surTotal = (cle, v) => { const s = _stats.get(cle); return s ? `${s.detail.get(v) || 0} / ${s.n}` : '-/-'; };

// Numéro de série d'ASLDiceBot : séries de 99, numéros tirés dans le désordre.
let _serie = 0, _rangSerie = 99, _ordreSerie = [];
function _numeroSerie(){
  if(_rangSerie >= 99){
    _serie++; _rangSerie = 0;
    _ordreSerie = Array.from({length: 99}, (_, i) => i + 1);
    for(let i = 98; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [_ordreSerie[i], _ordreSerie[j]] = [_ordreSerie[j], _ordreSerie[i]];
    }
  }
  const d2 = n => String(n).padStart(2, '0');
  return d2(_serie) + '.' + d2(_ordreSerie[_rangSerie++]);
}

function lancerDR(cat){
  const c = _d6(), b = _d6();
  _ajouterStat('D2_Total', c + b); _ajouterStat('D2_' + cat, c + b);
  const msg = `*** (${cat} DR) ${c},${b} ***   <${joueur()}>      ${_special(c + b)}`
            + `[${_surTotal('D2_Total', c + b)}   avg   ${_moy('D2_' + cat)} (${_moy('D2_Total')})]`
            + `    (${_numeroSerie()})`;
  _publierJet(msg);
  return {c, b, total: c + b};
}

function lancerdr(cat){
  const d = _d6();
  _ajouterStat('D1_Total', d); _ajouterStat('D1_' + cat, d);
  const msg = `*** (${cat} dr) ${d} ***   <${joueur()}>      `
            + `[${_surTotal('D1_Total', d)}   avg   ${_moy('D1_' + cat)} (${_moy('D1_Total')})]`
            + `    (${_numeroSerie()})`;
  _publierJet(msg);
  return {d};
}

// VASSAL encode le texte du chat en entités HTML.
function _publierJet(msg){
  _avantAction();
  _logCmd('CHAT' + msg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));
  afficherChat(msg);
}

function _desechappe(s){
  return (s || '').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&');
}

// ── Affichage d'un message de chat, jets décodés comme ASLChatter :
// images des dés, total, joueur, SAN ou piège, et les annonces de règle
// du niveau « Full ASL ».
function afficherChat(msg){
  const m = msg.match(/^\*\*\* \((.+?) (DR|dr)\) ([\d,]+) \*\*\*.*?<([^>]*)>\s*(.*)$/);
  if(!m){
    // Rapports (« * … ») et messages des joueurs, comme le chat de VASSAL.
    const l = document.createElement('div');
    l.className = /^\*/.test(msg) ? 'rap' : 'msg';
    l.textContent = msg;
    const j = document.getElementById('journal');
    j.appendChild(l);
    j.scrollTop = j.scrollHeight;
    return;
  }
  const [, catBrute, type, des, qui, reste] = m;
  const cat = catBrute.replace('ENEMY ', '');
  const v = des.split(',').map(Number);
  const ligne = document.createElement('div');
  ligne.className = 'jet';
  const t = document.createElement('span');
  t.className = 'cat'; t.textContent = `${catBrute === 'Other' ? '' : catBrute + ' '}${type}`;
  ligne.appendChild(t);
  v.forEach((n, i) => {
    const im = document.createElement('img');
    im.alt = String(n); im.title = String(n);
    chargerImage(`DC${n}_${i === 0 && type === 'DR' ? DE_COLORE : DE_BLANC}.png`).then(u => { if(u) im.src = u; });
    ligne.appendChild(im);
  });
  const tot = document.createElement('span');
  tot.className = 'tot';
  tot.textContent = type === 'DR' ? `= ${v[0] + v[1]}` : '';
  ligne.appendChild(tot);
  const q = document.createElement('span');
  q.className = 'qui'; q.textContent = qui;
  ligne.appendChild(q);
  if(type === 'DR'){
    const san = (reste.match(/^(Axis\/Allied|Axis|Allied) (SAN|Booby Trap)/) || [])[0];
    // ASLChatter ne signale pas le SAN sur Rally, TK et CC, ni les pièges hors TC.
    const montre = san && (/Booby/.test(san) ? cat === 'TC' : !['TK','CC','Rally'].includes(cat));
    if(montre){
      const s = document.createElement('span');
      s.className = 'san'; s.textContent = '🎯 ' + san;
      ligne.appendChild(s);
    }
    const sp = _annoncesDR(cat, v[0], v[1]);
    if(sp.length){
      const s = document.createElement('span');
      s.className = 'spe'; s.textContent = sp.join(', ');
      ligne.appendChild(s);
    }
  }
  const j = document.getElementById('journal');
  j.appendChild(ligne);
  j.scrollTop = j.scrollHeight;
}

function _annoncesDR(cat, a, b){
  const sp = [];
  switch(cat){
    case 'TH':
      if(a === b){ if(a === 1) sp.push('Unlikely Hit (C3.6)'); sp.push('Multiple Hits 15..40mm (C3.8)'); }
      sp.push(a < b ? 'Turret' : 'Hull');
      break;
    case 'TK':
      if(a === 6 && b === 6) sp.push('Dud (C7.35)');
      break;
    case 'MC':
      if(a === 1 && b === 1) sp.push('Heat of Battle (A15.1)');
      else if(a === 6 && b === 6) sp.push('Casualty MC (A10.31)');
      break;
    case 'Rally':
      if(a === 1 && b === 1) sp.push('Heat of Battle (A15.1) or Field Promotion (A18.11)');
      else if(a === 6 && b === 6) sp.push('Fate -> Casualty Reduction (A10.64)');
      break;
    case 'IFT':
      if(a === b){ if(a === 1) sp.push('Unlikely Kill vs * (A7.309)'); sp.push('Cower if MMC w/o LDR'); }
      break;
    case 'CC':
      if(a === 1 && b === 1) sp.push('Infiltration (A11.22), Field Promotion (A18.12), Unlikely Kill (A11.501)');
      else if(a === 6 && b === 6) sp.push('Infiltration (A11.22)');
      break;
  }
  return sp;
}

// Raccourcis d'ASLChatter : F2 DR, F1 dr, Ctrl+Maj+lettre par catégorie.
function _brancherDes(){
  for(const id of ['sanAxis', 'sanAllied', 'bbAxis', 'bbAllied'])
    document.getElementById(id).addEventListener('change', changerInfo);
  const DR = {I: 'IFT', H: 'TH', K: 'TK', M: 'MC', R: 'Rally', C: 'CC', T: 'TC'};
  const dr = {S: 'SA', D: 'RS'};
  document.addEventListener('keydown', e => {
    if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if(e.key === 'F2'){ e.preventDefault(); lancerDR('Other'); return; }
    if(e.key === 'F1'){ e.preventDefault(); lancerdr('Other'); return; }
    if(e.ctrlKey && e.shiftKey){
      const k = e.key.toUpperCase();
      if(DR[k]){ e.preventDefault(); lancerDR(DR[k]); }
      else if(dr[k]){ e.preventDefault(); lancerdr(dr[k]); }
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// EXPORT .vsav ET .vlog
// On repart des segments du fichier chargé : seules changent les
// positions, les piles de la carte de jeu, les pions retirés et ceux
// posés depuis la palette. Tout le reste — boards, autres fenêtres,
// options — est réécrit mot pour mot.
// ═══════════════════════════════════════════════════════════════
let _logEnr = null;       // commandes jouées depuis l'ouverture
let _logDepart = null;    // état de la partie avant le premier coup

// Toutes les commandes nées d'une même action du joueur — le même tour de
// boucle d'événements — forment un coup, écrit en une seule entrée LOG
// composée, comme le fait VASSAL.
let _logGroupes = [], _actionNo = 0, _actionOuverte = false;
function _logCmd(c){
  if(!_logEnr) return;
  if(!_actionOuverte){
    _actionNo++; _actionOuverte = true;
    setTimeout(() => { _actionOuverte = false; }, 0);
  }
  _logEnr.push(c);
  _logGroupes.push(_actionNo);
  majBoutons();
}
const _nbActions = () => new Set(_logGroupes).size;

function majBoutons(){
  document.getElementById('btVsav').disabled = !_source;
  document.getElementById('btVlog').disabled = !(_logEnr && _logEnr.length);
  document.getElementById('logTxt').textContent = _logEnr && _logEnr.length ? '⏺ ' + _nbActions() : '';
}

// Piles de la carte de jeu, d'après l'état courant. VASL écrit aussi les
// piles d'un seul pion. La couche (@@n) est celle de la pièce du fond
// dans le fichier d'origine, -1 (« non liée ») sinon.
function _segmentsPiles(){
  const out = [];
  let n = 0;
  for(const k of new Set(vivants().map(cle))){
    const s = pile(k);
    let couche = -1;
    for(const p of s) if(_coucheParUid.has(p.uid)){ couche = _coucheParUid.get(p.uid); break; }
    out.push(`+/w${Date.now()}${++n}/stack/${_carteJeu};${s[0].x};${s[0].y};`
             + s.map(p => p.uid).join(';') + `;@@${couche}`);
  }
  return out;
}

function etatPartie(){
  const parUidMap = new Map(pions.map(p => [p.uid, p]));
  const sortie = [], connus = new Set();
  for(const seg of _source){
    if(/^\+\/[^/]+\/stack\//.test(seg)){
      const mc = seg.replace(/\\/g, '').match(/\/stack\/([^;]+);/);
      if(mc && mc[1] === _carteJeu) continue;          // régénérée
      sortie.push(seg); continue;
    }
    if(seg.startsWith('INFO\t')){ sortie.push('INFO\t' + _infoEtat); continue; }
    const m = seg.match(/^\+\/([^/]+)\//);
    const p = m && parUidMap.get(m[1]);
    if(!p){ sortie.push(seg); continue; }
    connus.add(p.uid);
    if(!p.deleted || p.ailleurs) sortie.push(p.seg);
  }
  // Pions posés ou créés par le log : avant la fin de sauvegarde.
  const neufs = pions.filter(p => (!p.deleted || p.ailleurs) && !connus.has(p.uid)).map(p => p.seg);
  const ajout = [...neufs, ..._segmentsPiles()];
  // SAN saisis ici alors que le fichier n'avait pas d'informations de scénario.
  if(_infoModifiee && !_source.some(x => x.startsWith('INFO\t'))) ajout.push('INFO\t' + _infoEtat);
  const iFin = sortie.lastIndexOf('end_save');
  if(iFin >= 0) sortie.splice(iFin, 0, ...ajout); else sortie.push(...ajout);
  return sortie;
}

function _telecharger(texte, nom){
  const files = new Map([['savedGame', _vcskEncode(texte)]]);
  for(const [n, d] of _annexes) files.set(n, d);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(_zipWrite(files));
  a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function _nomExport(ext){
  const d = new Date();
  const j = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  return `${_nomFichier}_${j}.${ext}`;
}

function ecrireVsav(){
  if(!_source) return false;
  _telecharger(etatPartie().join('\x1b'), _nomExport('vsav'));
  chatLog(`💾 .vsav écrit : ${vivants().length} pion(s) sur « ${_carteJeu} »`);
  return true;
}

// BasicLogger : état de départ, puis « LOG\t<commande> » par action.
function ecrireVlog(){
  if(!_logEnr || !_logEnr.length || !_logDepart){
    chatLog('⚠️ Aucune action jouée depuis l\'ouverture : rien à rejouer dans VASL.');
    return false;
  }
  // GameModule.encode : un coup composé est la suite de ses commandes
  // séparées par ESC ; dans le fichier, ces ESC sont précédés d'une
  // contre-oblique (SequenceEncoder de BasicLogger).
  const entrees = [];
  _logEnr.forEach((c, i) => {
    if(i && _logGroupes[i] === _logGroupes[i - 1]) entrees[entrees.length - 1].push(c);
    else entrees.push([c]);
  });
  const lignes = entrees.map(l => 'LOG\t' + (l.length > 1 ? l.map(c => '\x1b' + c).join('') : l[0]).replace(/\x1b/g, '\\\x1b'));
  _telecharger([..._logDepart, ...lignes].join('\x1b'), _nomExport('vlog'));
  chatLog(`📼 .vlog écrit : ${entrees.length} coup(s), ${_logEnr.length} commande(s)`);
  return true;
}

// ObfuscatingOutputStream : « !VCSK » + clé, puis les octets XOR-és en
// hexadécimal minuscule, comme VASSAL.
function _vcskEncode(texte){
  const octets = new TextEncoder().encode(texte);
  const k = 1 + Math.floor(Math.random() * 254);
  const h = new Array(octets.length);
  for(let i = 0; i < octets.length; i++) h[i] = ((octets[i] ^ k) & 0xFF).toString(16).padStart(2, '0');
  return new TextEncoder().encode('!VCSK' + k.toString(16).padStart(2, '0') + h.join(''));
}

// ── Écriture ZIP en méthode STORED : format valide, lisible par VASSAL.
let _crcTable = null;
function _crc32(bytes){
  if(!_crcTable){
    _crcTable = new Uint32Array(256);
    for(let i = 0; i < 256; i++){
      let c = i;
      for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      _crcTable[i] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for(let i = 0; i < bytes.length; i++) crc = _crcTable[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function _zipWrite(files){
  const enc = new TextEncoder();
  const locals = [], centrals = [];
  let offset = 0;
  for(const [name, data] of files){
    const nb = enc.encode(name), crc = _crc32(data), size = data.length;
    const lh = new Uint8Array(30 + nb.length), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, size, true); lv.setUint32(22, size, true);
    lv.setUint16(26, nb.length, true);
    lh.set(nb, 30);
    locals.push(lh, data);
    const cd = new Uint8Array(46 + nb.length), cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, size, true); cv.setUint32(24, size, true);
    cv.setUint16(28, nb.length, true); cv.setUint32(42, offset, true);
    cd.set(nb, 46);
    centrals.push(cd);
    offset += lh.length + size;
  }
  let cdSize = 0;
  for(const c of centrals) cdSize += c.length;
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.size, true); ev.setUint16(10, files.size, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
  return new Blob([...locals, ...centrals, eo], {type: 'application/octet-stream'});
}

  _setupDropZone();
  _setupPanZoom();
  const r = document.getElementById('palRech');
  r.addEventListener('input', () => { _palFiltre = r.value.trim().toLowerCase(); dessinerPalette(); });

  _brancherDes();

  const w = document.getElementById('mapWrap');

  w.addEventListener('wheel', cacherSurvol);

});
