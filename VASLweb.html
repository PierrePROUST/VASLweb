// ── Poignées : largeur du panneau (240 à 520 px), hauteur du journal
// (48 à 300 px), retenues d'une visite à l'autre.
function _brancherPoignees(){
  const racine = document.documentElement.style;
  const lc = parseInt(_lirePref('aslweb.largeurCote'), 10), hj = parseInt(_lirePref('aslweb.hautJournal'), 10);
  if(lc) racine.setProperty('--largeurCote', lc + 'px');
  if(hj) racine.setProperty('--hautJournal', hj + 'px');
  const brancher = (el, cle, varCss, mini, maxi, mesure) => el.addEventListener('pointerdown', e => {
    e.preventDefault();
    const id = e.pointerId, depart = mesure(e), x0 = e.clientX, y0 = e.clientY;
    let v = depart.v;
    const bouge = ev => {
      if(ev.pointerId !== id) return;
      v = Math.max(mini, Math.min(maxi, depart.v + depart.sens(ev.clientX - x0, ev.clientY - y0)));
      racine.setProperty(varCss, v + 'px');
    };
    const fin = ev => {
      if(ev.pointerId !== id) return;
      document.removeEventListener('pointermove', bouge);
      document.removeEventListener('pointerup', fin);
      document.removeEventListener('pointercancel', fin);
      try { localStorage.setItem(cle, String(Math.round(v))); } catch(err){}
      _surRedimension();
    };
    document.addEventListener('pointermove', bouge);
    document.addEventListener('pointerup', fin);
    document.addEventListener('pointercancel', fin);
  });
  brancher(document.getElementById('poigneeCote'), 'aslweb.largeurCote', '--largeurCote', 240, 520,
    () => ({v: document.getElementById('cote').offsetWidth, sens: dx => -dx}));
  brancher(document.getElementById('poigneeJournal'), 'aslweb.hautJournal', '--hautJournal', 48, 300,
    () => ({v: document.getElementById('journal').offsetHeight, sens: (dx, dy) => -dy}));
}

    const nav = document.createElement('nav');

    // Une colonne d'icônes sur la droite de l'écran : carte ; affichage de
    // la carte avec ou sans pions ; palette ; Remove all ; journal ; Undo ;
    // les dés (DR, IFT, TH, TK, MC, Rally, CC, TC, dr, SA, RS) ; puis toutes

    // la colonne (⇄, à droite ou à gauche de l'écran) ; Plus ; tout en
    // bas, la relecture du log, présente seulement pendant une relecture.
    const premieres = ['vueCarte', 'masquer', 'vuePions', 'all', 'vueJournal', 'undo', ...DES.map(d => d.id)];
    const ids = [...premieres, ...PLUS.filter(x => x !== '-' && !premieres.includes(x) && !PLUS_SANS_ICONE.includes(x)),
                 'coteColonne', 'plus', 'relecture'];
    // Défilement sans fin : la liste est posée trois fois ; près d'un bout,
    // on saute d'une longueur de liste sans que rien ne bouge à l'écran.
    // Monter au-delà de la première icône mène à la dernière, et l'inverse.
    // Seule la copie du milieu est lue par les lecteurs d'écran.
    const debuts = [];
    for(let copie = 0; copie < 3; copie++) ids.forEach((id, i) => {
      const el = rendreAction(id, 'rail');
      if(copie !== 1){
        el.setAttribute('aria-hidden', 'true');
        for(const x of [el, ...el.querySelectorAll('button')]) x.tabIndex = -1;
      }
      if(!i) debuts.push(el);
      nav.appendChild(el);
    });
    const longueur = () => debuts[2].offsetTop - debuts[1].offsetTop;
    nav.addEventListener('scroll', () => {
      const L = longueur();
      if(!L) return;
      if(nav.scrollTop < L * 0.5) nav.scrollTop += L;
      else if(nav.scrollTop > L * 1.5) nav.scrollTop -= L;
    }, {passive: true});
    setTimeout(() => { nav.scrollTop = longueur(); }, 0);
    document.getElementById('chromeGauche').appendChild(nav);
    vueMobile('carte');
  }
};

// ═══ CHAT — CLAVIER VIRTUEL ═══
// Au doigt, tant qu'un champ texte a le focus, body.saisie : la navigation
// et la relecture s'effacent, et le chat se cale sur le bord haut du
// clavier d'après visualViewport, qu'il recouvre la page (iOS, Chrome
// Android) ou qu'il la réduise. Ni recadrage ni changement de profil avant
// que le clavier se ferme ; alors, un seul.
const enSaisie = () => document.body.classList.contains('saisie');
const _champTexte = el => !!el && el.matches && el.matches('input:not([type=checkbox]):not([type=radio]), textarea');
function _brancherClavier(){
  const vv = window.visualViewport, r = document.documentElement.style;
  const suivre = () => {
    if(!vv) return;
    r.setProperty('--clavier', Math.max(0, innerHeight - vv.height - vv.offsetTop) + 'px');
    r.setProperty('--vv-haut', vv.offsetTop + 'px');   // défilement imposé par iOS
    r.setProperty('--vv-h', vv.height + 'px');          // hauteur réellement visible
  };
  if(vv){ vv.addEventListener('resize', suivre); vv.addEventListener('scroll', suivre); suivre(); }
  document.addEventListener('focusin', e => {
    if(!_profil || _profil === 'pc' || !_champTexte(e.target)) return;
    document.body.classList.add('saisie');
    suivre();
  });
  document.addEventListener('focusout', () => {
    // Le focus peut passer d'un champ à l'autre : on regarde après coup.
    setTimeout(() => {
      if(_champTexte(document.activeElement) || !enSaisie()) return;
      document.body.classList.remove('saisie');
      suivre();
      _surRedimension();
      reevaluerProfil();
      for(const f of _apresSaisie) f();
    }, 0);
  });
  // Un appui sur la carte ferme le clavier ; le geste continue.
  document.getElementById('mapWrap').addEventListener('pointerdown', () => {
    if(enSaisie() && _champTexte(document.activeElement)){ _clavierFermeA = Date.now(); document.activeElement.blur(); }
  }, true);
}
const _apresSaisie = [];
let _clavierFermeA = 0;

// ═══ CHAT — SUR LA CARTE DU TÉLÉPHONE ═══
// Trois états, sans quitter la vue Carte : l'aperçu (une ligne au-dessus
// de la relecture), le chat compact (une feuille au-dessus de la relecture
// et de la navigation, la carte visible au-dessus), la saisie (la même,
// sur le clavier) ; l'onglet Journal reste l'état plein. Retour, glissé
// vers le bas ou appui sur la carte reculent d'un cran. Non-lus, aperçu et
// pastilles sont des indications d'interface : rien ne part au log.
let _etatChat = null;            // null (aperçu), 'compact', 'plein'
let _nonLus = 0;
// L'option n'a plus de bouton (masquée) : l'aperçu est toujours montré.
let _apercuChat = true;

// Hauteur réelle du bas de l'écran (aperçu, relecture, navigation) : le
// chat ouvert s'arrête au-dessus, la relecture reste accessible.
function majHautBas(){
  const b = document.getElementById('chromeBas');
  if(b) document.documentElement.style.setProperty('--hautBas', b.offsetHeight + 'px');
}
_apresRedimension.push(majHautBas);

// Sous le chat compact, une marge de la hauteur couverte : la carte peut
// défiler jusqu'à montrer son bas au-dessus du chat.
function _majReserveCarte(){
  const w = document.getElementById('mapWrap');
  document.getElementById('mapScaler').style.marginBottom = (w.clientHeight - hauteurVisibleCarte()) + 'px';
}

// Hauteur de la carte que le chat compact ne couvre pas.
function hauteurVisibleCarte(){
  const w = document.getElementById('mapWrap'), bas = document.getElementById('bas');
  if(_etatChat !== 'compact' || bas.hidden) return w.clientHeight;
  const rw = w.getBoundingClientRect(), rb = bas.getBoundingClientRect();
  return Math.max(80, Math.min(w.clientHeight, rb.top - rw.top));
}

function _construireApercuChat(){
  const ap = document.createElement('div');
  ap.id = 'apercuChat'; ap.className = 'apercuChat';
  ap.setAttribute('aria-hidden', 'true');      // il répète le journal, déjà aria-live
  const t = document.createElement('span');
  t.className = 'txt';
  const bg = document.createElement('span');
  bg.className = 'badgeAct'; bg.hidden = true;
  const ec = document.createElement('button');
  ec.type = 'button'; ec.className = 'act ecrire'; ec.tabIndex = -1;
  ec.textContent = '✏';
  ec.title = 'Écrire au chat';
  // iOS n'ouvre le clavier que si le focus part du geste lui-même.
  ec.addEventListener('click', e => { e.stopPropagation(); ouvrirChat(true); });
  ap.addEventListener('click', () => ouvrirChat(false));
  ap.append(t, bg, ec);
  setTimeout(_majApercuChat, 0);
  return ap;
}
function _majApercuChat(){
  const ap = document.getElementById('apercuChat');
  if(!ap) return;
  ap.hidden = !_apercuChat;
  // Les deux dernières lignes : messages, rapports, et toujours les jets de
  // dés, même quand le filtre Dés les cache dans le journal.
  const l = [...document.querySelectorAll('#journal > .msg, #journal > .rap, #journal > .jet')].slice(-2);
  const t = ap.querySelector('.txt');
  t.replaceChildren(...(l.length ? l : [null]).map(x => {
    const d = document.createElement('div');
    d.className = x && x.classList.contains('jet') ? 'jet' : '';
    d.textContent = x ? _texteLigneChat(x) : 'Chat';
    return d;
  }));
  const bg = ap.querySelector('.badgeAct');
  bg.textContent = _nonLus > 99 ? '99+' : String(_nonLus);
  bg.hidden = !_nonLus;
  majHautBas();
}
// Texte d'une ligne du journal ; un jet de dés se lit « IFT DR 3 5 = 8 Pierre ».
function _texteLigneChat(x){
  if(!x.classList.contains('jet')) return x.textContent;
  return [...x.childNodes].map(n => n.nodeName === 'IMG' ? n.alt : n.textContent).filter(v => v && v.trim()).join(' ');
}
function basculerApercuChat(){
  _apercuChat = !_apercuChat;
  try { localStorage.setItem('aslweb.apercuChat', _apercuChat ? '1' : '0'); } catch(e){}
  _majApercuChat();
  _surRedimension();
}
function _majNonLus(){ _majApercuChat(); rafraichirActions(['vueJournal']); }

// Chaque ligne : l'aperçu la montre ; un message d'un autre joueur, reçu
// ou relu, compte parmi les non-lus tant que le chat est fermé, et un
// message reçu du réseau fait vibrer.
_apresLigne.push(el => {
  if(!_telLike()) return;
  if(el.classList.contains('msg') && (_netReception || _relecture)){
    if(!_etatChat){ _nonLus++; _majNonLus(); }
    if(_netReception) vibrer();
  }
  if(el.classList.contains('msg') || el.classList.contains('rap') || el.classList.contains('jet')) _majApercuChat();
});

function _poserEtatChat(e, depuisRetour){
  const bas = document.getElementById('bas');
  const avant = _etatChat;
  _etatChat = e;
  if(e) bas.dataset.etat = e; else delete bas.dataset.etat;
  document.body.classList.toggle('chatOuvert', !!e);
  if(e){
    _nonLus = 0; _majNonLus();
    if(!avant) _pousserHistorique();
    fermerEventail();
  } else if(avant){
    if(depuisRetour) _histChat = false; else _retirerHistorique();
  }
  majHautBas();
  _majReserveCarte();
  for(const f of _apresEtatChat) f(e);
}
const _apresEtatChat = [];

// Chat compact, depuis la carte ; saisir : le clavier s'ouvre aussitôt.
function ouvrirChat(saisir){
  if(!_telLike()) return;
  if(_vue() !== 'carte') vueMobile('carte');
  const bas = document.getElementById('bas');
  bas.hidden = false;
  if(_etatChat !== 'compact') _poserEtatChat('compact');
  else _majReserveCarte();
  const j = document.getElementById('journal');
  j.scrollTop = j.scrollHeight;
  _nouveauxChat = 0; _majNouveauxChat();
  if(saisir) document.getElementById('chatIn').focus();
}
function fermerChat(depuisRetour){
  if(_etatChat !== 'compact') return;
  const ci = document.getElementById('chatIn');
  if(document.activeElement === ci) ci.blur();
  document.getElementById('bas').hidden = true;
  _poserEtatChat(null, depuisRetour);
}
// Sélectionner une pile ramène le chat compact à l'aperçu.
_apresSelection.push(() => { if(_etatChat === 'compact' && _sel.size) fermerChat(); });

// ── Bouton Retour d'Android : ouvrir le chat ajoute une entrée à
// l'historique ; Retour referme le chat au lieu de quitter la page.
let _histChat = false, _popIgnore = false;
function _pousserHistorique(){
  if(_histChat) return;
  try { history.pushState({chat: true}, ''); _histChat = true; } catch(e){}
}
function _retirerHistorique(){
  if(!_histChat) return;
  _histChat = false;
  _popIgnore = true;
  history.back();
}
window.addEventListener('popstate', () => {
  if(_popIgnore){ _popIgnore = false; return; }
  if(!_histChat) return;
  _histChat = false;
  if(_etatChat === 'plein') vueMobile('carte');
  else if(_etatChat === 'compact') fermerChat(true);
});

// Poignée du chat compact : vers le bas, l'aperçu ; vers le haut, le plein.
function _brancherPoigneeChat(){
  const bas = document.getElementById('bas');
  const pg = document.createElement('div');
  pg.className = 'poigneeChat';
  pg.setAttribute('aria-hidden', 'true');
  bas.insertBefore(pg, bas.firstChild);
  pg.addEventListener('pointerdown', e => {
    e.preventDefault();
    const id = e.pointerId, y0 = e.clientY;
    const fin = ev => {
      if(ev.pointerId !== id) return;
      document.removeEventListener('pointerup', fin);
      document.removeEventListener('pointercancel', fin);
      const dy = ev.clientY - y0;
      if(dy > 50) fermerChat();
      else if(dy < -50 || Math.abs(dy) < 6) vueMobile('journal');
    };
    document.addEventListener('pointerup', fin);
    document.addEventListener('pointercancel', fin);
  });
}

// ═══ CHAT — SAISIE RAPIDE ═══
// Au doigt, une rangée de phrases au-dessus du champ : un appui l'envoie
// au chat telle quelle, sans passer par le champ (le brouillon reste).
const PHRASES_CHAT = ['Hello', 'Assault Move', 'Bypass', 'Double Time', 'Dash'];
function majSaisieRapide(){
  const r = document.getElementById('chatRapide');
  if(!r) return;
  r.replaceChildren();
  for(const texte of PHRASES_CHAT){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pastilleChat phrase';
    b.textContent = texte;
    b.title = 'Envoyer au chat';
    b.addEventListener('pointerdown', e => e.preventDefault());   // le clavier ne bouge pas
    b.addEventListener('click', () => { vibrer(); envoyerChat(texte); });
    r.appendChild(b);
  }
}

// ═══ CHAT — LECTURE ═══
// Filtres du journal (au doigt) : Messages, Dés, Rapports, Système, par
// une classe CSS sur #journal ; une alerte n'est jamais masquée. Les lieux
// cités dans les messages et les rapports deviennent des liens qui centrent
// la carte. Le texte vient des autres joueurs : des nœuds texte et des
// span, jamais innerHTML.
const FILTRES_CHAT = [['msg', 'Messages'], ['jet', 'Dés'], ['rap', 'Rapports'], ['sys', 'Système']];
let _filtresChat = (() => {
  try { const l = JSON.parse(localStorage.getItem('aslweb.filtresChat') || 'null'); if(Array.isArray(l)) return new Set(l); } catch(e){}
  return new Set(['msg', 'jet', 'rap']);
})();
function majFiltresChat(){
  const j = document.getElementById('journal');
  j.dataset.filtres = [..._filtresChat].join(' ');
  for(const b of document.querySelectorAll('#filtresChat button')){
    const oui = _filtresChat.has(b.dataset.filtre);
    b.classList.toggle('actif', oui);
    b.setAttribute('aria-pressed', String(oui));
  }
}
function _construireFiltresChat(){
  const f = document.createElement('div');
  f.id = 'filtresChat'; f.className = 'filtresChat';
  f.setAttribute('role', 'toolbar');
  f.setAttribute('aria-label', 'Filtres du journal');
  for(const [c, lib] of FILTRES_CHAT){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pastilleChat'; b.dataset.filtre = c;
    b.textContent = lib;
    b.addEventListener('pointerdown', e => e.preventDefault());
    b.addEventListener('click', () => {
      if(_filtresChat.has(c)) _filtresChat.delete(c); else _filtresChat.add(c);
      try { localStorage.setItem('aslweb.filtresChat', JSON.stringify([..._filtresChat])); } catch(e){}
      majFiltresChat();
      const j = document.getElementById('journal'); j.scrollTop = j.scrollHeight;
    });
    f.appendChild(b);
  }
  const bas = document.getElementById('bas');
  bas.insertBefore(f, document.getElementById('journal'));
  majFiltresChat();
}

// Lieux d'une ligne de message ou de rapport, en liens.
function _lierLieux(el){
  if(!_hexParNom.size || !(el.classList.contains('msg') || el.classList.contains('rap'))) return;
  const t = el.textContent;
  const re = /[A-Za-z0-9]+(?:\/(?:NE|NO|SE|SO|N|S))?/g;
  let m, k = 0, morceaux = [];
  while((m = re.exec(t))){
    if(!_hexParNom.has(m[0])) continue;
    if(m.index > k) morceaux.push(document.createTextNode(t.slice(k, m.index)));
    const s = document.createElement('span');
    s.className = 'lieuChat';
    s.textContent = m[0];
    morceaux.push(s);
    k = m.index + m[0].length;
  }
  if(!morceaux.length) return;
  if(k < t.length) morceaux.push(document.createTextNode(t.slice(k)));
  el.replaceChildren(...morceaux);
}
_apresLigne.push(_lierLieux);

function _brancherLectureChat(){
  _construireFiltresChat();
  document.getElementById('journal').addEventListener('click', e => {
    const s = e.target.closest && e.target.closest('.lieuChat');
    if(!s || !_profil || _profil === 'pc') return;
    const pt = _hexParNom.get(s.textContent);
    if(!pt) return;
    // Depuis le journal plein, on revient à la carte pour voir le lieu.
    if(_etatChat === 'plein') vueMobile('carte');
    cadrerSur([pt]);
  });
}

// ═══ CHAT — CHAMP DE SAISIE ═══
// Comme le Chatter de VASSAL, une seule ligne, envoyée par Entrée ; au
// doigt, un bouton ➤ et la touche « Envoyer » du clavier, qui reste ouvert
// pour enchaîner. Une seule voie d'envoi : envoyerSaisie().
function envoyerSaisie(){
  const ci = document.getElementById('chatIn');
  envoyerChat(ci.value);
  ci.value = '';
  _majEnvoi();
}
function _majEnvoi(){
  document.getElementById('chatEnvoi').disabled = !document.getElementById('chatIn').value.trim();
}
// Texte d'aide : sur PC, celui d'avant ; au doigt, le nom sous lequel le
// message partira (« web » pour un observateur).
function majAideChat(){
  document.getElementById('chatIn').placeholder = !_profil || _profil === 'pc'
    ? 'Message au chat (Entrée pour envoyer)' : `Message en tant que ${joueur()}`;
}
function _brancherChat(){
  const ci = document.getElementById('chatIn'), bt = document.getElementById('chatEnvoi');
  ci.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); envoyerSaisie(); } });
  ci.addEventListener('input', _majEnvoi);
  // Le bouton ne prend pas le focus : le clavier reste ouvert.
  bt.addEventListener('pointerdown', e => e.preventDefault());
  bt.addEventListener('click', () => { if(ci.value.trim()) envoyerSaisie(); });
  const r = document.createElement('div');
  r.id = 'chatRapide'; r.className = 'chatRapide';
  r.setAttribute('aria-label', 'Saisie rapide');
  document.getElementById('bas').insertBefore(r, document.getElementById('chatBarre'));
  majSaisieRapide();
  _brancherLectureChat();
  _brancherClavier();
  _brancherPoigneeChat();
  majAideChat();
}
_apresProfil.push(majAideChat);

// ═══ INTERFACE — BARRE DE MENUS (profil PC) ═══
// Menus déroulants ; Alt seul ouvre le premier (F10 reste la LOS de VASL),
// les flèches y circulent, Entrée choisit, Échap referme.
let _menuOuvert = null;     // {titre, liste, items, i}
function construireMenus(def){
  const barre = document.createElement('div');
  barre.className = 'menus';
  barre.setAttribute('role', 'menubar');
  const h = document.createElement('h1');
  h.textContent = 'VASL — Carte';
  barre.appendChild(h);
  for(const [nom, ids] of Object.entries(def)){
    const t = document.createElement('button');
    t.type = 'button';
    t.className = 'titreMenu';
    t.textContent = nom;
    t.setAttribute('role', 'menuitem');
    t.setAttribute('aria-haspopup', 'true');
    t._ids = ids;
    t.addEventListener('pointerdown', e => e.stopPropagation());
    t.addEventListener('click', e => {
      e.stopPropagation();
      if(_menuOuvert && _menuOuvert.titre === t) fermerDeroulants(); else ouvrirDeroulant(t);
    });
    t.addEventListener('mouseenter', () => { if(_menuOuvert && _menuOuvert.titre !== t) ouvrirDeroulant(t); });
    barre.appendChild(t);
  }
  return barre;
}

function ouvrirDeroulant(t, focusPremier){
  fermerDeroulants(); fermerMenu();
  const m = document.createElement('div');
  m.className = 'deroulant';
  m.setAttribute('role', 'menu');
  for(const id of t._ids){
    if(id === '-'){ const s = document.createElement('div'); s.className = 'sepm'; s.setAttribute('role', 'separator'); m.appendChild(s); continue; }
    m.appendChild(rendreAction(id, 'menu'));
  }
  m.addEventListener('pointerdown', e => e.stopPropagation());
  document.body.appendChild(m);
  const r = t.getBoundingClientRect();
  m.style.left = Math.max(4, Math.min(r.left, window.innerWidth - m.offsetWidth - 4)) + 'px';
  m.style.top = r.bottom + 'px';
  t.classList.add('ouvert');
  t.setAttribute('aria-expanded', 'true');
  const items = [...m.querySelectorAll('.it')];
  _menuOuvert = {titre: t, liste: m, items, i: focusPremier ? 0 : -1};
  if(focusPremier) _focusItem(0);
}
function _focusItem(i){
  const o = _menuOuvert;
  if(!o || !o.items.length) return;
  o.i = (i + o.items.length) % o.items.length;
  o.items.forEach((it, k) => it.classList.toggle('focus', k === o.i));
  o.items[o.i].focus({preventScroll: true});
  o.items[o.i].scrollIntoView({block: 'nearest'});
}
function fermerDeroulants(){
  if(!_menuOuvert) return;
  _menuOuvert.liste.remove();
  _menuOuvert.titre.classList.remove('ouvert');
  _menuOuvert.titre.setAttribute('aria-expanded', 'false');
  _menuOuvert = null;
}
function _brancherMenus(){
  document.addEventListener('pointerdown', () => fermerDeroulants());
  let altSeul = false;
  window.addEventListener('keydown', e => {
    if(e.key === 'Alt'){ altSeul = !e.ctrlKey && !e.shiftKey && !e.metaKey; return; }
    altSeul = false;
    const o = _menuOuvert;
    if(!o) return;
    const titres = [...document.querySelectorAll('.menus .titreMenu')];
    const j = titres.indexOf(o.titre);
    const k = e.key;
    if(!['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'Enter', ' ', 'Escape', 'Home', 'End'].includes(k)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if(k === 'Escape'){ const t = o.titre; fermerDeroulants(); t.focus(); return; }
    if(k === 'ArrowDown') _focusItem(o.i + 1);
    else if(k === 'ArrowUp') _focusItem(o.i < 0 ? -1 : o.i - 1);
    else if(k === 'Home') _focusItem(0);
    else if(k === 'End') _focusItem(-1);
    else if(k === 'ArrowLeft' || k === 'ArrowRight')
      ouvrirDeroulant(titres[(j + (k === 'ArrowLeft' ? -1 : 1) + titres.length) % titres.length], true);
    else if(o.i >= 0) o.items[o.i].click();
  }, true);
  window.addEventListener('keyup', e => {
    if(e.key !== 'Alt' || !altSeul) return;
    altSeul = false;
    if(_profil !== 'pc' || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    const t = document.querySelector('.menus .titreMenu');
    if(!t) return;
    e.preventDefault();
    if(_menuOuvert) fermerDeroulants(); else ouvrirDeroulant(t, true);
  });
  // Alt enfoncé puis un clic : ce n'est pas « Alt seul ».
  window.addEventListener('pointerdown', () => { altSeul = false; }, true);
}

// Pose au centre de la vue, même si un panneau la recouvre.
function _poserAuCentre(x){
  const wr = document.getElementById('mapWrap').getBoundingClientRect();
  const c = clientVersCarte(wr.left + wr.width/2, wr.top + wr.height/2, null, true);
  if(c) poserDepuisPalette(x, c.x, c.y);
}

    ${lignes('Pions et piles', [
      ['Commandes du pion (menu)', 'clic droit · appui long'],
      ['Sélectionner la pile', 'clic'], ['Déplier / replier la pile', 'double-clic'],
      ['Ajouter ou retirer un pion', 'Ctrl+clic'], ['Ajouter à la sélection', 'Maj+clic'],
      ['Rectangle de sélection', 'Maj+glisser dans le vide'],
      ['Mettre au sommet de la pile', libelleTouche(m.top) || '↑'], ['Mettre au fond', libelleTouche(m.bottom) || '↓'],
      ['Monter d\'un cran', libelleTouche(m.up) || '→'], ['Descendre d\'un cran', libelleTouche(m.down) || '←'],
      ['Replier, puis désélectionner', 'Échap']])}
    ${lignes('Ligne de vue (pendant le tracé)', [['Niveau de la cible', '↑ / ↓'], ['Niveau de la source', 'Ctrl+↑ / Ctrl+↓'],
      ['Plus haut niveau hors toit', 'Ctrl à l\'appui'], ['Annuler', 'Échap']])}
    ${lignes('Relecture', [['Coup suivant / précédent', 'Page suivante / précédente']])}
    </table><div class="fb"><button id="utFermer" class="prim">Fermer</button></div></div>`;
  document.body.appendChild(w);
  w.querySelector('#utFermer').onclick = () => w.remove();

// Le profil suit la fenêtre et le pointeur.
function _brancherInterface(){
  window.addEventListener('resize', reevaluerProfil);
  for(const q of ['(pointer: coarse)', '(hover: hover)']){
    const mq = matchMedia(q);
    if(mq.addEventListener) mq.addEventListener('change', reevaluerProfil);
  }
}
let _reevaluation = null;
function reevaluerProfil(){
  clearTimeout(_reevaluation);
  if(enSaisie()) return;
  _reevaluation = setTimeout(() => { if(enSaisie()) return; const p = detecterProfil(); if(p !== _profil) appliquerProfil(p); }, 200);
}

document.addEventListener('DOMContentLoaded', () => {
  _brancherLangue();
  _setupDropZone();
  _setupPanZoom();
  _brancherCouches();
  // Ni sélection de texte ni glisser natif d'image sur la carte : le clic
  // y sert au panoramique et aux pions, jamais à surligner le terrain.
  const mw = document.getElementById('mapWrap');
  const saisie = t => t && t.closest && t.closest('input,textarea,select,[contenteditable="true"]');
  mw.addEventListener('selectstart', e => { if(!saisie(e.target)) e.preventDefault(); });
  mw.addEventListener('dragstart',   e => { if(!saisie(e.target)) e.preventDefault(); });
  const r = document.getElementById('palRech');
  r.addEventListener('input', () => { _palFiltre = r.value.trim().toLowerCase(); dessinerPalette(); });
  _brancherCommandes();
  _brancherMenus();
  _brancherInterface();
  _brancherPoignees();
  construireDes();
  appliquerProfil(detecterProfil());
  // Libellé des boutons d'icône pour les lecteurs d'écran : leur infobulle.
  for(const b of document.querySelectorAll('button[title]:not([aria-label])')) b.setAttribute('aria-label', b.title);
  // Pendant la saisie au doigt, le clavier change la taille de la fenêtre :
  // rien ne bouge avant qu'il se ferme (voir CHAT — CLAVIER VIRTUEL).
  window.addEventListener('resize', () => { if(enSaisie()) return; _redim = _redim || -1; _surRedimension(); });
  window.addEventListener('orientationchange', () => { if(!enSaisie()) _surRedimension(); });
  _brancherFil();
  majUtilisateur();
  _brancherDes();
  _brancherChat();
  // La carte qui défile ou zoome emporte la pile survolée : on referme.
  const w = document.getElementById('mapWrap');
  w.addEventListener('scroll', cacherSurvol);
  w.addEventListener('scroll', () => placerEventail());
  w.addEventListener('wheel', cacherSurvol);
  dessinerPalette();
  majNet();
  window.addEventListener('pagehide', () => { _garderLog(); if(_net) netQuitter(); });
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') _garderLog(); });
  setTimeout(_reprendreLogGarde, 0);
  // Comme VASSAL à la fermeture : des coups enregistrés et pas encore
  // écrits ne partent pas sans avertissement.
  window.addEventListener('beforeunload', e => {
    if(_logEnr && _logEnr.length){ e.preventDefault(); e.returnValue = ''; }
  });
});
