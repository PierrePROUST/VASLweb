// ── Widgets de la palette VASL. Seule la branche sélectionnée est dessinée :
// les vignettes ne se chargent qu'à l'ouverture de leur panneau.
// La sélection de chaque widget est retenue d'une visite à l'autre.
const _palSel = (() => {
  try { return new Map(JSON.parse(localStorage.getItem('palSel') || '[]')); } catch(e){ return new Map(); }
})();
function _choisir(noeud, i){
  _palSel.set(noeud.id, i);
  try { localStorage.setItem('palSel', JSON.stringify([..._palSel])); } catch(e){}
  dessinerPalette();
}

function rendreWidget(n, boite){
  const widgets = n.enfants.filter(e => e.enfants);
  const pions = n.enfants.filter(e => !e.enfants);
  const sel = Math.min(_palSel.get(n.id) || 0, Math.max(0, widgets.length - 1));
  const contenu = () => {
    const z = document.createElement('div');
    z.className = 'wcontenu';
    if(widgets[sel]) rendreWidget(widgets[sel], z);
    return z;
  };
  // Une fenêtre de palette qui contient plusieurs widgets les présente en
  // onglets, comme PieceWindow (la fenêtre « ? » : un onglet par nation).
  if(n.t === 'TabWidget' || n.t === 'Racine' || (n.t === 'PieceWindow' && widgets.length > 1)){
    // Onglets : un par widget enfant.
    if(pions.length) boite.appendChild(remplirGrille(pions));
    if(!widgets.length) return;
    const o = document.createElement('div');
    o.className = 'onglets';
    widgets.forEach((w, i) => {
      const b = document.createElement('div');
      b.className = 'onglet' + (i === sel ? ' actif' : '');
      b.textContent = w.nom || '—';
      b.addEventListener('click', () => _choisir(n, i));
      o.appendChild(b);
    });
    boite.append(o, contenu());
  } else if(n.t === 'BoxWidget'){
    // Liste déroulante.
    const t = document.createElement('div');
    t.className = 'wtitre'; t.textContent = n.nom;
    const s = document.createElement('select');
    s.className = 'wboite';
    widgets.forEach((w, i) => s.add(new Option(w.nom || '—', i, false, i === sel)));
    s.addEventListener('change', () => _choisir(n, +s.value));
    boite.append(t, s);
    if(pions.length) boite.appendChild(remplirGrille(pions));
    if(widgets.length) boite.appendChild(contenu());
  } else if(n.t === 'ListWidget'){
    // Liste : le choix d'une entrée affiche son contenu en dessous.
    if(widgets.length){
      const l = document.createElement('div');
      l.className = 'wliste';
      widgets.forEach((w, i) => {
        const e = document.createElement('div');
        e.className = 'wli' + (i === sel ? ' actif' : '');
        e.textContent = w.nom || '—';
        e.addEventListener('click', () => _choisir(n, i));
        l.appendChild(e);
      });
      boite.appendChild(l);
    }
    if(pions.length) boite.appendChild(remplirGrille(pions));
    if(widgets.length) boite.appendChild(contenu());
  } else {
    // PanelWidget, PieceWindow : tout le contenu, dans l'ordre du module ;
    // un panneau imbriqué porte son titre.
    let lot = [];
    const vider = () => { if(lot.length) boite.appendChild(remplirGrille(lot)); lot = []; };
    for(const e of n.enfants){
      if(!e.enfants){ lot.push(e); continue; }
      vider();
      if(e.t === 'PanelWidget' && e.nom){
        const t = document.createElement('div');
        t.className = 'wtitre'; t.textContent = e.nom;
        boite.appendChild(t);
      }
      rendreWidget(e, boite);
    }
    vider();
  }
}

function remplirGrille(liste){
  const g = document.createElement('div');
  g.className = 'grille';
  for(const x of liste){
    const d = document.createElement('div');
    d.className = 'vig';
    d.title = `${x.n}  (gpid ${x.g}) — glisser vers la carte, ou cliquer pour poser au centre ; au doigt, toucher puis toucher la carte`;
    d.setAttribute('aria-label', x.n);
    const mini = document.createElement('div');
    mini.className = 'mini';
    d.appendChild(mini);
    g.appendChild(d);
    composerVignette(mini, lireSlot(x), 42);
    // Glisser vers la carte, ou clic : pose au centre de la vue.
    d.addEventListener('pointerdown', e => glisser(e, (mini.querySelector('img') || {}).src, 48 * SC * zoom, (cx, cy) => {
      const c = clientVersCarte(cx, cy);
      if(c) poserDepuisPalette(x, c.x, c.y);
      else chatLog('Lâché hors de la carte : rien posé');
    }, ev => {
      // Au doigt : le pion est armé, l'appui suivant sur la carte le pose.
      if(ev && ev.pointerType && ev.pointerType !== 'mouse') armerPose(x);
      else _poserAuCentre(x);
    }, {appuiLong: 300}));
  }
  return g;
}

// ═══════════════════════════════════════════════════════════════
// DÉS — d'après ASLDiceBot et ASLChatter (VASL)
// Le jet est un message de chat au format d'ASLDiceBot, que VASL relit
// et décore lui-même :
//   *** (IFT DR) 3,1 ***   <Pierre>      Axis SAN    [1 / 8   avg   6,62 (6,62)]    (01.51)
// Le premier dé est le COLORÉ, le second le blanc. Le SAN se contrôle
// sur le total du DR original (A14.2), comme IsSpecialDiceRoll().
// ═══════════════════════════════════════════════════════════════
const DE_COLORE = 'R', DE_BLANC = 'W';     // DC<n>_<couleur>.png du module

// ═══ UTILISATEURS ET PROPRIÉTÉ DES PIONS ═══
// Comme dans VASSAL, un joueur a un NOM, qui s'inscrit dans la propriété
// Owner des pions qu'il pose ou déplace ($PlayerName$), et un MOT DE
// PASSE, qui est l'identifiant de ses masques : l'état des traits conceal
// et hide d'un fichier VASL porte ce mot de passe. Le saisir prouve donc
// qu'on est ce joueur, sans qu'aucune liste de mots de passe ne soit lue.
//
// Comme dans VASL, la propriété ne joue que pour les masques : tout le
// monde déplace tous les pions, mais un pion dissimulé (« ? ») ou en HIP
// n'est visible et commandable que par le joueur qui l'a masqué.
// L'administrateur voit et commande tout : arbitrage, relecture, partie
// solitaire.
//
// Rien de tout cela ne résiste à quelqu'un qui ouvre la console : tout
// s'exécute dans son navigateur. Le contrôle évite les regards
// distraits, pas la triche — il faudrait un serveur pour cela.
const NOM_ADMIN = 'Administrateur';
const ADMIN_MDP = 'Glorantha';
let _utilisateur = null;              // {nom, mdp} ; null = observateur
let _admin = false;

// Nom du joueur : Owner, chat, dés, rapports et commandes du log.
const joueur = () => _admin ? NOM_ADMIN : (_utilisateur ? _utilisateur.nom : 'web');
// Identifiant des masques (conceal, hide) : le mot de passe.
const idJoueur = () => _admin ? 'admin' : (_utilisateur ? _utilisateur.mdp : 'web');

const CLE_COMPTES = 'aslweb.comptes';
const CLE_DERNIER = 'aslweb.dernierUtilisateur';
const _lireLocal = (k, def) => { try { const v = localStorage.getItem(k); return v === null ? def : v; } catch(e){ return def; } };
const _ecrireLocal = (k, v) => { try { localStorage.setItem(k, v); return true; } catch(e){ return false; } };

// Comptes créés sur ce poste. Le mot de passe n'y est pas en clair :
// une empreinte FNV-1a suffit à refuser une faute de frappe, et
// crypto.subtle manque quand la page est ouverte en file://.
function _empreinte(t){
  let h = 0x811c9dc5;
  for(const c of String(t)){ h ^= c.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}
function comptesLocaux(){
  try {
    const l = JSON.parse(_lireLocal(CLE_COMPTES, '[]'));
    return Array.isArray(l) ? l.filter(c => c && c.nom && c.h) : [];
  } catch(e){ return []; }
}
const _memeNom = (a, b) => !!a && !!b && a.toLowerCase() === b.toLowerCase();
function enregistrerCompte(nom, mdp){
  const l = comptesLocaux();
  const c = l.find(x => _memeNom(x.nom, nom));
  if(c) c.h = _empreinte(mdp); else l.push({nom, h: _empreinte(mdp)});
  return _ecrireLocal(CLE_COMPTES, JSON.stringify(l));
}
function oublierCompte(nom){
  return _ecrireLocal(CLE_COMPTES, JSON.stringify(comptesLocaux().filter(x => !_memeNom(x.nom, nom))));
}
// Le nom est écrit tel quel dans l'état Owner : « ; », « / », « \ »,
// « , » et la tabulation sont des séparateurs de VASSAL.
const nomValide = nom => /^[^;/\\\t,<>&"]{1,24}$/.test(nom) && !_memeNom(nom, NOM_ADMIN) && !_memeNom(nom, 'web');

// Joueurs du fichier : un par identifiant de masque, nommé d'après
// l'Owner majoritaire des pions qu'il masque.
function joueursDuFichier(){
  const par = new Map();
  for(const p of vivants()){
    for(const id of [p.masqueProprio, p.hipProprio, p.compteurProprio]){
      if(!id || id === 'web' || id === 'admin') continue;
      if(!par.has(id)) par.set(id, {id, n: 0, noms: new Map()});
      const f = par.get(id);
      f.n++;
      if(p.proprietaire) f.noms.set(p.proprietaire, (f.noms.get(p.proprietaire) || 0) + 1);
    }
  }
  return [...par.values()].map((f, i) => {
    const nom = [...f.noms.entries()].sort((a, b) => b[1] - a[1])[0];
    return {id: f.id, n: f.n, nom: nom ? nom[0] : null, etiquette: 'Joueur ' + (i + 1)};
  }).sort((a, b) => b.n - a.n);
}

function seConnecter(u, admin){
  _utilisateur = admin ? null : u;
  _admin = !!admin;
  majUtilisateur();
  if(typeof majAideChat === 'function') majAideChat();
  _netMajInfo();
  // Ce qu'on voit d'une unité dissimulée ou en HIP dépend de qui l'on est.
  vivants().forEach(p => majApparence(p));
  if(_pileSel) afficherPile();
  chatLog(_admin ? '👁️ Administrateur : tous les pions dissimulés et HIP sont visibles'
    : (_utilisateur ? `👤 ${_utilisateur.nom} — ${nbMasques(_utilisateur.mdp)} pion(s) masqué(s) à vous`
                    : '👤 Observateur : les pions dissimulés et HIP restent cachés'));
}

function majUtilisateur(){ rafraichirActions(['utilisateur']); }

// ── Accès aux pions masqués.
// « web » est l'identifiant d'avant les comptes : il ne réserve rien.
const _masqueDe = (p, id) => !!id && (p.masqueProprio === id || p.hipProprio === id || p.compteurProprio === id);
const nbMasques = id => vivants().filter(p => _masqueDe(p, id)).length;
function accesRefuse(p){
  if(!p || _admin) return false;
  const autrui = id => !!id && id !== 'web' && id !== idJoueur();
  return autrui(p.masqueProprio) || autrui(p.hipProprio) || autrui(p.compteurProprio);
}
// Vrai si la commande est refusée ; le refus est dit au journal.
function refuser(p){
  if(!accesRefuse(p)) return false;
  chatLog(`🔒 ${p.el.title || p.nom} : masqué par un autre joueur, aucune commande`
    + ` — vous êtes ${_utilisateur ? _utilisateur.nom : 'observateur'}`);
  return true;
}

// ── Boîte d'identification, ouverte à chaque carte chargée.
// Choisir une ligne ne donne aucun accès : c'est le mot de passe qui
// prouve l'identité.
//   · joueur du fichier : son mot de passe est l'identifiant de ses masques
//   · compte du poste   : comparé à l'empreinte enregistrée
//   · administrateur    : ADMIN_MDP
const _esc = t => String(t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);

function demanderUtilisateur(){
  fermerFenetres();
  const fiches = joueursDuFichier();
  const comptes = comptesLocaux();
  const compteDe = nom => comptes.find(c => _memeNom(c.nom, nom)) || null;
  const entrees = [{type: 'admin', nom: NOM_ADMIN, info: 'voit tous les pions masqués'}];
  const deja = nom => entrees.some(e => _memeNom(e.nom, nom));
  for(const f of fiches){
    if(f.nom && deja(f.nom)) continue;
    entrees.push({type: 'joueur', nom: f.nom || f.etiquette, fiche: f, compte: compteDe(f.nom),
                  info: `${f.n} pion(s) masqué(s)`});
  }
  for(const c of comptes) if(!deja(c.nom)) entrees.push({type: 'joueur', nom: c.nom, compte: c, info: 'compte de ce poste'});
  entrees.push({type: 'nouveau', nom: 'Nouvel utilisateur…', info: ''});

  // Présélection : l'utilisateur de la dernière fois, sinon le premier joueur.
  const dernier = _lireLocal(CLE_DERNIER, '');
  let defaut = entrees.findIndex(e => e.type !== 'nouveau' && _memeNom(e.nom, dernier));
  if(defaut < 0) defaut = entrees.length > 2 ? 1 : entrees.length - 1;

  const w = document.createElement('div');
  w.id = 'fenUtil'; w.className = 'fenetre';
  w.innerHTML = `
    <div class="ft">Identification</div>
    <div class="fc">
      <p>Choisir l'utilisateur, puis saisir son mot de passe. Les pions dissimulés
        et HIP ne sont visibles que de leur joueur${fiches.length ? ` ; cette carte en
        contient de ${fiches.length} joueur(s)` : ''}.</p>
      <label>Utilisateur<select id="utSel">${entrees.map((e, i) =>
        `<option value="${i}"${i === defaut ? ' selected' : ''}>${_esc(e.nom)}${e.info ? ' — ' + _esc(e.info) : ''}</option>`).join('')}</select></label>
      <label id="utNomL">Nom du nouvel utilisateur<input id="utNom" maxlength="24" autocomplete="off" placeholder="nom affiché"></label>
      <label>Mot de passe<input id="utMdp" type="password" autocomplete="off" placeholder="mot de passe"></label>
      <div class="ferr" id="utErr"></div>
      <div class="fb">
        <button id="utOk" class="prim">Se connecter</button>
        <button id="utObs">Observateur</button>
        <button id="utGerer">Utilisateurs…</button>
      </div>
      <p class="fnote">Pour un joueur VASL, le mot de passe est celui de VASL : il ouvre ses
        pions dissimulés et en HIP.</p>
    </div>`;
  document.body.appendChild(w);
  const $ = id => document.getElementById(id);
  const sel = $('utSel'), err = $('utErr');
  const majNom = () => {
    const nouveau = entrees[+sel.value].type === 'nouveau';
    $('utNomL').style.display = nouveau ? '' : 'none';
    err.textContent = '';
    (nouveau ? $('utNom') : $('utMdp')).focus();
  };
  sel.addEventListener('change', majNom);
  const connecter = (nom, mdp) => {
    _ecrireLocal(CLE_DERNIER, nom);
    w.remove();
    seConnecter({nom, mdp}, false);
  };
  $('utOk').onclick = () => {
    const e = entrees[+sel.value], mdp = $('utMdp').value;
    if(e.type === 'admin'){
      if(mdp !== ADMIN_MDP){ err.textContent = 'Mot de passe administrateur incorrect.'; return; }
      _ecrireLocal(CLE_DERNIER, NOM_ADMIN);
      w.remove();
      seConnecter(null, true);
      return;
    }
    if(!mdp){ err.textContent = 'Saisir le mot de passe.'; return; }
    if(mdp === ADMIN_MDP || mdp === 'web' || mdp === 'admin'){ err.textContent = 'Ce mot de passe est réservé.'; return; }
    if(e.type === 'nouveau'){
      const nom = $('utNom').value.trim();
      if(!nomValide(nom)){ err.textContent = 'Nom requis : 24 caractères au plus, sans ; / \\ , < > & ".'; return; }
      if(entrees.some(x => x.type !== 'nouveau' && _memeNom(x.nom, nom))){
        err.textContent = 'Cet utilisateur existe déjà : le choisir dans la liste.'; return;
      }
      enregistrerCompte(nom, mdp);
      chatLog(`➕ Utilisateur créé : ${nom}`);
      connecter(nom, mdp);
      return;
    }
    // Le mot de passe doit être celui de l'utilisateur DÉSIGNÉ.
    const parMasque = e.fiche && mdp === e.fiche.id;
    const parCompte = e.compte && _empreinte(mdp) === e.compte.h;
    if(!parMasque && !parCompte){ err.textContent = 'Mot de passe incorrect pour cet utilisateur.'; return; }
    // Un nom réel encore inconnu du poste y devient un compte : il sera
    // reconnu la prochaine fois, même sans pion masqué.
    const nom = e.fiche ? (e.fiche.nom || e.nom) : e.nom;
    if(!e.compte && nomValide(nom)) enregistrerCompte(nom, mdp);
    connecter(nom, mdp);
  };
  $('utObs').onclick = () => { _ecrireLocal(CLE_DERNIER, ''); w.remove(); seConnecter(null, false); };
  $('utGerer').onclick = () => { w.remove(); gererUtilisateurs(); };
  for(const c of [$('utMdp'), $('utNom')])
    c.addEventListener('keydown', ev => {
      if(ev.key === 'Enter') $('utOk').click();
      if(ev.key === 'Escape') w.remove();
    });
  majNom();
}

// ── Gestion des utilisateurs : comptes du poste et joueurs du fichier,
// avec le nombre de pions que chacun tient masqués.
function gererUtilisateurs(){
  fermerFenetres();
  const fiches = joueursDuFichier();
  const lignes = [];
  for(const f of fiches)
    lignes.push({nom: f.nom || f.etiquette, n: f.n, local: false, moi: !!_utilisateur && f.id === _utilisateur.mdp});
  for(const c of comptesLocaux()){
    const l = lignes.find(x => _memeNom(x.nom, c.nom));
    if(l) l.local = true;
    else lignes.push({nom: c.nom, n: 0, local: true, moi: !!_utilisateur && _memeNom(c.nom, _utilisateur.nom)});
  }
  const w = document.createElement('div');
  w.id = 'fenUtil'; w.className = 'fenetre';
  w.innerHTML = `
    <div class="ft">Utilisateurs</div>
    <div class="fc">
      <p>Connecté : <b>${_esc(_admin ? NOM_ADMIN : (_utilisateur ? _utilisateur.nom : 'observateur'))}</b>.</p>
      <table><tr><th>Utilisateur</th><th>Pions masqués</th><th></th></tr>
        ${lignes.map(l => `<tr><td>${_esc(l.nom)}${l.moi ? ' <b>(vous)</b>' : ''}</td><td class="nb">${l.n}</td>
          <td>${l.local ? `<button class="oubli" data-nom="${_esc(l.nom)}">Oublier</button>` : '<i>fichier</i>'}</td></tr>`).join('')
          || '<tr><td colspan="3"><i>Aucun utilisateur</i></td></tr>'}</table>
      <div class="fb">
        <button id="utChanger" class="prim">Changer d'utilisateur…</button>
        <button id="utFermer">Fermer</button>
      </div>
      <p class="fnote">Comme dans VASL, tous les pions se déplacent librement ; un pion
        dissimulé ou en HIP n'est visible et commandable que par son joueur et par
        l'administrateur.</p>
    </div>`;
  document.body.appendChild(w);
  w.querySelectorAll('.oubli').forEach(b => b.onclick = () => {
    oublierCompte(b.dataset.nom);
    chatLog(`➖ Compte oublié sur ce poste : ${b.dataset.nom}`);
    gererUtilisateurs();
  });
  document.getElementById('utChanger').onclick = () => demanderUtilisateur();
  document.getElementById('utFermer').onclick = () => w.remove();
}

function fermerFenetres(){
  const f = document.getElementById('fenUtil');
  if(f) f.remove();
}
const _d6 = () => {
  // Tirage uniforme sans biais de modulo.
  const t = new Uint8Array(1);
  do { crypto.getRandomValues(t); } while(t[0] >= 252);
  return 1 + (t[0] % 6);
};

// ── Informations de scénario (ScenInfo, segment « INFO\t ») :
//   qui joue en premier, joueur, tour, ELR Axis, SAN Axis, ELR Allied,
//   SAN Allied, piège Axis, piège Allied, météo…
let _infoEtat = 'Axis\tAxis\t1\t?\t?\t?\t?\t?\t?';
let _infoModifiee = false;
const INFO_SAN_AXIS = 4, INFO_SAN_ALLIED = 6, INFO_BB_AXIS = 7, INFO_BB_ALLIED = 8;

function _infoChamp(i){
  return (_infoEtat.split('\t')[i] || '?').replace(/\\/g, '').trim();
}
function _infoFixer(i, v){
  const f = _infoEtat.split('\t');
  while(f.length <= i) f.push('?');
  f[i] = v;
  _infoEtat = f.join('\t');
}

function lireInfo(segs){
  const seg = segs.find(x => x.startsWith('INFO\t'));
  _infoEtat = seg ? seg.substring(5) : 'Axis\tAxis\t1\t?\t?\t?\t?\t?\t?';
  _infoModifiee = false;
  majChampsInfo();
  const sa = _infoChamp(INFO_SAN_AXIS), sl = _infoChamp(INFO_SAN_ALLIED);
  if(seg) chatLog(`🎯 SAN Axis ${sa} · Allied ${sl}`);
}

function majChampsInfo(){
  const n = v => /^\d+$/.test(v) ? v : '';
  document.getElementById('sanAxis').value = n(_infoChamp(INFO_SAN_AXIS));
  document.getElementById('sanAllied').value = n(_infoChamp(INFO_SAN_ALLIED));
  const b = v => ['A','B','C'].includes(v) ? v : '?';
  document.getElementById('bbAxis').value = b(_infoChamp(INFO_BB_AXIS));
  document.getElementById('bbAllied').value = b(_infoChamp(INFO_BB_ALLIED));
}

// Saisie : VASL diffuse et consigne la fiche entière (SetInfo).
function changerInfo(){
  const v = id => document.getElementById(id).value.trim();
  _avantAction();
  _infoFixer(INFO_SAN_AXIS, v('sanAxis') || '?');
  _infoFixer(INFO_SAN_ALLIED, v('sanAllied') || '?');
  _infoFixer(INFO_BB_AXIS, v('bbAxis'));
  _infoFixer(INFO_BB_ALLIED, v('bbAllied'));
  _infoModifiee = true;
  _logCmd('INFO\t' + _infoEtat);
  chatLog(`🎯 SAN Axis ${_infoChamp(INFO_SAN_AXIS)} · Allied ${_infoChamp(INFO_SAN_ALLIED)}`
        + ` — pièges Axis ${_infoChamp(INFO_BB_AXIS)} · Allied ${_infoChamp(INFO_BB_ALLIED)}`);
}

// IsSpecialDiceRoll() : SAN des deux camps sur le total, pièges sur 11-12.
function _special(total){
  const san = c => { const v = parseInt(_infoChamp(c), 10); return !isNaN(v) && v === total; };
  const ax = san(INFO_SAN_AXIS), al = san(INFO_SAN_ALLIED);
  if(ax && al) return 'Axis/Allied SAN    ';
  if(ax) return 'Axis SAN    ';
  if(al) return 'Allied SAN    ';
  if(total >= 11){
    const bt = c => { const v = _infoChamp(c); return v === 'A' || (v === 'B' && total === 11) || (v === 'C' && total === 12); };
    const bx = bt(INFO_BB_AXIS), bl = bt(INFO_BB_ALLIED);
    if(bx && bl) return 'Axis/Allied Booby Trap    ';
    if(bx) return 'Axis Booby Trap   ';
    if(bl) return 'Allied Booby Trap   ';
  }
  return '';
}

// ── Statistiques de la session, par catégorie et au total (DiceStats).
const _stats = new Map();
function _stat(cle){
  if(!_stats.has(cle)) _stats.set(cle, {n: 0, somme: 0, detail: new Map()});
  return _stats.get(cle);
}
function _ajouterStat(cle, valeur){
  const s = _stat(cle);
  s.n++; s.somme += valeur;
  s.detail.set(valeur, (s.detail.get(valeur) || 0) + 1);
}
const _fmt2 = v => v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const _moy = cle => { const s = _stats.get(cle); return s && s.n ? _fmt2(s.somme / s.n) : '-'; };
const _surTotal = (cle, v) => { const s = _stats.get(cle); return s ? `${s.detail.get(v) || 0} / ${s.n}` : '-/-'; };

// Numéro de série d'ASLDiceBot : séries de 99, numéros tirés dans le désordre.
let _serie = 0, _rangSerie = 99, _ordreSerie = [];
function _numeroSerie(){
  if(_rangSerie >= 99){
    _serie++; _rangSerie = 0;
    _ordreSerie = Array.from({length: 99}, (_, i) => i + 1);
    for(let i = 98; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [_ordreSerie[i], _ordreSerie[j]] = [_ordreSerie[j], _ordreSerie[i]];
    }
  }
  const d2 = n => String(n).padStart(2, '0');
  return d2(_serie) + '.' + d2(_ordreSerie[_rangSerie++]);
}

function lancerDR(cat){
  const c = _d6(), b = _d6();
  _ajouterStat('D2_Total', c + b); _ajouterStat('D2_' + cat, c + b);
  const msg = `*** (${cat} DR) ${c},${b} ***   <${joueur()}>      ${_special(c + b)}`
            + `[${_surTotal('D2_Total', c + b)}   avg   ${_moy('D2_' + cat)} (${_moy('D2_Total')})]`
            + `    (${_numeroSerie()})`;
  _publierJet(msg);
  return {c, b, total: c + b};
}

function lancerdr(cat){
  const d = _d6();
  _ajouterStat('D1_Total', d); _ajouterStat('D1_' + cat, d);
  const msg = `*** (${cat} dr) ${d} ***   <${joueur()}>      `
            + `[${_surTotal('D1_Total', d)}   avg   ${_moy('D1_' + cat)} (${_moy('D1_Total')})]`
            + `    (${_numeroSerie()})`;
  _publierJet(msg);
  return {d};
}

// VASSAL encode le texte du chat en entités HTML.
function _publierJet(msg){
  _logCmd('CHAT' + msg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));
  afficherChat(msg);
}

function _desechappe(s){
  return (s || '').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&');
}

// ── Affichage d'un message de chat, jets décodés comme ASLChatter :
// images des dés, total, joueur, SAN ou piège, et les annonces de règle
// du niveau « Full ASL ».
function afficherChat(msg){
  const m = msg.match(/^\*\*\* \((.+?) (DR|dr)\) ([\d,]+) \*\*\*.*?<([^>]*)>\s*(.*)$/);
  if(!m){
    // Rapports (« * … ») et messages des joueurs, comme le chat de VASSAL.
    const l = document.createElement('div');
    l.className = /^\*/.test(msg) ? 'rap' : 'msg';
    l.textContent = msg;
    ajouterLigne(l);
    return;
  }
  const [, catBrute, type, des, qui, reste] = m;
  const cat = catBrute.replace('ENEMY ', '');
  const v = des.split(',').map(Number);
  const ligne = document.createElement('div');
  ligne.className = 'jet';
  const t = document.createElement('span');
  t.className = 'cat'; t.textContent = `${catBrute === 'Other' ? '' : catBrute + ' '}${type}`;
  ligne.appendChild(t);
  v.forEach((n, i) => {
    const im = document.createElement('img');
    im.alt = String(n); im.title = String(n);
    chargerImage(`DC${n}_${i === 0 && type === 'DR' ? DE_COLORE : DE_BLANC}.png`).then(u => { if(u) im.src = u; });
    ligne.appendChild(im);
  });
  const tot = document.createElement('span');
  tot.className = 'tot';
  tot.textContent = type === 'DR' ? `= ${v[0] + v[1]}` : '';
  ligne.appendChild(tot);
  const q = document.createElement('span');
  q.className = 'qui'; q.textContent = qui;
  ligne.appendChild(q);
  // Annonces soulignées après le joueur, comme ASLChatter : le SAN ou le
  // piège en tête, puis les annonces de règle, séparés par des virgules.
  let san = null, sp;
  if(type === 'DR'){
    san = (reste.match(/^(Axis\/Allied|Axis|Allied) (SAN|Booby Trap)/) || [])[0];
    // ASLChatter ne signale pas le SAN sur Rally, TK et CC, ni les pièges hors TC.
    if(san && !(/Booby/.test(san) ? cat === 'TC' : !['TK','CC','Rally'].includes(cat))) san = null;
    sp = _annoncesDR(cat, v[0], v[1]);
  } else sp = _annoncesdr(cat, v[0]);
  if(san || sp.length){
    const s = document.createElement('span');
    s.className = 'spe';
    if(san){
      const e = document.createElement('span');
      e.className = 'san'; e.textContent = san;
      s.appendChild(e);
      if(sp.length) s.append(', ');
    }
    s.append(sp.join(', '));
    ligne.appendChild(s);
  }
  ajouterLigne(ligne);
}

// dr d'activation du Sniper (A14.3), comme ASLChatter.
function _annoncesdr(cat, d){
  if(cat !== 'SA') return [];
  if(d === 1) return ['Eliminates SMC, Dummy stack, Sniper; Stuns & Recalls CE crew; breaks MMC & Inherent crew of certain vehicles; immobilizes unarmored vehicle (A14.3)'];
  if(d === 2) return ['Eliminates Dummy stack; Wounds SMC; Stuns CE crew; pins MMC, Inherent crew of certain vehicles, Sniper (A14.3)'];
  return [];
}

function _annoncesDR(cat, a, b){
  const sp = [];
  switch(cat){
    case 'TH':
      if(a === b){ if(a === 1) sp.push('Unlikely Hit (C3.6)'); sp.push('Multiple Hits 15..40mm (C3.8)'); }
      sp.push(a < b ? 'Turret' : 'Hull');
      break;
    case 'TK':
      if(a === 6 && b === 6) sp.push('Dud (C7.35)');
      break;
    case 'MC':
      if(a === 1 && b === 1) sp.push('Heat of Battle (A15.1)');
      else if(a === 6 && b === 6) sp.push('Casualty MC (A10.31)');
      break;
    case 'Rally':
      if(a === 1 && b === 1) sp.push('Heat of Battle (A15.1) or Field Promotion (A18.11)');
      else if(a === 6 && b === 6) sp.push('Fate -> Casualty Reduction (A10.64)');
      break;
    case 'IFT':
      if(a === b){ if(a === 1) sp.push('Unlikely Kill vs * (A7.309)'); sp.push('Cower if MMC w/o LDR'); }
      break;
    case 'CC':
      if(a === 1 && b === 1) sp.push('Infiltration (A11.22), Field Promotion (A18.12), Unlikely Kill (A11.501)');
      else if(a === 6 && b === 6) sp.push('Infiltration (A11.22)');
      break;
  }
  return sp;
}

// Raccourcis d'ASLChatter : F2 DR, F1 dr, Ctrl+Maj+lettre par catégorie.
function _brancherDes(){
  for(const id of ['sanAxis', 'sanAllied', 'bbAxis', 'bbAllied'])
    document.getElementById(id).addEventListener('change', changerInfo);
  const DR = {I: 'IFT', H: 'TH', K: 'TK', M: 'MC', R: 'Rally', C: 'CC', T: 'TC'};
  const dr = {S: 'SA', D: 'RS'};
  document.addEventListener('keydown', e => {
    if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if(e.key === 'F2'){ e.preventDefault(); lancerDR('Other'); return; }
    if(e.key === 'F1'){ e.preventDefault(); lancerdr('Other'); return; }
    if(e.ctrlKey && e.shiftKey){
      const k = e.key.toUpperCase();
      if(DR[k]){ e.preventDefault(); lancerDR(DR[k]); }
      else if(dr[k]){ e.preventDefault(); lancerdr(dr[k]); }
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// PARTIE À DISTANCE — d'après VASSAL.chat.node (NodeClient, ServerNode,
// Protocol) et VASSAL.chat (SynchAction, SynchCommand, CommandDecoder)
// VASSAL relie les joueurs par un serveur de salles. Le dialogue se
// fait ligne à ligne :
//   REG\tid\tchemin\tinfo   s'inscrire, d'abord dans « VASL/Main Room »
//   JOIN\tVASL/salle        changer de salle
//   STATS\tinfo             nouveau nom du joueur
//   FWD\tchemin\tmessage    faire suivre : « VASL/salle/~id » toute la
//                           salle sauf soi, « VASL/*/id » un seul joueur
//   LIST\tchemin=info\t…    (serveur) les joueurs, salle par salle
//   ROOM_INFO\t…            (serveur) le propriétaire de chaque salle,
//                           son premier occupant
// Un message de plus de 1000 caractères part en « !ZIP! » suivi du
// base64 d'un zip à une entrée (Compressor).
// Entrer dans une salle occupée (NodeClient.setRoom) : JOIN, puis, à la
// LIST qui confirme l'arrivée, une demande « SYNC » au propriétaire.
// Celui-ci répond (SynchCommand) par l'état complet de la partie,
// begin_save … end_save, envoyé au seul demandeur. Ensuite chaque coup
// est exécuté, consigné et envoyé aux autres (sendAndLog) ; à réception
// il est décodé, exécuté et consigné (CommandDecoder).
// Un navigateur n'ouvre pas de socket TCP : la page qui héberge tient le
// rôle du serveur, et les lignes passent par WebRTC (PeerJS) entre
// postes, ou par BroadcastChannel entre onglets d'un même navigateur.
// ═══════════════════════════════════════════════════════════════
const NET_MODULE = 'VASL';
const NET_SALLE_DEFAUT = 'Main Room';       // DEFAULT_ROOM_NAME
const NET_ZIP = '!ZIP!', NET_ZIP_SEUIL = 1000;
const NET_SYNC_TROP_TOT = 15000;            // SynchAction.TOO_SOON
const NET_PREFIXE = 'aslweb-';
const PEERJS_URL = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';

let _net = null;            // connexion en cours
let _netReception = false;  // vrai pendant l'exécution d'un coup reçu

// Propriétés d'un joueur ou d'une salle : « clé=valeur&… », sans
// tabulation ni « / » qui séparent les champs du protocole.
const _propsEnc = o => Object.entries(o).map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
function _propsDec(s){
  const o = {};
  for(const e of (s || '').split('&')){
    const i = e.indexOf('=');
    if(i > 0) try { o[decodeURIComponent(e.substring(0, i))] = decodeURIComponent(e.substring(i + 1)); } catch(err){}
  }
  return o;
}
const _nomSalle = t => String(t || '').replace(/[\/\t=&\\]/g, ' ').trim().substring(0, 40);
const _netInfo = n => _propsEnc({id: n.moi, name: joueur(), client: 'ASLweb', looking: 'false', away: 'false'});

// ── !ZIP! : un zip à une entrée « Dummy », comme Compressor.
function _b64(u8){
  let s = '';
  for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
async function _netZip(texte){
  const f = await _deflate(new TextEncoder().encode(texte));
  return _b64(new Uint8Array(await _zipWrite(new Map([['Dummy', f]])).arrayBuffer()));
}
async function _netDezip(b64){
  const s = atob(b64), u = new Uint8Array(s.length);
  for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  const [d] = (await _zipRead(u.buffer)).values();
  return new TextDecoder().decode(d || new Uint8Array(0));
}

// ── Le serveur (ServerNode), tenu par la page qui héberge. Chaque joueur
// est une feuille « VASL/salle/id » ; un lien est sa connexion.
function creerServeur(){
  const joueurs = new Map();      // id → {id, chemin, info, lien}, par ordre d'arrivée
  let minuterie = null;
  const chemin = c => {
    const t = String(c || '').split('/');
    return NET_MODULE + '/' + (_nomSalle(t[1]) || NET_SALLE_DEFAUT);
  };
  const srv = {
    recevoir(lien, ligne){
      if(typeof ligne !== 'string') return;
      if(ligne.startsWith('REG\t')){
        const [id, ch, info] = ligne.substring(4).split('\t');
        if(!id) return;
        lien.id = id;
        joueurs.delete(id);
        joueurs.set(id, {id, chemin: chemin(ch), info: info || '', lien});
        srv.changer();
      } else if(!joueurs.has(lien.id)){
        lien.envoyer('REG_REQUEST\t');             // inconnu : prié de s'inscrire
      } else if(ligne.startsWith('JOIN\t')){
        // Changer de salle place le joueur après ses occupants.
        const j = joueurs.get(lien.id);
        joueurs.delete(j.id);
        j.chemin = chemin(ligne.substring(5).split('\t')[0]);
        joueurs.set(j.id, j);
        srv.changer();
      } else if(ligne.startsWith('STATS\t')){
        joueurs.get(lien.id).info = ligne.substring(6);
        srv.changer();
      } else if(ligne.startsWith('FWD\t')){
        const r = ligne.substring(4), i = r.indexOf('\t');
        if(i > 0) for(const j of srv.cibles(r.substring(0, i))) j.lien.envoyer(r.substring(i + 1));
      }
    },
    quitter(lien){
      if(lien.id && joueurs.get(lien.id) && joueurs.get(lien.id).lien === lien){
        joueurs.delete(lien.id);
        srv.changer();
      }
    },
    // getMsgSender : un segment désigne un nœud, « * » tous, « ~id » tous
    // sauf id ; le message va à toutes les feuilles désignées.
    cibles(ch){
      const parts = ch.split('/');
      return [...joueurs.values()].filter(j => {
        const p = [...j.chemin.split('/'), j.id];
        return parts.every((s, k) => s === '*' || (s.startsWith('~') ? p[k] !== s.substring(1) : p[k] === s));
      });
    },
    // ReportContentsThread : LIST puis ROOM_INFO à chacun, après un
    // changement.
    changer(){
      if(minuterie) return;
      minuterie = setTimeout(() => {
        minuterie = null;
        const tous = [...joueurs.values()];
        const liste = 'LIST\t' + tous.map(j => `${j.chemin}/${j.id}=${j.info}`).join('\t');
        const salles = {};
        for(const j of tous){
          const s = j.chemin.split('/')[1];
          if(s !== NET_SALLE_DEFAUT && !salles[s]) salles[s] = _propsEnc({owner: j.id});
        }
        const info = 'ROOM_INFO\t' + _propsEnc(salles);
        for(const j of tous){ j.lien.envoyer(liste); j.lien.envoyer(info); }
      }, 50);
    },
    nb: () => joueurs.size
  };
  return srv;
}

// ── Transports : un message est une ligne de texte.
async function _chargerPeerJS(){
  if(window.Peer) return window.Peer;
  await new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = PEERJS_URL; s.onload = ok;
    s.onerror = () => ko(new Error('bibliothèque PeerJS injoignable'));
    document.head.appendChild(s);
  });
  return window.Peer;
}
const _attendre = (sur, ms, quoi) => new Promise((ok, ko) => {
  const t = setTimeout(() => ko(new Error(quoi)), ms);
  sur((v) => { clearTimeout(t); ok(v); }, e => { clearTimeout(t); ko(e); });
});
const _errPeer = e => new Error(e && e.type === 'peer-unavailable' ? 'salle introuvable — vérifier le code'
  : e && e.type === 'unavailable-id' ? 'ce code de salle est déjà pris'
  : (e && (e.message || e.type)) || 'erreur WebRTC');

async function _hebergerPeer(n, srv){
  const Peer = await _chargerPeerJS();
  const peer = new Peer(NET_PREFIXE + n.code);
  n.fermerTransport = () => peer.destroy();
  await _attendre((ok, ko) => { peer.on('open', ok); peer.on('error', e => ko(_errPeer(e))); },
                  15000, 'serveur de rendez-vous PeerJS injoignable');
  // Coupé du serveur de rendez-vous, l'hôte s'y réinscrit : les joueurs
  // déjà là restent reliés, les nouveaux pourront entrer.
  peer.on('disconnected', () => { if(_net === n && !peer.destroyed) peer.reconnect(); });
  peer.on('connection', conn => {
    const lien = {envoyer: l => { if(conn.open) conn.send(l); }};
    conn.on('data', l => srv.recevoir(lien, l));
    conn.on('close', () => srv.quitter(lien));
    conn.on('error', () => srv.quitter(lien));
  });
}

async function _rejoindrePeer(n){
  const Peer = await _chargerPeerJS();
  const peer = new Peer();
  n.fermerTransport = () => peer.destroy();
  await _attendre((ok, ko) => { peer.on('open', ok); peer.on('error', e => ko(_errPeer(e))); },
                  15000, 'serveur de rendez-vous PeerJS injoignable');
  const conn = peer.connect(NET_PREFIXE + n.code, {reliable: true});
  await _attendre((ok, ko) => { conn.on('open', ok); conn.on('error', ko); peer.on('error', e => ko(_errPeer(e))); },
                  20000, 'salle injoignable');
  conn.on('data', l => _netRecevoir(n, l));
  conn.on('close', () => _netPerdu(n));
  n.envoyer = l => { if(conn.open) conn.send(l); };
}

function _hebergerOnglets(n, srv){
  const bc = new BroadcastChannel(NET_PREFIXE + n.code);
  const liens = new Map();
  bc.onmessage = e => {
    const {de, a, ligne, fin} = e.data || {};
    if(a !== 'serveur' || !de) return;
    let lien = liens.get(de);
    if(!lien){ lien = {envoyer: l => bc.postMessage({a: de, ligne: l})}; liens.set(de, lien); }
    if(fin){ srv.quitter(lien); liens.delete(de); }
    else srv.recevoir(lien, ligne);
  };
  n.fermerTransport = () => { bc.postMessage({a: '*', fin: true}); bc.close(); };
}

function _rejoindreOnglets(n){
  const bc = new BroadcastChannel(NET_PREFIXE + n.code);
  bc.onmessage = e => {
    const {a, ligne, fin} = e.data || {};
    if(a === '*' && fin) _netPerdu(n);
    else if(a === n.moi) _netRecevoir(n, ligne);
  };
  n.envoyer = l => bc.postMessage({de: n.moi, a: 'serveur', ligne: l});
  n.fermerTransport = () => { bc.postMessage({de: n.moi, a: 'serveur', fin: true}); bc.close(); };
}

// ── Le client (NodeClient).
function _nouvelleConnexion(hote, moyen, code, salle){
  return {hote, moyen, code, salleVoulue: salle, moi: 'p' + Math.random().toString(36).substring(2, 10),
          salle: null, joueurs: [], proprios: {}, attente: null, dernierSync: 0,
          envoi: Promise.resolve(), reception: Promise.resolve(), tampon: null,
          envoyer: () => {}, fermerTransport: () => {}};
}

function _codeSalle(){
  const a = 'abcdefghjkmnpqrstuvwxyz23456789', t = new Uint8Array(6);
  crypto.getRandomValues(t);
  return [...t].map(x => a[x % a.length]).join('');
}

async function heberger(moyen, salle){
  if(_net) netQuitter();
  const n = _nouvelleConnexion(true, moyen, _codeSalle(), _nomSalle(salle) || 'Partie de ' + joueur());
  const srv = creerServeur();
  n.serveur = srv;
  _net = n;
  try {
    if(moyen === 'onglets') _hebergerOnglets(n, srv); else await _hebergerPeer(n, srv);
  } catch(e){ _netEchec(n, e); throw e; }
  // Le client de l'hôte parle à son serveur sans réseau, mais pas dans le
  // même tour, comme à travers une socket.
  const lien = {envoyer: l => setTimeout(() => _netRecevoir(n, l))};
  n.envoyer = l => setTimeout(() => srv.recevoir(lien, l));
  _netInscrire(n);
  _netRejoindreSalle(n, n.salleVoulue);
  chatLog(`🌐 Salle « ${n.salleVoulue} » ouverte — code ${n.code} (${moyen === 'onglets' ? 'onglets de ce navigateur' : 'Internet'})`);
  majNet();
  return n.code;
}

async function rejoindre(moyen, code){
  code = String(code || '').trim().toLowerCase().replace(/^aslweb-/, '');
  if(!/^[a-z0-9]{4,16}$/.test(code)) throw new Error('code de salle invalide');
  if(_net) netQuitter();
  const n = _nouvelleConnexion(false, moyen, code, null);
  _net = n;
  try {
    if(moyen === 'onglets') _rejoindreOnglets(n); else await _rejoindrePeer(n);
  } catch(e){ _netEchec(n, e); throw e; }
  _netInscrire(n);
  chatLog(`🌐 Connexion à la salle ${code}…`);
  // Sans LIST du serveur, personne n'héberge ce code.
  setTimeout(() => {
    if(_net === n && !n.joueurs.length){ chatLog('❌ Aucune réponse : salle fermée ou code erroné'); netQuitter(); }
  }, 8000);
  majNet();
}

function _netEchec(n, e){
  if(_net === n) _net = null;
  try { n.fermerTransport(); } catch(err){}
  chatLog('❌ Réseau : ' + (e && e.message ? e.message : e));
  majNet();
}

function netQuitter(){
  const n = _net;
  if(!n) return;
  _net = null;
  try { n.fermerTransport(); } catch(e){}
  chatLog(n.hote ? '🔌 Salle fermée' : '🔌 Déconnecté de la salle');
  majNet();
}

function _netPerdu(n){
  if(_net !== n) return;
  _net = null;
  try { n.fermerTransport(); } catch(e){}
  chatLog('🔌 Connexion perdue : l\'hôte a fermé la salle');
  majNet();
}

// Les lignes partent dans l'ordre, même quand une compression les retarde.
function _netLigne(n, ligne){
  n.envoi = n.envoi.then(async () => {
    if(typeof ligne === 'function') ligne = await ligne();
    if(_net === n) n.envoyer(ligne);
  }).catch(e => console.error(e));
}
function _netForward(n, chemin, msg){
  _netLigne(n, async () => 'FWD\t' + chemin + '\t'
    + (msg.length > NET_ZIP_SEUIL ? NET_ZIP + await _netZip(msg) : msg));
}
const _netSalleCourante = n => n && n.salle && n.salle !== NET_SALLE_DEFAUT ? n.salle : null;
// sendToOthers : toute la salle, sauf soi.
function _netAuxAutres(n, msg){
  const s = _netSalleCourante(n);
  if(s) _netForward(n, `${NET_MODULE}/${s}/~${n.moi}`, msg);
}
// sendTo : un joueur, où qu'il soit.
const _netA = (n, id, msg) => _netForward(n, `${NET_MODULE}/*/${id}`, msg);

function _netInscrire(n){
  _netLigne(n, `REG\t${n.moi}\t${NET_MODULE}/${NET_SALLE_DEFAUT}\t${_netInfo(n)}`);
}
// setRoom : JOIN ; si l'on n'y est pas le premier, la synchronisation
// attend la LIST qui confirme l'arrivée.
function _netRejoindreSalle(n, salle){
  _netLigne(n, `JOIN\t${NET_MODULE}/${salle}`);
  const occupee = n.joueurs.some(j => j.salle === salle && j.id !== n.moi);
  if(occupee){ n.attente = salle; chatLog('🔄 Synchronisation en attente…'); }
}
// Nouveau nom (seConnecter) : STATS, comme setUserInfo.
function _netMajInfo(){
  if(_net) _netLigne(_net, 'STATS\t' + _netInfo(_net));
}

function _netRecevoir(n, ligne){
  if(typeof ligne !== 'string') return;
  n.reception = n.reception.then(() => _netTraiter(n, ligne)).catch(e => {
    console.error(e); chatLog('❌ Réseau : ' + (e && e.message ? e.message : e));
  });
}

async function _netTraiter(n, ligne){
  if(_net !== n) return;
  if(ligne.startsWith('LIST\t')){ _netListe(n, ligne.substring(5)); return; }
  if(ligne.startsWith('ROOM_INFO\t')){
    const s = _propsDec(ligne.substring(10));
    n.proprios = {};
    for(const k in s) n.proprios[k] = _propsDec(s[k]).owner;
    majNet();
    return;
  }
  if(ligne.startsWith('REG_REQUEST')){ _netInscrire(n); return; }
  if(ligne.startsWith(NET_ZIP)) ligne = await _netDezip(ligne.substring(NET_ZIP.length));
  // Commandes du module (CommandDecoder).
  if(ligne.startsWith('SYNC')) _netRepondreSync(n, _propsDec(ligne.substring(4)));
  else if(ligne.startsWith('begin_save')) await _netRestaurer(n, ligne);
  else _netAppliquer(ligne);
}

function _netListe(n, corps){
  const avant = new Map(n.joueurs.map(j => [j.id, j]));
  n.joueurs = [];
  for(const e of corps ? corps.split('\t') : []){
    const i = e.indexOf('=');
    const ch = (i < 0 ? e : e.substring(0, i)).split('/');
    if(ch[0] !== NET_MODULE || ch.length < 3) continue;
    n.joueurs.push({..._propsDec(i < 0 ? '' : e.substring(i + 1)), salle: ch[1], id: ch[2]});
  }
  const moi = n.joueurs.find(j => j.id === n.moi);
  n.salle = moi ? moi.salle : null;
  // Arrivées et départs dans ma salle.
  const s = _netSalleCourante(n);
  if(s){
    for(const j of n.joueurs)
      if(j.id !== n.moi && j.salle === s && (!avant.has(j.id) || avant.get(j.id).salle !== s)) chatLog(`🔌 ${j.name || j.id} est dans la salle`);
    for(const [id, j] of avant)
      if(id !== n.moi && j.salle === s && !n.joueurs.some(x => x.id === id && x.salle === s)) chatLog(`🔌 ${j.name || id} a quitté la salle`);
  }
  if(n.attente && n.salle === n.attente){
    // Arrivé : SYNC au propriétaire, le premier occupant.
    const salle = n.attente;
    n.attente = null;
    const proprio = n.joueurs.find(j => j.salle === salle);
    if(proprio && proprio.id !== n.moi){
      netSynchroniser(proprio);
      const msg = `* ${joueur()} rejoint la salle « ${salle} »`;
      afficherChat(msg);
      _netAuxAutres(n, 'CHAT' + msg.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'));
    }
  } else if(!n.hote && !n.attente && n.salle === NET_SALLE_DEFAUT){
    // Invité : il entre dans la salle de l'hôte.
    const cible = n.joueurs.find(j => j.salle !== NET_SALLE_DEFAUT);
    if(cible) _netRejoindreSalle(n, cible.salle);
  }
  majNet();
}

const _netProprio = n => {
  const s = _netSalleCourante(n);
  return s ? (n.proprios[s] || (n.joueurs.find(j => j.salle === s) || {}).id) : null;
};
const netProprietaire = () => !_net || !_netSalleCourante(_net) || _netProprio(_net) === _net.moi;

// SynchAction : pas deux demandes à la même salle en moins de 15 s.
function netSynchroniser(cible){
  const n = _net;
  if(!n) return false;
  cible = cible || n.joueurs.find(j => j.id === _netProprio(n));
  if(!cible || cible.id === n.moi) return false;
  const t = Date.now();
  if(t - n.dernierSync < NET_SYNC_TROP_TOT){ chatLog('⏳ Synchronisation demandée il y a moins de 15 s'); return false; }
  n.dernierSync = t;
  _netA(n, cible.id, 'SYNC' + _netInfo(n));
  chatLog(`🔄 Synchronisation demandée à ${cible.name || cible.id}`);
  return true;
}

// SynchCommand : l'état complet de la partie, au seul demandeur.
function _netRepondreSync(n, dem){
  if(!dem.id) return;
  if(!_source){ chatLog(`⚠️ ${dem.name || dem.id} demande la partie : aucune n'est ouverte ici`); return; }
  chatLog(`📤 Envoi de la partie à ${dem.name || dem.id}`);
  _netA(n, dem.id, etatPartie().join('\x1b'));
}

// Le propriétaire qui ouvre une partie l'envoie aux occupants de la salle.
function netPartieChargee(){
  const n = _net;
  if(!n || !_source || !_netSalleCourante(n) || !netProprietaire()) return;
  const autres = n.joueurs.filter(j => j.salle === n.salle && j.id !== n.moi);
  if(!autres.length) return;
  chatLog(`📤 Partie envoyée à ${autres.map(j => j.name || j.id).join(', ')}`);
  _netAuxAutres(n, etatPartie().join('\x1b'));
}

async function _netRestaurer(n, texte){
  chatLog('📥 Partie reçue de la salle');
  if(!await chargerPartie(texte, n.salle || 'salle', new Map())) return;
  n.synchro = true;
  chatLog('✅ Synchronisation terminée');
  majNet();
  // Un joueur du fichier se fait reconnaître pour voir ses pions masqués.
  if(!_utilisateur && !_admin) demanderUtilisateur();
}

// Coup reçu : exécuté, consigné, puis montré comme une relecture.
function _netAppliquer(texte){
  const segs = texte.split('\x1b').filter(s => s);
  if(!segs.length) return;
  _avantAction();
  const photo = _photo();
  _netReception = true;
  try {
    rejouerLog(segs);
    segs.forEach(_logCmd);
  } finally { _netReception = false; }
  rendreToutes();
  if(_pileSel) afficherPile();
  signalerCoup(photo);
}

// Coup joué ici : ses commandes, nées d'une même action, partent en une
// commande composée, comme GameModule.encode.
function _netCoup(c){
  const n = _net;
  if(!n || _netReception || !_netSalleCourante(n)) return;
  if(!n.tampon){
    n.tampon = [];
    setTimeout(() => {
      const l = n.tampon;
      n.tampon = null;
      if(_net === n && l.length) _netAuxAutres(n, l.length > 1 ? l.map(x => '\x1b' + x).join('') : l[0]);
    }, 0);
  }
  n.tampon.push(c);
}

function majNet(){
  rafraichirActions(['reseau']);
  const f = document.getElementById('fenUtil');
  if(f && f.dataset.net) ouvrirReseau();
}

// ── Fenêtre « Partie à distance ».
function ouvrirReseau(){
  const ancien = document.getElementById('fenUtil');
  const garde = ancien && ancien.dataset.net ? {moyen: (ancien.querySelector('#nwMoyen') || {}).value,
    salle: (ancien.querySelector('#nwSalle') || {}).value, code: (ancien.querySelector('#nwCode') || {}).value} : {};
  fermerFenetres();
  const n = _net;
  const w = document.createElement('div');
  w.id = 'fenUtil'; w.className = 'fenetre'; w.dataset.net = '1';
  const qui = _esc(joueur() === 'web' ? 'Observateur' : joueur());
  if(!n){
    w.innerHTML = `
      <div class="ft">Partie à distance</div>
      <div class="fc">
        <p>Comme le serveur de VASSAL : l'hôte ouvre une salle et donne son code ; qui la
          rejoint reçoit la partie du propriétaire, puis chaque coup joué part chez les autres.</p>
        <p>Vous jouez sous le nom <b>${qui}</b>.</p>
        <label>Liaison<select id="nwMoyen">
          <option value="internet">Internet (WebRTC, d'un poste à l'autre)</option>
          <option value="onglets">Onglets de ce navigateur</option></select></label>
        <label>Nom de la salle (pour héberger)<input id="nwSalle" maxlength="40" autocomplete="off"
          value="${_esc(garde.salle || (_source ? _nomFichier : 'Partie de ' + joueur()))}"></label>
        <label>Code de la salle (pour rejoindre)<input id="nwCode" maxlength="16" autocomplete="off"
          placeholder="ex. k7m2qa" value="${_esc(garde.code || '')}"></label>
        <div class="ferr" id="nwErr"></div>
        <div class="fb">
          <button id="nwHeberger" class="prim">Héberger</button>
          <button id="nwRejoindre">Rejoindre</button>
          <button id="nwIdent">Identification…</button>
          <button id="nwFermer">Fermer</button>
        </div>
        <p class="fnote">Internet : la mise en relation passe par le serveur public de PeerJS, puis
          les postes échangent directement. L'hôte doit garder sa page ouverte : elle tient lieu
          de serveur.</p>
      </div>`;
  } else {
    const s = _netSalleCourante(n), proprio = _netProprio(n);
    const lignes = n.joueurs.filter(j => !s || j.salle === s);
    w.innerHTML = `
      <div class="ft">Partie à distance</div>
      <div class="fc">
        <p>${s ? `Salle <b>${_esc(s)}</b>` : 'Connexion en cours…'} — code
          <b id="nwCodeAff" style="font-family:monospace;font-size:15px">${_esc(n.code)}</b>
          <button id="nwCopier" class="petit">Copier</button>
          <br>${n.moyen === 'onglets' ? 'Onglets de ce navigateur' : 'Internet (WebRTC)'}${n.hote ? ', vous hébergez' : ''}.</p>
        <table><tr><th>Joueur</th><th></th></tr>
          ${lignes.map(j => `<tr><td>${_esc(j.name || j.id)}${j.id === n.moi ? ' <b>(vous)</b>' : ''}</td>
            <td>${j.id === proprio ? 'propriétaire' : ''}</td></tr>`).join('')
            || '<tr><td colspan="2"><i>En attente du serveur…</i></td></tr>'}</table>
        <div class="ferr" id="nwErr"></div>
        <div class="fb">
          ${s && proprio !== n.moi ? '<button id="nwSync" class="prim">Synchroniser</button>' : ''}
          <button id="nwQuitter">${n.hote ? 'Fermer la salle' : 'Quitter la salle'}</button>
          <button id="nwFermer">Fermer</button>
        </div>
        <p class="fnote">${n.hote ? 'Donner le code à l\'adversaire. Fermer cette page ferme la salle.'
          : 'Synchroniser redemande l\'état de la partie au propriétaire de la salle.'}</p>
      </div>`;
  }
  document.body.appendChild(w);
  const $ = id => document.getElementById(id);
  $('nwFermer').onclick = () => w.remove();
  const err = $('nwErr');
  const tenter = async f => {
    err.textContent = '';
    w.querySelectorAll('button').forEach(b => b.disabled = true);
    try { await f(); } catch(e){ err.textContent = e && e.message ? e.message : String(e); }
    if(w.isConnected) w.querySelectorAll('button').forEach(b => b.disabled = false);
  };
  if(!n){
    if(garde.moyen) $('nwMoyen').value = garde.moyen;
    $('nwHeberger').onclick = () => tenter(() => heberger($('nwMoyen').value, $('nwSalle').value));
    $('nwRejoindre').onclick = () => tenter(() => {
      if(!$('nwCode').value.trim()){ $('nwCode').focus(); throw new Error('Saisir le code donné par l\'hôte.'); }
      return rejoindre($('nwMoyen').value, $('nwCode').value);
    });
    $('nwIdent').onclick = () => demanderUtilisateur();
    $('nwCode').addEventListener('keydown', e => { if(e.key === 'Enter') $('nwRejoindre').click(); });
  } else {
    $('nwQuitter').onclick = () => { netQuitter(); w.remove(); };
    $('nwCopier').onclick = () => {
      try { navigator.clipboard.writeText(n.code).then(() => { err.textContent = ''; $('nwCopier').textContent = 'Copié'; }); }
      catch(e){ err.textContent = 'Copie impossible : noter le code.'; }
    };
    if($('nwSync')) $('nwSync').onclick = () => { if(!netSynchroniser()) err.textContent = 'Synchronisation impossible pour l\'instant.'; };
  }
}

// ═══════════════════════════════════════════════════════════════
// EXPORT .vsav ET .vlog
// On repart des segments du fichier chargé : seules changent les
// positions, les piles de la carte de jeu, les pions retirés et ceux
// posés depuis la palette. Tout le reste — boards, autres fenêtres,
// options — est réécrit mot pour mot.
// ═══════════════════════════════════════════════════════════════
// Enregistrement du log, comme BasicLogger de VASSAL : « Begin Logfile »
// fige l'état de la partie et choisit le fichier ; chaque coup joué, reçu
// d'un autre joueur ou relu d'un .vlog s'y ajoute ; « End Logfile »
// écrit l'état de départ suivi des coups.
let _logEnr = null;       // commandes du log en cours ; null : pas de log
let _logDepart = null;    // état de la partie au début du log
let _logNom = null;       // fichier choisi au début du log

// Toutes les commandes nées d'une même action du joueur — le même tour de
// boucle d'événements — forment un coup, écrit en une seule entrée LOG
// composée, comme le fait VASSAL.
let _logGroupes = [], _actionNo = 0, _actionOuverte = false;
function _logCmd(c){
  if(_net) _netCoup(c);
  if(!_actionOuverte){
    _actionNo++; _actionOuverte = true;
    setTimeout(() => { _actionOuverte = false; }, 0);
  }
  _histoCmd(c);
  if(!_logEnr) return;
  _logEnr.push(c);
  _logGroupes.push(_actionNo);
  majBoutons();
}
const _nbActions = () => new Set(_logGroupes).size;

const enregistreLog = () => _logEnr !== null;
function basculerLog(){ return enregistreLog() ? terminerLog() : commencerLog(); }

// beginOutput : le nom du fichier d'abord (getSaveFile), puis l'état de
// la partie, figé à cet instant.
function commencerLog(){
  if(enregistreLog()) return false;
  if(!_source){ chatLog('⚠️ Ouvrir d\'abord une partie : le log part d\'un état que VASL sache relire.'); return false; }
  _fenetreLog('Commencer un fichier de log', `
      <label>Nom du fichier<input id="lgNom" autocomplete="off" value="${_esc(_nomExport('vlog'))}"></label>
      <div class="fb"><button id="lgOk" class="prim">Commencer</button><button id="lgAnnul">Annuler</button></div>
      <p class="fnote">Les coups joués, reçus ou relus à partir de cette position y seront
        enregistrés ; « Log » à nouveau termine le fichier et l'écrit.</p>`, w => {
    const inp = w.querySelector('#lgNom');
    const ok = () => {
      let nom = inp.value.trim().replace(/[\\/:*?"<>|]/g, '_');
      if(!nom) return;
      if(!/\.vlog$/i.test(nom)) nom += '.vlog';
      w.remove();
      _logNom = nom;
      _logEnr = []; _logGroupes = [];
      _logDepart = etatPartie();
      // beginOutput vide aussi logOutput : on n'annule pas en deçà du log.
      _histo = []; majUndo();
      chatLog(`⏺️ Enregistrement du log commencé : ${nom}`);
      majBoutons();
    };
    w.querySelector('#lgOk').onclick = ok;
    w.querySelector('#lgAnnul').onclick = () => w.remove();
    inp.addEventListener('keydown', e => { if(e.key === 'Enter') ok(); if(e.key === 'Escape') w.remove(); });
    inp.focus(); inp.select();
  });
  return true;
}

// endLogAction : write() n'écrit rien si aucun coup n'a été enregistré.
function terminerLog(){
  if(!enregistreLog()) return false;
  if(_logEnr.length) ecrireVlog();
  else chatLog('⏹️ Log terminé : aucun coup enregistré, aucun fichier écrit');
  _logEnr = null; _logDepart = null; _logNom = null; _logGroupes = [];
  _garderLog();
  majBoutons();
  return true;
}

// BasicLogger.setup(false) : la partie se ferme, un log en cours peut
// encore être écrit.
function fermerLog(){
  if(!enregistreLog()) return;
  if(_logEnr.length && confirm(T(`Le log « ${_logNom} » n'est pas écrit (${_nbActions()} coup(s)). L'écrire maintenant ?`)))
    ecrireVlog();
  _logEnr = null; _logDepart = null; _logNom = null; _logGroupes = [];
  _garderLog();
  const f = document.getElementById('fenLog');
  if(f) f.remove();
  majBoutons();
}

// Safari iOS ignore beforeunload et ferme sans prévenir un onglet laissé
// en arrière-plan : dès que la page se cache, le log pas encore écrit est
// mis de côté, puis proposé au chargement suivant.
const CLE_LOG_SECOURS = 'aslweb.logSecours';
const _versB64 = o => { let b = ''; for(let i = 0; i < o.length; i += 0x8000) b += String.fromCharCode(...o.subarray(i, i + 0x8000)); return btoa(b); };
const _deB64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
function _garderLog(){
  try {
    if(!_logEnr || !_logEnr.length || !_logDepart){ localStorage.removeItem(CLE_LOG_SECOURS); return; }
    localStorage.setItem(CLE_LOG_SECOURS, JSON.stringify({nom: _logNom, depart: _logDepart, enr: _logEnr,
      groupes: _logGroupes, annexes: [..._annexes].map(([n, d]) => [n, _versB64(d)])}));
  } catch(e){
    // Trop gros pour le stockage : pas de copie périmée non plus.
    try { localStorage.removeItem(CLE_LOG_SECOURS); } catch(e2){}
  }
}
function _reprendreLogGarde(){
  let g = null;
  try { g = JSON.parse(localStorage.getItem(CLE_LOG_SECOURS)); localStorage.removeItem(CLE_LOG_SECOURS); } catch(e){}
  if(!g || !Array.isArray(g.enr) || !g.enr.length || !Array.isArray(g.depart)) return;
  const n = new Set(g.groupes).size;
  if(!confirm(T(`Le log « ${g.nom} » n'a pas été écrit avant la fermeture de la page (${n} coup(s)). L'écrire maintenant ?`))) return;
  ecrireVlog({enr: g.enr, groupes: g.groupes || [], depart: g.depart, nom: g.nom,
              annexes: new Map((g.annexes || []).map(([k, t]) => [k, _deB64(t)]))});
}

// queryNewLogFile : à l'ouverture d'une partie et à la fin d'une
// relecture, VASSAL propose un nouveau log, sauf si l'on a choisi de
// ne plus être interrogé (préférences PromptNewLogAtStart et
// PromptNewLogEnd).
const CLE_LOG_DEBUT = 'aslweb.PromptNewLogAtStart', CLE_LOG_FIN = 'aslweb.PromptNewLogEnd';
function proposerLog(auDebut){
  if(enregistreLog() || !_source) return;
  const cle = auDebut ? CLE_LOG_DEBUT : CLE_LOG_FIN;
  if(_lireLocal(cle, '1') !== '1') return;
  const quoi = auDebut ? (_etapes.length ? 'La relecture commence.' : 'Partie ouverte.') : 'Relecture terminée.';
  _fenetreLog('Fichier de log', `
      <p>${quoi} Commencer un nouveau fichier de log ?</p>
      <div class="fb"><button id="lgOui" class="prim">Oui</button><button id="lgNon">Non</button>
        <button id="lgJamais">Ne plus demander</button></div>`, w => {
    w.querySelector('#lgOui').onclick = () => { w.remove(); commencerLog(); };
    w.querySelector('#lgNon').onclick = () => w.remove();
    w.querySelector('#lgJamais').onclick = () => { _ecrireLocal(cle, '0'); w.remove(); };
    w.querySelector('#lgOui').focus();
  });
}

function _fenetreLog(titre, corps, brancher){
  const ancien = document.getElementById('fenLog');
  if(ancien) ancien.remove();
  const w = document.createElement('div');
  w.id = 'fenLog'; w.className = 'fenetre';
  w.innerHTML = `<div class="ft">${_esc(titre)}</div><div class="fc">${corps}</div>`;
  document.body.appendChild(w);
  brancher(w);
}

function majBoutons(){ rafraichirActions(['vsav', 'log', 'logTxt']); }

// Piles de la carte de jeu, d'après l'état courant. VASL écrit aussi les
// piles d'un seul pion. La couche (@@n) est celle de la pièce du fond
// dans le fichier d'origine, -1 (« non liée ») sinon.
function _segmentsPiles(){
  const out = [];
  let n = 0;
  // Une pièce qui ne s'empile pas n'appartient à aucune pile VASSAL.
  for(const k of new Set(vivants().filter(p => !p.seul).map(cle))){
    const s = pile(k);
    let couche = -1;
    for(const p of s) if(_coucheParUid.has(p.uid)){ couche = _coucheParUid.get(p.uid); break; }
    out.push(`+/w${Date.now()}${++n}/stack/${_carteJeu};${s[0].x};${s[0].y};`
             + s.map(p => p.uid).join(';') + `;@@${couche}`);
  }
  return out;
}

function etatPartie(){
  const parUidMap = new Map(pions.map(p => [p.uid, p]));
  const sortie = [], connus = new Set();
  for(const seg of _source){
    if(/^\+\/[^/]+\/stack\//.test(seg)){
      const mc = seg.replace(/\\/g, '').match(/\/stack\/([^;]+);/);
      if(mc && mc[1] === _carteJeu) continue;          // régénérée
      sortie.push(seg); continue;
    }
    if(seg.startsWith('INFO\t')){ sortie.push('INFO\t' + _infoEtat); continue; }
    if(_CMD_LIEN.test(seg.replace(/\\+$/, ''))) continue;          // régénérés
    const m = seg.match(/^\+\/([^/]+)\//);
    const p = m && parUidMap.get(m[1]);
    if(!p){ sortie.push(seg); continue; }
    connus.add(p.uid);
    if(!p.deleted || p.ailleurs) sortie.push(p.seg);
  }
  // Pions posés ou créés par le log : avant la fin de sauvegarde.
  const neufs = pions.filter(p => (!p.deleted || p.ailleurs) && !connus.has(p.uid)).map(p => p.seg);
  const ajout = [...neufs, ..._segmentsPiles(), ...segmentsLiens()];
  // SAN saisis ici alors que le fichier n'avait pas d'informations de scénario.
  if(_infoModifiee && !_source.some(x => x.startsWith('INFO\t'))) ajout.push('INFO\t' + _infoEtat);
  const iFin = sortie.lastIndexOf('end_save');
  if(iFin >= 0) sortie.splice(iFin, 0, ...ajout); else sortie.push(...ajout);
  return sortie;
}

// Comme VASSAL, les entrées de l'archive sont comprimées : le savedGame
// obfusqué (hexadécimal) y perd plus de 90 % de sa taille.
async function _telecharger(texte, nom, annexes = _annexes){
  const files = new Map([['savedGame', await _deflate(_vcskEncode(texte))]]);
  for(const [n, d] of annexes) files.set(n, await _deflate(d));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(_zipWrite(files));
  a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  // Safari iOS demande d'abord s'il faut télécharger : l'URL doit vivre
  // le temps qu'on réponde.
  setTimeout(() => URL.revokeObjectURL(a.href), 120000);
}

function _nomExport(ext){
  const d = new Date();
  const j = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  return `${_nomFichier}_${j}.${ext}`;
}

function ecrireVsav(){
  if(!_source) return false;
  _telecharger(etatPartie().join('\x1b'), _nomExport('vsav'));
  chatLog(`💾 .vsav écrit : ${vivants().length} pion(s) sur « ${_carteJeu} »`);
  return true;
}

// BasicLogger : état de départ, puis « LOG\t<commande> » par action.
function ecrireVlog(log = {enr: _logEnr, groupes: _logGroupes, depart: _logDepart, nom: _logNom, annexes: _annexes}){
  if(!log.enr || !log.enr.length || !log.depart) return false;
  // BasicLogger.write : chaque coup devient une LogCommand, dont chaque
  // sous-commande est elle-même une LogCommand. GameModule.encode écrit
  // donc « LOG\t<c1> ESC LOG\t<c2> … », et ces ESC, imbriqués dans la
  // sauvegarde, prennent une contre-oblique (SequenceEncoder). Sans le
  // « LOG\t » de chaque sous-commande, VASSAL les exécute au chargement
  // au lieu d'en faire un coup à relire.
  // SequenceEncoder.append met entre apostrophes un jeton qui finit par
  // une contre-oblique (l'état d'un pion VASL, « …;OldMap;Main Map\ ») :
  // sans elles, elle échapperait l'ESC qui le suit, et le coup suivant se
  // fondrait dans celui-ci à la relecture.
  const jeton = t => {
    const e = t.replace(/\x1b/g, '\\\x1b');
    return t.endsWith('\\') || (t.startsWith("'") && t.endsWith("'")) ? `'${e}'` : e;
  };
  const entrees = [];
  log.enr.forEach((c, i) => {
    if(i && log.groupes[i] === log.groupes[i - 1]) entrees[entrees.length - 1].push(c);
    else entrees.push([c]);
  });
  const lignes = entrees.map(l => jeton(l.map(c => jeton('LOG\t' + c)).join('\x1b')));
  _telecharger([...log.depart, ...lignes].join('\x1b'), log.nom || _nomExport('vlog'), log.annexes);
  chatLog(`📼 Log écrit : ${log.nom} — ${entrees.length} coup(s), ${log.enr.length} commande(s)`);
  return true;
}

// ObfuscatingOutputStream : « !VCSK » + clé, puis les octets XOR-és en
// hexadécimal minuscule, comme VASSAL.
function _vcskEncode(texte){
  const octets = new TextEncoder().encode(texte);
  const k = 1 + Math.floor(Math.random() * 254);
  const h = new Array(octets.length);
  for(let i = 0; i < octets.length; i++) h[i] = ((octets[i] ^ k) & 0xFF).toString(16).padStart(2, '0');
  return new TextEncoder().encode('!VCSK' + k.toString(16).padStart(2, '0') + h.join(''));
}

// ── Écriture ZIP en méthode STORED : format valide, lisible par VASSAL.
let _crcTable = null;
function _crc32(bytes){
  if(!_crcTable){
    _crcTable = new Uint32Array(256);
    for(let i = 0; i < 256; i++){
      let c = i;
      for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      _crcTable[i] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for(let i = 0; i < bytes.length; i++) crc = _crcTable[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

// Entrée d'archive comprimée (deflate) : {brut, comp} pour _zipWrite ;
// sans CompressionStream, l'entrée reste brute (stockée).
async function _deflate(brut){
  if(typeof CompressionStream === 'undefined') return brut;
  const st = new Blob([brut]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return {brut, comp: new Uint8Array(await new Response(st).arrayBuffer())};
}

function _zipWrite(files){
  const enc = new TextEncoder();
  const locals = [], centrals = [];
  let offset = 0;
  // Date et heure MS-DOS de l'écriture.
  const t = new Date();
  const heure = (t.getHours() << 11) | (t.getMinutes() << 5) | (t.getSeconds() >> 1);
  const jour = ((t.getFullYear() - 1980) << 9) | ((t.getMonth() + 1) << 5) | t.getDate();
  for(const [name, f] of files){
    // Une entrée {brut, comp} est déjà comprimée (deflate) : méthode 8.
    const data = f.comp || f, brut = f.brut || f, methode = f.comp ? 8 : 0;
    const nb = enc.encode(name), crc = _crc32(brut), size = data.length, usize = brut.length;
    const lh = new Uint8Array(30 + nb.length), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(8, methode, true);
    lv.setUint16(10, heure, true); lv.setUint16(12, jour, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, size, true); lv.setUint32(22, usize, true);
    lv.setUint16(26, nb.length, true);
    lh.set(nb, 30);
    locals.push(lh, data);
    const cd = new Uint8Array(46 + nb.length), cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(10, methode, true);
    cv.setUint16(12, heure, true); cv.setUint16(14, jour, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, size, true); cv.setUint32(24, usize, true);
    cv.setUint16(28, nb.length, true); cv.setUint32(42, offset, true);
    cd.set(nb, 46);
    centrals.push(cd);
    offset += lh.length + size;
  }
  let cdSize = 0;
  for(const c of centrals) cdSize += c.length;
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.size, true); ev.setUint16(10, files.size, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
  return new Blob([...locals, ...centrals, eo], {type: 'application/octet-stream'});
}

// ═══════════════════════════════════════════════════════════════
// INTERFACE — PROFILS DE TERMINAL ET REGISTRE D'ACTIONS
// Toute action de l'interface est déclarée une seule fois (ACTIONS) ;
// chaque profil (PC, tablette, téléphone) dit où l'afficher
// (DISPOSITIONS). rafraichirActions() met à jour tout élément qui porte
// data-action : libellé, raccourci, état actif, allumé, coché, visible.
// Les raccourcis clavier ne passent pas par ce registre : leurs écouteurs
// restent ceux de leur section ; « touche » ne sert qu'à l'affichage.
// ═══════════════════════════════════════════════════════════════
const _v = f => typeof f === 'function' ? f() : f;

// Dés : catégories et raccourcis d'ASLDiceBot (voir _brancherDes).
const DES = [
  {id: 'DR_Other', lib: 'DR', titre: 'DR', touche: 'F2', faire: () => lancerDR('Other')},
  {id: 'DR_IFT', lib: 'IFT', titre: 'IFT attack DR', touche: 'Ctrl+Maj+I', faire: () => lancerDR('IFT')},
  {id: 'DR_TH', lib: 'TH', titre: 'To Hit DR', touche: 'Ctrl+Maj+H', faire: () => lancerDR('TH')},
  {id: 'DR_TK', lib: 'TK', titre: 'To Kill DR', touche: 'Ctrl+Maj+K', faire: () => lancerDR('TK')},

// ── Rendu d'une action, sous la forme demandée :
//   'icone'   bouton de barre (icône, et texte pour l'utilisateur, le réseau)
//   'bouton'  bouton à libellé court (dés, rail)
//   'menu'    entrée de menu déroulant, raccourci à droite
//   'ligne'   entrée de feuille ou de liste, en grand
function rendreAction(id, forme = 'icone'){
  const a = ACTIONS[id];
  if(!a) return document.createTextNode('');
  if(a.groupe){
    const g = document.createElement('span');
    g.className = 'groupeAct';
    g.dataset.action = id;
    for(const x of a.groupe) g.appendChild(rendreAction(x, forme === 'menu' ? 'icone' : forme));
    return g;
  }
  if(a.etiquette){
    const e = document.createElement('span');
    e.className = 'etiqAct ' + (a.classe || '');
    e.dataset.action = id;
    return e;
  }
  const menu = forme === 'menu';
  const el = document.createElement(menu ? 'div' : 'button');
  el.dataset.action = id;
  el.dataset.forme = forme;
  if(menu){
    el.className = 'it';
    el.setAttribute('role', a.coche ? 'menuitemcheckbox' : 'menuitem');
    el.tabIndex = -1;
    el.innerHTML = '<span class="ck"></span><span class="lb"></span><span class="rc"></span>';
  } else {
    el.type = 'button';
    el.className = 'act ' + forme + (a.de ? ' de' : '') + (a.lettre ? ' lettre' : '');
    if(a.pion && forme !== 'bouton'){
      el.appendChild(iconePion(a.pion === true ? undefined : a.pion));
    } else if(a.img){
      const im = document.createElement('img');
      im.alt = '';
      el.appendChild(im);
    } else if(a.ico && forme !== 'bouton'){
      const i = document.createElement('span');
      i.className = 'ic'; i.setAttribute('aria-hidden', 'true');
      i.textContent = a.ico;
      el.appendChild(i);
    }
    const t = document.createElement('span');
    t.className = 'lb';
    el.appendChild(t);
    if(forme === 'ligne'){ const rc = document.createElement('span'); rc.className = 'rc'; el.appendChild(rc); }
  }
  el.addEventListener('click', e => {
    if(el.classList.contains('off') || el.disabled) return;
    e.stopPropagation();
    if(el._long){ el._long = false; return; }
    if(menu) fermerDeroulants();
    executerAction(id, e.currentTarget, e);
  });
  if(a.menuLong && !menu) el.addEventListener('pointerdown', e => {
    if(e.pointerType === 'mouse') return;
    const t = setTimeout(() => { el._long = true; vibrer(); ouvrirFeuilleActions(_v(a.lib), a.menuLong); }, APPUI_LONG);
    const fin = () => { clearTimeout(t); el.removeEventListener('pointerup', fin); el.removeEventListener('pointercancel', fin); el.removeEventListener('pointerleave', fin); };
    el.addEventListener('pointerup', fin); el.addEventListener('pointercancel', fin); el.addEventListener('pointerleave', fin);
  });
  if(id === 'los') el.addEventListener('contextmenu', e => {
    // Clic droit sur le bouton LOS : Verbose LOS mode, comme VASL.
    if(_dernierPointeur !== 'mouse') return;
    e.preventDefault(); basculerVerbeux(); rafraichirActions(['verbeux']);
  });
  _majAction(el, a, id);
  return el;
}

// ── Icône des pions : le chef 10-3 de l'OB « Other UNC (Korea) » de la
// palette VASL (gpid 3b5:8394, prototype unLDR1(KFW)), son label Name
// réglé sur « Monclar ». Composée une fois, comme une vignette de la
// palette, puis copiée ; en attendant la base, le signe ♟. Une action
// peut donner son propre pion (« pion: {gpid} ») : le North de la vue
// Carte.
const ICONE_PION = {gpid: '3b5:8394', nom: 'Monclar'};
const ICONE_NORTH = {gpid: '291', ico: '🗺'};
const _modelesIconePion = new Map();     // gpid → Promise<modèle | null>
function _composerIconePion(spec = ICONE_PION){
  if(!_modelesIconePion.has(spec.gpid)) _modelesIconePion.set(spec.gpid, chargerBDD().then(async bdd => {
    const x = bdd.parGpid.get(spec.gpid);
    const def = x && developperDefinition(x.cmd);
    if(!def) return null;
    const i = def.T.findIndex(t => /^label;/.test(t) && t.split(';')[2] === 'Name');
    if(i >= 0 && spec.nom) def.S[i] = spec.nom;
    const d = lirePiece('+/icone/' + encoderTraits(def.T) + '/' + encoderTraits(def.S));
    const m = document.createElement('div');
    m.className = 'modelePion';
    await composerVignette(m, d, 48);
    // Les labels se mesurent dans la page, à l'échelle du pion (48 px).
    const cache = document.createElement('div');
    cache.style.cssText = 'position:fixed;left:-200px;top:0;visibility:hidden';
    cache.appendChild(m);
    document.body.appendChild(cache);
    for(const t of d.etiquettes){
      const e = document.createElement('div');
      e.className = 'etiq';
      remplirLabel(e, t);
      e.style.font = `${t.style & 2 ? 'italic ' : ''}${t.style & 1 ? 'bold ' : ''}${t.taille}px/1.15 Arial,Helvetica,sans-serif`;
      e.style.color = t.couleur;
      e._label = t;
      m.appendChild(e);
      placerLabel(e, 48, 1);
    }
    cache.remove();
    return m;
  }).catch(() => null));
  return _modelesIconePion.get(spec.gpid);
}
function iconePion(spec = ICONE_PION){
  const b = document.createElement('span');
  b.className = 'ic icPion';
  b.setAttribute('aria-hidden', 'true');
  b.textContent = spec.ico || '♟';
  _composerIconePion(spec).then(m => { if(m){ b.textContent = ''; b.appendChild(m.cloneNode(true)); } });
  return b;
}

// Une feuille du bas qui liste des actions, en grand.
function ouvrirFeuilleActions(titre, ids, id = 'feuilleActions'){
  const f = ouvrirFeuille({id, titre});
  for(const x of ids){
    if(x === '-'){ const s = document.createElement('div'); s.className = 'sepFeuille'; f.corps.appendChild(s); continue; }
    const el = rendreAction(x, 'ligne');
    el.addEventListener('click', () => { if(!ACTIONS[x].coche) f.fermer(); }, true);
    f.corps.appendChild(el);
  }
  return f;
}

// Les actions passent toutes par ici : la fréquence d'usage sert à trier
// les commandes des barres tactiles.
function executerAction(id, ancre, e){
  const a = ACTIONS[id];
  if(!a || !a.faire || (a.actif && !a.actif())) return;
  a.faire(ancre, e);
  rafraichirActions();
}

function _majAction(el, a, id){
  if(a.groupe){ el.hidden = !!(a.visible && !a.visible()); return; }
  if(a.etiquette){ el.textContent = _v(a.etiquette); el.hidden = !!(a.visible && !a.visible()); return; }
  const lib = _v(a.lib), t = _v(a.touche) || '';
  const forme = el.dataset.forme;
  // Icône tirée du dépôt VASL ; elle peut changer avec l'état (masquer).
  const im = a.img && el.querySelector(':scope > img');
  if(im && im._chemin !== _v(a.img)){
    const ch = im._chemin = _v(a.img);
    chargerImage(ch).then(u => { if(u && im._chemin === ch) im.src = u; });
  }
  el.title = t ? `${lib} [${t}]` : lib;
  el.setAttribute('aria-label', lib);
  const lb = el.querySelector('.lb');
  if(lb){
    lb.textContent = forme === 'menu' || forme === 'ligne' ? lib
                   : forme === 'bouton' || (forme === 'icone' && a.texteBarre)
                     || ((forme === 'icone' || forme === 'rail') && a.lettre)
                     || ((forme === 'icone' || forme === 'rail') && !a.ico && !a.img && !a.pion) ? _v(a.court || a.lib)
                   : '';
  }
  const rc = el.querySelector('.rc');
  if(rc) rc.textContent = t;
  const off = !!(a.actif && !a.actif());
  if(forme === 'menu'){ el.classList.toggle('off', off); el.setAttribute('aria-disabled', String(off)); }
  else el.disabled = off;
  const allume = !!(a.allume && a.allume());
  el.classList.toggle('actif', allume);
  if(forme !== 'menu' && a.allume) el.setAttribute('aria-pressed', String(allume));
  if(a.coche){
    const c = !!a.coche();
    el.setAttribute('aria-checked', String(c));
    const ck = el.querySelector('.ck');
    if(ck) ck.textContent = c ? '✓' : '';
    if(forme !== 'menu') el.classList.toggle('actif', c);
  }
  if(a.badge){
    const n = a.badge();
    let bg = el.querySelector('.badgeAct');
    if(n && !bg){ bg = document.createElement('span'); bg.className = 'badgeAct'; el.appendChild(bg); }
    if(bg){ bg.textContent = n > 99 ? '99+' : String(n); bg.hidden = !n; }
  }
  const cl = _v(a.classe);
  if(el._classe !== cl){ if(el._classe) el.classList.remove(el._classe); if(cl) el.classList.add(cl); el._classe = cl; }
  el.hidden = !!(a.visible && !a.visible());
}

// Met à jour les éléments rendus, tous ou ceux des actions données.
function rafraichirActions(ids){
  const sel = ids ? ids.map(i => `[data-action="${i}"]`).join(',') : '[data-action]';
  if(!sel) return;
  for(const el of document.querySelectorAll(sel)){
    const a = ACTIONS[el.dataset.action];
    if(a) _majAction(el, a, el.dataset.action);
  }
}

// ═══ INTERFACE — PROFILS DE TERMINAL ═══
// Le profil se choisit d'après le pointeur et la taille de l'écran, jamais
// d'après le navigateur annoncé ; le réglage « Affichage » peut l'imposer.
// Geste par geste, c'est pointerType qui décide (PC portable tactile).
// Un affichage tablette ou téléphone imposé à la main ne vaut que pour la
// séance : ces profils n'ont plus le choix de l'affichage pour en revenir.
let _profilChoisi = _lirePref('aslweb.profil') === 'pc' ? 'pc' : 'auto';
let _profil = null;
function detecterProfil(){
  if(_profilChoisi !== 'auto') return _profilChoisi;
  // Pointeur principal grossier : un écran tactile, même si le navigateur
  // annonce aussi le survol (certains Android, les stylets) ; sinon le
  // téléphone prenait l'interface du PC, sans moyen de fermer ses panneaux.
  const tactile = matchMedia('(pointer: coarse)').matches;
  if(!tactile) return 'pc';
  return Math.min(innerWidth, innerHeight) >= 600 ? 'tablette' : 'mobile';
}
function choisirProfil(p){
  _profilChoisi = p;
  try { localStorage.setItem('aslweb.profil', p === 'pc' ? 'pc' : 'auto'); } catch(e){}
  appliquerProfil(detecterProfil());
}

const DISPOSITIONS = {
  pc: {
    menus: {
      'Fichier':   ['ouvrir', 'vsav', '-', 'log'],
      'Partie':    ['undo', '-', 'unmoved', 'all', '-', 'infoScenario'],
      // Masqués à la demande : sélection des cartes et panneaux, effectif
      // des piles, LOS détaillée (toujours au clic droit sur le bouton LOS).
      'Affichage': ['zoomPlus', 'zoomMoins', 'ajuster', 'zoom100', '-', 'masquer', '-', 'couche_unite', 'couche_marqueur',
                    '-', 'pions', 'journal', '-', 'profil_auto', 'profil_pc', 'profil_tablette', 'profil_mobile'],
      'Outils':    ['los', 'losMuet'],
      'Dés':       [...DES.map(d => d.id), '-', 'infoScenario'],
      'Réseau':    ['reseau', 'utilisateur'],
      'Aide':      ['raccourcis']
    },
    barre: ['ouvrir', 'vsav', 'log', 'logTxt', '|', 'undo', '|', 'zoomMoins', 'zoomTxt', 'zoomPlus', 'ajuster',
            '|', 'relecture', 'los', 'unmoved', 'all', 'masquer', '|', 'reseau', 'utilisateur'],
    // Les dés restent à portée, en boutons sous la barre d'icônes.
    barreDes: [...DES.filter(d => d.id.startsWith('DR_')).map(d => d.id), '|', ...DES.filter(d => d.id.startsWith('dr_')).map(d => d.id)],
    panneau: ['pile', 'palette', 'des']
  }
};
// Tant qu'un profil n'a pas sa disposition propre, il reprend celle du PC.
const disposition = p => DISPOSITIONS[p] || DISPOSITIONS.pc;

function appliquerProfil(p){
  const ancien = _profil;
  _profil = p;
  document.body.dataset.terminal = p;
  fermerDeroulants(); fermerMenu();
  _defaireProfil();
  const d = disposition(p);
  const haut = document.getElementById('chromeHaut'), gauche = document.getElementById('chromeGauche'),
        bas = document.getElementById('chromeBas');
  haut.replaceChildren(); gauche.replaceChildren(); bas.replaceChildren();
  if(d.menus) haut.appendChild(construireMenus(d.menus));
  if(d.barre) haut.appendChild(construireBarre(d.barre, 'barreIcones'));
  if(d.barreDes) haut.appendChild(construireBarre(d.barreDes, 'barreIcones barreDes'));
  construireOnglets(d.panneau || ['pile', 'palette', 'des']);
  if(d.construire) d.construire();
  // Le tiroir de la tablette et les vues du téléphone partent fermés ; au
  // PC, le panneau est ouvert, sauf d'abord sur un petit écran.
  if(p === 'pc') basculerCote(ancien ? true : window.innerWidth >= 700);
  rafraichirActions();
