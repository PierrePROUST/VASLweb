<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#2b2b2b">
<title>VASL — Carte</title>
<style>
:root{
  --fond:#2b2b2b; --barre:#1e1e1e; --texte:#e6e6e6; --doux:#9a9a9a;
  --accent:#d9a441; --bord:#444;
  /* Menus, fenêtres et aperçus : sombres, comme le reste de l'interface. */
  --menu-fond:#2f2f2f; --menu-texte:#e6e6e6; --menu-survol:#2f5f9e; --menu-bord:#555;
  --menu-doux:#a8a8a8; --champ:#232323;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--fond);color:var(--texte);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
/* Hors de la carte, un double appui ne zoome pas la page (Safari iOS) ;
   le pincement reste permis. */
html,body{touch-action:manipulation}
.barre{display:flex;align-items:center;gap:6px;padding:6px 10px;
  background:var(--barre);border-bottom:1px solid var(--bord);flex-wrap:wrap}
.barre h1{font-size:15px;margin:0 10px 0 0;font-weight:600}
button{background:#333;color:var(--texte);border:1px solid var(--bord);
  border-radius:4px;padding:5px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
/* Pas de délai de double appui ni de zoom de page sur les commandes. */
button,select,label,.onglet,.wli,.lig,.vig{touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
/* ── Interface : menus, barre d'icônes, panneau à onglets (profil PC). */
:root{--cible:28px;--marge-h:env(safe-area-inset-top,0px);--marge-b:env(safe-area-inset-bottom,0px);
  --marge-g:env(safe-area-inset-left,0px);--marge-d:env(safe-area-inset-right,0px)}
body:is([data-terminal=mobile],[data-terminal=tablette]){--cible:44px}
#chromeHaut,#chromeBas,#chromeGauche{flex:none}
.menus{display:flex;align-items:center;height:calc(26px + var(--marge-h));padding:var(--marge-h) calc(6px + var(--marge-d)) 0 calc(6px + var(--marge-g));background:var(--barre);font-size:13px}
.menus h1{font-size:13px;margin:0 10px 0 2px;font-weight:600;color:var(--doux);white-space:nowrap}
.menus .titreMenu{background:none;border:1px solid transparent;padding:2px 9px;border-radius:3px}
.menus .titreMenu:hover,.menus .titreMenu.ouvert,.menus .titreMenu:focus-visible{background:#333;border-color:transparent}
.deroulant{position:fixed;z-index:9650;min-width:220px;max-width:360px;max-height:80vh;overflow:auto;padding:3px 0;
  background:var(--menu-fond);color:var(--menu-texte);border:1px solid var(--menu-bord);border-radius:4px;
  box-shadow:0 6px 20px rgba(0,0,0,.55);font-size:13px;user-select:none;-webkit-user-select:none}
.deroulant .it{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 6px;cursor:pointer;white-space:nowrap}
.deroulant .it:hover,.deroulant .it.focus{background:var(--menu-survol);color:#fff}
.deroulant .it .ck{width:14px;text-align:center;flex:none}
.deroulant .it .lb{flex:1}
.deroulant .it .rc{opacity:.6;font-size:11px}
.deroulant .it.off{color:#777;cursor:default;background:none}
.deroulant .sepm{height:1px;background:var(--menu-bord);margin:3px 0}
.barreIcones{display:flex;align-items:center;gap:4px;height:36px;padding:0 8px;background:var(--barre);
  border-bottom:1px solid var(--bord);overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin}
.barreIcones .sep{align-self:center;height:20px}
.barreDes{height:32px}
.barreDes .act.ico{height:24px;min-width:0;padding:1px 8px;font-size:13px}
.act.ico{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;min-width:30px;height:28px;flex:none}
.act img{height:16px;vertical-align:-3px}
.act.actif{border-color:var(--accent);color:var(--accent)}
.act.enreg.actif{border-color:#c03a3a;color:#ff8a8a}
.act.reseau.actif{border-color:#3c8f4a;color:#9fe0a8}
.act.admin{border-color:#c0392b;color:#ff8a7a}
.etiqAct{color:var(--doux);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.etiqAct.zoom{min-width:46px;text-align:center}
.etiqAct.enreg{color:#e05252;font-size:12px}
.groupeAct{display:inline-flex;align-items:center;gap:4px;flex:none}
.coteOnglets{display:flex;flex:none;background:#262626;border-bottom:1px solid var(--bord)}
.coteOnglets button{flex:1;background:none;border:none;border-bottom:2px solid transparent;border-radius:0;
  padding:6px 4px;color:var(--doux);font-size:13px}
.coteOnglets button.actif{color:var(--accent);border-bottom-color:var(--accent)}
.ongCorps{display:none;flex:1;min-height:0;flex-direction:column}
.ongCorps.actif{display:flex}
.poignee{flex:none;background:var(--bord);touch-action:none}
.poignee.verticale{width:4px;cursor:col-resize}
.poignee.horizontale{height:4px;cursor:row-resize}
.poignee:hover{background:var(--accent)}
.desBoutons{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px}
.desBoutons .sepDes{grid-column:1/-1;height:1px;background:var(--bord);margin:2px 0}
.infoScen{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:4px 8px 8px}
.infoScen label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--doux)}
.infoScen input,.infoScen select{background:#2a2a2a;color:var(--texte);border:1px solid var(--bord);
  border-radius:4px;padding:4px;font:inherit;font-size:13px}
.desAide{padding:4px 8px 8px;font-size:11px;color:var(--doux);overflow:auto}
.desAide td{padding:1px 6px 1px 0}
.act.bouton{padding:4px 6px;min-height:var(--cible)}
.act.ligne{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:44px;padding:6px 12px;
  background:none;border:none;border-bottom:1px solid #353535;border-radius:0;font-size:15px}
.act.ligne .ic{width:24px;text-align:center;flex:none}
.act.ligne .lb{flex:1}
.act.ligne .rc{color:var(--menu-doux);font-size:12px}
.act.ligne.actif{color:var(--accent)}
.fenetre th[colspan]{padding-top:8px;color:var(--accent)}
/* ── Composants tactiles. */
.voile{position:fixed;inset:0;z-index:9690;background:rgba(0,0,0,.45)}
.voile.transparent{background:transparent}
.feuille{position:fixed;left:0;right:0;bottom:0;z-index:9700;display:flex;flex-direction:column;
  max-height:70vh;background:var(--menu-fond);color:var(--menu-texte);border-top:1px solid var(--menu-bord);
  border-radius:12px 12px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.6);padding-bottom:var(--marge-b);
  transition:transform .18s ease-out;margin:0 auto;max-width:720px}
.feuille.moitie{max-height:55vh}
.feuille.plein{top:var(--marge-h);max-height:none;border-radius:0;max-width:none}
.poigneeFeuille{width:44px;height:5px;border-radius:3px;background:#666;margin:7px auto 2px;flex:none}
.teteFeuille{display:flex;align-items:center;gap:8px;padding:2px 6px 6px 14px;flex:none;touch-action:none}
.teteFeuille .tt{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teteFeuille .ferme{min-width:var(--cible);min-height:var(--cible);background:none;border:none;font-size:18px}
.corpsFeuille{overflow:auto;flex:1;min-height:0;overscroll-behavior:contain}
.corpsFeuille .act.ligne:disabled{opacity:.4}
.videFeuille{padding:14px;color:var(--menu-doux);font-style:italic}
.sepFeuille{height:6px;background:#262626}
.act.danger{color:#ff8a8a}
.act.prim{background:#2f5f9e;border-color:#2f5f9e;color:#fff}
.barrePile,.bandeauMode,.panneauFil{position:absolute;z-index:60;display:flex;align-items:center;gap:6px;
  padding:6px 8px;background:rgba(30,30,30,.94);border-top:1px solid var(--bord);overflow-x:auto;scrollbar-width:none}
.barrePile{bottom:0}
.barrePile .act.bouton,.actionsEv .act.bouton,.panneauFil .act.bouton{flex:none;white-space:nowrap;min-height:40px}
.miniPile{position:relative;flex:none;width:46px;height:40px;padding:2px;display:flex;align-items:center;justify-content:center}
.miniPile .nb{position:absolute;right:-2px;bottom:-2px;background:var(--accent);color:#111;border-radius:8px;
  font:600 11px/15px system-ui,sans-serif;padding:0 4px}
.copiePion{position:relative;overflow:hidden;flex:none;pointer-events:none}
.bandeauMode{top:8px;border:1px solid var(--accent);border-radius:6px;font-size:14px}
.bandeauMode label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--doux);white-space:nowrap}
.bandeauMode button{flex:none;min-width:36px;min-height:36px}
.panneauFil{top:8px;border:1px solid var(--accent);border-radius:6px;flex-wrap:wrap}
.panneauFil .libFil{font-size:12px;color:var(--doux);white-space:nowrap;margin-left:4px}
.eventail{position:fixed;z-index:9550;background:rgba(28,28,28,.97);border:1px solid var(--accent);border-radius:8px;
  box-shadow:0 6px 22px rgba(0,0,0,.65);padding:6px;max-width:calc(100vw - 16px)}
.bandeEv{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-height:45vh;overflow:auto}
.bandeEv .tout{flex:none;align-self:stretch;min-width:44px}
.sommetEv{font-size:11px;color:var(--doux);flex:none}
.vigEv{position:relative;flex:none;padding:2px;border:2px solid transparent;border-radius:5px;touch-action:none}
.vigEv.sel{border-color:var(--accent);background:rgba(217,164,65,.18)}
.vigEv.horsCouche{opacity:.35}
.vigEv.masque .copiePion{opacity:.6}
.vigEv .cadenas{position:absolute;left:2px;bottom:2px;font-size:14px}
.ckEv{position:absolute;right:-6px;top:-6px;width:28px;height:28px;padding:0;border-radius:14px;font-size:16px;
  line-height:26px;background:#1e1e1e}
.inserEv{position:absolute;width:3px;background:var(--accent);border-radius:2px;pointer-events:none}
.croixFermer{flex:none;width:30px;height:30px;min-width:30px;padding:0;border-radius:50%;background:#c0392b;color:#fff;
  border:2px solid #fff;font:700 15px/26px system-ui,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.eventail .croixFermer{position:absolute;right:-12px;top:-12px;z-index:2}
.barrePile .croixFermer{position:sticky;right:0;margin-left:auto}
.actionsEv{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--bord)}
/* Commandes rapides en tête du panneau Pile (PC) ; commandes d'état
   (Prep Fire, First Fire, Break, Pin, Conceal) allumées ou en partie. */
.actionsPile{position:sticky;top:0;z-index:1;display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;
  background:var(--barre);border-bottom:1px solid var(--bord)}
.actionsPile{align-items:center}
.actionsPile .act.bouton{min-height:28px;padding:2px 7px;font-size:12px;white-space:nowrap}
.actionsPile .act.cmdEtat{padding:2px}
.act.cmdEtat{padding:2px;line-height:0;border-width:2px}
.iconeCmd{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:2px}
.iconeCmd img{position:absolute;pointer-events:none}
.iconeCmd .lbIcone{font-size:9px;line-height:1.1;text-align:center;white-space:normal}
.act.cmdEtat.actif{background:rgba(217,164,65,.30);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.act.cmdEtat.mixte{border-style:dashed;border-color:var(--accent)}
/* Fenêtres (identification, réseau, log) : plein écran au doigt. */
body:not([data-terminal=pc]) .fenetre{left:0;top:0;transform:none;width:100%;height:100%;max-height:none;border-radius:0;
  padding:var(--marge-h) var(--marge-d) var(--marge-b) var(--marge-g);font-size:15px}
body:not([data-terminal=pc]) .fenetre .fb button{min-height:44px}
/* Au doigt, Safari iOS zoome la page sur tout champ de moins de 16 px :
   chat, recherches, SAN, palette de commandes compris. */
body:not([data-terminal=pc]) :is(input:not([type=checkbox]):not([type=radio]),select,textarea){font-size:16px!important}
/* Focus visible au clavier, partout. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.deroulant .it:focus-visible,.corpsFeuille .act.ligne:focus-visible{outline-offset:-2px}
/* Animations réduites : ni éclat des coups, ni fondu des retraits. */
@media (prefers-reduced-motion: reduce){
  .pion.coup{animation:none;box-shadow:0 0 0 3px #ff3b3b}
  .pion.retire{display:none}
  .feuille{transition:none}
}
/* ── Profils tactiles : boutons plus grands. */
body:not([data-terminal=pc]) .act.ico{min-width:var(--cible);height:var(--cible)}
/* Croix du panneau : là où il recouvre la carte (profils tactiles, PC étroit). */
.coteOnglets button.fermeCote{flex:none;align-self:center;display:none;width:30px;height:30px;min-width:30px;margin:0 6px;
  padding:0;border-radius:50%;background:#c0392b;color:#fff;border:2px solid #fff;font:700 15px/26px system-ui,sans-serif}
body:not([data-terminal=pc]) .coteOnglets button.fermeCote{display:block}
@media (max-width:700px){ .coteOnglets button.fermeCote{display:block} }
.act.rail{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:none;
  width:var(--tailleRail,52px);height:var(--tailleRail,52px);min-height:0;padding:0;margin:1px;font-size:10px;
  line-height:1.1;background:none;border-color:transparent;white-space:nowrap;overflow:hidden}
.act.rail .ic{font-size:calc(var(--tailleRail,52px) * .44);line-height:1}
.act.rail .lb{display:none}
.icPion{display:inline-block;position:relative;width:28px;height:28px;overflow:hidden;vertical-align:middle}
.icPion .modelePion{position:absolute;left:0;top:0;width:48px;height:48px;transform:scale(calc(28 / 48));transform-origin:0 0}
.modelePion{position:relative;width:48px;height:48px;overflow:hidden}
.modelePion img{position:absolute}
.act.ico .icPion{width:20px;height:20px}
.act.ico .icPion .modelePion{transform:scale(calc(20 / 48))}
.act.rail img{height:calc(var(--tailleRail,52px) * .46)}
.act.rail .icPion{width:calc(var(--tailleRail,52px) * .6);height:calc(var(--tailleRail,52px) * .6)}
.act.rail .icPion .modelePion{transform:scale(var(--echPionRail,.65))}
.act.rail .lb{max-width:50px;overflow:hidden;text-overflow:ellipsis}
/* Boutons LOS de VASL : l'icône thread.gif (16 px, trait noir) sur fond
   clair, et la lettre du bouton à côté, ou dessous dans le rail. */
.act.lettre img{background:#e4e1d6;border-radius:3px;padding:1px;image-rendering:pixelated}
.act.rail.lettre img{height:calc(var(--tailleRail,52px) * .36)}
.act.rail.lettre .lb{display:block;font:600 12px/1 system-ui,sans-serif}
.act.rail.actif{background:#333;border-color:var(--accent)}
.desBoutons.grand .act.bouton{min-height:56px;font-size:17px}
/* Téléphone : barre du haut, navigation en bas, une vue à la fois. */
.navBas{display:flex;justify-content:space-around;background:var(--barre);border-top:1px solid var(--bord);
  padding:0 var(--marge-d) var(--marge-b) var(--marge-g)}
.navBas{overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scroll-snap-type:x proximity;scrollbar-width:none;
  overscroll-behavior-x:contain;justify-content:flex-start}
.navBas::-webkit-scrollbar{display:none}
/* Icônes rapprochées : 46 px de large, au-dessus de la cible tactile de 44 px. */
.navBas{gap:2px;padding-left:calc(var(--marge-g) + 4px);padding-right:calc(var(--marge-d) + 4px);
  scroll-padding-inline:calc(var(--marge-g) + 4px) calc(var(--marge-d) + 4px)}
.navBas .act.rail{flex:0 0 46px;width:46px;height:50px;margin:0;font-size:11px;scroll-snap-align:start}
/* Un fondu au bord qui cache encore des icônes : la barre défile. */
.navBas.suiteDroite{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
.navBas.suiteGauche{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 28px),transparent);
  mask-image:linear-gradient(to left,#000 calc(100% - 28px),transparent)}
.navGauche.navBas{flex-direction:column;width:var(--railMobile);overflow-x:hidden;overflow-y:auto;touch-action:pan-y;
  scroll-snap-type:none;overscroll-behavior-y:contain;gap:2px;padding:calc(var(--marge-h) + 4px) calc(var(--marge-d) + 2px) calc(var(--marge-b) + 4px) 2px;
  scroll-padding-block:4px;border-top:none;border-left:1px solid var(--bord);-webkit-mask-image:none;mask-image:none}
.navGauche.navBas .act.rail{flex:0 0 46px;width:46px;height:46px}
/* Les dés : leur sigle en guise d'icône. */
.navGauche .act.rail.de .ic{font:600 13px/1 system-ui,sans-serif;letter-spacing:-.02em}
/* Relecture du log en bas de la colonne : boutons empilés, position en petit. */
.navGauche .groupeAct{flex-direction:column;gap:2px}
.navGauche .groupeAct .etiqAct{width:46px;font-size:10px;text-align:center;white-space:normal;color:var(--texte)}
:root{--railMobile:52px}
/* Tablette et téléphone : la colonne d'icônes est sur la droite de l'écran. */
body:is([data-terminal=mobile],[data-terminal=tablette]) #chromeGauche{display:flex;background:var(--barre);order:9}
/* … ou à gauche, au choix de l'utilisateur (icône ⇄ de la colonne). */
body[data-colonne=gauche] #chromeGauche{order:0}
body[data-colonne=gauche] .navGauche.navBas{padding-left:calc(var(--marge-g) + 2px);padding-right:2px;border-left:none;border-right:1px solid var(--bord)}
body[data-colonne=gauche]:is([data-terminal=mobile],[data-terminal=tablette]) #cote,
body[data-colonne=gauche]:is([data-terminal=mobile],[data-terminal=tablette]) #bas:not([hidden]){left:var(--railMobile);right:0}
.navBas.suiteGauche.suiteDroite{-webkit-mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent);
  mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
body:is([data-terminal=mobile],[data-terminal=tablette]) #poigneeCote,body:is([data-terminal=mobile],[data-terminal=tablette]) #poigneeJournal,
body:is([data-terminal=mobile],[data-terminal=tablette]) #coteOnglets button[data-onglet]{display:none}
body:is([data-terminal=mobile],[data-terminal=tablette]) #coteOnglets{justify-content:flex-end}
body:is([data-terminal=mobile],[data-terminal=tablette]) #couches{display:none}
body:is([data-terminal=mobile],[data-terminal=tablette]) #cote{position:absolute;left:0;right:var(--railMobile);bottom:0;z-index:70;width:auto;border-left:none;
  border-top:1px solid var(--bord);box-shadow:0 -6px 20px rgba(0,0,0,.5)}
body:is([data-terminal=mobile],[data-terminal=tablette])[data-vue=pile] #cote{top:auto;height:58%;border-radius:12px 12px 0 0}
body:is([data-terminal=mobile],[data-terminal=tablette])[data-vue=pions] #cote{top:0}
body:is([data-terminal=mobile],[data-terminal=tablette]) #bas:not([hidden]){position:fixed;left:0;right:var(--railMobile);z-index:80;display:flex;flex-direction:column;
  top:calc(var(--vv-haut,0px) + var(--marge-h));bottom:var(--hautBas,calc(55px + var(--marge-b)));background:var(--barre)}
/* Saisie au doigt : le chat touche le clavier ; la relecture, dessous de
   toute façon, s'efface ; la colonne d'icônes reste. Le chat
   et les vues du téléphone laissent cette colonne visible. */
body:not([data-terminal=pc]).saisie .navBas:not(.navGauche){display:none}
body:is([data-terminal=mobile],[data-terminal=tablette]).saisie #bas:not([hidden]){bottom:var(--clavier,0px)}
/* Chat compact : une feuille au-dessus du bas de l'écran, la carte visible. */
body:is([data-terminal=mobile],[data-terminal=tablette]) #bas[data-etat=compact]:not([hidden]){top:auto;height:calc(var(--vv-h,100vh) * .45);
  border-radius:12px 12px 0 0;border-top:1px solid var(--bord);box-shadow:0 -6px 20px rgba(0,0,0,.55)}
body:is([data-terminal=mobile],[data-terminal=tablette]).saisie #bas[data-etat=compact]:not([hidden]){height:calc(var(--vv-h,100vh) * .5)}
body:is([data-terminal=mobile],[data-terminal=tablette]) #bas[data-etat=compact] #journal{min-height:48px}
.poigneeChat{display:none}
.filtresChat{display:none;gap:6px;padding:4px 10px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none;flex:none;
  background:var(--barre);border-bottom:1px solid var(--bord)}
body:is([data-terminal=mobile],[data-terminal=tablette]).chatOuvert .filtresChat{display:flex}
.filtresChat .pastilleChat{height:30px;font-size:12px;opacity:.55}
.filtresChat .pastilleChat.actif{opacity:1;border-color:var(--accent)}

<script>
// ═══════════════════════════════════════════════════════════════
// LANGUE DE L'INTERFACE
// La langue du terminal décide : français s'il l'est (fr, fr-FR, fr-CA…),
// l'interface reste telle quelle ; sinon, anglais, avec les termes de
// VASSAL et de VASL (counter, stack, Undo, Logfile, Room…). « ?lang=fr »
// ou « ?lang=en » dans l'adresse l'impose. Seule l'interface se traduit :
// le journal, les rapports au chat, le log et les fichiers restent en
// l'état, tels que les reçoivent VASL et les autres joueurs.
// Le code garde ses libellés français ; T() les traduit à l'affichage,
// et un MutationObserver traduit ce qui paraît dans la page (texte,
// title, placeholder, aria-label), hors carte et journal.

// Touches, comme VASSAL les nomme.
const EN_TOUCHES = [[/Maj\+/g, 'Shift+'], [/Méta\+/g, 'Meta+'], [/\bÉchap\b/g, 'Esc'], [/Entrée/g, 'Enter'],
  [/Suppr/g, 'Delete'], [/Espace/g, 'Space'], [/Page précédente/g, 'Page Up'], [/Page suivante/g, 'Page Down']];
const _estTouche = s => /^(?:(?:Ctrl|Alt|Maj|Méta)\+)*(?:[^\s+]{1,4}|Échap|Entrée|Suppr|Espace|Num\d|Page (?:précédente|suivante))(?: \/ .+)?$/.test(s);

function T(s){
  if(LANGUE === 'fr' || typeof s !== 'string') return s;
  const k = s.replace(/\s+/g, ' ').trim();
  if(!k) return s;
  if(Object.hasOwn(EN, k)) return EN[k];
  if(_estTouche(k)) return EN_TOUCHES.reduce((t, [re, en]) => t.replace(re, en), k);
  for(const m of EN_MOTIFS){
    const r = m.re.exec(k);
    if(!r) continue;
    let i = 1;
    const t = m.en.replace(/\{\}/g, () => T(r[i++]));
    if(t !== k) return t;
  }
  return s;
}

// Traduction de la page : textes et attributs, hors carte et journal
// (noms des pions, messages des joueurs, rapports).
const _ATTR_TRADUITS = ['title', 'placeholder', 'aria-label'];
const _HORS_TRADUCTION = '#mapInner, #journal, #apercuChat .txt, script, style';
function _traduireAttr(el, a){
  const v = el.getAttribute(a);
  if(v){ const t = T(v); if(t !== v) el.setAttribute(a, t); }
}
function _traduireNoeud(n){
  if(n.nodeType === 3){
    const p = n.parentElement;
    if(!p || p.closest(_HORS_TRADUCTION)) return;
    const v = n.nodeValue, t = T(v);
    // Les espaces autour du libellé restent.
    if(t !== v) n.nodeValue = /^\s*/.exec(v)[0] + t + /\s*$/.exec(v)[0];
    return;
  }
  if(n.nodeType !== 1 || n.closest(_HORS_TRADUCTION)) return;
  for(const a of _ATTR_TRADUITS) _traduireAttr(n, a);
  for(const c of n.childNodes) _traduireNoeud(c);
}
function _brancherLangue(){
  document.documentElement.lang = LANGUE;
  if(LANGUE === 'fr') return;
  document.title = T(document.title);
  _traduireNoeud(document.body);
  new MutationObserver(l => {
    for(const m of l){
      if(m.type === 'childList') m.addedNodes.forEach(_traduireNoeud);
      else if(m.type === 'characterData') _traduireNoeud(m.target);
      else if(!m.target.closest(_HORS_TRADUCTION)) _traduireAttr(m.target, m.attributeName);
    }
  }).observe(document.body, {childList: true, subtree: true, characterData: true,
                             attributes: true, attributeFilter: _ATTR_TRADUITS});
}

// ── Journal
// Lignes de la page elle-même : « sys », et « alerte » pour un
// avertissement, une erreur ou un refus, que les filtres ne cachent jamais.
function chatLog(msg){
  const d = document.createElement('div');
  d.className = /^(⚠️|❌|🔒)/u.test(msg) ? 'sys alerte' : 'sys';
  d.textContent = msg;
  ajouterLigne(d);
}

// Une ligne au journal. Il ne redescend que si l'on était déjà en bas (à
// 40 px près) ; sinon, la lecture n'est pas interrompue et une pastille
// « ↓ n nouveaux » y ramène.
let _nouveauxChat = 0;
const _apresLigne = [];           // fonctions appelées pour chaque ligne ajoutée
function ajouterLigne(el){
  const j = document.getElementById('journal');
  const enBas = j.scrollHeight - j.scrollTop - j.clientHeight < 40;
  j.appendChild(el);
  if(enBas) j.scrollTop = j.scrollHeight;
  else if(el.offsetHeight){
    _nouveauxChat++;
    _majNouveauxChat();
  }
  for(const f of _apresLigne) f(el);
}
function _majNouveauxChat(){
  let b = document.getElementById('nouveauxChat');
  if(!_nouveauxChat){ if(b) b.hidden = true; return; }
  if(!b){
    b = document.createElement('button');
    b.type = 'button'; b.id = 'nouveauxChat'; b.className = 'nouveauxChat';
    b.addEventListener('pointerdown', e => e.preventDefault());
    b.addEventListener('click', () => { const j = document.getElementById('journal'); j.scrollTop = j.scrollHeight; _nouveauxChat = 0; _majNouveauxChat(); });
    document.getElementById('bas').appendChild(b);
  }
  b.hidden = false;
  b.textContent = `↓ ${_nouveauxChat} nouveau${_nouveauxChat > 1 ? 'x' : ''}`;
  const j = document.getElementById('journal');
  b.style.bottom = (document.getElementById('bas').getBoundingClientRect().bottom - j.getBoundingClientRect().bottom + 8) + 'px';
}

// ═══ ZIP natif (DecompressionStream) ═══
async function _zipRead(arrayBuffer){
  const buf = new Uint8Array(arrayBuffer);
  const dv  = new DataView(arrayBuffer);
  const files = new Map();
  let eocd = -1;
  for(let i = buf.length - 22; i >= 0 && i >= buf.length - 65558; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('Pas un fichier ZIP valide (EOCD introuvable)');
  const entryCount = dv.getUint16(eocd + 10, true);
  let cdOffset     = dv.getUint32(eocd + 16, true);
  for(let n = 0; n < entryCount; n++){
    if(dv.getUint32(cdOffset, true) !== 0x02014b50) break;
    const method    = dv.getUint16(cdOffset + 10, true);
    const compSize  = dv.getUint32(cdOffset + 20, true);
    const nameLen   = dv.getUint16(cdOffset + 28, true);
    const extraLen  = dv.getUint16(cdOffset + 30, true);
    const cmtLen    = dv.getUint16(cdOffset + 32, true);
    const localOff  = dv.getUint32(cdOffset + 42, true);
    const name      = new TextDecoder().decode(buf.subarray(cdOffset + 46, cdOffset + 46 + nameLen));
    if(dv.getUint32(localOff, true) === 0x04034b50){
      const lNameLen  = dv.getUint16(localOff + 26, true);
      const lExtraLen = dv.getUint16(localOff + 28, true);
      const dataStart = localOff + 30 + lNameLen + lExtraLen;
      const raw = buf.subarray(dataStart, dataStart + compSize);
      let out;
      if(method === 0) out = new Uint8Array(raw);
      else if(method === 8) out = await _inflateRaw(raw);
      else throw new Error('Méthode de compression ZIP non supportée : ' + method);
      files.set(name, out);
    }
    cdOffset += 46 + nameLen + extraLen + cmtLen;
  }
  return files;
}

async function _inflateRaw(bytes){
  if(typeof DecompressionStream === 'undefined')
    throw new Error('DecompressionStream indisponible — navigateur trop ancien');
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// ── XOR decode VASSAL (!VCSK + 2 chars hex key + payload hexadécimal)
function _xorDecode(bytes){
  const magic = [0x21,0x56,0x43,0x53,0x4B];
  let start = -1;
  for(let i = 0; i < bytes.length-7; i++){
    if(bytes[i]===magic[0]&&bytes[i+1]===magic[1]&&bytes[i+2]===magic[2]
     &&bytes[i+3]===magic[3]&&bytes[i+4]===magic[4]){ start = i; break; }
  }
  if(start < 0) return new TextDecoder().decode(bytes);
  const key = parseInt(String.fromCharCode(bytes[start+5], bytes[start+6]), 16);
  if(isNaN(key)) throw new Error('Clé XOR illisible');
  const hexPart = bytes.subarray(start+7);
  const n = hexPart.length >> 1;
  const out = new Uint8Array(n);
  const hv = c => c<=57 ? c-48 : (c<=70 ? c-55 : c-87);
  for(let i = 0; i < n; i++) out[i] = ((hv(hexPart[i*2])<<4) | hv(hexPart[i*2+1])) ^ key;
  return new TextDecoder('utf-8', {fatal:false}).decode(out);
}

// ═══ OUVERTURE DE FICHIER ═══
// On identifie le format par sa signature : sur Android le nom de
// fichier perd souvent son extension.
function _sniffFileType(b, name){
  if(b.length >= 4 && b[0] === 0x50 && b[1] === 0x4B
     && (b[2] === 3 || b[2] === 5 || b[2] === 7)) return 'vsav';
  if(b.length >= 5 && b[0] === 0x21 && b[1] === 0x56
     && b[2] === 0x43 && b[3] === 0x53 && b[4] === 0x4B) return 'raw';
  if(/\.(vsav|vlog|zip)$/i.test(name || '')) return 'vsav';
  return 'unknown';
}

async function openGameFile(file){
  if(!file) return;
  const label = file.name || 'fichier';
  // isNewGameAllowed : dans une salle, seul le propriétaire ouvre une partie.
  if(!netProprietaire()){
    chatLog('🔒 Dans une salle, seul son propriétaire ouvre une partie : utiliser Synchroniser');
    return;
  }
  try {
    const head = new Uint8Array(await file.slice(0, 64).arrayBuffer());
    const kind = _sniffFileType(head, file.name);
    let texte;
    // savedata et moduledata : repris tels quels à l'écriture, VASSAL y
    // vérifie la version du module et les extensions chargées.
    const annexes = new Map();
    if(kind === 'vsav'){
      const files = await _zipRead(await file.arrayBuffer());
      let raw = null, nomRaw = null;
      for(const [n, d] of files)
        if(n === 'savedGame' || n.toLowerCase().endsWith('savedgame')){ raw = d; nomRaw = n; break; }
      if(!raw){ chatLog(`❌ Pas d'entrée savedGame dans ${label}`); return; }
      for(const [n, d] of files) if(n !== nomRaw) annexes.set(n, d);
      texte = _xorDecode(raw);
    } else if(kind === 'raw'){
      texte = _xorDecode(new Uint8Array(await file.arrayBuffer()));
    } else {
      chatLog(`❌ Format non reconnu : ${label}`);
      return;
    }
    if(!await chargerPartie(texte, label, annexes)) return;
    netPartieChargee();
    // Qui joue ? Ce que l'on voit et ce que l'on peut toucher en dépend.
    demanderUtilisateur();
    // GameState.loadGame : « Replay commencing. Begin new log file? »
    proposerLog(true);
  } catch(err){
    chatLog('❌ Lecture impossible : ' + (err && err.message ? err.message : err));
    console.error(err);
  }
}

// Texte d'une sauvegarde : boards, puis pions. Sert aussi à la
// synchronisation d'une partie à distance.
async function chargerPartie(texte, label, annexes){
  const boards = _parseBoardSegment(texte);
  if(!boards.length){ chatLog(`⚠️ Aucun board dans ${label}`); return false; }
  fermerLog();
  document.title = 'VASL — ' + label;
  chatLog(`🗺️ ${label} — boards : `
    + boards.map(b => b.name + (b.reversed ? ' (retourné)' : '')).join(', '));
  await _renderBoards(boards);
  importerPions(texte, label, annexes);
  return true;
}

  const el = document.getElementById('fileImport');
  el.value = '';
  // Sur Android, « accept » grise les .vsav : on s'en abstient.
  if(!/Android/i.test(navigator.userAgent || '')) el.setAttribute('accept', EXT_ACCEPTEES.join(','));
  el.click();

function handleFileImport(input){
  const f = input.files && input.files[0];
  if(f) openGameFile(f);
}

function _setupDropZone(){
  const zone = document.getElementById('mapWrap');
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  let depth = 0;
  zone.addEventListener('dragenter', e => { stop(e); if(++depth === 1) zone.classList.add('dropping'); });
  zone.addEventListener('dragover', stop);
  zone.addEventListener('dragleave', e => {
    stop(e); if(--depth <= 0){ depth = 0; zone.classList.remove('dropping'); }
  });
  zone.addEventListener('drop', e => {
    stop(e); depth = 0; zone.classList.remove('dropping');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) openGameFile(f);
  });
  document.addEventListener('paste', e => {
    const items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(const it of items) if(it.kind === 'file'){
      const f = it.getAsFile();
      if(f){ e.preventDefault(); openGameFile(f); return; }
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// DISPOSITION DES BOARDS — d'après ASLBoardPicker.java (VASL)
//     x \t y \t nom [\t cropX \t cropY \t cropW \t cropH]
//     [\t VER ...] [\t OVR ...] [\t SSR ...] [\t ZOOM z] [\t FH]
// Le miroir d'un board retourné porte sur les dimensions RECADRÉES.
// ═══════════════════════════════════════════════════════════════
function _parseBoardSegment(text){
  const seg = text.split('\x1b').find(s => s.startsWith('bd\t'));
  if(!seg) return [];
  const out = [];
  for(const part of seg.split('bd\t')){
    if(!part.trim()) continue;
    const t = part.split('\t');
    if(t.length < 3) continue;
    const col = parseInt(t[0], 10), row = parseInt(t[1], 10);
    if(isNaN(col) || isNaN(row)) continue;
    const raw = t[2];
    // 'r' seul ou 'rdx' sont de vrais noms ; sinon 'rXX' = XX retourné.
    // Le « r » est minuscule (ASLBoardPicker.buildBoard) : RBv3, RR, RO…
    // sont des noms de boards, pas des boards retournés.
    let reversed = false, name = raw;
    if(raw.startsWith('r') && !/^r(dx)?$/i.test(raw)){ reversed = true; name = raw.substring(1); }
    let crop = null;
    const n = [t[3], t[4], t[5], t[6]].map(v => parseInt(v, 10));
    if(n.every(v => !isNaN(v))) crop = {x:n[0], y:n[1], w:n[2], h:n[3]};
    const zm = part.match(/ZOOM\t([\d.]+)/);
    // Les SSR sont séparées par des tabulations, avec des champs vides
    // au milieu : on lit jusqu'au mot-clé de section suivant.
    const m = part.match(/\tSSR\t([^]*?)(?:\tVER\t|\tOVR\t|\tZOOM\t|$)/);
    out.push({
      col, row, name, reversed, crop,
      zoom: zm ? parseFloat(zm[1]) : 1,
      ssrList: m ? m[1].split('\t').filter(s => s && s !== 'true' && s !== 'false' && s !== 'FH') : [],
      overlays: _parseOverlays(part)
    });
  }
  return out;
}

// Overlays d'hexagones, lus comme ASLBoardPicker : à chaque « OVR », les
// trois jetons qui suivent sont le nom, hex1 et hex2.
function _parseOverlays(part){
  const out = [];
  let s = part;
  for(let i = s.indexOf('OVR'); i >= 0; i = s.indexOf('OVR')){
    s = s.substring(i + 4);
    const tk = s.split(/[\t ]+/).filter(x => x);
    if(tk.length >= 3) out.push({nom: tk[0], hex1: tk[1], hex2: tk[2]});
  }
  return out;
}

// ── Géométrie de chaque board, lue dans BoardMetadata.xml : tous ne
// font pas 33 x 10 (23a, Deluxe, HASL).
const _geoBoards = new Map();
const _archives = new Map();          // nom → Promise<Map(fichier → octets)>

function _archive(nom){
  if(!_archives.has(nom)){
    _archives.set(nom, fetch(VASL_BOARDS_URL + 'bd' + nom).then(async r => {
      if(!r.ok) throw new Error('bd' + nom + ' introuvable (HTTP ' + r.status + ')');
      return _zipRead(await r.arrayBuffer());
    }));
    _archives.get(nom).catch(() => _archives.delete(nom));
  }
  return _archives.get(nom);
}

async function chargerGeoBoard(nom){
  if(_geoBoards.has(nom)) return _geoBoards.get(nom);
  let g;
  try {
    const files = await _archive(nom);
    const xml = _fichier(files, 'BoardMetadata.xml');
    const att = {};
    let meta = null;
    if(xml){
      const doc = new DOMParser().parseFromString(new TextDecoder().decode(xml), 'application/xml');
      const racine = doc.documentElement;
      if(racine && racine.nodeName === 'boardMetadata'){
        for(const a of racine.attributes) att[a.name] = a.value;
        meta = _lireMetaSSR(racine);
      }
    } else {
      // Board ancien (v5) : fichier « data », une paire « clé valeur » par ligne.
      const data = _fichier(files, 'data');
      if(data) for(const l of new TextDecoder().decode(data).split(/\r?\n/)){
        const m = l.trim().split(/\s+/);
        if(m.length >= 2) att['data.' + m[0].toLowerCase()] = m[1];
      }
    }
    const nb = (v, d) => { const x = parseFloat(v); return isNaN(x) ? d : x; };
    // Libellés du menu Terrain SSR propres au board (SSRControls de
    // l'archive : « Board XX Special overlays »…), règle → texte.
    const libelles = {};
    const ctl = _fichier(files, 'SSRControls');
    if(ctl){
      const doc = new DOMParser().parseFromString(new TextDecoder().decode(ctl), 'application/xml');
      for(const e of doc.getElementsByTagName('entry')){
        const regle = e.getAttribute('rule'), texte = e.getAttribute('text') || e.getAttribute('name');
        if(regle && texte) for(const r of regle.split(',')) if(r.trim()) libelles[r.trim()] = texte;
      }
    }
    g = {
      libelles,
      cols: parseInt(att.width, 10)  || HEX_COLS,
      rows: parseInt(att.height, 10) || HEX_ROWS,
      hw: nb(att.hexWidth  ?? att['data.dx'], 56.25),
      hh: nb(att.hexHeight ?? att['data.dy'], 64.5),
      meta,
    };
    // Origine de la grille (centre de A1). VASL la tronque en entier
    // (ASLBoard.initializeFromArchive : « (int) getA1CenterX() »).
    g.x0 = Math.trunc(nb(att.A1CenterX ?? att['data.x0'], 0));
    g.y0 = Math.trunc(nb(att.A1CenterY ?? att['data.y0'], g.hh / 2));
    g.alt = (att.altHexGrain ?? att['data.alternate']) === 'true';
    // La taille de l'image fait foi : les métadonnées manquent sur les
    // boards les plus anciens.
    const img = _gifDuBoard(files, nom, att.boardImageFileName);
    if(img && img.length > 10 && img[0] === 0x47){
      g.w = img[6] | (img[7] << 8);
      g.h = img[8] | (img[9] << 8);
    } else {
      g.w = Math.round((g.cols - 1) * g.hw);
      g.h = Math.round(g.rows * g.hh);
    }
  } catch(e){
    g = {cols:HEX_COLS, rows:HEX_ROWS, hw:56.25, hh:64.5, x0:0, y0:32, alt:false,
         w:BOARD_W, h:BOARD_H, defaut:true};
  }
  _geoBoards.set(nom, g);
  return g;
}

function geoBoard(b){
  return _geoBoards.get(b && b.name)
      || {cols:HEX_COLS, rows:HEX_ROWS, hw:56.25, hh:64.5, x0:0, y0:32, alt:false,
          w:BOARD_W, h:BOARD_H};
}

// Fichier d'une archive, sans tenir compte de la casse.
function _fichier(files, nom){
  if(files.has(nom)) return files.get(nom);
  const voulu = nom.toLowerCase();
  for(const [n, d] of files) if(n.toLowerCase() === voulu) return d;
  return null;
}

// ── Grille VASL (ASLHexGrid). Colonnes A…Z, AA…ZZ, AAA… ; les colonnes
// paires (A, C…) ont leur rangée 1 à y0, les impaires une demi-rangée
// plus bas (plus haut si la grille est « alternate »).
function hexrow(i){
  let s = '';
  for(let n = i; n >= 0; n -= 26) s += C26[n % 26];
  return s;
}
function centreHex(g, nom){
  const m = /^([a-z])(\1*)(-?\d+)$/i.exec(nom.trim());
  if(!m) return null;
  const col = m[1].toLowerCase().charCodeAt(0) - 97 + 26 * m[2].length;
  const rang = parseInt(m[3], 10);
  const y = col % 2 === 0 ? Math.trunc(g.hh * (rang - 1) + .5)
          : g.alt         ? Math.trunc(g.hh * (rang - 1.5) + .5)
          :                 Math.trunc(g.hh * (rang - .5) + .5);
  return {x: Math.trunc(g.hw * col + .5) + g.x0, y: y + g.y0};
}

// ── Règles SSR d'un fichier de métadonnées (SharedBoardMetadata.xml ou
// BoardMetadata.xml d'un board), dans l'ordre du fichier :
//   colors    : [[nom, 0xRRGGBB]]
//   colorSSR  : [[règle, [[nom de, nom vers], …]]]
//   overlays  : [[règle, [{image, x, y}, …]]]   (images de l'archive)
//   underlays : [[règle, {image, couleurs: [nom, …]}]]
function _lireMetaSSR(racine){
  const enfant = (el, nom) => [...el.children].find(e => e.nodeName === nom);
  const sous = (el, nom) => el ? [...el.children].filter(e => e.nodeName === nom) : [];
  const meta = {colors: [], colorSSR: [], overlays: [], underlays: []};
  for(const c of sous(enfant(racine, 'colors'), 'color')){
    const v = ['red', 'green', 'blue'].map(k => parseInt(c.getAttribute(k), 10));
    if(v.every(x => x >= 0 && x <= 255)) meta.colors.push([c.getAttribute('name'), v[0]<<16 | v[1]<<8 | v[2]]);
  }
  for(const r of sous(enfant(racine, 'colorSSRules'), 'colorSSR'))
    meta.colorSSR.push([r.getAttribute('name'),
      sous(r, 'colorMap').map(m => [m.getAttribute('fromColor'), m.getAttribute('toColor')])]);
  const img = e => ({image: e.getAttribute('image'),
                     x: parseInt(e.getAttribute('x'), 10) || 0, y: parseInt(e.getAttribute('y'), 10) || 0});
  for(const e of [...(enfant(racine, 'overlaySSRules') || {children: []}).children]){
    const nom = e.getAttribute('name');
    if(e.nodeName === 'overlaySSRule') meta.overlays.push([nom, [img(e)]]);
    else if(e.nodeName === 'overlaySSRuleSet') meta.overlays.push([nom, sous(e, 'overlaySSRuleImage').map(img)]);
    else if(e.nodeName === 'underlaySSRule')
      meta.underlays.push([nom, {image: e.getAttribute('image'),
                                 couleurs: sous(e, 'color').map(c => c.getAttribute('name'))}]);
  }
  return meta;
}

// Métadonnées partagées du module, téléchargées une fois, seulement si un
// board redéfinit des couleurs ou des règles : sans cela, LOS_SSR suffit.
let _partagee = null, _textePartage = null;
function textePartage(){
  if(!_textePartage){
    _textePartage = fetch(VASL_BOARDDATA_URL + 'SharedBoardMetadata.xml').then(r => {
      if(!r.ok) throw new Error('SharedBoardMetadata.xml introuvable (HTTP ' + r.status + ')');
      return r.text();
    });
    _textePartage.catch(() => { _textePartage = null; });
  }
  return _textePartage;
}
function metaPartagee(){
  if(!_partagee){
    _partagee = textePartage().then(texte => {
      const doc = new DOMParser().parseFromString(texte, 'application/xml');
      return _lireMetaSSR(doc.documentElement);
    });
    _partagee.catch(() => { _partagee = null; });
  }
  return _partagee;
}

function _gifDuBoard(files, nom, prefere){
  if(prefere && files.get(prefere)) return files.get(prefere);
  const voulu = ('bd' + nom + '.gif').toLowerCase();
  for(const [n, d] of files) if(n.toLowerCase() === voulu) return d;
  return null;
}

// Comme Map.getLocation de VASSAL : un board est décalé de la largeur des
// boards qui le précèdent sur SA rangée, et de la hauteur de ceux qui le
// précèdent dans SA colonne ; une case vide compte pour zéro. Avec des
// boards recadrés ou de tailles différentes, ce n'est pas une grille.
function _layoutBoards(boards){
  const larg = new Map(), haut = new Map();
  for(const b of boards){
    const g = geoBoard(b);
    const w  = (b.crop && b.crop.w > 0) ? b.crop.w : g.w;
    const hh = (b.crop && b.crop.h > 0) ? b.crop.h : g.h;
    b.dispW = Math.round(w * b.zoom);
    b.dispH = Math.round(hh * b.zoom);
    larg.set(b.col + ',' + b.row, b.dispW);
    haut.set(b.col + ',' + b.row, b.dispH);
  }
  let totalW = 0, totalH = 0;
  for(const b of boards){
    b.px = 0; b.py = 0;
    for(let c = 0; c < b.col; c++) b.px += larg.get(c + ',' + b.row) || 0;
    for(let r = 0; r < b.row; r++) b.py += haut.get(b.col + ',' + r) || 0;
    totalW = Math.max(totalW, b.px + b.dispW);
    totalH = Math.max(totalH, b.py + b.dispH);
  }
  return {totalW, totalH};
}

// ── Beaucoup de GPU Android plafonnent un canvas à 4096 px de côté.
let _canvasMax = null;
function _maxCanvasSide(){
  if(_canvasMax !== null) return _canvasMax;
  for(const s of [16384, 8192, 4096, 2048]){
    try {
      const c = document.createElement('canvas');
      c.width = s; c.height = 1;
      const g = c.getContext('2d');
      if(!g) continue;
      g.fillStyle = '#fff'; g.fillRect(s-1, 0, 1, 1);
      if(g.getImageData(s-1, 0, 1, 1).data[3] === 255){ _canvasMax = s; break; }
    } catch(e){ /* taille refusée */ }
  }
  if(_canvasMax === null) _canvasMax = 2048;
  return _canvasMax;
}
function _sizeCanvasSafely(cvs, wantW, wantH){
  const max = _maxCanvasSide();
  const k = Math.min(1, max/wantW, max/wantH);
  cvs.width  = Math.max(1, Math.floor(wantW*k));
  cvs.height = Math.max(1, Math.floor(wantH*k));
  return k;
}

async function _runLimited(items, worker, limit){
  limit = limit || (navigator.maxTouchPoints > 0 ? 4 : 8);
  let i = 0;
  await Promise.all(new Array(Math.min(limit, items.length)).fill(0).map(async () => {
    while(i < items.length){
      const k = i++;
      try { await worker(items[k], k); } catch(e){ /* isolé */ }
    }
  }));
}

const _boardCache = new Map();          // nom → URL de Blob
async function _fetchBoardImage(name){
  if(_boardCache.has(name)) return _boardCache.get(name);
  const files = await _archive(name);
  const gif = _gifDuBoard(files, name);
  if(!gif) throw new Error('bd' + name + '.gif absent de l\'archive');
  const url = URL.createObjectURL(new Blob([gif], {type:'image/gif'}));
  _boardCache.set(name, url);
  return url;
}

// Table de substitution, construite comme SSRFilter.loadRules : une seule
// table pour toutes les règles, parcourues dans l'ordre du fichier de
// métadonnées (celui de LOS_SSR), pas dans celui de la sauvegarde. La
// première règle qui remappe une couleur l'emporte, et chaque nouvelle
// correspondance prolonge celles qui aboutissaient à sa couleur source :
// Level6ToLevel5 puis Level5ToLevel4… ramène ainsi un niveau 6 jusqu'à 0.
// tbl : LOS_SSR, ou la table propre au board (reglesBoard).
function tableSSR(regles, tbl = LOS_SSR){
  const voulues = new Set(regles);
  const table = new Map();
  for(const [nom, r] of Object.entries(tbl)){
    if(!voulues.has(nom) || !r.c) continue;
    for(const [de, vers] of r.c){
      if(!de || !vers) continue;
      const a = de[0]<<16 | de[1]<<8 | de[2], b = vers[0]<<16 | vers[1]<<8 | vers[2];
      if(a === b) continue;
      if(!table.has(a)) table.set(a, b);
      for(const [k, v] of table) if(v === a) table.set(k, b);
    }
  }
  return table;
}

// Repeint un canvas en une passe (SSRFilter.transform) ; l'alpha est
// conservé. Renvoie le nombre de pixels changés.
function repeindre(cv, table){
  if(!table.size) return 0;
  const g = cv.getContext('2d', {willReadFrequently:true});
  const d = g.getImageData(0, 0, cv.width, cv.height);
  const px = d.data;
  let n = 0;
  for(let k = 0; k < px.length; k += 4){
    const c = table.get(px[k]<<16 | px[k+1]<<8 | px[k+2]);
    if(c !== undefined){
      px[k] = c >> 16; px[k+1] = (c >> 8) & 255; px[k+2] = c & 255;
      n++;
    }
  }
  if(n) g.putImageData(d, 0, 0);
  return n;
}

// ── Motifs (underlaySSRule) : boardData/<motif>.gif du module VASL.
const _motifs = new Map();              // nom → Promise<ImageData>

function chargerMotif(nom){
  if(!_motifs.has(nom)){
    _motifs.set(nom, (async () => {
      const r = await fetch(VASL_BOARDDATA_URL + nom);
      if(!r.ok) throw new Error(nom + ' introuvable (HTTP ' + r.status + ')');
      const im = await createImageBitmap(await r.blob());
      const cv = document.createElement('canvas');
      cv.width = im.width; cv.height = im.height;
      const g = cv.getContext('2d', {willReadFrequently:true});
      g.drawImage(im, 0, 0);
      return g.getImageData(0, 0, im.width, im.height);
    })());
    _motifs.get(nom).catch(() => _motifs.delete(nom));
  }
  return _motifs.get(nom);
}

// Pose les motifs sur l'image visible, comme Underlay.loadImage : le motif,
// répété depuis le coin du canvas, n'apparaît que là où le board d'origine
// (non repeint) porte l'une des couleurs de la règle. Ses pixels
// transparents ou noirs (HolePunch({0})) laissent voir le board. VASL
// insère les underlays en tête de liste : le dernier dessiné, donc celui
// qui l'emporte, est le premier dans l'ordre du fichier (celui de tbl).
// base : image où chercher les couleurs, si ce n'est pas le canvas lui-même
// (l'image d'un overlay avant ses propres images SSR) ; ses pixels
// transparents ne reçoivent pas de motif.
async function poserMotifs(b, cv, regles, tbl = LOS_SSR, base = null){
  const motifs = [];
  for(const r of regles){
    try {
      const m = await chargerMotif(tbl[r].m[0]);
      motifs.push({m, couleurs: new Set(tbl[r].m[1].filter(c => c)
                                 .map(c => c[0]<<16 | c[1]<<8 | c[2]))});
    } catch(e){
      chatLog(`⚠️ bd${b.name} : motif de ${r} indisponible (${e.message})`);
    }
  }
  if(!motifs.length) return 0;
  const g = cv.getContext('2d', {willReadFrequently:true});
  const d = g.getImageData(0, 0, cv.width, cv.height);
  const px = d.data, W = cv.width, H = cv.height;
  const ref = base ? base.data : px;
  const toutes = new Set(motifs.flatMap(o => [...o.couleurs]));
  let n = 0;
  for(let y = 0, k = 0; y < H; y++){
    for(let x = 0; x < W; x++, k += 4){
      const rgb = ref[k]<<16 | ref[k+1]<<8 | ref[k+2];
      if(ref[k+3] < 128 || !toutes.has(rgb)) continue;
      for(const {m, couleurs} of motifs){
        if(!couleurs.has(rgb)) continue;
        const s = m.data, j = ((y % m.height) * m.width + (x % m.width)) * 4;
        if(s[j+3] < 128 || !(s[j] | s[j+1] | s[j+2])) continue;
        px[k] = s[j]; px[k+1] = s[j+1]; px[k+2] = s[j+2];
        n++;
        break;
      }
    }
  }
  if(n) g.putImageData(d, 0, 0);
  return n;
}

// ── Règles d'un board. Son BoardMetadata.xml part des métadonnées
// partagées (BoardMetadata) : ses couleurs remplacent celles du même nom,
// ses colorSSR s'ajoutent (ou complètent la règle du même nom), ses
// underlays remplacent la règle du même nom à sa place. Quand le board ne
// touche à rien de ce que demande la sauvegarde, LOS_SSR, calculée sur les
// couleurs partagées, donne le même résultat sans téléchargement.
async function reglesBoard(b){
  const g = geoBoard(b), meta = g.meta;
  const voulues = new Set(b.ssrList || []);
  const touche = meta && (
       meta.colorSSR.some(([n]) => voulues.has(n))
    || meta.underlays.some(([n]) => voulues.has(n))
    || (meta.colors.length && [...voulues].some(r => LOS_SSR[r] && (LOS_SSR[r].c || LOS_SSR[r].m))));
  if(!touche) return LOS_SSR;
  if(g.tblSSR) return g.tblSSR;
  let p;
  try { p = await metaPartagee(); }
  catch(e){
    chatLog(`⚠️ bd${b.name} : couleurs propres au board ignorées (${e.message})`);
    return LOS_SSR;
  }
  const couleurs = new Map(p.colors);
  for(const [n, c] of meta.colors) couleurs.set(n, c);
  const colorSSR = new Map();
  for(const [n, maps] of [...p.colorSSR, ...meta.colorSSR])
    colorSSR.set(n, (colorSSR.get(n) || []).concat(maps));
  const underlays = new Map(p.underlays);
  for(const [n, u] of meta.underlays) underlays.set(n, u);
  const rgb = n => {
    const c = couleurs.get(n);
    return c === undefined ? null : [c >> 16, (c >> 8) & 255, c & 255];
  };
  const tbl = {};
  for(const [n, maps] of colorSSR) tbl[n] = {c: maps.map(([de, vers]) => [rgb(de), rgb(vers)])};
  for(const [n, u] of underlays) tbl[n] = Object.assign(tbl[n] || {}, {m: [u.image, u.couleurs.map(rgb)]});
  g.tblSSR = tbl;
  return tbl;
}

// ── Images SSR du board (SSROverlay) : posées à x,y, repère du board non
// recadré. setTerrain les insère une à une en tête de liste : elles se
// dessinent donc dans l'ordre inverse du fichier, sur les motifs et sous
// les overlays d'hexagones.
async function poserImagesSSR(b, cv, regles, sx, sy){
  const files = await _archive(b.name);
  const liste = regles.flatMap(([r, imgs]) => imgs.map(i => [r, i])).reverse();
  const g = cv.getContext('2d');
  let n = 0;
  for(const [r, i] of liste){
    const octets = _fichier(files, i.image);
    if(!octets){ chatLog(`⚠️ bd${b.name} : image ${i.image} (${r}) absente de l'archive`); continue; }
    try {
      const bm = await createImageBitmap(new Blob([octets]));
      g.drawImage(bm, i.x - sx, i.y - sy);
      bm.close();
      n++;
    } catch(e){
      chatLog(`⚠️ bd${b.name} : image ${i.image} illisible`);
    }
  }
  return n;
}

// L'image « ovr<nom><orientation>.gif » se trouve dans l'archive
// boards/bdFiles/overlays/ovr<NOM SANS CHIFFRES>. Son fichier « data » donne,
// pour chaque orientation a…f, l'hexagone d'origine : l'image se pose à
// centre(hex1) − centre(origine), dans le repère du board non recadré.
const VASL_OVERLAYS_URL =
  'https://raw.githubusercontent.com/vasl-developers/vasl/develop/boards/bdFiles/overlays/';

function _equivalence(f){
  if(/^be[23]/.test(f)) return 'be1' + f.substring(3);
  if(/^be[56]/.test(f)) return 'be4' + f.substring(3);
  if(f.startsWith('oc2')) return 'oc1' + f.substring(3);
  if(f.startsWith('oc4')) return 'oc3' + f.substring(3);
  return f;
}
// Retire l'orientation, puis la queue de chiffres si le nom commence
// par une lettre : « o3a » → « o », « rr10a » → « rr », « 1a » → « 1 ».
function _trimNom(s){
  s = s.substring(0, s.length - 1);
  if(/^[0-9]/.test(s)) return s;
  return s.replace(/[0-9]+$/, '') || s;
}
const archiveOverlay = nom => 'ovr' + _trimNom(_equivalence(nom + 'a')).toUpperCase();
const imageOverlay   = nom => 'ovr' + _equivalence(nom) + '.gif';

function chargerArchiveOverlay(arch){
  if(!_archivesOvr.has(arch)){
    _archivesOvr.set(arch, fetch(VASL_OVERLAYS_URL + arch).then(async r => {
      if(!r.ok) throw new Error(arch + ' introuvable (HTTP ' + r.status + ')');
      const files = await _zipRead(await r.arrayBuffer());
      const data = _fichier(files, 'data');
      const xml = _fichier(files, 'BoardMetadata.xml');
      let meta = null;
      if(xml){
        const doc = new DOMParser().parseFromString(new TextDecoder().decode(xml), 'application/xml');
        if(doc.documentElement && doc.documentElement.nodeName === 'boardMetadata')
          meta = _lireMetaSSR(doc.documentElement);
      }
      return {files, data: data ? new TextDecoder().decode(data) : '', meta};
    }));
    _archivesOvr.get(arch).catch(() => _archivesOvr.delete(arch));
  }
  return _archivesOvr.get(arch);
}

function _originesDefaut(nom){
  if(ORIGINES_OVR[nom]) return ORIGINES_OVR[nom];
  if(/^(wd|g|m|p|x|b|rp|rr|hd|o)/.test(nom)) return 'b2;b1;c1;d1;d2;c3';
  return null;
}

// Fichier data (Overlay.readData) : « nom origines… », « placeAt h1 h2 ».
function _lireDataOverlay(texte, nom){
  const r = {origines: _originesDefaut(nom), placeAt: null};
  for(const l of texte.split(/\r?\n/)){
    const tk = l.trim().split(/\s+/);
    if(tk.length < 2) continue;
    if(tk[0].toLowerCase() === nom.toLowerCase()) r.origines = l.trim().substring(nom.length).trim();
    else if(tk[0].toLowerCase() === 'placeat') r.placeAt = [tk[1], tk[2] || tk[1]];
  }
  return r;
}

// Orientation a…f d'après la position de hex2 par rapport à hex1.
function _orientation(g, hex1, hex2){
  if(hex1 === hex2) return 'a';
  const p = centreHex(g, hex1), q = centreHex(g, hex2);
  if(!p || !q) return 'a';
  if(p.x === q.x) return p.y < q.y ? 'd' : 'a';
  if(p.x > q.x) return p.y > q.y ? 'f' : 'e';
  return p.y > q.y ? 'b' : 'c';
}

// Hexagone d'origine pour une orientation, avec les deux bricolages de
// VASL (Overlay.offset). La liste Java porte la chaîne unique
// « 22b, 23b, 24b, 25b, 26b » : ces boards-là ne sont pas décalés.
const BOARDS_B = new Set(['1b','2b','3b','4b','5b','6b','7b','8b','9b','10b','11b','12b','13b',
  '14b','15b','16b','17b','18b','19b','20b','21b']);
function _origine(origines, c, board){
  let o = (origines || '').split(';')[c.charCodeAt(0) - 97];
  if(o === undefined) return null;
  o = o.trim();
  if(!o) return null;
  if(BOARDS_B.has(board)) o = String.fromCharCode(o.charCodeAt(0) + 16) + o.substring(1);
  if(/^BFPDW[1-7]b$/.test(board)){
    const r = parseInt(o.substring(1), 10);
    if(!isNaN(r)) o = o.substring(0, 1) + (r + 10);
  }
  return o;
}

// Prépare un overlay : image, position (repère du board non recadré) et
// métadonnées de son archive. Lève une erreur lisible en cas d'échec.
async function preparerOverlay(b, o){
  const g = geoBoard(b);
  const arch = archiveOverlay(o.nom);
  const a = await chargerArchiveOverlay(arch);
  const d = _lireDataOverlay(a.data, o.nom);
  let hex1 = o.hex1, hex2 = o.hex2;
  if(d.placeAt) [hex1, hex2] = d.placeAt;
  const unHex = !!_fichier(a.files, imageOverlay(o.nom + 'a')) && !_fichier(a.files, imageOverlay(o.nom + 'd'));
  if(unHex && hex1 !== hex2) throw new Error('un seul hexagone attendu');
  if(!unHex && hex1 === hex2) throw new Error('deux hexagones attendus');

  if(!p1 || !p2) throw new Error('hexagone ' + (p1 ? hex2 : hex1) + ' invalide');

  if(Math.abs(p2.x - p1.x) > 1.1 * g.hw || Math.abs(p2.y - p1.y) > 1.1 * g.hh)
    throw new Error(hex1 + ' et ' + hex2 + ' ne sont pas voisins');

  const fichier = imageOverlay(o.nom + c);
  const octets = _fichier(a.files, fichier);
  if(!octets) throw new Error(fichier + ' absent de ' + arch);
  const nomOrigine = _origine(d.origines, c, b.name);
  const po = nomOrigine && centreHex(g, nomOrigine);
  if(!po) throw new Error(`orientation « ${c} » sans origine`);
  const image = await createImageBitmap(new Blob([octets]));
  return {nom: o.nom, archive: arch, meta: a.meta, files: a.files, image,
          x: p1.x - po.x, y: p1.y - po.y, orientation: c};
}

// Dessin d'un overlay (ASLBoard.BoardOp) : son image, puis, si le board a
// des SSR et que l'archive de l'overlay a son BoardMetadata.xml
// (Overlay.getTerrain), les images SSR de cette archive et les motifs du
// board découpés dans l'image de l'overlay — dans cet ordre.
async function dessinerOverlay(b, cv, ov, tbl, voulues, sx, sy){
  let src = ov.image;
  if(voulues.size && ov.meta){
    const c = document.createElement('canvas');
    c.width = ov.image.width; c.height = ov.image.height;
    const g = c.getContext('2d', {willReadFrequently:true});
    g.drawImage(ov.image, 0, 0);
    const base = g.getImageData(0, 0, c.width, c.height);
    const images = ov.meta.overlays.filter(([r]) => voulues.has(r));
    let nImg = 0;
    for(const [r, imgs] of images) for(const i of imgs){
      const octets = _fichier(ov.files, i.image);
      if(!octets){ chatLog(`⚠️ ${ov.archive} : image ${i.image} (${r}) absente`); continue; }
      const bm = await createImageBitmap(new Blob([octets]));
      g.drawImage(bm, i.x, i.y);
      bm.close();
      nImg++;
    }
    if(nImg) chatLog(`🖼️ overlay ${ov.nom} : ${images.map(([r]) => r).join(', ')} — ${nImg} image(s) de l'overlay`);
    const parImage = new Set(images.map(([r]) => r));
    const motifs = Object.keys(tbl).filter(r => voulues.has(r) && tbl[r].m && !parImage.has(r));
    if(motifs.length){
      const n = await poserMotifs(b, c, motifs, tbl, base);
      if(n) chatLog(`🧩 overlay ${ov.nom} : ${motifs.join(', ')} — ${n.toLocaleString('fr')} pixels de motif`);
    }
    src = c;
  }
  cv.getContext('2d').drawImage(src, ov.x - sx, ov.y - sy);
  return src;
}

// Pixels d'un overlay posé (repère du board non recadré), lus par la LOS
// pour en tirer terrain et niveaux (ASLMap.adjustLOSForOverlays).
function _pixelsOverlay(nom, image, x, y){
  const c = document.createElement('canvas');
  c.width = image.width; c.height = image.height;
  const g = c.getContext('2d', {willReadFrequently:true});
  g.drawImage(image, 0, 0);
  return {nom, x, y, w: c.width, h: c.height, data: g.getImageData(0, 0, c.width, c.height).data};
}

// Image d'un board telle que la compose ASLBoard.BoardOp : la partie
// visible (recadrée) au format natif, puis les motifs, les images SSR et
// les overlays, puis le repeint des SSR sur l'ensemble. Le retournement et
// le zoom viennent après, au dessin sur la carte.
async function composerBoard(b, img){
  const gb = geoBoard(b);
  const sx = b.crop ? b.crop.x : 0, sy = b.crop ? b.crop.y : 0;
  const sw = (b.crop && b.crop.w > 0) ? b.crop.w : gb.w;
  const sh = (b.crop && b.crop.h > 0) ? b.crop.h : gb.h;
  const cv = document.createElement('canvas');
  cv.width = sw; cv.height = sh;
  cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  const voulues = new Set(b.ssrList || []);
  const overlays = b.overlays || [];
  if(!voulues.size && !overlays.length) return cv;
  let tbl = LOS_SSR, couleurs = [];
  if(voulues.size){
    try {
      tbl = await reglesBoard(b);
      // Dans l'ordre du fichier de métadonnées, pas dans celui de la sauvegarde.
      const ordre = Object.keys(tbl).filter(r => voulues.has(r));
      const images = ((gb.meta && gb.meta.overlays) || []).filter(([r]) => voulues.has(r));
      // SSRFilter retire de la liste les règles servies par une image :
      // elles ne passent plus par l'underlay.
      const parImage = new Set(images.map(([r]) => r));
      const motifs = ordre.filter(r => tbl[r].m && !parImage.has(r));
      couleurs = ordre.filter(r => tbl[r].c);
      if(motifs.length){
        const n = await poserMotifs(b, cv, motifs, tbl);
        if(n) chatLog(`🧩 bd${b.name} : ${motifs.join(', ')} — ${n.toLocaleString('fr')} pixels de motif`);
        else  chatLog(`⚠️ bd${b.name} : aucun terrain à couvrir pour ${motifs.join(', ')}`);
      }
      if(images.length){
        const n = await poserImagesSSR(b, cv, images, sx, sy);
        const lib = r => gb.libelles && gb.libelles[r] ? `${r} (${gb.libelles[r]})` : r;
      if(n) chatLog(`🖼️ bd${b.name} : ${[...parImage].map(lib).join(', ')} — ${n} image(s) du board`);
      }
    } catch(e){
      chatLog(`⚠️ SSR sur bd${b.name} impossible : ${e.message}`);
    }
  }
  // Overlays d'hexagones, dans l'ordre de la sauvegarde, sur les SSR.
  b.ovrLOS = [];
  for(const o of overlays){
    try {
      const ov = await preparerOverlay(b, o);
      const img = await dessinerOverlay(b, cv, ov, tbl, voulues, sx, sy);
      b.ovrLOS.push(Object.assign(_pixelsOverlay(o.nom, img, ov.x, ov.y), {archive: ov.archive}));
      ov.image.close();
      chatLog(`🧱 bd${b.name} : overlay ${o.nom} en ${o.hex1}-${o.hex2} (${ov.archive}, orientation ${ov.orientation})`);
    } catch(e){
      chatLog(`⚠️ bd${b.name} : overlay ${o.nom} non posé — ${e.message}`);
    }
  }
  // Le repeint porte sur toute l'image : board, motifs, images et overlays.
  if(couleurs.length){
    try {
      const n = repeindre(cv, tableSSR(couleurs, tbl));
      if(n) chatLog(`🎨 bd${b.name} : ${couleurs.join(', ')} — ${n.toLocaleString('fr')} pixels repeints`);
      else  chatLog(`⚠️ bd${b.name} : aucune couleur à repeindre pour ${couleurs.join(', ')}`);
    } catch(e){
      chatLog(`⚠️ SSR sur bd${b.name} impossible : ${e.message}`);
    }
  }
  return cv;
}

// ═══ RENDU DE LA CARTE ═══
async function _renderBoards(boards){
  const noms = [...new Set(boards.map(b => b.name))];
  chatLog(`⏳ Téléchargement de ${noms.length} board(s)…`);
  await _runLimited(noms, n => chargerGeoBoard(n));
  const divers = noms.filter(n => {
    const g = _geoBoards.get(n);
    return g && !g.defaut && (g.cols !== HEX_COLS || g.rows !== HEX_ROWS);
  });
  if(divers.length)
    chatLog('📐 Board(s) non standard : ' + divers.map(n => {
      const g = _geoBoards.get(n);
      return `${n} — ${g.cols}×${g.rows} hex, ${g.w}×${g.h} px`;
    }).join(' · '));

  const mi = document.getElementById('mapInner');
  mi.querySelectorAll('.boardLayer').forEach(e => e.remove());
  document.getElementById('vide').style.display = 'none';

  const {totalW, totalH} = _layoutBoards(boards);
  oublierCarteLOS(boards);
  const ssrTot = [...new Set(boards.flatMap(b => b.ssrList || []))];
  if(ssrTot.length){
    chatLog(`🌾 Modifications de terrain (SSR) : ${ssrTot.join(', ')}`);
    // Une règle sans effet graphique en général peut avoir une image, une
    // couleur ou un motif propre à l'un des boards.
    const propre = new Set(boards.flatMap(b => {
      const m = geoBoard(b).meta;
      return m ? [...m.overlays, ...m.colorSSR, ...m.underlays].map(([r]) => r) : [];
    }));
    const losSeule  = ssrTot.filter(r => !LOS_SSR[r] && !propre.has(r) && SSR_LOS_SEULES[r]);
    const inconnues = ssrTot.filter(r => !LOS_SSR[r] && !propre.has(r) && !SSR_LOS_SEULES[r]);
    if(losSeule.length)  chatLog('ℹ️ Sans effet graphique (visée seule) : ' + losSeule.join(', '));
    if(inconnues.length) chatLog('⚠️ SSR non reconnue(s), terrain inchangé : ' + inconnues.join(', '));
  }

  _setMapSize(Math.round((totalW + BOARD_MARGIN*2) * SC), Math.round((totalH + BOARD_MARGIN*2) * SC));
  _buildHexTable(boards);
  const M = Math.round(BOARD_MARGIN * SC);
  let ok = 0; const fail = [];

  await _runLimited(noms, n => _fetchBoardImage(n));

  for(const b of boards){
    const x = Math.round(b.px * SC) + M, y = Math.round(b.py * SC) + M;
    const w = Math.round(b.dispW * SC), hgt = Math.round(b.dispH * SC);
    try {
      const url = await _fetchBoardImage(b.name);
      // Le recadrage et le miroir imposent un canvas plutôt qu'un <img>.
      const cv = document.createElement('canvas');
      cv.className = 'boardLayer';
      const kb = _sizeCanvasSafely(cv, b.dispW, b.dispH);
      cv.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${hgt}px;`;
      let im = new Image();
      await new Promise((res, rej) => { im.onload = res; im.onerror = rej; im.src = url; });
      const comp = await composerBoard(b, im);
      const g = cv.getContext('2d');
      if(kb !== 1) g.scale(kb, kb);
      if(b.reversed){ g.translate(b.dispW, b.dispH); g.scale(-1, -1); }
      g.drawImage(comp, 0, 0, b.dispW, b.dispH);
      mi.appendChild(cv);
      ok++;
    } catch(err){
      fail.push(b.name + (err && err.message ? ' (' + err.message + ')' : ''));
      const ph = document.createElement('div');
      ph.className = 'boardLayer';
      ph.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${hgt}px;`
        + 'background:#222;border:1px dashed #666;';
      mi.appendChild(ph);
    }
  }
  if(ok) chatLog(`🗺️ ${ok} board(s) — composition ${totalW}×${totalH} px`);
  if(fail.length) chatLog('⚠️ Board(s) non chargé(s) : ' + fail.join(', '));
  zoomFit();
}

function _setMapSize(w, h){
  _mapW = w; _mapH = h;
  const mi = document.getElementById('mapInner');
  mi.style.width = w + 'px'; mi.style.height = h + 'px';
  _majScaler();
}
function _majScaler(){
  const s = document.getElementById('mapScaler');
  s.style.width  = Math.round(_mapW * zoom) + 'px';
  s.style.height = Math.round(_mapH * zoom) + 'px';
}

// ═══ ZOOM ET DÉPLACEMENT ═══
function setZoom(z, fx, fy){
  z = Math.max(0.1, Math.min(3, z));
  const wrap = document.getElementById('mapWrap');
  const wr = wrap.getBoundingClientRect();
  if(fx === undefined){ fx = wr.left + wr.width/2; fy = wr.top + wr.height/2; }
  const wx = (wrap.scrollLeft + (fx - wr.left)) / zoom;
  const wy = (wrap.scrollTop  + (fy - wr.top )) / zoom;
  const loin = _effectifPiles && _vueDeLoin();
  zoom = z;
  if(!_zoomAuto) _zoomManuel = true;
  const mi = document.getElementById('mapInner');
  mi.style.transform = `scale(${zoom})`;
  mi.style.setProperty('--zinv', 1 / zoom);
  _majScaler();
  wrap.scrollLeft = wx*zoom - (fx - wr.left);
  wrap.scrollTop  = wy*zoom - (fy - wr.top);
  rafraichirActions(['zoomTxt']);
  if(_fil) dessinerFil();
  if(_liens.size) dessinerLiens();
  if(_eventail) placerEventail();
  // L'effectif des piles ne se montre que de loin.
  if(_effectifPiles && loin !== _vueDeLoin()) rendreToutes();
}
function zoomIn(){  setZoom(zoom*1.25); }
function zoomOut(){ setZoom(zoom/1.25); }
// Zoom choisi par le joueur, ou seulement celui d'« Ajuster » : après une
// rotation de l'écran, on n'ajuste de nouveau que dans ce second cas.
let _zoomManuel = false, _zoomAuto = false;
function zoomFit(){
  if(!_mapW) return;
  const wrap = document.getElementById('mapWrap');
  _zoomAuto = true;
  try { setZoom(Math.min(wrap.clientWidth/_mapW, wrap.clientHeight/_mapH)); } finally { _zoomAuto = false; }
  _zoomManuel = false;
  wrap.scrollLeft = 0; wrap.scrollTop = 0;
}

// Fenêtre redimensionnée ou écran tourné : on garde le point de la carte
// qui était au centre de la vue, ou l'on ajuste si le joueur n'a pas zoomé.
let _centreVue = null, _redim = null;
function _noterCentre(){
  const w = document.getElementById('mapWrap');
  if(_mapW && w.clientWidth) _centreVue = {x: (w.scrollLeft + w.clientWidth/2) / zoom, y: (w.scrollTop + w.clientHeight/2) / zoom};
}
function _surRedimension(){
  clearTimeout(_redim);
  _redim = setTimeout(() => {
    _redim = null;
    const w = document.getElementById('mapWrap');
    if(_mapW && w.clientWidth){
      if(!_zoomManuel) zoomFit();
      else if(_centreVue){
        w.scrollLeft = _centreVue.x * zoom - w.clientWidth/2;
        w.scrollTop  = _centreVue.y * zoom - w.clientHeight/2;
      }
    }
    _noterCentre();
    for(const f of _apresRedimension) f();
  }, 200);
}
const _apresRedimension = [];
const _apresProfil = [];          // (p, ancien) après un changement de profil

// Sélection d'un pion à l'autre d'une pile (Alt + molette) : +1 vers le
// sommet, −1 vers le fond, en boucle.
function tournerDansPile(p, sens){
  if(!p) return;
  const k = cle(p), s = pile(k).filter(selectionnable);
  if(!s.length) return;
  deplier(k, true);
  const cur = s.findIndex(q => _sel.has(q) && selDans(k).length === 1);
  const i = cur < 0 ? (sens > 0 ? 0 : s.length - 1) : (cur + sens + s.length) % s.length;
  selectionner([s[i]]);
}

// Double appui dans le vide, au doigt : zoom ×2 centré ; au zoom maximal,
// la carte s'ajuste.
let _dernierVide = {t: 0, x: 0, y: 0};
function _doubleAppuiVide(e){
  const d = Date.now() - _dernierVide.t < 320 && Math.hypot(e.clientX - _dernierVide.x, e.clientY - _dernierVide.y) < 30;
  _dernierVide = d ? {t: 0, x: 0, y: 0} : {t: Date.now(), x: e.clientX, y: e.clientY};
  if(!d) return false;
  if(zoom >= 2.99) zoomFit(); else setZoom(zoom * 2, e.clientX, e.clientY);
  return true;
}

// Clic dans le vide de la carte : comme KeyBufferer, la sélection se vide.
// Au doigt, les piles dépliées se replient aussi ; à la souris, elles
// restent dépliées, comme dans VASSAL (Échap les replie).
function _clicVide(e){
  if(_filArme) return;
  // Le chat ouvert recule d'un cran : un appui qui vient de fermer le
  // clavier s'arrête là ; sinon le chat compact revient à l'aperçu.
  if(_etatChat === 'compact'){
    if(Date.now() - _clavierFermeA > 800) fermerChat();
    return;
  }
  if(_modeCarte){ toucherModeCarte(clientVersCarte(e.clientX, e.clientY, null, true)); return; }
  if(e.pointerType && e.pointerType !== 'mouse'){
    // Sélection tolérante : la pile la plus proche, à moins de 30 px.
    const k = pileProche(e.clientX, e.clientY);
    // L'appui qui vient de fermer l'éventail ferme aussi la pile, sans en
    // reprendre une voisine.
    if(Date.now() - _eventailFermeA < 800){ _eventailFermeA = 0; replierTout(); if(_sel.size || _pileSel) selectionnerPile(null); return; }
    if(k){ appuiSurPile(k); return; }
    if(_doubleAppuiVide(e)) return;
    replierTout();
    fermerEventail();
  }
  if(_sel.size || _pileSel) selectionnerPile(null);
}

// Rectangle de sélection (Maj + glissé dans le vide). Dans VASSAL, c'est
// un simple glissé ; ici, le glissé déplace la carte, d'où la touche Maj.
// Comme KBDeckVisitor : une pile repliée entre tout entière si son point
// est dans le rectangle ; d'une pile dépliée, chaque pion dont le point est
// dedans. Ctrl + Maj retire de la sélection au lieu d'y ajouter.
function _lasso(e){
  e.preventDefault();
  const x0 = e.clientX, y0 = e.clientY, id = e.pointerId;
  const r = document.createElement('div');
  r.className = 'lasso';
  document.body.appendChild(r);
  const peindre = ev => {
    Object.assign(r.style, {left: Math.min(x0, ev.clientX) + 'px', top: Math.min(y0, ev.clientY) + 'px',
      width: Math.abs(ev.clientX - x0) + 'px', height: Math.abs(ev.clientY - y0) + 'px'});
  };
  peindre(e);
  const bouge = ev => { if(ev.pointerId === id){ ev.preventDefault(); peindre(ev); } };
  const fin = ev => {
    if(ev.pointerId !== id) return;
    document.removeEventListener('pointermove', bouge);
    document.removeEventListener('pointerup', fin);
    document.removeEventListener('pointercancel', fin);
    r.remove();
    if(ev.type !== 'pointerup') return;
    const a = clientVersCarte(Math.min(x0, ev.clientX), Math.min(y0, ev.clientY), null, true);
    const b = clientVersCarte(Math.max(x0, ev.clientX), Math.max(y0, ev.clientY), null, true);
    if(!a || !b) return;
    const dedans = (x, y) => x >= a.x && x <= b.x && y >= a.y && y <= b.y;
    const pris = [];
    for(const [k, l] of indexerPiles()){
      const vus = l.filter(p => !p.cache);
      if(_depliees.has(k)){
        rectsPile(vus, true).forEach((q, i) => {
          if(dedans((q.x + q.w/2) / SC, (q.y + q.h/2) / SC)) pris.push(vus[i]);
        });
      } else if(dedans(l[0].x, l[0].y)) pris.push(...vus);
    }
    const choisis = pris.filter(p => selectionnable(p) && COUCHES_SEL[p.couche || 'unite']);
    selectionner(choisis, _basculeSel(ev) ? 'retirer' : 'ajouter');
  };
  document.addEventListener('pointermove', bouge);
  document.addEventListener('pointerup', fin);
  document.addEventListener('pointercancel', fin);
}

// Les pointeurs posés sur la carte, pions compris : un pincement qui
// commence sur un pion zoome, et abandonne le glissé du pion.
const _pointeursCarte = new Map();
function _setupPanZoom(){
  const wrap = document.getElementById('mapWrap');
  const pts = _pointeursCarte;
  let pinch = null;
  wrap.addEventListener('pointerdown', e => {
    // Un appui sur la carte ferme le panneau posé par-dessus (liste de la
    // pile, palette), sauf pendant une pose en deux appuis ; le geste continue.
    if(coteRecouvre() && !_modeCarte && !_filArme) fermerCote();
    // Un pion garde son geste (sélection, glissé) : seul, son doigt ne
    // déplace pas la carte.
    const pion = !!(e.target.closest && e.target.closest('.pion'))
      && !(_verrouPions && e.pointerType && e.pointerType !== 'mouse');
    // Maj + glissé dans le vide, à la souris : rectangle de sélection.
    if(!pion && e.shiftKey && e.button === 0 && (e.pointerType === 'mouse' || !e.pointerType)){ _lasso(e); return; }
    // surPion : l'appui a commencé sur un pion ; avec le verrou, son doigt
    // déplace la carte (pion faux) mais ce n'est pas un appui dans le vide.
    const surPion = !!(e.target.closest && e.target.closest('.pion'));
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY, pion, surPion, x0: e.clientX, y0: e.clientY, t0: Date.now(), btn: e.button});
    if(!pion){ try { wrap.setPointerCapture(e.pointerId); } catch(err){} }
    if(!pion || pts.size > 1) wrap.classList.add('pan');
    if(pts.size === 2){
      if(_glisse) _glisse.abandonner();
      for(const q of pts.values()) q.pion = false;
      const [a, b] = [...pts.values()];
      pinch = {d: Math.hypot(a.x-b.x, a.y-b.y), z: zoom};
    }
  });
  window.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId);
    if(!p) return;
    if(pts.size === 1 && !p.pion){
      wrap.scrollLeft -= e.clientX - p.x;
      wrap.scrollTop  -= e.clientY - p.y;
    }
    p.x = e.clientX; p.y = e.clientY;
    if(pts.size === 2 && pinch){
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if(pinch.d > 0) setZoom(pinch.z * d / pinch.d, (a.x+b.x)/2, (a.y+b.y)/2);
    }
  });
  let pince = false;
  const fin = e => {
    const p = pts.get(e.pointerId);
    if(pts.size > 1) pince = true;
    pts.delete(e.pointerId);
    if(pts.size < 2) pinch = null;
    if(!pts.size) wrap.classList.remove('pan');
    // Un appui bref dans le vide, sans glisser ni pincer : clic sur la carte.
    if(p && !p.pion && !p.surPion && e.type === 'pointerup' && !pince && p.btn === 0
       && Math.hypot(e.clientX - p.x0, e.clientY - p.y0) < 6) _clicVide(e);
    if(!pts.size) pince = false;
  };
  window.addEventListener('pointerup', fin);
  window.addEventListener('pointercancel', fin);
  wrap.addEventListener('scroll', () => { if(!_redim) _noterCentre(); });
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    // Alt + molette sur une pile : la sélection passe d'un pion à l'autre
    // de la pile, dépliée au besoin.
    const pion = e.altKey && e.target.closest && e.target.closest('.pion');
    if(pion){ tournerDansPile(pions.find(p => p.el === pion), e.deltaY > 0 ? -1 : 1); return; }
    setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1/1.1), e.clientX, e.clientY);
  }, {passive:false});
}

// ═══════════════════════════════════════════════════════════════
// TABLE DES HEXAGONES — positions légales des pions
// Un pion occupe le centre d'un hexagone ou le milieu d'un de ses six
// côtés (Bypass, marqueurs d'hexside). Repère : pixels VASL natifs,
// marge de carte comprise — celui des coordonnées du .vsav.
// ═══════════════════════════════════════════════════════════════
const C26 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const HEX_HY = 32.25;          // centre → milieu du côté haut/bas
const HEX_HX = 28.125;         // composante x des côtés obliques
const COTES = [null, [0,-HEX_HY], [HEX_HX,-HEX_HY/2], [HEX_HX,HEX_HY/2],
               [0,HEX_HY], [-HEX_HX,HEX_HY/2], [-HEX_HX,-HEX_HY/2]];
const SNAP_COTE = 0.45;        // le côté ne gagne que tout près de son milieu
let _hexTable = [];
// Les hexagones rangés par cases de GRILLE_HEX pixels : la recherche de
// l'ancrage ne regarde que les 9 cases autour du point. La case est plus
// grande que la distance d'accrochage (75 px), ce qui suffit.
const GRILLE_HEX = 80;
let _grilleHex = new Map();
let _hexParNom = new Map();
const _caseHex = (x, y) => Math.floor(x / GRILLE_HEX) + ',' + Math.floor(y / GRILLE_HEX);

// Les hexagones retenus sont ceux dont le centre tombe sur l'image du board,
// demi-hexagones de bord compris (B0, B10…) : la grille VASL les connaît.
// Les boards « b » (A1CenterX = −901) commencent ainsi à la colonne Q.
function _buildHexTable(boards){
  _hexTable = [];
  for(const b of boards){
    const g = geoBoard(b);
    const cropX = b.crop ? (b.crop.x || 0) : 0;
    const cropY = b.crop ? (b.crop.y || 0) : 0;
    const dispW = b.dispW || g.w, dispH = b.dispH || g.h;
    const i0 = Math.max(0, Math.floor((-g.hw/4 - g.x0) / g.hw));
    const i1 = Math.ceil((g.w + g.hw/4 - g.x0) / g.hw);
    const r0 = Math.floor((-g.hh/4 - g.y0) / g.hh), r1 = Math.ceil((g.h + g.hh/4 - g.y0) / g.hh) + 1;
    for(let i = i0; i <= i1; i++){
      const col = hexrow(i);
      for(let r = r0; r <= r1; r++){
        const c = centreHex(g, col + r);
        if(c.x <= -g.hw/4 || c.x >= g.w + g.hw/4 || c.y <= -g.hh/4 || c.y >= g.h + g.hh/4) continue;
        // ASLBoard.globalCoordinates : recadrage, puis grossissement (ZOOM),
        // puis retournement sur la taille affichée.
        const z = b.zoom || 1;
        const lx = (c.x - cropX) * z, ly = (c.y - cropY) * z;
        if(ly < -g.hh*z/2 || ly > dispH + g.hh*z/2) continue;
        if(lx < -g.hw*z/2 || lx > dispW + g.hw*z/2) continue;
        const px = b.reversed ? dispW - lx : lx;
        const py = b.reversed ? dispH - ly : ly;
        _hexTable.push({name: b.name + col + r,
          x: (b.px || 0) + px + BOARD_MARGIN, y: (b.py || 0) + py + BOARD_MARGIN});
      }
    }
  }
  // Nom d'ancrage → point, côtés compris (« 33B5 », « 33B5/NE ») : les
  // lieux cités au chat deviennent cliquables.
  _hexParNom = new Map();
  for(const h of _hexTable){
    _hexParNom.set(h.name, {x: h.x, y: h.y});
    for(let c = 1; c <= 6; c++)
      _hexParNom.set(h.name + '/' + ['', 'N', 'NE', 'SE', 'S', 'SO', 'NO'][c], {x: h.x + COTES[c][0], y: h.y + COTES[c][1]});
  }
  _grilleHex = new Map();
  for(const h of _hexTable){
    const k = _caseHex(h.x, h.y);
    if(!_grilleHex.has(k)) _grilleHex.set(k, []);
    _grilleHex.get(k).push(h);
  }
}

// Ancrage légal le plus proche d'un point (pixels natifs), ou null au
// large des boards : le pion reste alors où on l'a lâché.
function ancragePlusProche(x, y){
  let hex = null, dh = Infinity;
  const cx = Math.floor(x / GRILLE_HEX), cy = Math.floor(y / GRILLE_HEX);
  for(let i = -1; i <= 1; i++) for(let j = -1; j <= 1; j++){
    for(const h of _grilleHex.get((cx + i) + ',' + (cy + j)) || []){
      const d = (h.x-x)*(h.x-x) + (h.y-y)*(h.y-y);
      if(d < dh){ dh = d; hex = h; }
    }
  }
  if(!hex || dh > 75*75) return null;
  let side = 0, ds = Infinity;
  for(let s = 1; s <= 6; s++){
    const mx = hex.x + COTES[s][0], my = hex.y + COTES[s][1];
    const d = (mx-x)*(mx-x) + (my-y)*(my-y);
    if(d < ds){ ds = d; side = s; }
  }
  const rayon = HEX_HY * SNAP_COTE;
  if(!(ds < rayon*rayon && ds < dh)) side = 0;
  return {
    x: Math.round(hex.x + (side ? COTES[side][0] : 0)),
    y: Math.round(hex.y + (side ? COTES[side][1] : 0)),
    label: hex.name + (side ? '/' + ['','N','NE','SE','S','SO','NO'][side] : '')
  };
}

// ═══════════════════════════════════════════════════════════════
// LIGNE DE VUE (LOS) — portage du moteur de VASL (paquet VASL.LOS.Map)
// Terrain, Location, Hex, Bridge, LOSResult et Map.LOS() avec toutes ses
// règles, méthode par méthode, noms Java conservés pour qu'on retrouve
// le code d'origine. Repère : pixels des boards sans marge ni loupe,
// (0,0) au coin haut gauche du premier board.
// Les pions sont lus par LosPions (VASLGameInterface, plus bas) ; la
// partie n'est jamais de nuit (ni éclairage, ni lueur de tir).
// ═══════════════════════════════════════════════════════════════

// a.equals(b) de Java : lève une erreur si a est nul, comme le NPE que
